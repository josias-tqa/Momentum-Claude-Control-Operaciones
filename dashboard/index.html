<title>Torre de Control Momentum</title><!-- el idioma activo lo fija setIdioma() -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: riel de navegación fijo a la izquierda (barra inferior en teléfono); una columna de trabajo con
   cabecera de vista y selector de proyecto; el detalle de cada tema se abre en un panel lateral sobre la lista. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#e9edf2; --hover:#f6f8fb; --fg:#121a24; --muted:#566273; --line:#dce2ea; --line-2:#c2cbd6;
  --accent:#2446d8; --accent-fg:#ffffff; --accent-soft:#e7ecfd;
  --rail:#0d1a28; --rail-fg:#e6edf5; --rail-muted:#9aabbd; --rail-line:#22364b; --rail-hover:#15273a; --rail-on:#1d3550;
  --rail-ok:#4cc38a; --rail-warn:#e5b53f; --rail-bad:#ff6b63;
  --p1:#c22525; --p2:#a84c08; --p3:#8a6a00; --p4:#566273; --ok:#1f7a4a;
  --p1-bg:#fdeceb; --p2-bg:#fdf0e3; --p3-bg:#fbf4d9; --p4-bg:#e9edf2; --ok-bg:#e4f4ea;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.12); --scrim:rgba(10,16,24,.48);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Archivo","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --r-s:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1017; --surface:#111923; --surface-2:#1a2431; --hover:#15202c; --fg:#e5ebf2; --muted:#9aa8b8; --line:#222e3c; --line-2:#36465a;
  --accent:#8fa8ff; --accent-fg:#0a1017; --accent-soft:#1a2648;
  --rail:#070c12; --rail-fg:#e1e8f0; --rail-muted:#8b9bad; --rail-line:#1a2532; --rail-hover:#101924; --rail-on:#18263a;
  --rail-ok:#4cc38a; --rail-warn:#e5b53f; --rail-bad:#ff6b63;
  --p1:#ff8279; --p2:#ffa657; --p3:#e3b341; --p4:#9aa8b8; --ok:#5bd08a;
  --p1-bg:#3b1a1c; --p2-bg:#3a2613; --p3-bg:#33290f; --p4-bg:#1a2431; --ok-bg:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1017; --surface:#111923; --surface-2:#1a2431; --hover:#15202c; --fg:#e5ebf2; --muted:#9aa8b8; --line:#222e3c; --line-2:#36465a;
  --accent:#8fa8ff; --accent-fg:#0a1017; --accent-soft:#1a2648;
  --rail:#070c12; --rail-fg:#e1e8f0; --rail-muted:#8b9bad; --rail-line:#1a2532; --rail-hover:#101924; --rail-on:#18263a;
  --rail-ok:#4cc38a; --rail-warn:#e5b53f; --rail-bad:#ff6b63;
  --p1:#ff8279; --p2:#ffa657; --p3:#e3b341; --p4:#9aa8b8; --ok:#5bd08a;
  --p1-bg:#3b1a1c; --p2-bg:#3a2613; --p3-bg:#33290f; --p4-bg:#1a2431; --ok-bg:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.62); color-scheme:dark}

*{box-sizing:border-box}
html.lock{overflow:hidden}
html.lock .app{padding-right:var(--sbw,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg{flex:none}
.i{width:16px;height:16px}
.skip{position:fixed;left:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:50;transform:translateY(-200%);background:var(--accent);color:var(--accent-fg);border:0;border-radius:var(--r-s);padding:8px 12px;font-weight:600}
.skip:focus-visible{transform:none;outline-color:var(--fg)}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr)}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:22px;padding:20px 12px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.rail :focus-visible,.mtop :focus-visible{outline-color:var(--rail-fg)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--rail-fg);padding:2px 8px;font-family:var(--display);font-stretch:112%;font-weight:650;font-size:15px;line-height:1.2;letter-spacing:.005em}
.brand svg{width:26px;height:26px;color:var(--rail-ok)}
.brand small{display:block;font-family:var(--sans);font-stretch:100%;font-weight:400;font-size:11.5px;color:var(--rail-muted);letter-spacing:0}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:38px;padding:7px 10px;border-radius:var(--r-s);color:var(--rail-muted);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--rail-hover);color:var(--rail-fg)}
.nav a[aria-current="page"]{background:var(--rail-on);color:var(--rail-fg)}
.nav .i{width:18px;height:18px}
.nav .sep{height:1px;background:var(--rail-line);margin:8px 6px}
.badge{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:500;line-height:1;padding:4px 7px;border-radius:999px;background:var(--rail-line);color:var(--rail-fg);font-variant-numeric:tabular-nums}
.badge.hot{background:var(--rail-fg);color:var(--rail)}
.rail-foot{margin-top:auto;display:grid;gap:10px;border-top:1px solid var(--rail-line);padding:14px 8px 0}
.pulse{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.35}
.pulse b{display:block;font-weight:600;color:var(--rail-fg)}
.pulse span.d{color:var(--rail-muted)}
.pulse .dot{margin-top:4px}
.quien{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--rail-muted);min-width:0}
.quien b{display:block;color:var(--rail-fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quien .av{width:26px;height:26px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--p4);flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--p3)} .dot.critical{background:var(--p1)}
.dot.off{background:none;box-shadow:inset 0 0 0 2px var(--p4)}
.rail .dot.ok,.mtop .dot.ok{background:var(--rail-ok)} .rail .dot.warn,.mtop .dot.warn{background:var(--rail-warn)} .rail .dot.critical,.mtop .dot.critical{background:var(--rail-bad)} .rail .dot.unknown,.mtop .dot.unknown{background:var(--rail-muted)}
.content{min-width:0}
.vw{max-width:1040px;margin:0 auto;padding-block:30px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.vw:focus{outline:none}
.mtop,.tabbar{display:none}

/* ---------- Cabecera de vista ---------- */
.vh{display:grid;gap:10px;margin-bottom:22px}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;width:max-content;min-height:28px}
.crumb:hover{color:var(--fg)}
.vh-row{display:flex;gap:14px 20px;align-items:flex-start;flex-wrap:wrap}
.vh-t{flex:1;min-width:min(100%,260px);display:grid;gap:4px}
h1{font-family:var(--display);font-stretch:112%;font-size:27px;line-height:1.15;font-weight:650;letter-spacing:-.012em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h1:focus{outline:none}
.vh-t p{max-width:68ch}
.vh-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Selector de proyecto ---------- */
.scope{position:relative;display:flex;gap:6px;align-items:center;min-width:0}
.scope-btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;max-width:100%;padding:6px 10px 6px 12px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;min-width:0}
.scope-btn:hover{border-color:var(--muted)}
.scope-btn .k{color:var(--muted);font-size:12.5px}
.scope-btn .v{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.scope.on .scope-btn{border-color:var(--accent);background:var(--accent-soft)}
.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:8;width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pop-q{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
.pop-q:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.pop-q input[type=text]{border:0;background:none;padding:0;min-height:24px;outline:none;width:100%;color:var(--fg);border-radius:0}
.pop ul{list-style:none;margin:0;padding:6px;max-height:min(340px,50vh);overflow:auto}
.pop li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;min-height:40px}
.pop li.act{background:var(--surface-2)}
.pop li .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop li .fp{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop li[aria-selected="true"] .nm{font-weight:600;color:var(--accent)}
.pop li .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pop .none{padding:16px;text-align:center}

/* ---------- Controles ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:6px 12px;min-height:34px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted);background:var(--hover)}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.ghost.on{background:var(--accent-soft);color:var(--accent)}
.btn.sm{min-height:30px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-s);border:1px solid transparent;background:none;color:var(--muted);text-decoration:none;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:7px 10px;font-size:14px;width:100%;min-height:36px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
textarea{min-height:76px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
.w-auto{width:auto!important}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;min-height:32px;font-size:13px;font-weight:500;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.seg button:hover{border-color:var(--muted);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg .n{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.85}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search{position:relative;margin-left:auto;flex:0 1 250px;min-width:170px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:33px}

/* ---------- Secciones y listas ---------- */
.sec{display:grid;gap:9px;margin-bottom:26px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2{font-family:var(--display);font-stretch:108%;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:0;color:var(--muted)}
.cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-h .hint{font-size:12.5px;color:var(--muted);margin-left:auto}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.list>*+*{border-top:1px solid var(--line)}
.list>:first-child{border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}
.list>:last-child{border-radius:0 0 calc(var(--r) - 1px) calc(var(--r) - 1px)}
.list>:only-child{border-radius:calc(var(--r) - 1px)}

/* Tema (tarjeta de incidente) */
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 16px;cursor:pointer;min-width:0}
.card:hover{background:var(--hover)}
.card.sel{background:var(--accent-soft)}
.pill{display:inline-grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.02em;border-radius:7px;min-width:34px;height:26px;padding:0 6px;background:var(--p4-bg);color:var(--p4);border:1px solid transparent;flex:none}
.pill.P1{background:var(--p1);color:var(--surface)} .pill.P2{background:var(--p2-bg);color:var(--p2);border-color:var(--p2)} .pill.P3{background:var(--p3-bg);color:var(--p3)}
.c-main{min-width:0;display:grid;gap:6px}
.c-title{margin:0;font-family:var(--sans);font-size:14.5px;font-weight:600;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere;letter-spacing:0;text-transform:none;color:var(--fg)}
.c-title a{color:inherit;text-decoration:none}
.c-title a:hover{text-decoration:underline}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.c-meta .cat{display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
.c-meta .cat .i{width:14px;height:14px;color:var(--muted)}
.tag{font-size:12px;border:1px solid var(--line-2);border-radius:6px;padding:0 6px;line-height:1.6;color:var(--fg);overflow-wrap:anywhere}
.tag.rec{border-color:transparent;background:var(--surface-2);font-family:var(--mono);font-size:11.5px}
.tag.reo{border-color:var(--p2);color:var(--p2)}
.tag.dec{border-color:transparent;background:var(--surface-2);color:var(--muted)}
.why{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:78ch}
.actions{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.card .actions{margin-left:-8px}
.actions .sp{flex:1}
.go{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);min-height:30px;padding:0 4px}
.go:hover{color:var(--accent)}
.panel{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:12px;display:grid;gap:10px;cursor:default}
.panel-t{font-weight:600;font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;min-height:32px;font-size:13px}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.people{display:grid;gap:2px}
.person{display:flex;gap:9px;align-items:center;border:1px solid transparent;border-radius:var(--r-s);padding:6px 8px;min-height:36px;background:none;text-align:left}
.person:hover{background:var(--surface-2)}
.av{width:22px;height:22px;border-radius:50%;flex:none;background:var(--surface-2)}
.who{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.who .av{width:18px;height:18px}

/* Filas enlazables */
.rowi{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:var(--fg);min-width:0}
a.rowi:hover{background:var(--hover)}
a.rowi:focus-visible{outline-offset:-2px}
.rowi .t{min-width:0;overflow-wrap:anywhere;display:grid;gap:1px}
.rowi .t b{font-weight:600}
.rowi .chev{color:var(--muted)}
.rowi.two{grid-template-columns:minmax(0,1fr) auto}
.rowi .end{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nums{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.warn{background:var(--p3-bg);color:var(--p3)} .st.bad{background:var(--p1-bg);color:var(--p1)} .st.info{background:var(--accent-soft);color:var(--accent)}
.ico-b{width:30px;height:30px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.ico-b.info{background:var(--accent-soft);color:var(--accent)} .ico-b.bad{background:var(--p1-bg);color:var(--p1)}

/* Cajas, avisos y estados vacíos */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.banner{border-radius:var(--r);padding:11px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;border:1px solid var(--line);background:var(--surface)}
.banner .i{margin-top:2px}
.banner.bad{background:var(--p1-bg);color:var(--p1);border-color:transparent} .banner.bad a{color:inherit;font-weight:600}
.banner.info{background:var(--surface-2);border-color:transparent}
.banner.note{background:var(--accent-soft);border-color:transparent}
.banner .grow{flex:1;min-width:0}
.notas-an{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}.notas-an ul{margin:0;padding-left:18px;display:grid;gap:4px}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:44px 20px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty svg{width:40px;height:40px;color:var(--ok)}
.empty b{font-family:var(--display);font-stretch:110%;font-size:18px;font-weight:650}
.empty.plain svg{color:var(--muted)}
.skel{display:grid;gap:10px}
.skel i{display:block;height:72px;border-radius:var(--r);background:var(--surface-2)}

/* Proyecto */
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;font-size:13px}
.role-b{font-family:var(--mono);font-size:11px;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:22px 0 16px}
.tabs button{border:0;background:none;padding:9px 12px;min-height:38px;color:var(--muted);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.md{min-width:0;overflow-wrap:anywhere;max-width:76ch}
.md h2,.md h3,.md h4{font-family:var(--sans);font-stretch:100%;font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg);margin:16px 0 4px} .md>:first-child{margin-top:0}
.md p{margin:6px 0} .md ul,.md ol{margin:6px 0;padding-left:20px}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--muted);font-size:12px}
h3.lbl,h4.lbl{font-family:var(--display);font-stretch:108%;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:0;color:var(--muted)}

/* Discrepancias y documentación de un proyecto (pestañas) */
.discs,.docs{display:grid;min-width:0}
.disc,.doc{display:grid;gap:8px;padding:14px 0;min-width:0}
.disc+.disc,.doc+.doc{border-top:1px solid var(--line)}
.disc:first-child,.doc:first-child{padding-top:0} .disc:last-child,.doc:last-child{padding-bottom:0}
.disc p{margin:0;max-width:78ch;overflow-wrap:anywhere;font-size:13.5px}
.disc .banner,.doc .banner{margin:0;align-items:center;flex-wrap:wrap}
.disc .actions{margin-left:-8px}
.doc-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.doc-h b{font-size:14.5px}
.doc .actions{gap:6px}
.doc-view{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:var(--bg);max-width:none}
.doc textarea{min-height:260px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
label.btn{cursor:pointer;position:relative}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
/* Interruptor y primeros pasos */
.swrow{display:flex;gap:12px;align-items:flex-start}
.swrow>div{display:grid;gap:3px;min-width:0}
.switch{flex:none;width:42px;height:24px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);padding:2px;display:inline-flex;align-items:center;margin-top:1px}
.switch span{width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(18px)}
.pasos{margin-top:14px;text-align:left}
.pasos ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pasos li{display:flex;gap:9px;align-items:flex-start}
.pasos li .i{color:var(--muted);margin-top:3px;flex:none}
.pasos li.ok .i{color:var(--ok)}

/* Formularios */
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--fg)}
.form label .h{font-weight:400;color:var(--muted)}
.form label.chk{display:flex;gap:9px;align-items:center;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.procs{display:grid;gap:10px}
.proc{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;display:grid;gap:10px;background:var(--bg)}
.proc-h{display:flex;align-items:center;gap:8px}
.proc-h b{flex:1;font-size:13px}
details>summary{cursor:pointer;color:var(--muted);font-weight:500;width:max-content;border-radius:4px}
details>summary:hover{color:var(--fg)}
details[open]>summary{margin-bottom:12px}

/* Editor de regla en línea (en el panel de un tema o en la lista de reglas) */
.redit{display:grid;gap:10px;min-width:0}
.redit label{display:grid;gap:5px;font-size:13px;font-weight:500}
.redit label.chk{display:flex;gap:9px;align-items:center;font-weight:400}
.redit .banner{margin:0;align-items:center;flex-wrap:wrap}
.re-h,.re-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.excs{display:grid;gap:4px}
.exc{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--surface-2);border-radius:6px;padding:2px 4px 2px 10px}
.exc>span{flex:1;min-width:0;overflow-wrap:anywhere}
.exc.off>span{text-decoration:line-through;color:var(--muted)}
.btn.danger{color:var(--p1)} .btn.danger:hover{border-color:var(--p1)}
.btn.danger.solid{background:var(--p1);border-color:var(--p1);color:var(--surface)}
.rule-ed{padding:14px 0 16px}
.tag.sugt{border-color:var(--accent);color:var(--accent)}

/* ---------- Panel de detalle ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(740px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer:focus{outline:none}
.dw-h{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px 16px;padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.dw-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
.dw-top .sp{flex:1}
.dw-h h2{font-family:var(--display);font-stretch:110%;font-size:20px;line-height:1.25;font-weight:650;text-transform:none;letter-spacing:-.005em;color:var(--fg);text-wrap:balance;overflow-wrap:anywhere}
.dw-b{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 36px;padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
.dw-b section{display:grid;gap:8px;min-width:0}
.dw-b .box{padding:14px}
.lead{font-size:14.5px;max-width:70ch}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ev{display:grid;gap:4px;max-height:280px;overflow:auto}
.ev .l{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:6px 9px;overflow-wrap:anywhere}
.hyp{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.hyp li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.hyp li .muted{grid-column:2}
.lk{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;background:var(--surface-2);color:var(--muted);text-transform:capitalize}
.lk.alta{background:var(--p2-bg);color:var(--p2)} .lk.media{background:var(--p3-bg);color:var(--p3)}
.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.refs{display:grid;gap:6px;font-size:13px}
.refs>div{overflow-wrap:anywhere}
.tl{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:13px}
.tl time{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.tl span{overflow-wrap:anywhere}
.composer{display:grid;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:13.5px;z-index:60;display:flex;gap:12px;align-items:center;max-width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
.toast button{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;padding:2px 4px;border-radius:4px}
.toast :focus-visible{outline-color:var(--bg)}

/* ---------- Teléfono y pantallas angostas ---------- */
@media (max-width:900px){
  .app{display:block}
  .rail{display:none}
  body::before{background:var(--rail)}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:var(--rail);color:var(--rail-fg);min-height:52px;padding-block:8px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0;font-size:14.5px}
  .mtop .brand svg{width:22px;height:22px}
  .mtop .pulse{margin-left:auto;align-items:center;font-size:12px;color:var(--rail-muted);text-align:right}
  .mtop .pulse .dot{margin-top:0}
  .vw{padding-block:20px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:23px}
  .tabbar{display:flex;position:fixed;inset:auto 0 0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar a{flex:1;min-width:0;display:grid;justify-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent)}

  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .vh-a,.scope{width:100%}
  .scope-btn{flex:1;justify-content:flex-start}
  .scope-btn .v{flex:1;text-align:left;max-width:none}
  .pop{left:0;right:0;width:auto}
  .search{flex:1 1 100%;margin-left:0}

}
@media (max-width:620px){
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px}.kv dt{margin-top:6px}
  .card{grid-template-columns:minmax(0,1fr);gap:8px}
  .card>.pill{justify-self:start}
  .rowi{grid-template-columns:auto minmax(0,1fr) auto}
  .rowi>.nums,.rowi>.st,.rowi>.end{grid-column:2/-1;justify-self:start}
  .rowi .chev{display:none}
  .rowi.two{grid-template-columns:minmax(0,1fr)}
  .tl li{grid-template-columns:1fr;gap:0}
  .btn.ghost.sm .i{display:none}
}
@media (pointer:coarse){
  input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{font-size:16px;min-height:42px}
  .btn{min-height:40px} .btn.sm{min-height:38px} .opt,.seg button{min-height:38px} .icon-btn{width:40px;height:40px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.rowi,.btn,.nav a,.seg button{transition:background-color .12s,border-color .12s,color .12s}
  .switch,.switch span{transition:background-color .15s,transform .15s}
  #drawer.opening .drawer{animation:entra .2s cubic-bezier(.2,.8,.2,1)}
  #drawer.opening .scrim{animation:aparece .2s ease-out}
  @keyframes entra{from{transform:translateX(28px);opacity:0}}
  @keyframes aparece{from{opacity:0}}
}

to</a><ol class="n3"><li><a href="#ayuda-proyecto-memoria">Pestaña Memoria de proceso</a></li><li><a href="#ayuda-proyecto-produccion">Pestaña Memoria de producción</a></li><li><a href="#ayuda-proyecto-discrepancias">Pestaña Discrepancias</a></li><li><a href="#ayuda-proyecto-documentacion">Pestaña Documentación</a></li><li><a href="#ayuda-proyecto-reglas">Pestaña Reglas</a></li><li><a href="#ayuda-proyecto-inventario">Pestaña Inventario</a></li><li><a href="#ayuda-proyecto-config">Pestaña Configuración</a></li></ol></li><li><a href="#ayuda-reglas">Reglas</a><ol class="n3"><li><a href="#ayuda-editor-regla">Editor de reglas</a></li><li><a href="#ayuda-propuestas">Propuestas de la rutina</a></li></ol></li><li><a href="#ayuda-registrar">Registrar proyecto</a><ol class="n3"><li><a href="#ayuda-propuestos">Proyectos propuestos</a></li></ol></li><li><a href="#ayuda-ajustes">Ajustes</a><ol class="n3"><li><a href="#ayuda-descubrimiento">Proyectos a controlar</a></li></ol></li><li><a href="#ayuda-mas">Más (teléfono)</a></li></ol></li><li><a href="#ayuda-glosario">Glosario</a></li></ol></nav><div class="ay-inicio"><a class="ay-card" href="#ayuda-introduccion"><b>Qué es la Torre de Control</b><span>Qué hace, cómo trabaja, qué no hace nunca y qué puede hacer cada rol.</span></a><a class="ay-card" href="#ayuda-configuracion-inicial"><b>Configuración inicial</b><span>La puesta en marcha, una sola vez: accesos de UiPath y Bitbucket, entorno de Claude, rutina y primer escaneo.</span></a><a class="ay-card" href="#ayuda-pantallas"><b>Pantallas y acciones</b><span>Cada pantalla, pestaña y botón del tablero, con vistas de ejemplo.</span></a><a class="ay-card" href="#ayuda-glosario"><b>Glosario</b><span>Los términos que usa el tablero, en orden alfabético.</span></a></div>
<section class="ay-sec n1" id="ayuda-introduccion" data-nivel="1"><h2>Qué es la Torre de Control</h2><p class="ay-breve">Qué hace, cómo trabaja, qué no hace nunca y qué puede hacer cada rol.</p><p>La Torre de Control vigila los robots de UiPath que Grupo Momentum tiene en producción. Cada hora una <strong>rutina</strong> de Claude revisa Orchestrator, detecta lo que anda mal, decide qué tan grave es y lo deja en este tablero, explicado y ordenado.</p><p>El tablero es donde el equipo trabaja: ve lo que requiere atención, lo responde, lo delega o lo descarta. Con cada respuesta la rutina aprende: la próxima vez sabe qué es normal en cada proyecto y qué no.</p></section>
<section class="ay-sec n2" id="ayuda-como-funciona" data-nivel="2"><h3>Cómo funciona</h3><ol>
<li><strong>Controla.</strong> La rutina lee los jobs, los logs, las colas y los triggers de cada proyecto activo, y evalúa sus <a href="#ayuda-regla">reglas</a>.</li>
<li><strong>Agrupa.</strong> Cada problema distinto es un <a href="#ayuda-tema">tema</a> y tiene una sola tarjeta. Si se repite, la tarjeta suma ocurrencias en lugar de duplicarse.</li>
<li><strong>Clasifica.</strong> El <a href="#ayuda-triage">triage</a> asigna categoría, <a href="#ayuda-severidad">severidad</a> y una <a href="#ayuda-decision">decisión</a>: escalar, avisar, observar o dar por conocido. Siempre dice por qué.</li>
<li><strong>Analiza.</strong> Antes de escalar, cruza el error con el código del paquete desplegado y su documentación. El resultado es el <a href="#ayuda-analisis-previo">análisis previo</a>.</li>
<li><strong>Publica.</strong> Lo que necesita a una persona aparece en la <a href="#ayuda-bandeja">Bandeja</a>. El resto queda en <a href="#ayuda-no-reportados">No reportados</a>.</li>
<li><strong>Aprende.</strong> Las respuestas del equipo se guardan en la <a href="#ayuda-memoria-de-produccion">memoria de producción</a> y pueden convertirse en reglas propuestas.</li>
</ol></section>
<section class="ay-sec n2" id="ayuda-solo-lectura" data-nivel="2"><h3>Lo que la Torre de Control nunca hace</h3><ul>
<li><strong>No cambia nada en Orchestrator.</strong> No inicia, detiene ni reintenta jobs, y no toca colas, assets ni procesos.</li>
<li><strong>No cambia código.</strong> Si un problema requiere un fix, lo sugiere con la evidencia. Lo hace una persona.</li>
<li><strong>No muestra datos personales.</strong> Todo lo que viene de Orchestrator pasa por una redacción de PII antes de llegar al tablero. Los valores de assets y el contenido de los queue items nunca se leen.</li>
</ul></section>
<section class="ay-sec n2" id="ayuda-roles" data-nivel="2"><h3>Roles</h3><p class="ay-breve">Tu rol define qué podés hacer: Lector mira, Operador trabaja las tarjetas y Admin además configura proyectos, reglas y ajustes.</p><p>Tu rol se ve abajo del menú, como <strong>Acceso de Operador</strong> (en el teléfono, dentro de <strong>Más</strong>). Se asigna desde el menú <strong>Compartir</strong> del tablero.</p><table><thead><tr><th>Rol</th><th>Acceso en Compartir</th><th>Puede</th></tr></thead><tbody><tr><td>Lector</td><td>Viewer</td><td>Ver todo, incluida esta ayuda.</td></tr><tr><td>Operador</td><td>Contributor</td><td>Delegar, posponer, descartar, responder y comentar tarjetas, pedir un nuevo análisis, y responder, posponer o descartar las discrepancias de un proyecto.</td></tr><tr><td>Admin</td><td>Editor</td><td>Además: indicar la carpeta a escanear, registrar y configurar proyectos, subir su documentación, activar o pausar el control, aprobar, ajustar y eliminar reglas y editar los ajustes.</td></tr></tbody></table></section>
<section class="ay-sec n1" id="ayuda-configuracion-inicial" data-nivel="1"><h2>Configuración inicial</h2><p class="ay-breve">La puesta en marcha, una sola vez: accesos de UiPath y Bitbucket, entorno de Claude, rutina y primer escaneo.</p><p>Esto se hace una sola vez, antes de la primera corrida. Lo hace quien instala la Torre de Control, con un administrador de UiPath Automation Cloud y, si se usa, uno de Bitbucket. Si el tablero ya muestra corridas, está hecho: esta parte sirve entonces para <a href="#ayuda-config-credenciales">renovar una credencial</a> o sumar carpetas.</p><p>La Torre necesita dos accesos, los dos <strong>de solo lectura</strong>: uno a <a href="#ayuda-config-uipath">Orchestrator</a>, obligatorio, y uno a <a href="#ayuda-config-bitbucket">Bitbucket</a>, opcional. Los dos se cargan en el <a href="#ayuda-config-entorno">entorno de Claude</a> donde corre la rutina.</p><table><thead><tr><th>Paso</th><th>Dónde se hace</th><th>Quién</th></tr></thead><tbody><tr><td><a href="#ayuda-config-uipath">1. External App</a> y <a href="#ayuda-config-uipath-carpetas">acceso a las carpetas</a></td><td>UiPath Automation Cloud y Orchestrator</td><td>Administrador de la organización de UiPath</td></tr><tr><td><a href="#ayuda-config-bitbucket">2. Token de Bitbucket</a> (opcional)</td><td>Bitbucket</td><td>Administrador del repositorio o del workspace</td></tr><tr><td><a href="#ayuda-config-entorno">3. Entorno</a></td><td>Claude</td><td>Quien instala la Torre</td></tr><tr><td><a href="#ayuda-config-verificar">4. Verificación</a></td><td>Una sesión de Claude en ese entorno</td><td>Quien instala la Torre</td></tr><tr><td><a href="#ayuda-config-tablero">5. Tablero y rutina</a></td><td>Claude</td><td>La cuenta dueña del tablero</td></tr><tr><td><a href="#ayuda-primeros-pasos">6. Primeros pasos</a></td><td>Este tablero</td><td>Un Admin del tablero</td></tr></tbody></table><div class="ay-nota" role="note"><b>Los secretos no se comparten</b><p>El secret de la External App y el token de Bitbucket se copian una sola vez, de la pantalla donde se crean a la configuración del entorno. No se pegan en un chat, en un mail ni en este tablero.</p></div></section>
<section class="ay-sec n2" id="ayuda-config-uipath" data-nivel="2"><h3>1. External App en UiPath Cloud</h3><p class="ay-breve">La identidad con la que la rutina lee Orchestrator: una aplicación confidencial con permisos de solo lectura.</p><p>La rutina no entra a UiPath como una persona. Entra como una <strong>External Application</strong> propia, que solo puede leer. Se crea así:</p><ol>
<li>Entrá a <code>cloud.uipath.com</code> con una cuenta administradora de la organización y abrí <strong>Admin</strong>.</li>
<li>Elegí la organización en el panel de la izquierda y entrá a <strong>External Applications</strong>. Si hay pestañas, es la de <strong>OAuth Applications</strong>.</li>
<li>Tocá <strong>Add application</strong> y completá:
<ul>
<li><strong>Application name:</strong> un nombre que la identifique, por ejemplo <code>Torre de Control Operaciones</code>.</li>
<li><strong>Application type:</strong> <strong>Confidential application</strong>.</li>
</ul>
</li>
<li>En <strong>Resources</strong> tocá <strong>Add scopes</strong>. Elegí el recurso <strong>Orchestrator API Access</strong> y pasá a la pestaña <strong>Application scope(s)</strong>, no a la de User scope(s). Marcá solo estos ocho:
<ul>
<li><code>OR.Folders.Read</code></li>
<li><code>OR.Jobs.Read</code></li>
<li><code>OR.Queues.Read</code></li>
<li><code>OR.Assets.Read</code></li>
<li><code>OR.Execution.Read</code></li>
<li><code>OR.Monitoring.Read</code></li>
<li><code>OR.Robots.Read</code></li>
<li><code>OR.Machines.Read</code></li>
</ul>
</li>
<li>Dejá <strong>Redirect URL</strong> vacío: nadie inicia sesión con esta aplicación.</li>
<li>Tocá <strong>Add</strong>. UiPath muestra el <strong>App Secret</strong> una sola vez: copialo en ese momento. El <strong>App ID</strong> queda a la vista en la lista de aplicaciones.</li>
</ol><p>Los nombres de los menús pueden cambiar un poco según la versión de Automation Cloud.</p><p>De esta pantalla salen cuatro datos para el <a href="#ayuda-config-entorno">entorno</a>:</p><table><thead><tr><th>Dato</th><th>Dónde está</th><th>Variable</th></tr></thead><tbody><tr><td>App ID</td><td>La lista de External Applications</td><td><code>UIPATH_CLIENT_ID</code></td></tr><tr><td>App Secret</td><td>Solo en el aviso que aparece al crear la aplicación</td><td><code>UIPATH_APP_SECRET</code></td></tr><tr><td>Organización</td><td>La primera parte de la dirección después de <code>cloud.uipath.com/</code></td><td><code>UIPATH_ORG</code></td></tr><tr><td>Tenant</td><td>El nombre del tenant de producción, como aparece en el selector de tenants</td><td><code>UIPATH_TENANT</code></td></tr></tbody></table><div class="ay-nota" role="note"><b>Solo scopes de lectura</b><p>No marques ningún scope que no termine en <code>.Read</code>. La rutina nunca escribe en Orchestrator, y sin scopes de escritura UiPath mismo se lo impide.</p></div></section>
<section class="ay-sec n3" id="ayuda-config-uipath-carpetas" data-nivel="3"><h4>Acceso a las carpetas de producción</h4><p class="ay-breve">La External App solo ve las carpetas de Orchestrator a las que se la asigna, con un rol de solo lectura.</p><p>Los scopes dicen qué tipo de dato puede leer la aplicación. Qué carpetas ve se define aparte, en Orchestrator. Sin este paso las lecturas vuelven vacías o con error 403.</p><ol>
<li><strong>Creá un rol de carpeta de solo lectura.</strong> En Orchestrator, <strong>Tenant → Manage Access → Roles</strong>, agregá un rol de tipo <strong>Folder</strong>, por ejemplo <code>Monitor Operaciones</code>, con permiso <strong>View</strong> y ningún otro en Jobs, Logs, Queues, Transactions, Assets, Processes y Triggers.</li>
<li><strong>Asigná la aplicación a cada carpeta de producción.</strong> En <strong>Tenant → Folders</strong>, elegí la carpeta, tocá <strong>Assign Account/Group/External App</strong>, buscá la aplicación por su nombre y dale el rol del paso anterior. Las subcarpetas heredan el acceso de la carpeta que las contiene.</li>
<li><strong>Para el escaneo, dale un rol de tenant.</strong> En <strong>Tenant → Manage Access → Assign roles → External app</strong>, asignale un rol de tenant que tenga <strong>View</strong> en Folders. Con eso el <a href="#ayuda-descubrimiento">escaneo</a> puede recorrer las subcarpetas. Sin eso solo lee la carpeta indicada en Ajustes, y el tablero lo avisa.</li>
</ol><p>Cuando se suma una carpeta de producción nueva, se repite el paso 2 para esa carpeta.</p></section>
<section class="ay-sec n2" id="ayuda-config-bitbucket" data-nivel="2"><h3>2. Token de Bitbucket (opcional)</h3><p class="ay-breve">Un token de solo lectura para clonar el repositorio de un proyecto. Es un respaldo: el código sale de los paquetes publicados en Orchestrator.</p><p>La rutina lee el código y la documentación de los <strong>paquetes publicados en Orchestrator</strong>, en la versión desplegada. Bitbucket se usa solo cuando un paquete no trae las fuentes o la documentación y el proceso tiene un repositorio cargado en su <a href="#ayuda-proyecto-config">configuración</a>. Si no se carga un token, ese respaldo no existe y todo lo demás funciona igual.</p><p>La Torre usa <strong>un solo token</strong>, así que tiene que alcanzar a todos los repositorios que se quieran leer. Hay dos formas de crearlo:</p><p><strong>Access token del repositorio, del proyecto o del workspace (recomendado).</strong> No depende de la cuenta de una persona.</p><ol>
<li>En Bitbucket, abrí el repositorio y entrá a <strong>Repository settings → Security → Access tokens</strong>.</li>
<li>Tocá <strong>Create Repository Access Token</strong>.</li>
<li>Ponele un nombre, por ejemplo <code>torre-control-lectura</code>, y marcá un solo permiso: <strong>Repositories → Read</strong>.</li>
<li>Tocá <strong>Create</strong> y copiá el token: Bitbucket lo muestra una sola vez.</li>
</ol><p>Para cubrir varios repositorios con un token, se crea igual desde los ajustes del proyecto o del workspace (<strong>Workspace settings → Security → Access tokens</strong>). Esos dos niveles requieren un plan Premium de Bitbucket.</p><p><strong>API token de una cuenta de Atlassian.</strong> Sirve cuando no hay access tokens de workspace. Conviene una cuenta de servicio y no la de una persona.</p><ol>
<li>Con esa cuenta, entrá a <code>id.atlassian.com/manage-profile/security/api-tokens</code>.</li>
<li>Tocá <strong>Create API token with scopes</strong>, elegí la aplicación <strong>Bitbucket</strong> y marcá solo el scope de lectura de repositorios (<code>read:repository:bitbucket</code>).</li>
<li>Elegí el vencimiento, creá el token y copialo.</li>
</ol><table><thead><tr><th>Tipo de token</th><th><code>BITBUCKET_TOKEN</code></th><th><code>BITBUCKET_USER</code></th></tr></thead><tbody><tr><td>Access token</td><td>El token</td><td>Vacío</td></tr><tr><td>API token de Atlassian</td><td>El token</td><td>El email de la cuenta que lo creó</td></tr></tbody></table><div class="ay-nota" role="note"><b>Solo lectura, también acá</b><p>No marques permisos de escritura, de pull requests ni de administración. La Torre nunca hace commit, push ni PR: si un problema requiere un fix, lo reporta para que lo tome una persona. Las App passwords de Bitbucket están en retiro: no las uses.</p></div></section>
<section class="ay-sec n2" id="ayuda-config-entorno" data-nivel="2"><h3>3. Entorno en Claude</h3><p class="ay-breve">El entorno cloud donde corre la rutina: red limitada, variables con las credenciales y el script que instala el CLI de UiPath.</p><p>La rutina corre en un entorno cloud de Claude Code, que en Momentum se llama <code>momentum-operaciones</code>. Se crea desde Claude Code en la web, en la configuración de entornos, con tres partes:</p><p><strong>Red.</strong> Acceso <strong>Limited</strong>, con <strong>Allow package managers</strong> marcado y estos dominios permitidos:</p><ul>
<li><code>cloud.uipath.com</code></li>
<li><code>bitbucket.org</code></li>
<li><code>api.bitbucket.org</code></li>
</ul><p><strong>Variables.</strong> Se cargan en la configuración del entorno.</p><table><thead><tr><th>Variable</th><th>Valor</th><th>Secreto</th></tr></thead><tbody><tr><td><code>UIPATH_ORG</code></td><td>Organización de Automation Cloud</td><td>No</td></tr><tr><td><code>UIPATH_TENANT</code></td><td>Tenant de producción</td><td>No</td></tr><tr><td><code>UIPATH_CLIENT_ID</code></td><td>App ID de la External App</td><td>Sí</td></tr><tr><td><code>UIPATH_APP_SECRET</code></td><td>App Secret de la External App</td><td>Sí</td></tr><tr><td><code>BITBUCKET_TOKEN</code></td><td>Token de solo lectura. Opcional.</td><td>Sí</td></tr><tr><td><code>BITBUCKET_USER</code></td><td>Solo con un API token de Atlassian</td><td>No</td></tr><tr><td><code>OPS_ARTIFACT_URL</code></td><td>La dirección de este tablero</td><td>No</td></tr><tr><td><code>UIPATH_TELEMETRY_DISABLED</code></td><td><code>true</code></td><td>No</td></tr><tr><td><code>UIPATH_CLI_DISABLE_VERSION_SYNC</code></td><td><code>true</code></td><td>No</td></tr><tr><td><code>UIPATH_CARPETA_PRUEBA</code></td><td>Una carpeta de producción con actividad en las últimas 24 horas. Solo para la verificación.</td><td>No</td></tr><tr><td><code>BITBUCKET_REPO_PRUEBA</code></td><td>Un repositorio, como <code>workspace/repo</code> o su dirección. Solo para la verificación.</td><td>No</td></tr></tbody></table><p><strong>Setup script.</strong> El contenido de <code>scripts/setup-entorno.sh</code>, del repositorio de la Torre. Instala el CLI de UiPath en una versión fija. No lee ningún secreto.</p><p>Un cambio en las variables vale solo para las sesiones nuevas: las que ya están abiertas siguen con los valores anteriores.</p></section>
<section class="ay-sec n2" id="ayuda-config-verificar" data-nivel="2"><h3>4. Verificar los accesos</h3><p class="ay-breve">Una prueba de solo lectura que confirma que el entorno llega a Orchestrator, a Bitbucket y al tablero.</p><p>Abrí una <strong>sesión nueva</strong> de Claude en el entorno, con el repositorio de la Torre, y pedile:</p><p><code>/verificar-entorno</code></p><p>La prueba inicia sesión con la External App, hace una lectura de cada tipo, clona el repositorio de prueba y escribe y borra un documento de prueba en el tablero. El reporte trae conteos y nombres de campos, nunca datos. Termina con un veredicto:</p><ul>
<li><strong>GO:</strong> el login y las lecturas funcionan con el CLI. Se puede seguir.</li>
<li><strong>GO CON FALLBACK:</strong> el CLI falla pero la API de Orchestrator responde. La rutina usa la API.</li>
<li><strong>NO-GO:</strong> ninguno responde. El reporte dice qué acceso falta.</li>
</ul><table><thead><tr><th>Si el reporte dice</th><th>Causa probable</th><th>Qué hacer</th></tr></thead><tbody><tr><td><code>invalid_client</code> al iniciar sesión</td><td>App ID o secret mal copiados, o la aplicación está deshabilitada</td><td>Revisar la <a href="#ayuda-config-uipath">External App</a> y las variables</td></tr><tr><td>Login correcto y error 403 en una lectura</td><td>Falta un scope, o la aplicación no está asignada a la carpeta</td><td>Agregar el scope que nombra el reporte o <a href="#ayuda-config-uipath-carpetas">asignar la carpeta</a></td></tr><tr><td>Lista vacía en una carpeta con actividad</td><td>El nombre de la carpeta está mal escrito, o la aplicación no la ve</td><td>Revisar <code>UIPATH_CARPETA_PRUEBA</code> y la asignación a la carpeta</td></tr><tr><td>No se pudo bajar un paquete o una librería</td><td>Al rol le falta ver los paquetes</td><td>Sumar <strong>View</strong> en Packages al rol de carpeta, y en Libraries al rol de tenant</td></tr><tr><td>Host bloqueado</td><td>El dominio no está entre los permitidos</td><td>Agregarlo a la red del <a href="#ayuda-config-entorno">entorno</a></td></tr><tr><td><code>Authentication failed</code> en Bitbucket</td><td>Token vencido o sin lectura de repositorios, o falta <code>BITBUCKET_USER</code> con un API token</td><td>Crear de nuevo el <a href="#ayuda-config-bitbucket">token</a></td></tr></tbody></table></section>
<section class="ay-sec n2" id="ayuda-config-tablero" data-nivel="2"><h3>5. Tablero y rutina</h3><p class="ay-breve">Publicar el tablero, cargar su configuración inicial, programar la corrida de cada hora y compartirlo con el equipo.</p><ol>
<li><strong>Publicá el tablero.</strong> Es el archivo <code>dashboard/index.html</code> del repositorio, publicado como artifact con las capacidades de <code>dashboard/capabilities.json</code>. Queda con una dirección propia y la base vacía.</li>
<li><strong>Cargá esa dirección</strong> en la variable <code>OPS_ARTIFACT_URL</code> del entorno.</li>
<li><strong>Sembrá la configuración inicial.</strong> En una sesión nueva del entorno, pedí <code>/control-mantenimiento seed</code>. Carga los criterios de triage, los umbrales y la retención que después se ven en <a href="#ayuda-ajustes">Ajustes</a>.</li>
<li><strong>Programá la rutina.</strong> Una tarea programada de Claude que abre una sesión nueva en el entorno cada hora, en el horario operativo, con el pedido <code>Ejecutá /control-corrida.</code> La hora de cada corrida se ve en el <a href="#ayuda-pulso">pulso de la rutina</a>.</li>
<li><strong>Compartí el tablero</strong> con el equipo y dale a cada persona su <a href="#ayuda-roles">rol</a>.</li>
</ol><p>La rutina corre como la cuenta dueña del tablero. Por eso es la única que escribe corridas y temas.</p></section>
<section class="ay-sec n2" id="ayuda-primeros-pasos" data-nivel="2"><h3>6. Primeros pasos en un tablero nuevo</h3><p class="ay-breve">Con la rutina en marcha, un Admin indica la carpeta a escanear y registra los proyectos.</p><p>Un tablero recién publicado no tiene proyectos. Un Admin lo pone en marcha así:</p><ol>
<li><strong>Indicá la carpeta a escanear.</strong> En <a href="#ayuda-descubrimiento">Ajustes</a>, escribí la carpeta de Orchestrator donde están los proyectos de producción y tocá <strong>Guardar y escanear</strong>.</li>
<li><strong>Revisá los proyectos propuestos.</strong> La próxima corrida recorre esa carpeta y propone como proyecto cada carpeta que tiene procesos. Aparecen en <a href="#ayuda-propuestos">Registrar proyecto</a>.</li>
<li><strong>Registrá los que quieras controlar</strong> e ignorá el resto. La rutina hace el <a href="#ayuda-alta">alta</a> de cada uno, hasta 3 por corrida.</li>
<li><strong>Revisá y activá.</strong> Cada proyecto queda En revisión con su memoria de proceso, sus discrepancias y sus reglas propuestas. Cuando esté bien, activá el control.</li>
</ol><p>Mientras no hay proyectos, la Bandeja y Proyectos muestran estos pasos.</p></section>
<section class="ay-sec n2" id="ayuda-config-credenciales" data-nivel="2"><h3>Renovar credenciales y resolver problemas</h3><p class="ay-breve">Qué hacer cuando vence o se cambia el secret de UiPath o el token de Bitbucket, y qué mirar si la rutina deja de leer.</p><p><strong>Secret de la External App.</strong> En <strong>Admin → External Applications</strong>, editá la aplicación y generá un secret nuevo. Cargalo en <code>UIPATH_APP_SECRET</code>. El secret anterior deja de servir.</p><p><strong>Token de Bitbucket.</strong> Revocá el anterior, creá uno nuevo con los <a href="#ayuda-config-bitbucket">mismos permisos</a> y cargalo en <code>BITBUCKET_TOKEN</code>. Los API tokens de Atlassian tienen vencimiento: conviene anotar la fecha.</p><p>Después de cualquier cambio, corré <code>/verificar-entorno</code> en una sesión nueva. La corrida siguiente ya usa el valor nuevo.</p><table><thead><tr><th>Lo que se ve en el tablero</th><th>Qué mirar</th></tr></thead><tbody><tr><td><strong>Rutina detenida</strong>, en rojo</td><td>La tarea programada está pausada o falla al arrancar. Revisá su historial de ejecuciones en Claude.</td></tr><tr><td>Un tema de categoría Monitoreo que dice que no pudo iniciar sesión</td><td>El secret de la External App venció o se cambió. Renovalo y verificá.</td></tr><tr><td>Un proyecto <strong>Con error</strong></td><td>La nota del proyecto dice el motivo. Lo habitual es que la External App no esté <a href="#ayuda-config-uipath-carpetas">asignada a esa carpeta</a>.</td></tr><tr><td>El escaneo no encuentra subcarpetas</td><td>A la External App le falta el rol de tenant con View en Folders.</td></tr><tr><td>Un análisis previo sin código relacionado</td><td>El paquete no trae las fuentes y no hay repositorio o token de Bitbucket para ese proceso.</td></tr></tbody></table></section>
<section class="ay-sec n1" id="ayuda-pantallas" data-nivel="1"><h2>Pantallas y acciones</h2><p class="ay-breve">Cada pantalla, pestaña y botón del tablero, con vistas de ejemplo.</p><p>Cada pantalla tiene un botón <strong>?</strong> al lado del título que trae a su sección de esta ayuda. El link <strong>Ayuda</strong> del menú también abre la parte de la pantalla en la que estás. Al pasar el mouse por un botón o una etiqueta aparece una explicación breve, con un link a más detalle. Las vistas de esta página son las de la app, dibujadas con datos de ejemplo.</p></section>
<section class="ay-sec n2" id="ayuda-navegacion" data-nivel="2"><h3>Menú y selector de proyecto</h3><p>El menú está siempre a la vista: a la izquierda en una computadora y abajo en el teléfono. Lleva a la Bandeja, Proyectos, Corridas, Reglas, Fuera de bandeja, Ajustes (Admin) y esta Ayuda. El número de la Bandeja es la cantidad de temas abiertos; el de Reglas, las propuestas que esperan aprobación.</p><p>Abajo del menú está el <a href="#ayuda-pulso">pulso de la rutina</a> y tu <a href="#ayuda-roles">rol</a>. En el teléfono el pulso y el <strong>?</strong> están en la barra de arriba, y Fuera de bandeja, Ajustes y Ayuda están dentro de <a href="#ayuda-mas">Más</a>.</p><div class="ay-accion" id="ayuda-scope"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Proyecto</span></div><p><b>Filtra la Bandeja, Corridas, Reglas y Fuera de bandeja por un proyecto. La × quita el filtro.</b></p><p>Tocalo y escribí parte del nombre o de la carpeta. Elegí el proyecto con un clic, o con las flechas y Enter. Cada proyecto muestra un punto de color con su salud (verde: sin novedades; ámbar: con avisos; rojo: con problemas P1 o P2; gris: pausado o sin datos) y cuántos temas tiene abiertos. Primero aparecen los que tienen temas abiertos.</p><p>El filtro queda aplicado en todas esas pantallas, y se recuerda en este navegador, hasta que lo quites con la <strong>×</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:selector:abierto--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div></section>
<section class="ay-sec n2" id="ayuda-bandeja" data-nivel="2"><h3>Bandeja</h3><p class="ay-breve">La pantalla principal: lo que necesita a una persona, ordenado por severidad.</p><p>Es la pantalla de trabajo. Muestra solo los temas abiertos cuya decisión es escalar o avisar, y que nadie respondió, descartó o pospuso. Están ordenados por severidad, primero los escalados y después los más recientes. Si no hay nada pendiente, dice <strong>Todo en orden</strong>.</p><ul>
<li>Los botones <strong>Todo</strong>, <strong>Para vos</strong>, <strong>Requiere acción</strong> y <strong>Avisos</strong> muestran solo esa parte.</li>
<li>El buscador filtra por título, proyecto, categoría, proceso o severidad.</li>
<li>Si la rutina está detenida o la última corrida tuvo errores de colecta, arriba aparece un aviso rojo.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:bandeja:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-para-revisar" data-nivel="3"><h4>Para revisar</h4><p class="ay-breve">Solo Admin: reglas propuestas, cambios sugeridos en reglas, proyectos propuestos y proyectos que terminaron su análisis.</p><p>Solo la ven los Admin, en la vista <strong>Todo</strong>. Junta las tareas de configuración pendientes: <a href="#ayuda-propuestas">reglas propuestas</a>, reglas con un cambio sugerido, <a href="#ayuda-propuestos">proyectos propuestos</a> por el escaneo, proyectos <strong>En revisión</strong> que esperan ser activados y proyectos <strong>Con error</strong>. Cada fila lleva a donde se resuelve.</p><p>Las <a href="#ayuda-discrepancia">discrepancias</a> de un proyecto no aparecen acá ni en el resto de la bandeja: se trabajan desde la página del proyecto.</p></section>
<section class="ay-sec n3" id="ayuda-para-vos" data-nivel="3"><h4>Para vos</h4><p class="ay-breve">Temas que alguien te delegó.</p><p>Los temas que alguien te <a href="#ayuda-delegar">delegó</a>. Salen de esta lista cuando los respondés, descartás o posponés.</p></section>
<section class="ay-sec n3" id="ayuda-requiere-accion" data-nivel="3"><h4>Requiere acción</h4><p class="ay-breve">Temas escalados: el triage decidió que necesitan a una persona.</p><p>Los temas con decisión <strong>Escalado</strong>. En general son P1 o P2, o algo que la rutina nunca había visto. Cada uno trae su análisis previo en el detalle.</p></section>
<section class="ay-sec n3" id="ayuda-avisos" data-nivel="3"><h4>Avisos</h4><p class="ay-breve">Cosas para saber que no bloquean, en formato compacto.</p><p>Los temas con decisión <strong>Aviso</strong>, en general P3 o P4 nuevos. Se muestran compactos: sin el porqué y sin Delegar. El detalle tiene todo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:aviso--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-tarjeta" data-nivel="2"><h3>El tema y su detalle</h3><p class="ay-breve">Un problema por tema, con su severidad, su porqué y las acciones para trabajarlo.</p><p>Cada tarjeta es un <a href="#ayuda-tema">tema</a>. Si el problema vuelve a ocurrir no se crea otra: la misma suma ocurrencias.</p><ul>
<li><strong>A la izquierda:</strong> la <a href="#ayuda-severidad">severidad</a>.</li>
<li><strong>Etiquetas:</strong> la <a href="#ayuda-categoria">categoría</a>; el proyecto, cuando no hay filtro, y el proceso si el proyecto tiene varios; la <a href="#ayuda-recurrencia">recurrencia</a>; <a href="#ayuda-reaparecio">Reapareció</a>; la <a href="#ayuda-libreria">librería</a> donde ocurrió el error; <a href="#ayuda-nueva-version">Nueva versión</a>; <strong>Aviso</strong>, y a quién está delegado.</li>
<li><strong>Texto gris:</strong> el porqué del triage, en dos líneas.</li>
<li><strong>Acciones:</strong> abajo. Un Lector no las ve.</li>
</ul><p>Un clic en la tarjeta, o en <strong>Ver detalle</strong>, abre el detalle en un panel al costado, sin perder el lugar en la lista. Se cierra con la <strong>×</strong>, con Esc o tocando fuera.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-detalle" data-nivel="3"><h4>El detalle de un tema</h4><p class="ay-breve">Por qué está acá, el análisis previo, la evidencia y la actividad del tema.</p><p>El detalle muestra, en este orden:</p><ol>
<li><strong>Estado:</strong> si el tema está delegado, pospuesto, descartado o respondido, y por quién. Si salió de la bandeja, ofrece <a href="#ayuda-reabrir">Devolver a la bandeja</a>.</li>
<li><strong>Acciones:</strong> las mismas de la tarjeta.</li>
<li><strong>Por qué está acá:</strong> el porqué del triage, la decisión y su confianza, las reglas y memorias en las que se basó, desde cuándo se ve y en cuántas corridas.</li>
<li><strong>Análisis previo:</strong> resumen, hipótesis con su probabilidad, acciones sugeridas, código y documentación relacionados, y qué cambió en el último deploy. Si dice Pendiente, lo completa la próxima corrida.</li>
<li><strong>Librería:</strong> si el error ocurrió en una librería, su versión, la actividad y qué otros proyectos la usan.</li>
<li><strong>Evidencia (redactada):</strong> los últimos logs, queue items y jobs, sin datos personales.</li>
<li><strong>Actividad:</strong> quién hizo qué con el tema, y un cuadro para <a href="#ayuda-comentar">comentar</a>.</li>
</ol><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:detalle--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-acciones" data-nivel="2"><h3>Acciones sobre un tema</h3><p>Las usan los Operadores y los Admin. Cada acción queda en la actividad del tema. Las respuestas y los descartes además le enseñan a la rutina, que los procesa en la próxima corrida. Después de posponer, descartar o responder aparece un aviso con <strong>Deshacer</strong>.</p><div class="ay-accion" id="ayuda-responder"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Responder</span></div><p><b>Registra qué se encontró o qué se va a hacer. Queda en la memoria de producción.</b></p><p>Elegí una decisión y agregá notas:</p><ul>
<li><strong>Requiere fix:</strong> hay que corregir el robot. Podés cargar el ticket o la referencia del fix.</li>
<li><strong>Comportamiento esperado</strong>, <strong>Problema de datos</strong>, <strong>Sistema externo</strong> o <strong>Falso positivo / ajustar regla:</strong> la causa es otra; la rutina lo aprende.</li>
<li><strong>Volver a controlar:</strong> elegí una fecha. El tema se oculta hasta ese día y la rutina hace un <a href="#ayuda-re-control">re-control</a>.</li>
<li><strong>Derivar a desarrollo:</strong> lo toma el equipo de desarrollo.</li>
</ul><p>El tema sale de la bandeja y la respuesta queda en la memoria de producción del proyecto.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:responder--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-posponer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Posponer</span></div><p><b>Oculta el tema hasta una fecha. Vuelve antes si el problema empeora.</b></p><p>Elegí 1 día, 3 días, 1 semana o una fecha. Mientras tanto el tema pasa a <a href="#ayuda-no-reportados">Fuera de bandeja</a> como <strong>Pospuesto</strong>.</p><ul>
<li>Si la severidad sube antes de la fecha, el tema vuelve a la bandeja solo.</li>
<li>Al vencer, vuelve a mostrarse si el problema sigue.</li>
<li>Posponer no le enseña nada a la rutina. Si el problema es esperado, conviene <strong>Descartar</strong> o <strong>Responder</strong>.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:posponer--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar</span></div><p><b>Saca el tema de la bandeja con un motivo. La rutina lo aprende y puede proponer una regla.</b></p><p>Elegí un motivo y, si querés, agregá una nota que explique por qué:</p><ul>
<li><strong>Es esperado:</strong> pasa siempre y no es un problema, por ejemplo una ventana de mantenimiento.</li>
<li><strong>Falso positivo:</strong> la detección se equivocó.</li>
<li><strong>Dato de negocio:</strong> es una excepción de negocio esperable, no una falla del robot.</li>
<li><strong>Sistema externo:</strong> el problema está en un sistema que no depende del equipo.</li>
</ul><p>La rutina anota el motivo en la <a href="#ayuda-memoria-de-produccion">memoria de producción</a> y puede proponer una <a href="#ayuda-regla">regla</a> para no volver a avisar. Si el tema se repite, suma ocurrencias en la misma tarjeta, pero no vuelve a la bandeja como nuevo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:descartar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-delegar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Delegar</span></div><p><b>Asigna la revisión a una persona: el tema le aparece en Para vos.</b></p><p>Buscá a la persona por nombre y elegila. La tarjeta muestra a quién está delegado y sigue en la bandeja de todos, pero esa persona lo ve en <strong>Para vos</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:delegar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-ajustar-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ajustar regla o Crear regla</span></div><p><b>Abre el editor de la regla de este tema sin salir de la bandeja. Un Operador la ve pero no la cambia.</b></p><p>Si el tema salió de una regla, o una regla lo marcó como conocido, el botón dice <strong>Ajustar regla</strong> (o <strong>Ver regla</strong> para un Operador) y abre el <a href="#ayuda-editor-regla">editor de reglas</a> ahí mismo.</p><p>Si no salió de ninguna regla, un Admin ve <strong>Crear regla</strong>: escribís una para ese caso, por ejemplo &quot;los abandonados de esta cola los lunes antes de las 9 son normales; no avisar&quot;, y vale para ese proyecto desde la próxima corrida. Con <strong>Descartar también este tema</strong> el incidente se cierra en el mismo paso.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:regla--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></div><div class="ay-accion" id="ayuda-re-crear"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Crear regla (desde un tema)</span><span class="role-b">Solo Admin</span></div><p><b>Crea una regla nueva para el proyecto de este tema. Se compila en la próxima corrida.</b></p><p>La regla queda <strong>Por compilar</strong> hasta que la rutina la traduce. Si marcaste <strong>Descartar también este tema</strong>, el tema sale de la bandeja como falso positivo, con <strong>Deshacer</strong> en el aviso.</p></div><div class="ay-accion" id="ayuda-comentar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Comentar</span></div><p><b>Deja una nota para el equipo en la actividad del tema. No cambia su estado.</b></p><p>El cuadro está en la sección <strong>Actividad</strong> del detalle. El comentario no saca el tema de la bandeja ni le enseña nada a la rutina. Con Ctrl o Cmd + Enter se envía sin usar el mouse.</p></div><div class="ay-accion" id="ayuda-reanalizar-inc"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Volver a analizar</span></div><p><b>Pide a la próxima corrida un análisis previo nuevo de este tema.</b></p><p>Está junto al título <strong>Análisis previo</strong> del detalle (si el tema no tiene análisis, dice <strong>Pedir análisis</strong>). Sirve cuando el análisis quedó viejo, por ejemplo después de un cambio en el sistema o en la documentación.</p></div><div class="ay-accion" id="ayuda-reabrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Devolver a la bandeja</span></div><p><b>Deshace un posponer, un descarte o una respuesta: el tema vuelve a la bandeja.</b></p><p>Aparece en el detalle de un tema pospuesto, descartado o respondido. El tema vuelve como estaba antes y queda en su actividad.</p></div><div class="ay-accion" id="ayuda-deshacer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Deshacer</span></div><p><b>Revierte la última acción sobre el tema (posponer, descartar o responder).</b></p><p>Está en el aviso que aparece abajo durante unos segundos después de la acción. Pasado ese tiempo se usa <strong>Devolver a la bandeja</strong> desde el detalle.</p></div></section>
<section class="ay-sec n2" id="ayuda-no-reportados" data-nivel="2"><h3>Fuera de bandeja</h3><p class="ay-breve">Temas abiertos que no se muestran en la bandeja: pospuestos, respondidos, descartados o no reportados por el triage.</p><p>Todo lo abierto que no está en la bandeja, con el motivo. Los botones de arriba filtran por <strong>Pospuestos</strong>, <strong>Respondidos</strong>, <strong>Descartados</strong> o <strong>No reportados por el triage</strong> (decisiones En observación y Conocido).</p><p>Sirve para controlar el criterio de la rutina. Si algo de acá debería estar en la bandeja, abrilo y usá <strong>Devolver a la bandeja</strong>, respondé <strong>Falso positivo / ajustar regla</strong> o corregí los <a href="#ayuda-criterios">criterios</a>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:fuera:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-corridas" data-nivel="2"><h3>Corridas</h3><p class="ay-breve">Cada ejecución de la rutina, con lo que revisó y lo que encontró.</p><p>Las últimas 50 corridas, con su estado (Completa, Parcial o Con errores), cuántos proyectos revisó y cuántos temas nuevos, recurrentes y escalados encontró.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corridas:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-corrida-detalle" data-nivel="3"><h4>Detalle de una corrida</h4><p class="ay-breve">Qué revisó la rutina en cada proyecto y qué decidió con cada hallazgo.</p><p>Por cada proyecto muestra la ventana de tiempo revisada, un resumen de señales, la tabla de <a href="#ayuda-punto-de-control">puntos de control</a> con su valor observado y los <strong>Hallazgos y triage</strong>: cada hallazgo con su severidad, su decisión, si es nuevo, recurrente o reabierto, y su porqué. Un clic en un hallazgo abre su tema. Si hubo errores al leer Orchestrator, aparecen en la caja del proyecto.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corrida:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-proyectos" data-nivel="2"><h3>Proyectos</h3><p class="ay-breve">Todos los proyectos controlados, con su salud, su estado y sus temas abiertos.</p><p>La lista de proyectos con su carpeta de Orchestrator, sus temas abiertos, sus <a href="#ayuda-discrepancia">discrepancias</a> pendientes y su <a href="#ayuda-estado-proyecto">estado</a>. Primero aparecen los que tienen problemas o esperan revisión. Con más de 5 proyectos aparece un buscador. Los Admin ven <strong>Registrar proyecto</strong> y un aviso si la rutina <a href="#ayuda-propuestos">propone proyectos</a> para agregar.</p><p>Si todavía no hay proyectos, un Admin ve los <a href="#ayuda-primeros-pasos">primeros pasos</a>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyectos:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-pagina-proyecto" data-nivel="2"><h3>Página de un proyecto</h3><p class="ay-breve">Procesos, memoria, discrepancias, documentación, reglas, inventario y configuración de un proyecto.</p><p>Arriba está la carpeta, la cantidad de procesos, el estado y cuántas discrepancias tiene pendientes, con las acciones. Debajo, cada proceso con su rol, su nombre en Orchestrator, el paquete y la versión desplegada, y sus librerías. Si el último análisis falló, un aviso rojo dice qué acceso o dato faltó. Después vienen siete pestañas. Las notas del último análisis (lo que encontró y los criterios que sugiere) están plegadas al principio de la pestaña Memoria de proceso.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:memoria--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-ver-bandeja"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ver temas abiertos</span></div><p><b>Abre la bandeja filtrada por este proyecto.</b></p><p>Aparece cuando el proyecto tiene temas en la bandeja. Aplica el <a href="#ayuda-scope">selector de proyecto</a>.</p></div><div class="ay-accion" id="ayuda-activar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Activar el control</span><span class="role-b">Solo Admin</span></div><p><b>Empieza a controlar el proyecto en cada corrida. También reanuda un control pausado.</b></p><p>Aparece cuando el proyecto terminó su <a href="#ayuda-alta">alta</a> y está <strong>En revisión</strong>: antes de activarlo, revisá la memoria de proceso, las reglas propuestas y el inventario. Si el proyecto está <strong>Pausado</strong>, el botón dice <strong>Reanudar control</strong>.</p></div><div class="ay-accion" id="ayuda-pausar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pausar control</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar el proyecto hasta que se reanude. No borra nada.</b></p><p>Útil durante un mantenimiento largo o mientras se rehace un proceso. Los temas abiertos quedan como están y el proyecto se ve gris.</p></div><div class="ay-accion" id="ayuda-reanalizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pedir re-análisis</span><span class="role-b">Solo Admin</span></div><p><b>Pide a la próxima corrida que regenere la memoria de proceso, el inventario y las reglas propuestas.</b></p><p>Conviene después de un cambio grande en el proceso o en su documentación. El proyecto sigue activo mientras tanto.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-memoria" data-nivel="3"><h4>Pestaña Memoria de proceso</h4><p class="ay-breve">Qué hace el proceso, según el alta: el contexto que usa la rutina.</p><p>La <a href="#ayuda-memoria-de-proceso">memoria de proceso</a>: qué hace el proceso, sus pasos, sistemas, colas y excepciones conocidas. La genera el alta a partir del código y la documentación.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-produccion" data-nivel="3"><h4>Pestaña Memoria de producción</h4><p class="ay-breve">Lo que pasó en producción: respuestas del equipo, deploys y re-controles.</p><p>La <a href="#ayuda-memoria-de-produccion">memoria de producción</a>: un resumen arriba y debajo el historial, del más nuevo al más viejo, con quién respondió y el ticket si lo hay.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:produccion--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-discrepancias" data-nivel="3"><h4>Pestaña Discrepancias</h4><p class="ay-breve">Lo que no coincide entre el código, la documentación y Orchestrator. Se responde, se pospone o se descarta acá: no va a la bandeja.</p><p>Las <a href="#ayuda-discrepancia">discrepancias</a> que encontró el análisis del proyecto, por ejemplo:</p><ul>
<li>una cola o un asset que figura en el SDD o en el código y no existe en Orchestrator, o al revés;</li>
<li>un trigger con una frecuencia distinta a la documentada;</li>
<li>el Dispatcher y el Performer que no usan la misma cola;</li>
<li>documentación que no coincide con el código;</li>
<li>un paquete que publica capturas o datos que no debería.</li>
</ul><p>Cada una muestra su tipo, el proceso, qué se encontró, una sugerencia y de dónde sale. Son tarjetas del proyecto: <strong>no aparecen en la bandeja</strong> ni cambian su salud. El número de la pestaña, y el de la lista de proyectos, cuenta las pendientes.</p><ul>
<li><strong>Pendientes:</strong> las que la rutina sigue detectando y nadie atendió.</li>
<li><strong>Atendidas:</strong> las respondidas, pospuestas o descartadas, con quién lo hizo, y las <strong>resueltas</strong>, que la rutina dejó de detectar.</li>
</ul><p>En cada re-análisis la rutina actualiza la lista: suma las nuevas, cierra las que ya no detecta y respeta lo que respondió el equipo. Una discrepancia descartada no vuelve a aparecer como nueva. Si una que se dio por corregida vuelve a detectarse, reaparece como pendiente con la marca <strong>Reapareció</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:discrepancias--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-disc-responder"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Responder</span></div><p><b>Registra qué se va a hacer con la discrepancia. Queda en la memoria de producción del proyecto.</b></p><p>Elegí una decisión y agregá notas:</p><ul>
<li><strong>Corregir la documentación</strong>, <strong>Corregir en Orchestrator</strong> o <strong>Corregir el código:</strong> hay algo para arreglar. Podés cargar el ticket o la referencia. La discrepancia pasa a Atendidas y la rutina la cierra cuando un re-análisis deja de detectarla.</li>
<li><strong>Es correcto así:</strong> no hay nada que corregir. La rutina lo anota y no vuelve a preguntar.</li>
<li><strong>Derivar a desarrollo:</strong> lo toma el equipo de desarrollo.</li>
</ul></div><div class="ay-accion" id="ayuda-disc-posponer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Posponer</span></div><p><b>Saca la discrepancia de las pendientes hasta una fecha.</b></p><p>Elegí 1 semana, 1 mes, 3 meses o una fecha. Al vencer vuelve a Pendientes, si la rutina la sigue detectando.</p></div><div class="ay-accion" id="ayuda-disc-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar</span></div><p><b>Cierra la discrepancia con un motivo. La rutina no la vuelve a mostrar como nueva.</b></p><p>Motivos: <strong>Es correcto así</strong>, <strong>La rutina se equivocó</strong>, <strong>Ya se corrigió</strong> o <strong>No es relevante</strong>, con una nota opcional. Queda en Atendidas y en la memoria de producción.</p></div><div class="ay-accion" id="ayuda-disc-reabrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Volver a abrir</span></div><p><b>Deshace la respuesta, el descarte o la posposición: la discrepancia vuelve a estar pendiente.</b></p><p>Aparece en las discrepancias atendidas que la rutina todavía detecta.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-documentacion" data-nivel="3"><h4>Pestaña Documentación</h4><p class="ay-breve">Los documentos del proyecto (PDD, SDD, Runbook y otros), subidos a mano y guardados en Markdown.</p><p>La rutina lee sola la documentación que viene dentro de los paquetes publicados. Cuando un documento no está ahí, o está desactualizado, un Admin lo sube acá. Se pueden subir <strong>tantos documentos como haga falta</strong>. Cada uno lleva una categoría y, si querés, un título o una descripción:</p><ul>
<li><strong>PDD:</strong> el proceso de negocio, sus pasos y sus excepciones.</li>
<li><strong>SDD:</strong> cómo está construida la solución, con sus colas, assets y triggers.</li>
<li><strong>Runbook:</strong> qué hacer ante cada falla y a quién escalar.</li>
<li><strong>Otro:</strong> manuales, instructivos, acuerdos de servicio o cualquier otro documento útil.</li>
