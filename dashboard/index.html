<title>Torre de Control Momentum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de trabajo (bandeja de acción) bajo una barra fina de estado por proyecto;
   todo lo secundario vive en vistas "Ver más" enrutadas por #hash. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#e9edeb; --fg:#16201d; --muted:#5d6a66; --line:#d5dcd9;
  --accent:#0d6b5f; --accent-fg:#ffffff;
  --p1:#c62828; --p2:#d9640c; --p3:#b88a00; --p4:#7a8580; --ok:#2e7d4f;
  --p1-bg:#fdecea; --p2-bg:#fdf0e6; --p3-bg:#fbf5dd; --p4-bg:#eef1f0; --ok-bg:#e6f3ec;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1e2824; --fg:#e3ebe8; --muted:#93a39e; --line:#2a3632;
  --accent:#3fb8a6; --accent-fg:#0b1412;
  --p1:#ef6a62; --p2:#f0924a; --p3:#e3bc3f; --p4:#8f9b97; --ok:#5cc28a;
  --p1-bg:#3a1c1a; --p2-bg:#3a2617; --p3-bg:#352d12; --p4-bg:#232c29; --ok-bg:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1e2824; --fg:#e3ebe8; --muted:#93a39e; --line:#2a3632;
  --accent:#3fb8a6; --accent-fg:#0b1412;
  --p1:#ef6a62; --p2:#f0924a; --p3:#e3bc3f; --p4:#8f9b97; --ok:#5cc28a;
  --p1-bg:#3a1c1a; --p2-bg:#3a2617; --p3-bg:#352d12; --p4-bg:#232c29; --ok-bg:#16301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:880px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* Barra superior */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:600;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg)}
.brand svg{width:20px;height:20px;color:var(--accent)}
.pulse{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--p4);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--p3)} .dot.critical{background:var(--p1)} .dot.unknown,.dot.off{background:var(--p4)}
.role{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-fg)}
.chip .n{font-family:var(--mono);font-size:11.5px;opacity:.8}

/* Secciones */
main{padding-top:18px;display:grid;gap:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.sec-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:0;color:var(--muted)}
.sec-h .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.list{display:grid;gap:10px}

/* Tarjeta de incidente */
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--p4);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0}
.card.P1{border-left-color:var(--p1)} .card.P2{border-left-color:var(--p2)} .card.P3{border-left-color:var(--p3)}
.c-head{display:flex;gap:10px;align-items:flex-start;min-width:0}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--p4-bg);color:var(--p4)}
.P1 .ico{background:var(--p1-bg);color:var(--p1)} .P2 .ico{background:var(--p2-bg);color:var(--p2)} .P3 .ico{background:var(--p3-bg);color:var(--p3)}
.ico svg{width:17px;height:17px}
.c-main{min-width:0;flex:1;display:grid;gap:3px}
.c-title{font-weight:600;font-size:14.5px;text-wrap:balance;overflow-wrap:anywhere}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.pill{font-family:var(--mono);font-size:11.5px;font-weight:500;border-radius:5px;padding:1px 6px;background:var(--p4-bg);color:var(--p4)}
.pill.P1{background:var(--p1-bg);color:var(--p1)} .pill.P2{background:var(--p2-bg);color:var(--p2)} .pill.P3{background:var(--p3-bg);color:var(--p3)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 6px}
.tag.rec{border-color:transparent;background:var(--surface-2);color:var(--fg);font-family:var(--mono);font-size:11.5px}
.tag.reo{border-color:var(--p2);color:var(--p2)}
.why{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn svg{width:14px;height:14px}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.link{border-color:transparent;background:none;color:var(--muted);padding-inline:4px}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;font-size:13px;width:100%}
textarea{min-height:70px;resize:vertical}
.panel{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.people{display:grid;gap:4px}
.person{display:flex;gap:8px;align-items:center;border:1px solid transparent;border-radius:7px;padding:4px 6px;background:none;text-align:left}
.person:hover{border-color:var(--line)}
.av{width:22px;height:22px;border-radius:50%;flex:none}
.who{display:inline-flex;align-items:center;gap:6px}

/* Detalle */
.detail{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.detail h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ev{display:grid;gap:4px;max-height:260px;overflow:auto}
.ev .l{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:5px 8px;overflow-wrap:anywhere}
.hyp{display:grid;gap:6px;padding-left:0;margin:0;list-style:none}
.hyp li{display:grid;gap:2px;border-left:3px solid var(--line);padding-left:9px}
.hyp li.alta{border-color:var(--p2)}
.tl{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px}
.tl time{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}

/* Estado vacío y avisos */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px 18px;text-align:center;display:grid;gap:6px;justify-items:center}
.empty svg{width:44px;height:44px;color:var(--ok)}
.empty b{font-size:17px}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.banner.bad{background:var(--p1-bg);color:var(--p1)} .banner.info{background:var(--surface-2);color:var(--fg)}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini a{display:inline-flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;text-decoration:none;color:var(--fg);font-size:13px}
.mini a .n{font-family:var(--mono)}
.card.compact{padding:10px 14px;gap:6px}
.card.compact .c-title{font-size:14px;font-weight:500}
.actions .sp{flex:1}
.procs{display:grid;gap:10px}
.proc{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--bg)}
.proc-h{display:flex;align-items:center;gap:8px}
.proc-h b{flex:1;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.role-b{font-family:var(--mono);font-size:11px;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.plist{display:grid;gap:6px}
.pitem{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;font-size:13px}

/* Ver más */
nav.more{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:16px}
nav.more a{color:var(--muted);text-decoration:none;font-size:13px;border-radius:7px;padding:5px 10px;border:1px solid transparent}
nav.more a:hover,nav.more a[aria-current="page"]{border-color:var(--line);color:var(--fg);background:var(--surface)}
.back{color:var(--muted);text-decoration:none;font-size:13px}
.view-h{display:grid;gap:4px}
.view-h h1{font-size:20px;margin:0;text-wrap:balance}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.rows{display:grid}
.rowi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);min-width:0}
.rowi:last-child{border-bottom:0}
.rowi .t{min-width:0;overflow-wrap:anywhere}
.nums{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:none;border-radius:7px;padding:5px 10px;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--line);background:var(--surface);color:var(--fg)}
.md{min-width:0;overflow-wrap:anywhere}
.md h1,.md h2,.md h3{font-size:15px;margin:14px 0 4px} .md p{margin:6px 0} .md ul{margin:6px 0;padding-left:20px}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:0 4px;border-radius:4px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.ok-ico{color:var(--ok)} .al-ico{color:var(--p2)} .om-ico{color:var(--p4)}
.ico-s{width:15px;height:15px;vertical-align:-3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:13px;z-index:20}
@media (max-width:520px){.pulse .txt{display:none}.kv{grid-template-columns:1fr}.kv dt{margin-top:4px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="row1">
      <a class="brand" href="#inicio" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M5 22l2.5-10h9L19 22M8.5 8h7l1 4h-9z"/><path d="M4 6a11 11 0 0 1 4-3M20 6a11 11 0 0 0-4-3"/></svg>
        Torre de Control
      </a>
      <span class="role" id="role">…</span>
      <div class="pulse" id="pulse"><span class="dot unknown"></span><span class="txt">Conectando…</span></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por proyecto"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
(() => {
'use strict';

// ---------- iconos (SVG inline, trazo) ----------
const P = {
  login:'<path d="M15 7a4 4 0 1 1-3.9 4.9L4 19v2h3v-2h2v-2h2l1.1-1.1A4 4 0 0 1 15 7z"/><circle cx="16" cy="9" r="1"/>',
  selector:'<path d="M4 4l7 17 2.5-7.5L21 11z"/>',
  app_down:'<path d="M3 3l18 18M8 16H6a4 4 0 0 1-.9-7.9M9.5 5.2A6 6 0 0 1 18 9a4 4 0 0 1 2.4 7.2"/>',
  infrastructure:'<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  configuration:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  scheduling:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  business:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  silent_failure:'<path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c5 0 9 5 9 7a9 9 0 0 1-2.2 3.2M6.6 6.6C4.3 8 3 10.6 3 12c0 2 4 7 9 7a9.6 9.6 0 0 0 4.2-1"/>',
  regression:'<path d="M3 7l6 6 4-4 8 8M21 11v6h-6"/>',
  deploy:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  monitoring:'<circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/>',
  application:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  reply:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/>',
  send:'<path d="M4 12l16-8-6 16-2.5-6.5z"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/>',
  minus:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
};
P.data = P.business; P.other = P.application; P.sla = P.scheduling;
const ico = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || P.application}</svg>`;

// ---------- textos ----------
const CAT = { business:'Negocio', application:'Sistema', login:'Login / credenciales', selector:'Selector / UI', app_down:'Aplicación caída', data:'Datos', infrastructure:'Infraestructura', configuration:'Configuración', scheduling:'Programación', sla:'SLA', regression:'Regresión', silent_failure:'Falla silenciosa', monitoring:'Monitoreo', deploy:'Deploy', other:'Otro' };
const DEC = { escalate:'Escalado', notify:'Aviso', monitor:'En observación', known:'Conocido' };
const DISMISS = [['expected','Es esperado'],['false_positive','Falso positivo'],['business_data','Dato de negocio'],['external_system','Sistema externo']];
const RESP = [['fix_required','Requiere fix'],['expected_behavior','Comportamiento esperado'],['data_issue','Problema de datos'],['external_system','Sistema externo'],['false_positive','Falso positivo / ajustar regla'],['recheck','Volver a controlar'],['escalate_dev','Derivar a desarrollo']];
const HIST = { incident_resolved:'Resuelto', fix_required:'Requiere fix', expected_behavior:'Comportamiento esperado', data_issue:'Problema de datos', external_system:'Sistema externo', false_positive:'Falso positivo', recheck_scheduled:'Re-control agendado', recheck_done:'Re-control OK', deploy_detected:'Deploy', rule_added:'Regla nueva', onboarding:'Alta', note:'Nota' };
const PSTATUS = { pending_analysis:'Esperando análisis', analyzing:'Analizando', review:'En revisión', active:'Activo', paused:'Pausado', error:'Con error' };
const RSTATUS = { pending_compile:'Por compilar', proposed:'Propuesta', active:'Activa', disabled:'Desactivada', rejected:'Rechazada' };
const SEV_ORD = { P1:1, P2:2, P3:3, P4:4 };

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nowIso = () => new Date().toISOString();
function rel(iso) {
  if (!iso) return '—';
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'recién';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 36) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}
const fecha = (iso) => iso ? new Date(iso).toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
const addDays = (d) => new Date(Date.now() + d * 86400000).toISOString();
const slug = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2600); }
function md(src) {
  // Markdown mínimo y seguro: el texto se escapa primero.
  const lines = esc(src || '').split('\n'); let out = ''; let inList = false; let inTable = false;
  const inline = (s) => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\|.*\|$/.test(l.trim())) {
      if (/^\|[\s:-]+\|/.test(l.trim()) && l.replace(/[|\s:-]/g, '') === '') continue;
      if (!inTable) { out += '<div class="tblw"><table>'; inTable = true; }
      out += '<tr>' + l.trim().slice(1, -1).split('|').map((c) => `<td>${inline(c.trim())}</td>`).join('') + '</tr>'; continue;
    } else if (inTable) { out += '</table></div>'; inTable = false; }
    if (/^\s*[-*] /.test(l)) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    const h = l.match(/^(#{1,3}) (.*)/);
    if (h) out += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  if (inList) out += '</ul>'; if (inTable) out += '</table></div>';
  return out;
}

// ---------- modelo de proyecto: uno o más procesos, cada uno con su repo ----------
const ROLES = [['dispatcher', 'Dispatcher'], ['performer', 'Performer'], ['reporter', 'Reporter'], ['other', 'Otro']];
const rolDe = (t) => /dispatch/i.test(t) ? 'dispatcher' : /perform/i.test(t) ? 'performer' : /report/i.test(t) ? 'reporter' : 'other';
function procesosDe(p) {
  if (Array.isArray(p.processes) && p.processes.length) return p.processes;
  if (p.repo && p.repo.slug) return [{ id: slug(p.repo.slug), label: p.repo.slug, role: rolDe(p.repo.slug), repo: p.repo, docs: p.docs || { paths: [] } }]; // formato anterior
  return [];
}
const repoTxt = (r) => (r && r.workspace && r.slug ? `${r.workspace}/${r.slug}` : '');
function parseRepo(txt) {
  const x = String(txt || '').trim().replace(/^https?:\/\/(www\.)?bitbucket\.org\//i, '').replace(/\.git$/i, '').split('/').filter(Boolean);
  return x.length >= 2 ? { workspace: x[0], slug: x[1] } : null;
}
const listaDocs = (t) => String(t || '').split(',').map((x) => x.trim()).filter(Boolean);
// Formulario editable de un proyecto (alta o configuración): S.forms[clave].
function formDesde(p) {
  return {
    nombre: p ? p.name || '' : '', carpeta: p ? (p.orchestrator || {}).folderPath || '' : '', crit: p ? p.triageCriteria || '' : '',
    docs: p ? ((p.docs || {}).paths || []).join(', ') : '',
    procesos: p && procesosDe(p).length ? procesosDe(p).map((x) => ({ id: x.id, label: x.label || '', op: x.orchestratorProcess || '', role: x.role || rolDe(x.label || ''),
      repo: repoTxt(x.repo), rama: (x.repo || {}).branch || 'main', docs: ((x.docs || {}).paths || []).join(', '), carpeta: x.folderPath || '' }))
      : [{ id: '', label: 'Dispatcher', op: '', role: 'dispatcher', repo: '', rama: 'main', docs: '', carpeta: '' }, { id: '', label: 'Performer', op: '', role: 'performer', repo: '', rama: 'main', docs: '', carpeta: '' }],
  };
}
// Convierte el formulario en el documento del proyecto. Devuelve { error } o { data }.
function proyectoDesdeForm(f) {
  if (!f.nombre.trim()) return { error: 'Falta el nombre del proyecto' };
  if (!f.carpeta.trim()) return { error: 'Falta la carpeta de Orchestrator' };
  const procs = f.procesos.filter((x) => x.label.trim() || x.repo.trim() || x.op.trim());
  if (!procs.length) return { error: 'Agregá al menos un proceso' };
  const usados = new Set(); const processes = [];
  for (const [i, x] of procs.entries()) {
    // El repo es opcional: un proceso sin repo (p. ej. sin versionar en Bitbucket) se controla igual,
    // pero el análisis previo no puede mirar su código.
    const repo = x.repo.trim() ? parseRepo(x.repo) : null;
    if (x.repo.trim() && !repo) return { error: `Proceso ${i + 1}: el repositorio tiene que ser la URL de Bitbucket o workspace/repo` };
    if (!repo && !x.label.trim() && !x.op.trim()) return { error: `Proceso ${i + 1}: falta el nombre` };
    let id = x.id || slug(x.label || x.op || (repo && repo.slug)) || `proceso-${i + 1}`;
    while (usados.has(id)) id = `${id}-${i + 1}`;
    usados.add(id);
    processes.push({ id, label: x.label.trim() || x.op.trim() || repo.slug, orchestratorProcess: x.op.trim() || null, role: x.role || 'other',
      folderPath: x.carpeta.trim() && x.carpeta.trim() !== f.carpeta.trim() ? x.carpeta.trim() : null,
      repo: repo ? { ...repo, branch: x.rama.trim() || 'main' } : null, docs: { paths: listaDocs(x.docs) } });
  }
  return { data: { name: f.nombre.trim(), orchestrator: { folderPath: f.carpeta.trim() }, processes, docs: { paths: listaDocs(f.docs) }, triageCriteria: f.crit } };
}
function formProyectoHtml(clave, f, { boton, botonExtra } = {}) {
  const fid = (k, i) => `f-${clave}-${i ?? 'p'}-${k}`;
  const inp = (k, i, v, ph = '') => `<input type="text" id="${fid(k, i)}" data-form="${esc(clave)}" data-k="${k}" ${i !== undefined ? `data-i="${i}"` : ''} value="${esc(v)}" placeholder="${esc(ph)}">`;
  return `<div class="form">
    <div class="grid2"><label>Nombre del proyecto${inp('nombre', undefined, f.nombre, 'Validación de derechos')}</label>
    <label>Carpeta de Orchestrator (producción)${inp('carpeta', undefined, f.carpeta, 'Produccion/Finanzas')}</label></div>
    <div class="sec-h" style="margin:6px 0 0"><h2>Procesos</h2><span class="cnt">${f.procesos.length}</span></div>
    <div class="procs">${f.procesos.map((x, i) => `<div class="proc">
      <div class="proc-h"><b>Proceso ${i + 1}</b>
        <select id="${fid('role', i)}" data-form="${esc(clave)}" data-k="role" data-i="${i}" aria-label="Rol" style="width:auto">${ROLES.map(([k, l]) => `<option value="${k}" ${x.role === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${f.procesos.length > 1 ? `<button class="btn link" data-act="quitar-proceso" data-form="${esc(clave)}" data-i="${i}">Quitar</button>` : ''}</div>
      <div class="grid2"><label>Nombre${inp('label', i, x.label, 'Performer')}</label>
      <label>Nombre en Orchestrator (opcional: el alta lo detecta)${inp('op', i, x.op, 'p. ej. VD_Performer')}</label></div>
      <label>Repositorio de Bitbucket (URL o workspace/repo; vacío si no está versionado)${inp('repo', i, x.repo, 'https://bitbucket.org/workspace/repo')}</label>
      <div class="grid2"><label>Rama${inp('rama', i, x.rama, 'main')}</label>
      <label>Documentación en el repo (opcional, separada por coma)${inp('docs', i, x.docs, 'docs/SDD.md')}</label></div>
      <label>Carpeta propia (solo si no usa la del proyecto)${inp('carpeta', i, x.carpeta, '')}</label>
    </div>`).join('')}</div>
    <div><button class="btn" data-act="agregar-proceso" data-form="${esc(clave)}">+ Agregar proceso</button></div>
    <label>Documentación común del proyecto (opcional; rutas dentro de cualquiera de los repos)${inp('docs', undefined, f.docs, 'docs/PDD.md')}</label>
    <label>Criterios de triage del proyecto (opcional)<textarea id="${fid('crit')}" data-form="${esc(clave)}" data-k="crit">${esc(f.crit)}</textarea></label>
    <div class="actions">${boton}${botonExtra || ''}</div></div>`;
}

// ---------- estado ----------
const S = {
  db: null, user: null, me: null, role: 'lector', canWrite: false, isAdmin: false,
  projects: {}, incidents: {}, work: {}, rules: {}, runs: [], settings: null, health: null,
  loaded: { projects:false, incidents:false, work:false, runs:false },
  filter: null, open: {}, panel: {}, drafts: {}, names: {}, sel: {}, activity: {}, history: {}, memory: {},
  projTab: 'memoria', peopleHits: {}, error: null, stale: false, forms: {},
};
try { S.filter = localStorage.getItem('torre.filtro') || null; } catch {}

const visibleByWork = (inc) => {
  const w = S.work[inc.id];
  if (!w) return true;
  if (w.state === 'dismissed' || w.state === 'responded') return false;
  if (w.state === 'snoozed' && w.snoozeUntil && w.snoozeUntil > nowIso()) {
    return Boolean(inc.severityRaisedAt && w.updatedAt && inc.severityRaisedAt > w.updatedAt); // vuelve si empeoró
  }
  return true;
};
const reportable = (i) => i.status === 'open' && (i.decision === 'escalate' || i.decision === 'notify');
const inFilter = (i) => !S.filter || i.projectId === S.filter;
const orden = (a, b) => (SEV_ORD[a.severity] - SEV_ORD[b.severity]) || ((a.decision === 'escalate' ? 0 : 1) - (b.decision === 'escalate' ? 0 : 1)) || String(b.lastSeenAt).localeCompare(String(a.lastSeenAt));
const projName = (id) => (S.projects[id] && S.projects[id].name) || id;
function procLabel(i) {
  const p = S.projects[i.projectId]; if (!p) return '';
  const ps = procesosDe(p); if (ps.length < 2) return '';
  const x = ps.find((y) => y.id === i.processId) || ps.find((y) => y.orchestratorProcess && y.orchestratorProcess === i.process);
  return x ? x.label : '';
}

// ---------- personas (solo ids guardados; nombres resueltos al mostrar) ----------
async function resolveNames(ids) {
  if (!S.user) return;
  const faltan = [...new Set(ids.filter((x) => x && x.startsWith('u_') && !S.names[x]))];
  if (!faltan.length) return;
  const ps = await S.user.profiles(faltan);
  let cambio = false;
  for (const id of faltan) if (ps[id]) { S.names[id] = ps[id]; cambio = true; }
  if (cambio) schedule();
}
function who(id) {
  if (!id) return '';
  if (id === 'rutina') return '<span class="who">Rutina</span>';
  const p = S.names[id];
  if (!p) { resolveNames([id]); return '<span class="who">…</span>'; }
  const nombre = id === S.me ? 'Vos' : (p.name || 'Alguien');
  return `<span class="who"><img class="av" alt="" src="${esc(p.avatarUrl)}">${esc(nombre)}</span>`;
}

// ---------- escritura ----------
async function writeWork(inc, patch, activity) {
  if (!S.canWrite) return toast('Tu acceso es de solo lectura');
  const ref = S.db.doc(`incidentWork/${inc.id}`);
  const data = { ...(S.work[inc.id] || {}), ...patch, updatedAt: nowIso(), updatedBy: S.me || null };
  delete data.id;
  try {
    await ref.set(data);
    if (activity) await S.db.collection('activity').add({ incidentId: inc.id, projectId: inc.projectId, at: nowIso(), by: S.me || null, ...activity });
    return true;
  } catch (e) { toast(e && e.code === 'invalid_argument' ? 'No tenés permiso para esta acción' : 'No se pudo guardar. Probá de nuevo.'); return false; }
}

// ---------- render ----------
let pending = false;
function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }

function render() {
  // Conservar foco y borradores entre renders.
  const act = document.activeElement; const actId = act && act.id; const selStart = act && act.selectionStart;
  renderTop();
  const h = (location.hash || '#inicio').slice(1);
  const v = $('#view');
  if (h === 'inicio' || h === '') v.innerHTML = viewInicio();
  else if (h === 'corridas') v.innerHTML = viewCorridas();
  else if (h.startsWith('corrida-')) v.innerHTML = viewCorrida(h.slice(8));
  else if (h === 'no-reportados') v.innerHTML = viewNoReportados();
  else if (h === 'proyectos') v.innerHTML = viewProyectos();
  else if (h.startsWith('proyecto-')) v.innerHTML = viewProyecto(h.slice(9));
  else if (h === 'reglas') v.innerHTML = viewReglas();
  else if (h === 'ajustes') v.innerHTML = viewAjustes();
  else if (h === 'registrar') v.innerHTML = viewRegistrar();
  else if (h.startsWith('incidente-')) v.innerHTML = viewIncidente(h.slice(10));
  else v.innerHTML = viewInicio();
  if (actId) { const el = document.getElementById(actId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} } }
}

function renderTop() {
  $('#role').textContent = { admin:'Admin', operador:'Operador', lector:'Lector' }[S.role];
  // Pulso de la rutina: último run y alarma si está detenida.
  const ult = S.runs[0];
  const intervalo = (S.settings && S.settings.intervalMinutes) || 60;
  let cls = 'unknown', txt = 'Sin corridas todavía';
  if (ult) {
    const min = (Date.now() - Date.parse(ult.finishedAt || ult.startedAt)) / 60000;
    const detenida = min > intervalo * 2.2;
    cls = detenida ? 'critical' : ult.status === 'ok' ? 'ok' : 'warn';
    txt = detenida ? `Rutina detenida · último control ${rel(ult.finishedAt || ult.startedAt)}` : `Último control ${rel(ult.finishedAt || ult.startedAt)}`;
  } else if (S.error) { cls = 'critical'; txt = S.error; }
  $('#pulse').innerHTML = `<span class="dot ${cls}"></span><span class="txt">${esc(txt)}</span>`;
  // Chips por proyecto con salud.
  const ps = Object.values(S.projects).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const abiertos = (pid) => Object.values(S.incidents).filter((i) => i.projectId === pid && reportable(i) && visibleByWork(i)).length;
  const chip = (id, label, dot, n) => `<button class="chip" data-filter="${esc(id)}" aria-pressed="${(S.filter || '') === id}">${dot}${esc(label)}${n ? ` <span class="n">${n}</span>` : ''}</button>`;
  const total = Object.values(S.incidents).filter((i) => reportable(i) && visibleByWork(i)).length;
  $('#chips').innerHTML = chip('', 'Todos', '', total) + ps.map((p) => {
    const lvl = p.status !== 'active' ? 'off' : ((p.health && p.health.level) || 'unknown');
    return chip(p.id, p.name || p.id, `<span class="dot ${lvl}" title="${esc(p.status !== 'active' ? PSTATUS[p.status] || p.status : lvl)}"></span>`, abiertos(p.id));
  }).join('');
}

function cardHtml(i, compacta = false) {
  const w = S.work[i.id] || {};
  const rec = i.recurrences || [];
  const open = S.open[i.id];
  const panel = S.panel[i.id];
  const d = (k) => esc(S.drafts[`${i.id}-${k}`] || '');
  const sel = S.sel[i.id] || {};
  const can = S.canWrite;
  let html = `<article class="card ${esc(i.severity)}${compacta ? ' compact' : ''}" data-inc="${esc(i.id)}">
    <div class="c-head">
      <div class="ico" title="${esc(CAT[i.category] || i.category)}">${ico(i.category)}</div>
      <div class="c-main">
        <div class="c-title">${esc(i.title)}</div>
        <div class="c-meta">
          <span class="pill ${esc(i.severity)}">${esc(i.severity)}</span>
          <span>${esc(CAT[i.category] || i.category)}</span>
          ${S.filter ? '' : `<span class="tag">${esc(projName(i.projectId))}</span>`}
          ${procLabel(i) ? `<span class="tag">${esc(procLabel(i))}</span>` : ''}
          ${rec.length > 1 || i.occurrences > 1 ? `<span class="tag rec" title="Ocurrencias acumuladas en esta tarjeta">×${esc(i.occurrences)} · última ${esc(rel(i.lastSeenAt))}</span>` : `<span>${esc(rel(i.lastSeenAt))}</span>`}
          ${i.reopenCount ? '<span class="tag reo">Reapareció</span>' : ''}
          ${i.decision === 'notify' ? '<span class="tag">Aviso</span>' : ''}
          ${w.state === 'delegated' && w.assignee ? `<span>→ ${who(w.assignee)}</span>` : ''}
        </div>
      </div>
    </div>
    ${compacta && !open && !panel ? '' : `<div class="why">${esc(i.triage && i.triage.rationale)}</div>`}`;
  const bt = (p, icono, txt) => `<button class="btn ${panel === p ? 'on' : ''}" data-act="panel" data-p="${p}">${ico(icono)}${txt}</button>`;
  html += `<div class="actions">
    ${can && !compacta ? bt('delegar', 'user', 'Delegar') + bt('posponer', 'clock', 'Posponer') + bt('descartar', 'x', 'Descartar') + bt('responder', 'reply', 'Responder') + bt('comentar', 'send', 'Comentar') : ''}
    ${can && compacta ? bt('descartar', 'x', 'Descartar') + bt('posponer', 'clock', 'Posponer') + bt('responder', 'reply', 'Responder') : ''}
    <span class="sp"></span><button class="btn link" data-act="detalle" aria-expanded="${Boolean(open)}">${open ? 'Ocultar detalle' : 'Ver detalle'}</button>
  </div>`;
  if (panel === 'comentar') {
    html += `<div class="panel"><textarea id="${esc(i.id)}-coment" placeholder="Comentario para el equipo">${d('coment')}</textarea><div><button class="btn primary" data-act="comentar">Agregar comentario</button></div></div>`;
  } else if (panel === 'delegar') {
    const hits = S.peopleHits[i.id] || [];
    html += `<div class="panel"><input type="text" id="${esc(i.id)}-buscar" placeholder="Buscar persona por nombre…" value="${d('buscar')}" data-act="buscar" autocomplete="off">
      <div class="people">${hits.map((p) => `<button class="person" data-act="asignar" data-uid="${esc(p.id)}"><img class="av" alt="" src="${esc(p.avatarUrl)}"><span>${esc(p.name)}</span></button>`).join('') || '<span class="muted">Escribí para buscar en tu organización.</span>'}</div></div>`;
  } else if (panel === 'posponer') {
    html += `<div class="panel"><div class="opts">
      <button class="opt" data-act="posponer" data-d="1">1 día</button><button class="opt" data-act="posponer" data-d="3">3 días</button><button class="opt" data-act="posponer" data-d="7">1 semana</button>
      <input type="date" id="${esc(i.id)}-fecha" value="${d('fecha')}" style="width:auto" aria-label="Hasta"><button class="btn" data-act="posponer-fecha">Hasta esa fecha</button></div>
      <span class="muted">La tarjeta se oculta hasta esa fecha. Vuelve antes si el problema empeora, y la rutina la vuelve a controlar al vencer.</span></div>`;
  } else if (panel === 'descartar') {
    html += `<div class="panel"><div class="opts">${DISMISS.map(([k, l]) => `<button class="opt" data-act="sel" data-k="motivo" data-v="${k}" aria-pressed="${sel.motivo === k}">${l}</button>`).join('')}</div>
      <input type="text" id="${esc(i.id)}-nota" placeholder="Nota opcional (por qué)" value="${d('nota')}">
      <div><button class="btn primary" data-act="descartar" ${sel.motivo ? '' : 'disabled'}>Descartar</button></div>
      <span class="muted">Con lo que indiques, la rutina actualiza la memoria del proyecto y puede proponer una regla.</span></div>`;
  } else if (panel === 'responder') {
    html += `<div class="panel"><div class="opts">${RESP.map(([k, l]) => `<button class="opt" data-act="sel" data-k="decision" data-v="${k}" aria-pressed="${sel.decision === k}">${l}</button>`).join('')}</div>
      <textarea id="${esc(i.id)}-notas" placeholder="Qué se encontró, qué se hizo o qué hay que hacer">${d('notas')}</textarea>
      ${sel.decision === 'fix_required' ? `<input type="text" id="${esc(i.id)}-ticket" placeholder="Ticket o referencia del fix (opcional)" value="${d('ticket')}">` : ''}
      ${sel.decision === 'recheck' ? `<label class="muted">Volver a controlar el <input type="date" id="${esc(i.id)}-recheck" value="${d('recheck')}" style="width:auto"></label>` : ''}
      <div><button class="btn primary" data-act="responder" ${sel.decision ? '' : 'disabled'}>Enviar respuesta</button></div></div>`;
  }
  if (open) html += detailHtml(i);
  return html + '</article>';
}

function detailHtml(i) {
  const ev = i.evidence || {}; const u = ev.ultima || ev.primera || {};
  const a = i.analysis || {}; const t = i.triage || {};
  const lines = [];
  for (const l of (u.logs || []).slice(-6)) lines.push(`<div class="l">${esc(fecha(l.fecha))} · ${esc(l.nivel)} · ${esc(l.mensaje)}</div>`);
  for (const q of (u.queueItems || []).slice(0, 6)) lines.push(`<div class="l">Item ${esc(q.referenciaHash || q.id)} · ${esc(q.estado)} ${esc(q.tipoExcepcion || '')} · ${esc(q.motivo || '')}</div>`);
  for (const j of (u.jobs || []).slice(0, 6)) lines.push(`<div class="l">Job ${esc(String(j.key).slice(0, 8))} · ${esc(j.estado || '')} · ${esc(fecha(j.fin || j.creado))}${j.maquina ? ' · ' + esc(j.maquina) : ''}</div>`);
  if (u.regla) lines.push(`<div class="l">Regla: ${esc(u.regla.texto)} · observado ${esc(u.regla.observado)} (umbral ${esc(u.regla.umbral)})</div>`);
  if (u.errores) for (const e of u.errores.slice(0, 5)) lines.push(`<div class="l">${esc(e)}</div>`);
  const acts = (S.activity[i.id] || []);
  if (!S.activity[i.id]) loadActivity(i.id);
  return `<div class="detail">
    <section><h4>Triage</h4><dl class="kv">
      <dt>Decisión</dt><dd>${esc(DEC[i.decision] || i.decision)} · confianza ${esc(t.confidence || '—')}</dd>
      <dt>Por qué</dt><dd>${esc(t.rationale)}</dd>
      ${(t.matchedRules || []).length ? `<dt>Reglas</dt><dd class="mono">${(t.matchedRules).map(esc).join(', ')}</dd>` : ''}
      ${(t.memoryRefs || []).length ? `<dt>Memoria</dt><dd class="mono">${(t.memoryRefs).map(esc).join(', ')}</dd>` : ''}
      <dt>Visto</dt><dd>desde ${esc(fecha(i.firstSeenAt))} · ${esc(i.occurrences)} ocurrencia(s) en ${esc((i.recurrences || []).length)} corrida(s)</dd>
      ${i.process ? `<dt>Proceso</dt><dd class="mono">${esc(i.process)}</dd>` : ''}${i.queue ? `<dt>Cola</dt><dd class="mono">${esc(i.queue)}</dd>` : ''}
    </dl></section>
    ${a.status === 'done' ? `<section><h4>Análisis previo</h4>
      <p style="margin:0 0 8px">${esc(a.summary)}</p>
      ${(a.hypotheses || []).length ? `<ul class="hyp">${a.hypotheses.map((h) => `<li class="${esc(h.likelihood)}"><b>${esc(h.text)}</b><span class="muted">Probabilidad ${esc(h.likelihood)} · ${esc(h.evidence)}</span></li>`).join('')}</ul>` : ''}
      ${(a.suggestedActions || []).length ? `<h4 style="margin-top:10px">Acciones sugeridas</h4><ul style="margin:0;padding-left:18px">${a.suggestedActions.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      ${(a.codeRefs || []).length ? `<h4 style="margin-top:10px">Código</h4>${a.codeRefs.map((c) => `<div class="mono">${esc(c.file)}${c.line ? ':' + esc(c.line) : ''} <span class="muted">@${esc(String(c.sha || '').slice(0, 7))}</span> — ${esc(c.note)}</div>`).join('')}` : ''}
      ${(a.docRefs || []).length ? `<h4 style="margin-top:10px">Documentación</h4>${a.docRefs.map((c) => `<div><span class="mono">${esc(c.file)}</span> · ${esc(c.section)} — ${esc(c.note)}</div>`).join('')}` : ''}
      ${a.repo && !a.repo.matchesDeployedVersion ? '<p class="muted">El código analizado es de la rama configurada, no del tag de la versión desplegada.</p>' : ''}
    </section>` : a.status === 'pending' ? '<section><h4>Análisis previo</h4><p class="muted" style="margin:0">Pendiente: lo completa la próxima corrida.</p></section>' : ''}
    ${lines.length ? `<section><h4>Evidencia (redactada)</h4><div class="ev">${lines.join('')}</div></section>` : ''}
    <section><h4>Actividad</h4>${acts.length ? `<ul class="tl">${acts.map((x) => `<li><time>${esc(fecha(x.at))}</time><span>${who(x.by)} ${esc(x.text || '')}</span></li>`).join('')}</ul>` : '<span class="muted">Sin actividad todavía.</span>'}</section>
  </div>`;
}

const subs = {};
function loadActivity(id) {
  if (subs['act-' + id] || !S.db) return;
  S.activity[id] = [];
  subs['act-' + id] = S.db.collection('activity').where('incidentId', '==', id).onSnapshot((s) => {
    S.activity[id] = s.docs.map((d) => d.data()).sort((a, b) => String(a.at).localeCompare(String(b.at)));
    resolveNames(S.activity[id].map((x) => x.by)); schedule();
  }, () => {});
}

function viewInicio() {
  if (!S.db) return `<div class="banner info">${esc(S.error || 'Conectando con el tablero…')}</div>`;
  if (!S.loaded.incidents || !S.loaded.projects) return `<div class="banner info">${S.stale ? 'Los datos tardan en llegar. Puede que estés sin conexión.' : 'Cargando…'}</div>`;
  const todos = Object.values(S.incidents).filter((i) => reportable(i) && visibleByWork(i) && inFilter(i)).sort(orden);
  const mios = todos.filter((i) => { const w = S.work[i.id]; return w && w.state === 'delegated' && w.assignee && w.assignee === S.me; });
  const accion = todos.filter((i) => !mios.includes(i) && i.decision === 'escalate');
  const avisos = todos.filter((i) => !mios.includes(i) && i.decision !== 'escalate');
  let html = '';
  const ult = S.runs[0];
  if (ult && ult.status !== 'ok') html += `<div class="banner bad">${ico('alert', 'ico-s')} La última corrida terminó con errores de colecta. <a href="#corrida-${esc(ult.id)}">Ver detalle</a></div>`;
  if (S.isAdmin) {
    const prop = Object.values(S.rules).filter((r) => r.status === 'proposed' && (!S.filter || r.projectId === S.filter)).length;
    const rev = Object.values(S.projects).filter((p) => p.status === 'review' && (!S.filter || p.id === S.filter));
    const err = Object.values(S.projects).filter((p) => p.status === 'error' && (!S.filter || p.id === S.filter));
    const items = [];
    if (prop) items.push(`<a href="#reglas"><b class="n">${prop}</b> regla(s) propuesta(s) para aprobar</a>`);
    for (const p of rev) items.push(`<a href="#proyecto-${esc(p.id)}">Revisar alta de <b>${esc(p.name)}</b></a>`);
    for (const p of err) items.push(`<a href="#proyecto-${esc(p.id)}">${ico('alert', 'ico-s al-ico')} <b>${esc(p.name)}</b>: ${esc(PSTATUS.error)}</a>`);
    if (items.length) html += `<section><div class="sec-h"><h2>Para revisar</h2></div><div class="mini">${items.join('')}</div></section>`;
  }
  if (mios.length) html += `<section><div class="sec-h"><h2>Para vos</h2><span class="cnt">${mios.length}</span></div><div class="list">${mios.map((i) => cardHtml(i)).join('')}</div></section>`;
  if (accion.length) html += `<section><div class="sec-h"><h2>Requiere acción</h2><span class="cnt">${accion.length}</span></div><div class="list">${accion.map((i) => cardHtml(i)).join('')}</div></section>`;
  if (avisos.length) html += `<section><div class="sec-h"><h2>Avisos</h2><span class="cnt">${avisos.length}</span></div><div class="list">${avisos.map((i) => cardHtml(i, true)).join('')}</div></section>`;
  if (!todos.length) {
    const p = S.filter && S.projects[S.filter];
    html += `<div class="empty">${ico('check')}<b>Todo en orden</b><span class="muted">${p ? `Nada pendiente en ${esc(p.name)}.` : 'No hay incidentes que requieran acción.'}${ult ? ` Último control ${esc(rel(ult.finishedAt || ult.startedAt))}.` : ''}</span>
      ${!Object.keys(S.projects).length ? `<span class="muted">Todavía no hay proyectos. ${S.isAdmin ? '<a href="#registrar">Registrá el primero</a>.' : 'Un Admin tiene que registrarlos.'}</span>` : ''}</div>`;
  }
  return html + navMore('inicio');
}

function navMore(cur) {
  const l = [['inicio', 'Bandeja'], ['corridas', 'Corridas'], ['no-reportados', 'No reportados'], ['proyectos', 'Proyectos'], ['reglas', 'Reglas']];
  if (S.isAdmin) l.push(['registrar', 'Registrar proyecto'], ['ajustes', 'Ajustes']);
  return `<nav class="more" aria-label="Ver más">${l.map(([h, t]) => `<a href="#${h}" ${cur === h ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</nav>`;
}
const head = (title, sub, back = '#inicio') => `<div class="view-h"><a class="back" href="${back}">← Volver</a><h1>${esc(title)}</h1>${sub ? `<span class="muted">${sub}</span>` : ''}</div>`;

function viewCorridas() {
  const runs = S.runs.filter((r) => !S.filter || (r.projects || []).some((p) => p.projectId === S.filter));
  const rows = runs.map((r) => {
    const ps = (r.projects || []).filter((p) => !S.filter || p.projectId === S.filter);
    const nuevos = ps.reduce((a, p) => a + (p.incidentsNew || []).length, 0);
    const rec = ps.reduce((a, p) => a + (p.incidentsUpdated || []).length, 0);
    const esc_ = ps.reduce((a, p) => a + (p.findings || []).filter((f) => f.decision === 'escalate').length, 0);
    return `<a class="rowi" href="#corrida-${esc(r.id)}"><span class="dot ${r.status === 'ok' ? 'ok' : r.status === 'partial' ? 'warn' : 'critical'}"></span>
      <span class="t">${esc(fecha(r.startedAt))} <span class="muted">· ${ps.length} proyecto(s)${r.trigger !== 'scheduled' ? ' · ' + esc(r.trigger) : ''}</span></span>
      <span class="nums">${nuevos} nuevos · ${rec} recurrentes · ${esc_} escalados</span></a>`;
  }).join('');
  return head('Corridas', 'Cada ejecución de la rutina, con lo que revisó y encontró.') + `<div class="box"><div class="rows">${rows || '<span class="muted">Todavía no hay corridas.</span>'}</div></div>` + navMore('corridas');
}

function viewCorrida(id) {
  const r = S.runs.find((x) => x.id === id);
  if (!r) return head('Corrida', 'No está entre las últimas 50 corridas.', '#corridas');
  const ps = (r.projects || []).filter((p) => !S.filter || p.projectId === S.filter);
  const icoRes = (res) => res === 'alerta' ? ico('alert', 'ico-s al-ico') : res === 'ok' ? ico('check', 'ico-s ok-ico') : ico('minus', 'ico-s om-ico');
  return head(`Corrida del ${fecha(r.startedAt)}`, `${esc(r.status === 'ok' ? 'Completa' : r.status === 'partial' ? 'Parcial' : 'Con errores')} · duró ${r.finishedAt ? Math.max(1, Math.round((Date.parse(r.finishedAt) - Date.parse(r.startedAt)) / 60000)) + ' min' : '—'}${r.sessionUrl ? ` · <a href="${esc(r.sessionUrl)}" target="_blank" rel="noopener">sesión</a>` : ''}`, '#corridas')
    + ps.map((p) => `<section class="box">
      <div class="sec-h" style="margin:0"><h2>${esc(projName(p.projectId))}</h2><span class="cnt">${esc(fecha(p.window && p.window.desde))} → ${esc(fecha(p.window && p.window.hasta))}</span></div>
      ${p.signals ? `<div class="nums">${esc(p.signals.jobs)} jobs · ${esc(p.signals.logsErrorFatal)} logs error/fatal · ${esc(p.signals.queueItemsFallidos)} items fallidos · ${esc(p.signals.queueItemsAbandonados)} abandonados</div>` : ''}
      <div class="tblw"><table><thead><tr><th></th><th>Punto de control</th><th>Observado</th></tr></thead><tbody>
      ${(p.checks || []).map((c) => `<tr><td>${icoRes(c.resultado)}</td><td>${esc(c.nombre)}</td><td class="mono">${esc(c.observado ?? '—')}</td></tr>`).join('')}</tbody></table></div>
      ${(p.findings || []).length ? `<h4 class="muted" style="margin:4px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.07em">Hallazgos y triage</h4>
        <div class="rows">${p.findings.map((f) => `<a class="rowi" href="#incidente-${esc(f.incidentId)}"><span class="pill ${esc(f.severity)}">${esc(f.severity)}</span>
          <span class="t">${esc(f.title)}<br><span class="muted">${esc(DEC[f.decision])}${f.recurrence ? ' · recurrencia' : ' · nuevo'}${f.reopened ? ' · reabierto' : ''} — ${esc(f.rationale)}</span></span>${ico('chev', 'ico-s om-ico')}</a>`).join('')}</div>` : '<span class="muted">Sin hallazgos.</span>'}
      ${(p.errors || []).length ? `<div class="ev">${p.errors.map((e) => `<div class="l">${esc(e)}</div>`).join('')}</div>` : ''}
    </section>`).join('') + navMore('');
}

function viewIncidente(id) {
  const i = S.incidents[id];
  if (!i) return head('Incidente', 'Este incidente ya no está abierto o se depuró por retención.', '#corridas');
  S.open[id] = true;
  return head(i.title, `${esc(projName(i.projectId))} · ${esc(DEC[i.decision])}`, '#inicio') + `<div class="list">${cardHtml(i)}</div>` + navMore('');
}

function viewNoReportados() {
  const xs = Object.values(S.incidents).filter((i) => inFilter(i) && i.status === 'open' && (!reportable(i) || !visibleByWork(i))).sort(orden);
  const motivo = (i) => {
    const w = S.work[i.id];
    if (w && w.state === 'snoozed') return `Pospuesto hasta ${fecha(w.snoozeUntil)}`;
    if (w && w.state === 'dismissed') return `Descartado: ${(DISMISS.find((d) => d[0] === w.dismissReason) || [0, ''])[1]}`;
    if (w && w.state === 'responded') return `Respondido: ${(RESP.find((d) => d[0] === (w.response || {}).decision) || [0, ''])[1]}`;
    return DEC[i.decision];
  };
  return head('No reportados', 'Lo que el triage decidió no mostrar en la bandeja, y lo que el equipo ya respondió, pospuso o descartó.')
    + `<div class="box"><div class="rows">${xs.map((i) => `<a class="rowi" href="#incidente-${esc(i.id)}"><span class="ico" style="width:24px;height:24px">${ico(i.category)}</span>
      <span class="t">${esc(i.title)}<br><span class="muted">${esc(motivo(i))} — ${esc(i.triage && i.triage.rationale)}</span></span><span class="nums">×${esc(i.occurrences)}</span></a>`).join('') || '<span class="muted">Nada por aquí.</span>'}</div></div>` + navMore('no-reportados');
}

function viewProyectos() {
  const ps = Object.values(S.projects).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  return head('Proyectos', 'Estado, memoria y reglas de cada proyecto controlado.') + `<div class="box"><div class="rows">${ps.map((p) => `<a class="rowi" href="#proyecto-${esc(p.id)}">
    <span class="dot ${p.status !== 'active' ? 'off' : (p.health && p.health.level) || 'unknown'}"></span><span class="t">${esc(p.name)}<br><span class="muted mono">${esc(p.orchestrator && p.orchestrator.folderPath)}</span></span>
    <span class="nums">${esc(PSTATUS[p.status] || p.status)}</span></a>`).join('') || '<span class="muted">Sin proyectos todavía.</span>'}</div></div>` + navMore('proyectos');
}

function subProject(id) {
  if (subs['proj-' + id] || !S.db) return;
  subs['proj-' + id] = true;
  S.db.doc(`memory/${id}`).onSnapshot((d) => { S.memory[id] = d.exists ? d.data() : null; schedule(); }, () => {});
  S.db.collection('history').where('projectId', '==', id).orderBy('at', 'desc').limit(100).onSnapshot((s) => {
    S.history[id] = s.docs.map((d) => ({ id: d.id, ...d.data() })); resolveNames(S.history[id].map((h) => h.by)); schedule();
  }, () => {});
}

function viewProyecto(id) {
  const p = S.projects[id];
  if (!p) return head('Proyecto', 'No se encontró el proyecto.', '#proyectos');
  subProject(id);
  const tab = S.projTab;
  const m = S.memory[id];
  const hist = S.history[id] || [];
  const reglas = Object.values(S.rules).filter((r) => r.projectId === id);
  const inv = p.inventory || {};
  let body = '';
  if (tab === 'memoria') body = m && m.process ? `<div class="md">${md(m.process)}</div>` : '<span class="muted">La memoria de proceso se genera en el alta automática.</span>';
  else if (tab === 'produccion') body = (m && m.productionSummary ? `<div class="md">${md(m.productionSummary)}</div>` : '')
    + `<ul class="tl">${hist.map((h) => `<li><time>${esc(fecha(h.at))}</time><span><b>${esc(HIST[h.type] || h.type)}</b> · ${esc(h.summary)}${h.ticket ? ` <span class="mono">[${esc(h.ticket)}]</span>` : ''} <span class="muted">${who(h.by)}</span></span></li>`).join('') || '<li><span></span><span class="muted">Sin historial todavía.</span></li>'}</ul>`;
  else if (tab === 'reglas') body = rulesTable(reglas, true);
  else if (tab === 'inventario') body = invTable('Procesos en Orchestrator', ['Nombre', 'Versión', 'Del proyecto'], (inv.processes || []).map((x) => [x.name, x.version, procesosDe(p).some((y) => y.orchestratorProcess === x.name) ? 'sí' : 'no']))
    + invTable('Colas', ['Nombre', 'Reintentos'], (inv.queues || []).map((x) => [x.name, x.maxRetries]))
    + invTable('Triggers', ['Nombre', 'Tipo', 'Habilitado', 'Proceso'], (inv.triggers || []).map((x) => [x.name, x.type, x.enabled ? 'sí' : 'no', x.process]))
    + invTable('Assets (solo nombres)', ['Nombre', 'Tipo'], (inv.assets || []).map((x) => [x.nombre || x.name, x.tipo || x.type]));
  else if (tab === 'config') body = configProyecto(p);
  const tabs = [['memoria', 'Memoria de proceso'], ['produccion', 'Memoria de producción'], ['reglas', `Reglas (${reglas.length})`], ['inventario', 'Inventario'], ['config', 'Configuración']];
  const procs = procesosDe(p);
  return head(p.name, `<span class="mono">${esc(p.orchestrator && p.orchestrator.folderPath)}</span> · ${procs.length} proceso(s) · ${esc(PSTATUS[p.status] || p.status)}`, '#proyectos')
    + `<div class="box plist">${procs.map((x) => `<div class="pitem"><span class="role-b">${esc((ROLES.find((r) => r[0] === x.role) || ROLES[3])[1])}</span>
      <span><b>${esc(x.label)}</b> <span class="muted">· Orchestrator: </span><span class="mono">${esc(x.orchestratorProcess || 'por detectar')}</span><span class="muted"> · repo: </span><span class="mono">${esc(repoTxt(x.repo) || 'sin repo (se controla, sin análisis de código)')}</span>${x.folderPath ? `<span class="muted"> · carpeta: </span><span class="mono">${esc(x.folderPath)}</span>` : ''}</span></div>`).join('') || '<span class="muted">Sin procesos configurados.</span>'}
      ${S.isAdmin ? `<div><button class="btn link" data-act="tab" data-t="config" style="padding-left:0">Editar configuración</button></div>` : ''}</div>`
    + (p.statusNote ? `<div class="banner info">${esc(p.statusNote)}</div>` : '')
    + (S.isAdmin && p.status === 'review' ? `<div><button class="btn primary" data-act="activar" data-pid="${esc(p.id)}">Activar el control de este proyecto</button></div>` : '')
    + (S.isAdmin && p.status === 'active' ? `<div class="actions"><button class="btn" data-act="pausar" data-pid="${esc(p.id)}">Pausar control</button><button class="btn" data-act="reanalizar" data-pid="${esc(p.id)}">Pedir re-análisis</button></div>` : '')
    + (S.isAdmin && p.status === 'paused' ? `<div><button class="btn" data-act="activar" data-pid="${esc(p.id)}">Reanudar control</button></div>` : '')
    + `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-act="tab" data-t="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div><div class="box">${body}</div>` + navMore('');
}
const invTable = (t, cols, rows) => `<h4 class="muted" style="margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.07em">${esc(t)}</h4><div class="tblw"><table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c ?? '—')}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="muted">—</td></tr>`}</tbody></table></div>`;

function configProyecto(p) {
  if (!S.isAdmin) return `<dl class="kv"><dt>Criterios de triage</dt><dd>${esc(p.triageCriteria || '—')}</dd><dt>Documentación común</dt><dd class="mono">${esc(((p.docs || {}).paths || []).join(', ') || '—')}</dd></dl>`;
  const clave = 'cfg-' + p.id;
  if (!S.forms[clave]) S.forms[clave] = formDesde(p);
  return formProyectoHtml(clave, S.forms[clave], {
    boton: `<button class="btn primary" data-act="guardar-proyecto" data-pid="${esc(p.id)}" data-reanalizar="1">Guardar y re-analizar</button>`,
    botonExtra: `<button class="btn" data-act="guardar-proyecto" data-pid="${esc(p.id)}">Solo guardar</button><button class="btn link" data-act="descartar-cambios" data-pid="${esc(p.id)}">Descartar cambios</button>
      <span class="muted">Si cambiaste repos o procesos, conviene re-analizar: la rutina regenera la memoria y el inventario.</span>`,
  });
}

function rulesTable(reglas, enProyecto) {
  const ord = { proposed: 0, pending_compile: 1, active: 2, disabled: 3, rejected: 4 };
  reglas = reglas.slice().sort((a, b) => ord[a.status] - ord[b.status]);
  return `<div class="rows">${reglas.map((r) => `<div class="rowi" style="grid-template-columns:1fr auto">
    <span class="t"><b>${esc(r.text)}</b><br><span class="muted">${esc(RSTATUS[r.status] || r.status)}${enProyecto ? '' : ' · ' + esc(r.projectId === '*' ? 'Todos los proyectos' : projName(r.projectId))}${r.origin === 'learned' ? ' · aprendida de un incidente' : r.origin === 'onboarding' ? ' · del alta' : ''}${r.compileNote ? ' — ' + esc(r.compileNote) : ''}</span></span>
    <span class="actions">${S.isAdmin && r.status === 'proposed' ? `<button class="btn primary" data-act="regla" data-rid="${esc(r.id)}" data-s="active">Aprobar</button><button class="btn" data-act="regla" data-rid="${esc(r.id)}" data-s="rejected">Rechazar</button>` : ''}
      ${S.isAdmin && r.status === 'active' ? `<button class="btn" data-act="regla" data-rid="${esc(r.id)}" data-s="disabled">Desactivar</button>` : ''}
      ${S.isAdmin && r.status === 'disabled' ? `<button class="btn" data-act="regla" data-rid="${esc(r.id)}" data-s="active">Activar</button>` : ''}</span></div>`).join('') || '<span class="muted">Sin reglas.</span>'}</div>`;
}

function viewReglas() {
  const reglas = Object.values(S.rules).filter((r) => !S.filter || r.projectId === S.filter || r.projectId === '*');
  const ps = Object.values(S.projects);
  const form = S.isAdmin ? `<div class="box form"><b>Nueva regla</b>
    <label>Proyecto<select id="nr-proj">${['*', ...ps.map((p) => p.id)].map((id) => `<option value="${esc(id)}" ${(S.drafts['nr-proj'] || S.filter || '*') === id ? 'selected' : ''}>${esc(id === '*' ? 'Todos los proyectos' : projName(id))}</option>`).join('')}</select></label>
    <label>Regla en lenguaje natural<input type="text" id="nr-text" placeholder="Ej.: si se ven más de 10 errores de login seguidos, escalar" value="${esc(S.drafts['nr-text'] || '')}"></label>
    <div><button class="btn primary" data-act="nueva-regla">Crear regla</button> <span class="muted">La rutina la traduce a un control en la próxima corrida y muestra cómo la entendió.</span></div></div>` : '';
  return head('Reglas de control', 'Puntos de control definidos en lenguaje natural. Las propuestas nacen de respuestas a incidentes y las aprueba un Admin.') + form + `<div class="box">${rulesTable(reglas, false)}</div>` + navMore('reglas');
}

function viewAjustes() {
  if (!S.isAdmin) return head('Ajustes', 'Solo los Admin pueden ver los ajustes.');
  const s = S.settings || {};
  const d = (k, v) => esc(S.drafts['aj-' + k] ?? v ?? '');
  return head('Ajustes', 'Criterios globales que usa el triage en todos los proyectos.') + `<div class="box form">
    <label>Criterios de triage globales<textarea id="aj-crit" style="min-height:160px">${d('crit', s.triageCriteria)}</textarea></label>
    <label>Matriz de severidad<textarea id="aj-sev">${d('sev', s.severityMatrix)}</textarea></label>
    <label>Minutos máximos en Pending<input type="number" id="aj-pend" value="${d('pend', s.pendingMaxMinutes)}"></label>
    <label>Retención de corridas (días)<input type="number" id="aj-runs" value="${d('runs', (s.retention || {}).runsDays)}"></label>
    <label>Retención de incidentes cerrados (días)<input type="number" id="aj-inc" value="${d('inc', (s.retention || {}).closedIncidentsDays)}"></label>
    <div><button class="btn primary" data-act="guardar-ajustes">Guardar ajustes</button></div>
    <p class="muted" style="margin:0">Roles: Lector = acceso de Viewer, Operador = Contributor, Admin = Editor. Se asignan desde el menú Compartir del tablero.</p></div>` + navMore('ajustes');
}

function viewRegistrar() {
  if (!S.isAdmin) return head('Registrar proyecto', 'Solo los Admin pueden registrar proyectos.');
  if (!S.forms.nuevo) S.forms.nuevo = formDesde(null);
  return head('Registrar proyecto', 'Un proyecto agrupa sus procesos (por ejemplo Dispatcher y Performer), cada uno con su repositorio. La rutina analiza Orchestrator, el código y la documentación y genera la memoria; después lo revisás y activás.')
    + `<div class="box">${formProyectoHtml('nuevo', S.forms.nuevo, { boton: '<button class="btn primary" data-act="registrar">Registrar y analizar</button>' })}</div>` + navMore('registrar');
}

// ---------- eventos ----------
document.addEventListener('input', (e) => {
  const t = e.target; if (!t.id) return;
  S.drafts[t.id] = t.value;
  if (t.dataset.form && S.forms[t.dataset.form]) {
    const f = S.forms[t.dataset.form];
    if (t.dataset.i !== undefined) {
      const x = f.procesos[Number(t.dataset.i)]; x[t.dataset.k] = t.value;
      // El rol se deduce del nombre mientras no se haya elegido uno.
      if (['label', 'op'].includes(t.dataset.k) && (x.role === 'other' || x.autoRole)) { const r = rolDe(`${x.label} ${x.op}`); if (r !== 'other' || x.autoRole) { x.role = r; x.autoRole = true; const sel = document.getElementById(`f-${t.dataset.form}-${t.dataset.i}-role`); if (sel) sel.value = r; } }
    } else f[t.dataset.k] = t.value;
  }
  if (t.dataset.act === 'buscar' && S.user) {
    const card = t.closest('[data-inc]'); const id = card && card.dataset.inc;
    S.user.search(t.value).then((hits) => { S.peopleHits[id] = hits; schedule(); });
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.form && S.forms[t.dataset.form]) { const x = S.forms[t.dataset.form].procesos[Number(t.dataset.i)]; x[t.dataset.k] = t.value; x.autoRole = false; }
});
document.addEventListener('focusin', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'buscar' && S.user && !t.value) { const id = t.closest('[data-inc]').dataset.inc; S.user.search('').then((h) => { S.peopleHits[id] = h; schedule(); }); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id && e.target.id.endsWith('-coment')) { e.preventDefault(); e.target.closest('.card').querySelector('[data-act="comentar"]').click(); }
});
document.addEventListener('click', async (e) => {
  const chip = e.target.closest('[data-filter]');
  if (chip) { S.filter = chip.dataset.filter || null; try { S.filter ? localStorage.setItem('torre.filtro', S.filter) : localStorage.removeItem('torre.filtro'); } catch {} schedule(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  const card = b.closest('[data-inc]'); const id = card && card.dataset.inc; const inc = id && S.incidents[id];
  const draft = (k) => (S.drafts[`${id}-${k}`] || '').trim();
  const clear = (...ks) => ks.forEach((k) => delete S.drafts[`${id}-${k}`]);
  const act = b.dataset.act;
  if (act === 'detalle') { S.open[id] = !S.open[id]; return schedule(); }
  if (act === 'panel') { S.panel[id] = S.panel[id] === b.dataset.p ? null : b.dataset.p; S.sel[id] = {}; return schedule(); }
  if (act === 'sel') { S.sel[id] = { ...(S.sel[id] || {}), [b.dataset.k]: b.dataset.v }; return schedule(); }
  if (act === 'tab') { S.projTab = b.dataset.t; return schedule(); }
  if (act === 'agregar-proceso') { S.forms[b.dataset.form].procesos.push({ id: '', label: '', op: '', role: 'other', repo: '', rama: 'main', docs: '', carpeta: '' }); return schedule(); }
  if (act === 'quitar-proceso') { S.forms[b.dataset.form].procesos.splice(Number(b.dataset.i), 1); return schedule(); }
  if (act === 'descartar-cambios') { delete S.forms['cfg-' + b.dataset.pid]; return schedule(); }
  if (act === 'comentar') {
    const txt = draft('coment'); if (!txt) return;
    b.disabled = true;
    try { await S.db.collection('activity').add({ incidentId: id, projectId: inc.projectId, type: 'comment', text: txt, by: S.me || null, at: nowIso() }); clear('coment'); S.panel[id] = null; S.open[id] = true; toast('Comentario agregado'); }
    catch { toast('No se pudo comentar'); }
    return schedule();
  }
  if (act === 'asignar') {
    const uid = b.dataset.uid; const nombre = (S.peopleHits[id] || []).find((p) => p.id === uid);
    if (nombre) S.names[uid] = nombre;
    if (await writeWork(inc, { state: 'delegated', assignee: uid, delegatedBy: S.me || null, delegatedAt: nowIso() }, { type: 'delegate', text: `delegó la revisión` })) { S.panel[id] = null; toast('Delegado'); }
    return schedule();
  }
  if (act === 'posponer' || act === 'posponer-fecha') {
    let hasta = act === 'posponer' ? addDays(Number(b.dataset.d)) : (draft('fecha') ? new Date(draft('fecha') + 'T09:00:00').toISOString() : null);
    if (!hasta) return toast('Elegí una fecha');
    if (await writeWork(inc, { state: 'snoozed', snoozeUntil: hasta }, { type: 'snooze', text: `pospuso hasta ${fecha(hasta)}` })) { S.panel[id] = null; clear('fecha'); toast('Pospuesto'); }
    return schedule();
  }
  if (act === 'descartar') {
    const motivo = (S.sel[id] || {}).motivo; if (!motivo) return;
    const nota = draft('nota');
    if (await writeWork(inc, { state: 'dismissed', dismissReason: motivo, response: { notes: nota || null } }, { type: 'dismiss', text: `descartó: ${(DISMISS.find((x) => x[0] === motivo) || [0, motivo])[1]}${nota ? ' — ' + nota : ''}` })) { S.panel[id] = null; clear('nota'); toast('Descartado'); }
    return schedule();
  }
  if (act === 'responder') {
    const dec = (S.sel[id] || {}).decision; if (!dec) return;
    const notas = draft('notas');
    if (dec === 'recheck' && !draft('recheck')) return toast('Elegí la fecha del re-control');
    const response = { decision: dec, notes: notas || null, ticket: draft('ticket') || null, recheckAt: dec === 'recheck' ? new Date(draft('recheck') + 'T09:00:00').toISOString() : null };
    if (await writeWork(inc, { state: 'responded', response }, { type: 'respond', text: `respondió: ${(RESP.find((x) => x[0] === dec) || [0, dec])[1]}${notas ? ' — ' + notas : ''}` })) { S.panel[id] = null; clear('notas', 'ticket', 'recheck'); toast('Respuesta enviada. La rutina actualiza la memoria en la próxima corrida.'); }
    return schedule();
  }
  // ---- acciones de Admin ----
  try {
    if (act === 'activar' || act === 'pausar') {
      await S.db.doc(`projects/${b.dataset.pid}`).update({ status: act === 'activar' ? 'active' : 'paused', updatedAt: nowIso() });
      toast(act === 'activar' ? 'Proyecto activado' : 'Control pausado');
    } else if (act === 'reanalizar') {
      await S.db.collection('requests').add({ type: 'reanalyze_project', projectId: b.dataset.pid, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
      toast('Re-análisis pedido: lo hace la próxima corrida');
    } else if (act === 'regla') {
      const patch = { status: b.dataset.s }; if (b.dataset.s === 'active') { patch.approvedBy = S.me || null; patch.approvedAt = nowIso(); }
      await S.db.doc(`rules/${b.dataset.rid}`).update(patch);
      toast({ active: 'Regla activa', rejected: 'Regla rechazada', disabled: 'Regla desactivada' }[b.dataset.s]);
    } else if (act === 'nueva-regla') {
      const text = (S.drafts['nr-text'] || '').trim(); if (!text) return toast('Escribí la regla');
      const pid = S.drafts['nr-proj'] || (document.getElementById('nr-proj') || {}).value || S.filter || '*';
      await S.db.doc(`rules/${slug(pid)}-${Date.now().toString(36)}`).set({ projectId: pid, text, status: 'pending_compile', origin: 'manual', createdBy: S.me || null, createdAt: nowIso() });
      delete S.drafts['nr-text']; toast('Regla creada: se compila en la próxima corrida');
    } else if (act === 'guardar-ajustes') {
      const v = (k, d) => S.drafts['aj-' + k] ?? d; const s = S.settings || {};
      await S.db.doc('config/settings').set({ ...s, triageCriteria: v('crit', s.triageCriteria || ''), severityMatrix: v('sev', s.severityMatrix || ''), pendingMaxMinutes: Number(v('pend', s.pendingMaxMinutes || 30)),
        retention: { runsDays: Number(v('runs', (s.retention || {}).runsDays || 60)), closedIncidentsDays: Number(v('inc', (s.retention || {}).closedIncidentsDays || 180)) } });
      toast('Ajustes guardados');
    } else if (act === 'guardar-proyecto') {
      const pid = b.dataset.pid; const p = S.projects[pid];
      const r = proyectoDesdeForm(S.forms['cfg-' + pid] || formDesde(p));
      if (r.error) return toast(r.error);
      // `repo` era el formato anterior (un solo repo por proyecto): se reemplaza por `processes`.
      await S.db.doc(`projects/${pid}`).update({ ...r.data, repo: null, updatedAt: nowIso(), updatedBy: S.me || null });
      if (b.dataset.reanalizar) {
        await S.db.collection('requests').add({ type: 'reanalyze_project', projectId: pid, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
        toast('Guardado. La próxima corrida re-analiza el proyecto.');
      } else toast('Configuración guardada');
      S.forms['cfg-' + pid] = formDesde({ ...p, ...r.data });
    } else if (act === 'registrar') {
      const r = proyectoDesdeForm(S.forms.nuevo || formDesde(null));
      if (r.error) return toast(r.error);
      let id = slug(r.data.name); if (S.projects[id]) id = `${id}-${Date.now().toString(36).slice(-4)}`;
      await S.db.doc(`projects/${id}`).set({ ...r.data, status: 'pending_analysis', createdBy: S.me || null, createdAt: nowIso(), updatedAt: nowIso() });
      await S.db.collection('requests').add({ type: 'onboard_project', projectId: id, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
      delete S.forms.nuevo;
      toast('Proyecto registrado: la rutina lo analiza en la próxima corrida');
      location.hash = '#proyecto-' + id;
    }
  } catch (err) { toast(err && err.code === 'invalid_argument' ? 'No tenés permiso para esta acción' : 'No se pudo guardar. Probá de nuevo.'); }
  schedule();
});
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); schedule(); });

// ---------- arranque ----------
async function start() {
  render();
  const cl = window.claude;
  const [db, user] = await Promise.all([cl && cl.use ? cl.use('db') : null, cl && cl.use ? cl.use('user') : null]);
  S.user = user;
  if (!db) { S.error = 'El tablero necesita una sesión de claude.ai para mostrar datos.'; return schedule(); }
  S.db = db;
  if (user) {
    S.me = await user.id();
    S.isAdmin = await user.canEdit();
    const w = await user.can('data.write');
    S.canWrite = S.isAdmin || w === true || w === null;
    S.role = S.isAdmin ? 'admin' : S.canWrite ? 'operador' : 'lector';
    if (S.me) resolveNames([S.me]);
  }
  const timer = setTimeout(() => { S.stale = true; schedule(); }, 10000);
  const onErr = (e) => { clearTimeout(timer); S.error = e && e.code === 'revoked' ? 'Tu acceso al tablero cambió.' : 'No se pudo leer el tablero.'; schedule(); };
  const coll = (name, key, fn) => db.collection(name).onSnapshot((s) => { clearTimeout(timer); S[key] = {}; for (const d of s.docs) S[key][d.id] = { id: d.id, ...d.data() }; S.loaded[key] = true; if (fn) fn(); schedule(); }, onErr);
  coll('projects', 'projects');
  coll('rules', 'rules');
  coll('incidentWork', 'work', () => resolveNames(Object.values(S.work).map((w) => w.assignee)));
  db.collection('incidents').where('status', '==', 'open').onSnapshot((s) => { clearTimeout(timer); S.incidents = {}; for (const d of s.docs) S.incidents[d.id] = { id: d.id, ...d.data() }; S.loaded.incidents = true; schedule(); }, onErr);
  db.collection('runs').orderBy('startedAt', 'desc').limit(50).onSnapshot((s) => { S.runs = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.runs = true; schedule(); }, onErr);
  db.doc('config/settings').onSnapshot((d) => { S.settings = d.exists ? d.data() : null; schedule(); }, () => {});
  setInterval(schedule, 60000); // refresca los "hace X min"
}
start();
})();
</script>
