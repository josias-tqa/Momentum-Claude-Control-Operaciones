<template id="ayuda-tpl"><nav class="ay-toc box" aria-label="Contenido de la ayuda"><div class="ay-toc-g"><a href="#ayuda-introduccion"><b>Qué es la Torre de Control</b></a><ul><li><a href="#ayuda-como-funciona">Cómo funciona</a></li><li><a href="#ayuda-primeros-pasos">Primeros pasos en un tablero nuevo</a></li><li><a href="#ayuda-solo-lectura">Lo que la Torre de Control nunca hace</a></li><li><a href="#ayuda-roles">Roles</a></li></ul></div><div class="ay-toc-g"><a href="#ayuda-glosario"><b>Glosario</b></a></div><div class="ay-toc-g"><a href="#ayuda-pantallas"><b>Pantallas y acciones</b></a><ul><li><a href="#ayuda-navegacion">Menú y selector de proyecto</a></li><li><a href="#ayuda-bandeja">Bandeja</a></li><li><a href="#ayuda-tarjeta">El tema y su detalle</a></li><li><a href="#ayuda-acciones">Acciones sobre un tema</a></li><li><a href="#ayuda-no-reportados">Fuera de bandeja</a></li><li><a href="#ayuda-corridas">Corridas</a></li><li><a href="#ayuda-proyectos">Proyectos</a></li><li><a href="#ayuda-pagina-proyecto">Página de un proyecto</a></li><li><a href="#ayuda-reglas">Reglas</a></li><li><a href="#ayuda-registrar">Registrar proyecto</a></li><li><a href="#ayuda-ajustes">Ajustes</a></li><li><a href="#ayuda-mas">Más (teléfono)</a></li></ul></div></nav>
<section class="ay-sec n1" id="ayuda-introduccion" data-nivel="1"><h2>Qué es la Torre de Control</h2><p>La Torre de Control vigila los robots de UiPath que Grupo Momentum tiene en producción. Cada hora una <strong>rutina</strong> de Claude revisa Orchestrator, detecta lo que anda mal, decide qué tan grave es y lo deja en este tablero, explicado y ordenado.</p><p>El tablero es donde el equipo trabaja: ve lo que requiere atención, lo responde, lo delega o lo descarta. Con cada respuesta la rutina aprende: la próxima vez sabe qué es normal en cada proyecto y qué no.</p></section>
<section class="ay-sec n2" id="ayuda-como-funciona" data-nivel="2"><h3>Cómo funciona</h3><ol>
<li><strong>Controla.</strong> La rutina lee los jobs, los logs, las colas y los triggers de cada proyecto activo, y evalúa sus <a href="#ayuda-regla">reglas</a>.</li>
<li><strong>Agrupa.</strong> Cada problema distinto es un <a href="#ayuda-tema">tema</a> y tiene una sola tarjeta. Si se repite, la tarjeta suma ocurrencias en lugar de duplicarse.</li>
<li><strong>Clasifica.</strong> El <a href="#ayuda-triage">triage</a> asigna categoría, <a href="#ayuda-severidad">severidad</a> y una <a href="#ayuda-decision">decisión</a>: escalar, avisar, observar o dar por conocido. Siempre dice por qué.</li>
<li><strong>Analiza.</strong> Antes de escalar, cruza el error con el código del paquete desplegado y su documentación. El resultado es el <a href="#ayuda-analisis-previo">análisis previo</a>.</li>
<li><strong>Publica.</strong> Lo que necesita a una persona aparece en la <a href="#ayuda-bandeja">Bandeja</a>. El resto queda en <a href="#ayuda-no-reportados">No reportados</a>.</li>
<li><strong>Aprende.</strong> Las respuestas del equipo se guardan en la <a href="#ayuda-memoria-de-produccion">memoria de producción</a> y pueden convertirse en reglas propuestas.</li>
</ol></section>
<section class="ay-sec n2" id="ayuda-primeros-pasos" data-nivel="2"><h3>Primeros pasos en un tablero nuevo</h3><p>Un tablero recién publicado no tiene proyectos. Un Admin lo pone en marcha así:</p><ol>
<li><strong>Indicá la carpeta a escanear.</strong> En <a href="#ayuda-descubrimiento">Ajustes</a>, escribí la carpeta de Orchestrator donde están los proyectos de producción y tocá <strong>Guardar y escanear</strong>.</li>
<li><strong>Revisá los proyectos propuestos.</strong> La próxima corrida recorre esa carpeta y propone como proyecto cada carpeta que tiene procesos. Aparecen en <a href="#ayuda-propuestos">Registrar proyecto</a>.</li>
<li><strong>Registrá los que quieras controlar</strong> e ignorá el resto. La rutina hace el <a href="#ayuda-alta">alta</a> de cada uno, hasta 3 por corrida.</li>
<li><strong>Revisá y activá.</strong> Cada proyecto queda En revisión con su memoria de proceso, sus discrepancias y sus reglas propuestas. Cuando esté bien, activá el control.</li>
</ol><p>Mientras no hay proyectos, la Bandeja y Proyectos muestran estos pasos.</p></section>
<section class="ay-sec n2" id="ayuda-solo-lectura" data-nivel="2"><h3>Lo que la Torre de Control nunca hace</h3><ul>
<li><strong>No cambia nada en Orchestrator.</strong> No inicia, detiene ni reintenta jobs, y no toca colas, assets ni procesos.</li>
<li><strong>No cambia código.</strong> Si un problema requiere un fix, lo sugiere con la evidencia. Lo hace una persona.</li>
<li><strong>No muestra datos personales.</strong> Todo lo que viene de Orchestrator pasa por una redacción de PII antes de llegar al tablero. Los valores de assets y el contenido de los queue items nunca se leen.</li>
</ul></section>
<section class="ay-sec n2" id="ayuda-roles" data-nivel="2"><h3>Roles</h3><p class="ay-breve">Tu rol define qué podés hacer: Lector mira, Operador trabaja las tarjetas y Admin además configura proyectos, reglas y ajustes.</p><p>Tu rol se ve abajo del menú, como <strong>Acceso de Operador</strong> (en el teléfono, dentro de <strong>Más</strong>). Se asigna desde el menú <strong>Compartir</strong> del tablero.</p><table><thead><tr><th>Rol</th><th>Acceso en Compartir</th><th>Puede</th></tr></thead><tbody><tr><td>Lector</td><td>Viewer</td><td>Ver todo, incluida esta ayuda.</td></tr><tr><td>Operador</td><td>Contributor</td><td>Delegar, posponer, descartar, responder y comentar tarjetas, pedir un nuevo análisis, y responder, posponer o descartar las discrepancias de un proyecto.</td></tr><tr><td>Admin</td><td>Editor</td><td>Además: indicar la carpeta a escanear, registrar y configurar proyectos, subir su documentación, activar o pausar el control, aprobar, ajustar y eliminar reglas y editar los ajustes.</td></tr></tbody></table></section>
<section class="ay-sec n1" id="ayuda-glosario" data-nivel="1"><h2>Glosario</h2><p>Los términos que aparecen en el tablero, en orden alfabético.</p><div class="ay-glos"><div class="ay-term" id="ayuda-alta"><b class="ay-term-n">Alta</b><div class="ay-term-d">El primer análisis de un proyecto recién registrado. La rutina descubre sus procesos, colas, triggers y librerías, calcula el baseline y genera la memoria de proceso, las discrepancias y las reglas propuestas. Después un Admin lo revisa y lo activa.</div></div><div class="ay-term" id="ayuda-analisis-previo"><b class="ay-term-n">Análisis previo</b><div class="ay-term-d">Lo que la rutina investiga antes de escalar una tarjeta: hipótesis con su probabilidad, acciones sugeridas, el código y la documentación relacionados, y qué cambió en el último deploy. Se lee en el detalle de la tarjeta.</div></div><div class="ay-term" id="ayuda-aprobacion-automatica"><b class="ay-term-n">Aprobación automática</b><div class="ay-term-d">Una opción de Ajustes. Cuando está activa, las reglas que propone la rutina se activan solas en la corrida siguiente, sin esperar a un Admin. Los cambios sugeridos sobre reglas que ya existen siempre los aplica una persona.</div></div><div class="ay-term" id="ayuda-baseline"><b class="ay-term-n">Baseline</b><div class="ay-term-d">El comportamiento normal de un proyecto en los últimos 30 días: cuántos jobs corre, cuánto tardan y cuántos errores tiene. Sirve para distinguir un problema nuevo de lo habitual.</div></div><div class="ay-term" id="ayuda-categoria"><b class="ay-term-n">Categoría</b><div class="ay-term-d">El tipo de problema, con su ícono: login o credenciales, selector o UI, aplicación caída, infraestructura, configuración, programación, negocio, sistema, falla silenciosa, regresión, deploy o monitoreo.</div></div><div class="ay-term" id="ayuda-corrida"><b class="ay-term-n">Corrida</b><div class="ay-term-d">Una ejecución de la rutina. Registra qué ventana de tiempo revisó en cada proyecto, cada punto de control con su valor observado y los hallazgos con su triage.</div></div><div class="ay-term" id="ayuda-criterios"><b class="ay-term-n">Criterios de triage</b><div class="ay-term-d">Instrucciones en lenguaje natural que guían la clasificación. Hay criterios globales, en Ajustes, y criterios propios de cada proyecto, en su Configuración.</div></div><div class="ay-term" id="ayuda-decision"><b class="ay-term-n">Decisión</b><div class="ay-term-d">Qué hace el triage con un hallazgo. Escalado: necesita a una persona y va a Requiere acción. Aviso: conviene verlo, pero no bloquea. En observación: se sigue la tendencia sin mostrarlo. Conocido: la memoria o una regla dicen que es esperado.</div></div><div class="ay-term" id="ayuda-discrepancia"><b class="ay-term-n">Discrepancia</b><div class="ay-term-d">Algo que no coincide entre el código, la documentación y Orchestrator de un proyecto, por ejemplo una cola del SDD que no existe o un trigger con otra frecuencia. La encuentra el análisis del proyecto. Se responde, se pospone o se descarta desde la pestaña Discrepancias del proyecto: no va a la bandeja.</div></div><div class="ay-term" id="ayuda-estado-proyecto"><b class="ay-term-n">Estado del proyecto</b><div class="ay-term-d">Esperando análisis, Analizando, En revisión, Activo, Pausado o Con error. Solo los proyectos activos se controlan en cada corrida.</div></div><div class="ay-term" id="ayuda-evidencia"><b class="ay-term-n">Evidencia (redactada)</b><div class="ay-term-d">Los logs, queue items, jobs y valores de reglas que respaldan una tarjeta, después de quitarles los datos personales. Las referencias de los casos se muestran como un código corto, nunca el dato original.</div></div><div class="ay-term" id="ayuda-excepcion"><b class="ay-term-n">Excepción de regla</b><div class="ay-term-d">Una condición en la que una regla que está bien no aplica, por ejemplo: es lunes antes de las 9. Se agrega desde el editor de reglas y vale desde la próxima corrida.</div></div><div class="ay-term" id="ayuda-incidente"><b class="ay-term-n">Incidente o tarjeta</b><div class="ay-term-d">Un problema detectado, con toda su historia: cuándo se vio por primera y por última vez, cuántas veces ocurrió, su triage, su análisis y la actividad del equipo.</div></div><div class="ay-term" id="ayuda-inventario"><b class="ay-term-n">Inventario</b><div class="ay-term-d">Lo que tiene la carpeta de Orchestrator de un proyecto: procesos con su versión, colas, triggers y assets. De los assets se guarda solo el nombre y el tipo, nunca el valor.</div></div><div class="ay-term" id="ayuda-libreria"><b class="ay-term-n">Librería</b><div class="ay-term-d">La etiqueta con el nombre de una librería indica que el error ocurrió dentro de una actividad de esa librería. El detalle dice qué otros proyectos la usan y si tienen tarjetas abiertas.</div></div><div class="ay-term" id="ayuda-memoria-de-proceso"><b class="ay-term-n">Memoria de proceso</b><div class="ay-term-d">Una descripción del proceso, similar a un PDD resumido, que la rutina genera en el alta a partir del código y la documentación. Sirve de contexto para el triage y el análisis.</div></div><div class="ay-term" id="ayuda-memoria-de-produccion"><b class="ay-term-n">Memoria de producción</b><div class="ay-term-d">El historial permanente de un proyecto: respuestas del equipo, deploys, re-controles y reglas nuevas, más un resumen que se actualiza solo. Es lo que hace que la rutina aprenda.</div></div><div class="ay-term" id="ayuda-nueva-version"><b class="ay-term-n">Nueva versión</b><div class="ay-term-d">Se desplegó una versión nueva del proceso después de que se abrió la tarjeta. La rutina la vuelve a analizar y explica qué cambió.</div></div><div class="ay-term" id="ayuda-proyecto"><b class="ay-term-n">Proyecto</b><div class="ay-term-d">Una carpeta de Orchestrator con sus procesos, por ejemplo Dispatcher, Performer y Reporter. Es la unidad que se registra, se analiza y se controla.</div></div><div class="ay-term" id="ayuda-proyecto-propuesto"><b class="ay-term-n">Proyecto propuesto</b><div class="ay-term-d">Una carpeta de Orchestrator con procesos que encontró el escaneo y que todavía no se controla. Un Admin la registra, y entonces la rutina hace su alta, o la ignora.</div></div><div class="ay-term" id="ayuda-pulso"><b class="ay-term-n">Pulso de la rutina</b><div class="ay-term-d">Abajo del menú (en el teléfono, arriba): cuándo fue el último control. Verde si salió bien, ámbar si tuvo errores de colecta, y rojo si la rutina dejó de correr; en ese caso la bandeja también lo avisa.</div></div><div class="ay-term" id="ayuda-punto-de-control"><b class="ay-term-n">Punto de control</b><div class="ay-term-d">Cada cosa que se revisa en una corrida, por ejemplo jobs fallidos, items abandonados o una regla. Su resultado es alerta, ok u omitido.</div></div><div class="ay-term" id="ayuda-re-control"><b class="ay-term-n">Re-control</b><div class="ay-term-d">Respuesta Volver a controlar con una fecha. La tarjeta se oculta hasta ese día y entonces la rutina verifica si el problema sigue. Queda en la memoria de producción como Re-control agendado y Re-control OK.</div></div><div class="ay-term" id="ayuda-reaparecio"><b class="ay-term-n">Reapareció</b><div class="ay-term-d">Un tema que se había cerrado volvió dentro de los 30 días. Se reabre la misma tarjeta en lugar de crear una nueva, para no perder su historia.</div></div><div class="ay-term" id="ayuda-recurrencia"><b class="ay-term-n">Recurrencia</b><div class="ay-term-d">Cuando un tema se repite, suma ocurrencias en la misma tarjeta. La etiqueta ×7 · última hace 12 min indica cuántas veces pasó y cuándo fue la última.</div></div><div class="ay-term" id="ayuda-regla"><b class="ay-term-n">Regla</b><div class="ay-term-d">Un punto de control escrito en lenguaje natural, por ejemplo: si hay más de 10 errores de login seguidos, escalar. La rutina la traduce a un control y muestra cómo la entendió.</div></div><div class="ay-term" id="ayuda-retencion"><b class="ay-term-n">Retención</b><div class="ay-term-d">Las corridas y los incidentes cerrados se borran después de cierta cantidad de días, que se configura en Ajustes. Antes de borrarlos se guarda un resumen mensual.</div></div><div class="ay-term" id="ayuda-rutina"><b class="ay-term-n">Rutina</b><div class="ay-term-d">El proceso de Claude que corre solo, en general cada hora. Es el único que crea corridas e incidentes, y nunca modifica nada en Orchestrator.</div></div><div class="ay-term" id="ayuda-severidad"><b class="ay-term-n">Severidad (P1 a P4)</b><div class="ay-term-d">P1: un proceso crítico se detuvo o se incumplió el SLA hoy. P2: proceso degradado con riesgo de SLA. P3: errores aislados. P4: informativo.</div></div><div class="ay-term" id="ayuda-similitud"><b class="ay-term-n">Propuesta por similitud</b><div class="ay-term-d">Cuando un Admin aprueba o edita una regla, la rutina propone la regla equivalente a otros procesos que usan el mismo portal, la misma aplicación o la misma librería. Llega como propuesta: la aprueba un Admin, salvo que esté activa la aprobación automática.</div></div><div class="ay-term" id="ayuda-solicitud"><b class="ay-term-n">Solicitud</b><div class="ay-term-d">Un pedido del equipo a la rutina, por ejemplo escanear una carpeta, analizar un proyecto nuevo o volver a analizar una tarjeta. Se atiende en la próxima corrida.</div></div><div class="ay-term" id="ayuda-sugerencia"><b class="ay-term-n">Sugerencia de la rutina</b><div class="ay-term-d">Un cambio en una regla que propone la revisión diaria de los últimos 30 días: una excepción o un umbral si casi siempre se descarta, una severidad más baja si sus temas se posponen, o desactivarla si no dispara hace 60 días. Se ve como Cambio sugerido.</div></div><div class="ay-term" id="ayuda-tema"><b class="ay-term-n">Tema</b><div class="ay-term-d">Lo que identifica a un problema, sin importar cuántas veces ocurra: el mismo error en el mismo lugar. Un tema tiene una sola tarjeta.</div></div><div class="ay-term" id="ayuda-triage"><b class="ay-term-n">Triage</b><div class="ay-term-d">La clasificación de cada hallazgo: categoría, severidad y decisión, con su porqué, su nivel de confianza y las reglas o memorias en las que se basó.</div></div></div></section>
<section class="ay-sec n1" id="ayuda-pantallas" data-nivel="1"><h2>Pantallas y acciones</h2><p>Cada pantalla tiene un botón <strong>?</strong> al lado del título que trae a su sección de esta ayuda. El link <strong>Ayuda</strong> del menú también abre la parte de la pantalla en la que estás. Al pasar el mouse por un botón o una etiqueta aparece una explicación breve, con un link a más detalle. Las vistas de esta página son las de la app, dibujadas con datos de ejemplo.</p></section>
<section class="ay-sec n2" id="ayuda-navegacion" data-nivel="2"><h3>Menú y selector de proyecto</h3><p>El menú está siempre a la vista: a la izquierda en una computadora y abajo en el teléfono. Lleva a la Bandeja, Proyectos, Corridas, Reglas, Fuera de bandeja, Ajustes (Admin) y esta Ayuda. El número de la Bandeja es la cantidad de temas abiertos; el de Reglas, las propuestas que esperan aprobación.</p><p>Abajo del menú está el <a href="#ayuda-pulso">pulso de la rutina</a> y tu <a href="#ayuda-roles">rol</a>. En el teléfono el pulso y el <strong>?</strong> están en la barra de arriba, y Fuera de bandeja, Ajustes y Ayuda están dentro de <a href="#ayuda-mas">Más</a>.</p><div class="ay-accion" id="ayuda-scope"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Proyecto</span></div><p><b>Filtra la Bandeja, Corridas, Reglas y Fuera de bandeja por un proyecto. La × quita el filtro.</b></p><p>Tocalo y escribí parte del nombre o de la carpeta. Elegí el proyecto con un clic, o con las flechas y Enter. Cada proyecto muestra un punto de color con su salud (verde: sin novedades; ámbar: con avisos; rojo: con problemas P1 o P2; gris: pausado o sin datos) y cuántos temas tiene abiertos. Primero aparecen los que tienen temas abiertos.</p><p>El filtro queda aplicado en todas esas pantallas, y se recuerda en este navegador, hasta que lo quites con la <strong>×</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:selector:abierto--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div></section>
<section class="ay-sec n2" id="ayuda-bandeja" data-nivel="2"><h3>Bandeja</h3><p class="ay-breve">La pantalla principal: lo que necesita a una persona, ordenado por severidad.</p><p>Es la pantalla de trabajo. Muestra solo los temas abiertos cuya decisión es escalar o avisar, y que nadie respondió, descartó o pospuso. Están ordenados por severidad, primero los escalados y después los más recientes. Si no hay nada pendiente, dice <strong>Todo en orden</strong>.</p><ul>
<li>Los botones <strong>Todo</strong>, <strong>Para vos</strong>, <strong>Requiere acción</strong> y <strong>Avisos</strong> muestran solo esa parte.</li>
<li>El buscador filtra por título, proyecto, categoría, proceso o severidad.</li>
<li>Si la rutina está detenida o la última corrida tuvo errores de colecta, arriba aparece un aviso rojo.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:bandeja:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-para-revisar" data-nivel="3"><h4>Para revisar</h4><p class="ay-breve">Solo Admin: reglas propuestas, cambios sugeridos en reglas, proyectos propuestos y proyectos que terminaron su análisis.</p><p>Solo la ven los Admin, en la vista <strong>Todo</strong>. Junta las tareas de configuración pendientes: <a href="#ayuda-propuestas">reglas propuestas</a>, reglas con un cambio sugerido, <a href="#ayuda-propuestos">proyectos propuestos</a> por el escaneo, proyectos <strong>En revisión</strong> que esperan ser activados y proyectos <strong>Con error</strong>. Cada fila lleva a donde se resuelve.</p><p>Las <a href="#ayuda-discrepancia">discrepancias</a> de un proyecto no aparecen acá ni en el resto de la bandeja: se trabajan desde la página del proyecto.</p></section>
<section class="ay-sec n3" id="ayuda-para-vos" data-nivel="3"><h4>Para vos</h4><p class="ay-breve">Temas que alguien te delegó.</p><p>Los temas que alguien te <a href="#ayuda-delegar">delegó</a>. Salen de esta lista cuando los respondés, descartás o posponés.</p></section>
<section class="ay-sec n3" id="ayuda-requiere-accion" data-nivel="3"><h4>Requiere acción</h4><p class="ay-breve">Temas escalados: el triage decidió que necesitan a una persona.</p><p>Los temas con decisión <strong>Escalado</strong>. En general son P1 o P2, o algo que la rutina nunca había visto. Cada uno trae su análisis previo en el detalle.</p></section>
<section class="ay-sec n3" id="ayuda-avisos" data-nivel="3"><h4>Avisos</h4><p class="ay-breve">Cosas para saber que no bloquean, en formato compacto.</p><p>Los temas con decisión <strong>Aviso</strong>, en general P3 o P4 nuevos. Se muestran compactos: sin el porqué y sin Delegar. El detalle tiene todo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:aviso--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-tarjeta" data-nivel="2"><h3>El tema y su detalle</h3><p class="ay-breve">Un problema por tema, con su severidad, su porqué y las acciones para trabajarlo.</p><p>Cada tarjeta es un <a href="#ayuda-tema">tema</a>. Si el problema vuelve a ocurrir no se crea otra: la misma suma ocurrencias.</p><ul>
<li><strong>A la izquierda:</strong> la <a href="#ayuda-severidad">severidad</a>.</li>
<li><strong>Etiquetas:</strong> la <a href="#ayuda-categoria">categoría</a>; el proyecto, cuando no hay filtro, y el proceso si el proyecto tiene varios; la <a href="#ayuda-recurrencia">recurrencia</a>; <a href="#ayuda-reaparecio">Reapareció</a>; la <a href="#ayuda-libreria">librería</a> donde ocurrió el error; <a href="#ayuda-nueva-version">Nueva versión</a>; <strong>Aviso</strong>, y a quién está delegado.</li>
<li><strong>Texto gris:</strong> el porqué del triage, en dos líneas.</li>
<li><strong>Acciones:</strong> abajo. Un Lector no las ve.</li>
</ul><p>Un clic en la tarjeta, o en <strong>Ver detalle</strong>, abre el detalle en un panel al costado, sin perder el lugar en la lista. Se cierra con la <strong>×</strong>, con Esc o tocando fuera.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-detalle" data-nivel="3"><h4>El detalle de un tema</h4><p class="ay-breve">Por qué está acá, el análisis previo, la evidencia y la actividad del tema.</p><p>El detalle muestra, en este orden:</p><ol>
<li><strong>Estado:</strong> si el tema está delegado, pospuesto, descartado o respondido, y por quién. Si salió de la bandeja, ofrece <a href="#ayuda-reabrir">Devolver a la bandeja</a>.</li>
<li><strong>Acciones:</strong> las mismas de la tarjeta.</li>
<li><strong>Por qué está acá:</strong> el porqué del triage, la decisión y su confianza, las reglas y memorias en las que se basó, desde cuándo se ve y en cuántas corridas.</li>
<li><strong>Análisis previo:</strong> resumen, hipótesis con su probabilidad, acciones sugeridas, código y documentación relacionados, y qué cambió en el último deploy. Si dice Pendiente, lo completa la próxima corrida.</li>
<li><strong>Librería:</strong> si el error ocurrió en una librería, su versión, la actividad y qué otros proyectos la usan.</li>
<li><strong>Evidencia (redactada):</strong> los últimos logs, queue items y jobs, sin datos personales.</li>
<li><strong>Actividad:</strong> quién hizo qué con el tema, y un cuadro para <a href="#ayuda-comentar">comentar</a>.</li>
</ol><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:detalle--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-acciones" data-nivel="2"><h3>Acciones sobre un tema</h3><p>Las usan los Operadores y los Admin. Cada acción queda en la actividad del tema. Las respuestas y los descartes además le enseñan a la rutina, que los procesa en la próxima corrida. Después de posponer, descartar o responder aparece un aviso con <strong>Deshacer</strong>.</p><div class="ay-accion" id="ayuda-responder"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Responder</span></div><p><b>Registra qué se encontró o qué se va a hacer. Queda en la memoria de producción.</b></p><p>Elegí una decisión y agregá notas:</p><ul>
<li><strong>Requiere fix:</strong> hay que corregir el robot. Podés cargar el ticket o la referencia del fix.</li>
<li><strong>Comportamiento esperado</strong>, <strong>Problema de datos</strong>, <strong>Sistema externo</strong> o <strong>Falso positivo / ajustar regla:</strong> la causa es otra; la rutina lo aprende.</li>
<li><strong>Volver a controlar:</strong> elegí una fecha. El tema se oculta hasta ese día y la rutina hace un <a href="#ayuda-re-control">re-control</a>.</li>
<li><strong>Derivar a desarrollo:</strong> lo toma el equipo de desarrollo.</li>
</ul><p>El tema sale de la bandeja y la respuesta queda en la memoria de producción del proyecto.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:responder--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-posponer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Posponer</span></div><p><b>Oculta el tema hasta una fecha. Vuelve antes si el problema empeora.</b></p><p>Elegí 1 día, 3 días, 1 semana o una fecha. Mientras tanto el tema pasa a <a href="#ayuda-no-reportados">Fuera de bandeja</a> como <strong>Pospuesto</strong>.</p><ul>
<li>Si la severidad sube antes de la fecha, el tema vuelve a la bandeja solo.</li>
<li>Al vencer, vuelve a mostrarse si el problema sigue.</li>
<li>Posponer no le enseña nada a la rutina. Si el problema es esperado, conviene <strong>Descartar</strong> o <strong>Responder</strong>.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:posponer--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar</span></div><p><b>Saca el tema de la bandeja con un motivo. La rutina lo aprende y puede proponer una regla.</b></p><p>Elegí un motivo y, si querés, agregá una nota que explique por qué:</p><ul>
<li><strong>Es esperado:</strong> pasa siempre y no es un problema, por ejemplo una ventana de mantenimiento.</li>
<li><strong>Falso positivo:</strong> la detección se equivocó.</li>
<li><strong>Dato de negocio:</strong> es una excepción de negocio esperable, no una falla del robot.</li>
<li><strong>Sistema externo:</strong> el problema está en un sistema que no depende del equipo.</li>
</ul><p>La rutina anota el motivo en la <a href="#ayuda-memoria-de-produccion">memoria de producción</a> y puede proponer una <a href="#ayuda-regla">regla</a> para no volver a avisar. Si el tema se repite, suma ocurrencias en la misma tarjeta, pero no vuelve a la bandeja como nuevo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:descartar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-delegar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Delegar</span></div><p><b>Asigna la revisión a una persona: el tema le aparece en Para vos.</b></p><p>Buscá a la persona por nombre y elegila. La tarjeta muestra a quién está delegado y sigue en la bandeja de todos, pero esa persona lo ve en <strong>Para vos</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:delegar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-ajustar-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ajustar regla o Crear regla</span></div><p><b>Abre el editor de la regla de este tema sin salir de la bandeja. Un Operador la ve pero no la cambia.</b></p><p>Si el tema salió de una regla, o una regla lo marcó como conocido, el botón dice <strong>Ajustar regla</strong> (o <strong>Ver regla</strong> para un Operador) y abre el <a href="#ayuda-editor-regla">editor de reglas</a> ahí mismo.</p><p>Si no salió de ninguna regla, un Admin ve <strong>Crear regla</strong>: escribís una para ese caso, por ejemplo &quot;los abandonados de esta cola los lunes antes de las 9 son normales; no avisar&quot;, y vale para ese proyecto desde la próxima corrida. Con <strong>Descartar también este tema</strong> el incidente se cierra en el mismo paso.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:regla--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></div><div class="ay-accion" id="ayuda-re-crear"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Crear regla (desde un tema)</span><span class="role-b">Solo Admin</span></div><p><b>Crea una regla nueva para el proyecto de este tema. Se compila en la próxima corrida.</b></p><p>La regla queda <strong>Por compilar</strong> hasta que la rutina la traduce. Si marcaste <strong>Descartar también este tema</strong>, el tema sale de la bandeja como falso positivo, con <strong>Deshacer</strong> en el aviso.</p></div><div class="ay-accion" id="ayuda-comentar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Comentar</span></div><p><b>Deja una nota para el equipo en la actividad del tema. No cambia su estado.</b></p><p>El cuadro está en la sección <strong>Actividad</strong> del detalle. El comentario no saca el tema de la bandeja ni le enseña nada a la rutina. Con Ctrl o Cmd + Enter se envía sin usar el mouse.</p></div><div class="ay-accion" id="ayuda-reanalizar-inc"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Volver a analizar</span></div><p><b>Pide a la próxima corrida un análisis previo nuevo de este tema.</b></p><p>Está junto al título <strong>Análisis previo</strong> del detalle (si el tema no tiene análisis, dice <strong>Pedir análisis</strong>). Sirve cuando el análisis quedó viejo, por ejemplo después de un cambio en el sistema o en la documentación.</p></div><div class="ay-accion" id="ayuda-reabrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Devolver a la bandeja</span></div><p><b>Deshace un posponer, un descarte o una respuesta: el tema vuelve a la bandeja.</b></p><p>Aparece en el detalle de un tema pospuesto, descartado o respondido. El tema vuelve como estaba antes y queda en su actividad.</p></div><div class="ay-accion" id="ayuda-deshacer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Deshacer</span></div><p><b>Revierte la última acción sobre el tema (posponer, descartar o responder).</b></p><p>Está en el aviso que aparece abajo durante unos segundos después de la acción. Pasado ese tiempo se usa <strong>Devolver a la bandeja</strong> desde el detalle.</p></div></section>
<section class="ay-sec n2" id="ayuda-no-reportados" data-nivel="2"><h3>Fuera de bandeja</h3><p class="ay-breve">Temas abiertos que no se muestran en la bandeja: pospuestos, respondidos, descartados o no reportados por el triage.</p><p>Todo lo abierto que no está en la bandeja, con el motivo. Los botones de arriba filtran por <strong>Pospuestos</strong>, <strong>Respondidos</strong>, <strong>Descartados</strong> o <strong>No reportados por el triage</strong> (decisiones En observación y Conocido).</p><p>Sirve para controlar el criterio de la rutina. Si algo de acá debería estar en la bandeja, abrilo y usá <strong>Devolver a la bandeja</strong>, respondé <strong>Falso positivo / ajustar regla</strong> o corregí los <a href="#ayuda-criterios">criterios</a>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:fuera:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-corridas" data-nivel="2"><h3>Corridas</h3><p class="ay-breve">Cada ejecución de la rutina, con lo que revisó y lo que encontró.</p><p>Las últimas 50 corridas, con su estado (Completa, Parcial o Con errores), cuántos proyectos revisó y cuántos temas nuevos, recurrentes y escalados encontró.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corridas:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-corrida-detalle" data-nivel="3"><h4>Detalle de una corrida</h4><p class="ay-breve">Qué revisó la rutina en cada proyecto y qué decidió con cada hallazgo.</p><p>Por cada proyecto muestra la ventana de tiempo revisada, un resumen de señales, la tabla de <a href="#ayuda-punto-de-control">puntos de control</a> con su valor observado y los <strong>Hallazgos y triage</strong>: cada hallazgo con su severidad, su decisión, si es nuevo, recurrente o reabierto, y su porqué. Un clic en un hallazgo abre su tema. Si hubo errores al leer Orchestrator, aparecen en la caja del proyecto.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corrida:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-proyectos" data-nivel="2"><h3>Proyectos</h3><p class="ay-breve">Todos los proyectos controlados, con su salud, su estado y sus temas abiertos.</p><p>La lista de proyectos con su carpeta de Orchestrator, sus temas abiertos, sus <a href="#ayuda-discrepancia">discrepancias</a> pendientes y su <a href="#ayuda-estado-proyecto">estado</a>. Primero aparecen los que tienen problemas o esperan revisión. Con más de 5 proyectos aparece un buscador. Los Admin ven <strong>Registrar proyecto</strong> y un aviso si la rutina <a href="#ayuda-propuestos">propone proyectos</a> para agregar.</p><p>Si todavía no hay proyectos, un Admin ve los <a href="#ayuda-primeros-pasos">primeros pasos</a>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyectos:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-pagina-proyecto" data-nivel="2"><h3>Página de un proyecto</h3><p class="ay-breve">Procesos, memoria, discrepancias, documentación, reglas, inventario y configuración de un proyecto.</p><p>Arriba está la carpeta, la cantidad de procesos, el estado y cuántas discrepancias tiene pendientes, con las acciones. Debajo, cada proceso con su rol, su nombre en Orchestrator, el paquete y la versión desplegada, y sus librerías. Después vienen siete pestañas.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:memoria--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-ver-bandeja"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ver temas abiertos</span></div><p><b>Abre la bandeja filtrada por este proyecto.</b></p><p>Aparece cuando el proyecto tiene temas en la bandeja. Aplica el <a href="#ayuda-scope">selector de proyecto</a>.</p></div><div class="ay-accion" id="ayuda-activar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Activar el control</span><span class="role-b">Solo Admin</span></div><p><b>Empieza a controlar el proyecto en cada corrida. También reanuda un control pausado.</b></p><p>Aparece cuando el proyecto terminó su <a href="#ayuda-alta">alta</a> y está <strong>En revisión</strong>: antes de activarlo, revisá la memoria de proceso, las reglas propuestas y el inventario. Si el proyecto está <strong>Pausado</strong>, el botón dice <strong>Reanudar control</strong>.</p></div><div class="ay-accion" id="ayuda-pausar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pausar control</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar el proyecto hasta que se reanude. No borra nada.</b></p><p>Útil durante un mantenimiento largo o mientras se rehace un proceso. Los temas abiertos quedan como están y el proyecto se ve gris.</p></div><div class="ay-accion" id="ayuda-reanalizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pedir re-análisis</span><span class="role-b">Solo Admin</span></div><p><b>Pide a la próxima corrida que regenere la memoria de proceso, el inventario y las reglas propuestas.</b></p><p>Conviene después de un cambio grande en el proceso o en su documentación. El proyecto sigue activo mientras tanto.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-memoria" data-nivel="3"><h4>Pestaña Memoria de proceso</h4><p class="ay-breve">Qué hace el proceso, según el alta: el contexto que usa la rutina.</p><p>La <a href="#ayuda-memoria-de-proceso">memoria de proceso</a>: qué hace el proceso, sus pasos, sistemas, colas y excepciones conocidas. La genera el alta a partir del código y la documentación.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-produccion" data-nivel="3"><h4>Pestaña Memoria de producción</h4><p class="ay-breve">Lo que pasó en producción: respuestas del equipo, deploys y re-controles.</p><p>La <a href="#ayuda-memoria-de-produccion">memoria de producción</a>: un resumen arriba y debajo el historial, del más nuevo al más viejo, con quién respondió y el ticket si lo hay.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:produccion--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-discrepancias" data-nivel="3"><h4>Pestaña Discrepancias</h4><p class="ay-breve">Lo que no coincide entre el código, la documentación y Orchestrator. Se responde, se pospone o se descarta acá: no va a la bandeja.</p><p>Las <a href="#ayuda-discrepancia">discrepancias</a> que encontró el análisis del proyecto, por ejemplo:</p><ul>
<li>una cola o un asset que figura en el SDD o en el código y no existe en Orchestrator, o al revés;</li>
<li>un trigger con una frecuencia distinta a la documentada;</li>
<li>el Dispatcher y el Performer que no usan la misma cola;</li>
<li>documentación que no coincide con el código;</li>
<li>un paquete que publica capturas o datos que no debería.</li>
</ul><p>Cada una muestra su tipo, el proceso, qué se encontró, una sugerencia y de dónde sale. Son tarjetas del proyecto: <strong>no aparecen en la bandeja</strong> ni cambian su salud. El número de la pestaña, y el de la lista de proyectos, cuenta las pendientes.</p><ul>
<li><strong>Pendientes:</strong> las que la rutina sigue detectando y nadie atendió.</li>
<li><strong>Atendidas:</strong> las respondidas, pospuestas o descartadas, con quién lo hizo, y las <strong>resueltas</strong>, que la rutina dejó de detectar.</li>
</ul><p>En cada re-análisis la rutina actualiza la lista: suma las nuevas, cierra las que ya no detecta y respeta lo que respondió el equipo. Una discrepancia descartada no vuelve a aparecer como nueva. Si una que se dio por corregida vuelve a detectarse, reaparece como pendiente con la marca <strong>Reapareció</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:discrepancias--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-disc-responder"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Responder</span></div><p><b>Registra qué se va a hacer con la discrepancia. Queda en la memoria de producción del proyecto.</b></p><p>Elegí una decisión y agregá notas:</p><ul>
<li><strong>Corregir la documentación</strong>, <strong>Corregir en Orchestrator</strong> o <strong>Corregir el código:</strong> hay algo para arreglar. Podés cargar el ticket o la referencia. La discrepancia pasa a Atendidas y la rutina la cierra cuando un re-análisis deja de detectarla.</li>
<li><strong>Es correcto así:</strong> no hay nada que corregir. La rutina lo anota y no vuelve a preguntar.</li>
<li><strong>Derivar a desarrollo:</strong> lo toma el equipo de desarrollo.</li>
</ul></div><div class="ay-accion" id="ayuda-disc-posponer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Posponer</span></div><p><b>Saca la discrepancia de las pendientes hasta una fecha.</b></p><p>Elegí 1 semana, 1 mes, 3 meses o una fecha. Al vencer vuelve a Pendientes, si la rutina la sigue detectando.</p></div><div class="ay-accion" id="ayuda-disc-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar</span></div><p><b>Cierra la discrepancia con un motivo. La rutina no la vuelve a mostrar como nueva.</b></p><p>Motivos: <strong>Es correcto así</strong>, <strong>La rutina se equivocó</strong>, <strong>Ya se corrigió</strong> o <strong>No es relevante</strong>, con una nota opcional. Queda en Atendidas y en la memoria de producción.</p></div><div class="ay-accion" id="ayuda-disc-reabrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Volver a abrir</span></div><p><b>Deshace la respuesta, el descarte o la posposición: la discrepancia vuelve a estar pendiente.</b></p><p>Aparece en las discrepancias atendidas que la rutina todavía detecta.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-documentacion" data-nivel="3"><h4>Pestaña Documentación</h4><p class="ay-breve">PDD, SDD y Runbook del proyecto, subidos a mano y guardados en Markdown.</p><p>La rutina lee sola la documentación que viene dentro de los paquetes publicados. Cuando un documento no está ahí, o está desactualizado, un Admin lo sube acá. Hay un lugar para cada uno:</p><ul>
<li><strong>PDD:</strong> el proceso de negocio, sus pasos y sus excepciones.</li>
<li><strong>SDD:</strong> cómo está construida la solución, con sus colas, assets y triggers.</li>
<li><strong>Runbook:</strong> qué hacer ante cada falla y a quién escalar.</li>
</ul><p>Todo se guarda <strong>en Markdown</strong> (.md), sin imágenes. La rutina usa estos documentos en el análisis del proyecto, para la memoria de proceso y las discrepancias, y en el análisis previo de cada tema. Después de subir uno conviene <strong>Pedir re-análisis</strong>.</p><p>Un Lector o un Operador pueden ver y descargar los documentos; solo un Admin los sube, reemplaza o quita.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:documentacion--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure><div class="ay-accion" id="ayuda-doc-subir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Subir archivo o Reemplazar</span><span class="role-b">Solo Admin</span></div><p><b>Sube un .docx, .md o .txt y lo convierte a Markdown. Se revisa antes de guardar.</b></p><p>Un Word (.docx) se convierte en el momento: títulos, párrafos, negritas, listas y tablas. Las imágenes, los encabezados y el índice no se pasan. Un PDF o un .doc antiguo no se pueden convertir: guardalo como .docx o usá <strong>Pegar texto</strong>.</p><p>Nada se guarda hasta tocar <strong>Guardar</strong>. Si ya había un documento de ese tipo, el nuevo lo reemplaza.</p></div><div class="ay-accion" id="ayuda-doc-pegar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pegar texto</span><span class="role-b">Solo Admin</span></div><p><b>Abre un cuadro para pegar o escribir el documento, en Markdown o texto plano.</b></p><p>Sirve para documentos que están en una wiki, en un PDF o en otro formato.</p></div><div class="ay-accion" id="ayuda-doc-guardar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar</span><span class="role-b">Solo Admin</span></div><p><b>Guarda el documento en Markdown, después de enmascarar emails, documentos y usuarios.</b></p><p>Antes de guardar se ve el Markdown y se puede corregir. El tablero no guarda datos personales: los emails, los números de documento y los usuarios de Windows se enmascaran solos, pero los <strong>nombres de personas no se detectan</strong>: quitalos a mano. Cada documento admite hasta 230 KB de texto.</p></div><div class="ay-accion" id="ayuda-doc-ver"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ver</span></div><p><b>Muestra el documento guardado, con formato.</b></p><p><strong>Ocultar</strong> lo cierra.</p></div><div class="ay-accion" id="ayuda-doc-descargar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descargar .md</span></div><p><b>Baja el documento guardado como un archivo Markdown.</b></p><p>Pide confirmación antes de guardar el archivo. Si esta vista no admite descargas, el botón no aparece.</p></div><div class="ay-accion" id="ayuda-doc-quitar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Quitar</span><span class="role-b">Solo Admin</span></div><p><b>Borra el documento del proyecto. Pide confirmación.</b></p><p>No se puede deshacer. La memoria de proceso que ya se generó con ese documento no cambia hasta el próximo re-análisis.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-reglas" data-nivel="3"><h4>Pestaña Reglas</h4><p class="ay-breve">Las reglas de este proyecto y su estado.</p><p>Las reglas del proyecto, con las mismas acciones que la pantalla <a href="#ayuda-reglas">Reglas</a>.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-inventario" data-nivel="3"><h4>Pestaña Inventario</h4><p class="ay-breve">Procesos, colas, triggers y assets de la carpeta (de los assets, solo el nombre).</p><p>El <a href="#ayuda-inventario">inventario</a> de la carpeta: procesos con su versión y si son parte del proyecto, colas con sus reintentos, triggers y assets. De los assets se muestra solo el nombre y el tipo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:inventario--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-config" data-nivel="3"><h4>Pestaña Configuración</h4><p class="ay-breve">Nombre, carpeta, procesos, documentación y criterios del proyecto. Solo Admin puede editarla.</p><p>Un Lector o un Operador ven los criterios de triage y la documentación del proyecto. Un Admin puede editar:</p><ul>
<li>el nombre y la carpeta de Orchestrator;</li>
<li>en <strong>Opciones avanzadas</strong>: controlar solo algunos procesos, el repo de Bitbucket de respaldo de cada proceso, la documentación adicional y los criterios de triage del proyecto.</li>
</ul><p><strong>Editar configuración</strong>, debajo de la lista de procesos, abre esta pestaña.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:config--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-guardar-proyecto"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar y re-analizar</span><span class="role-b">Solo Admin</span></div><p><b>Guarda la configuración. Guardar y re-analizar además pide a la próxima corrida que regenere memoria e inventario.</b></p><p>Si cambiaste repos o procesos, conviene re-analizar. <strong>Solo guardar</strong> guarda sin pedir el análisis. Si el proyecto estaba activo, sigue activo.</p></div><div class="ay-accion" id="ayuda-descartar-cambios"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar cambios</span><span class="role-b">Solo Admin</span></div><p><b>Vuelve el formulario a la configuración guardada.</b></p><p>Deshace lo que editaste y no guardaste.</p></div></section>
<section class="ay-sec n2" id="ayuda-reglas" data-nivel="2"><h3>Reglas</h3><p class="ay-breve">Los puntos de control escritos en lenguaje natural, de todos los proyectos.</p><p>Las <a href="#ayuda-regla">reglas</a> de todos los proyectos. Arriba, las <strong>Propuestas para aprobar</strong>; después, para un Admin, el formulario <strong>Nueva regla</strong>, y al final el resto. Cada una muestra su estado, su proyecto, de dónde salió (a mano, del alta, aprendida de un incidente, por similitud o de la revisión diaria), sus excepciones y cómo la entendió la rutina.</p><ul>
<li><strong>Por compilar:</strong> la rutina la traduce a un control en la próxima corrida.</li>
<li><strong>Propuesta:</strong> la rutina la sugirió y dice por qué; un Admin la aprueba o la rechaza. Con la <a href="#ayuda-auto-reglas">aprobación automática</a> activa, se aprueba sola en la corrida siguiente.</li>
<li><strong>Activa</strong>, <strong>Desactivada</strong> o <strong>Rechazada.</strong></li>
<li><strong>Cambio sugerido:</strong> la revisión diaria encontró algo para ajustar en la regla.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure><div class="ay-accion" id="ayuda-nueva-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Crear regla</span><span class="role-b">Solo Admin</span></div><p><b>Agrega una regla escrita en lenguaje natural. Se compila en la próxima corrida.</b></p><p>Elegí el proyecto, o Todos los proyectos, y escribí la regla como se la dirías a una persona: qué mirar, el umbral y qué hacer. Por ejemplo: si se ven más de 10 errores de login seguidos, escalar.</p></div><div class="ay-accion" id="ayuda-regla-active"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aprobar o Activar</span><span class="role-b">Solo Admin</span></div><p><b>La regla pasa a controlarse en cada corrida.</b></p><p><strong>Aprobar</strong> acepta una regla propuesta. <strong>Activar</strong> vuelve a encender una regla desactivada.</p></div><div class="ay-accion" id="ayuda-regla-rejected"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Rechazar</span><span class="role-b">Solo Admin</span></div><p><b>Descarta una regla propuesta. No se controla.</b></p><p>La regla queda como Rechazada, para que la rutina no la vuelva a proponer igual.</p></div><div class="ay-accion" id="ayuda-regla-disabled"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Desactivar</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar una regla activa, sin borrarla.</b></p><p>Se puede volver a activar en cualquier momento.</p></div><div class="ay-accion" id="ayuda-re-abrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Editar o Revisar</span><span class="role-b">Solo Admin</span></div><p><b>Abre el editor de la regla en la lista. Dice Revisar cuando la rutina sugiere un cambio.</b></p><p>Es el mismo <a href="#ayuda-editor-regla">editor</a> que se abre desde un tema.</p></div></section>
<section class="ay-sec n3" id="ayuda-editor-regla" data-nivel="3"><h4>Editor de reglas</h4><p class="ay-breve">Cambia el texto, la severidad o las excepciones de una regla, o la desactiva o elimina.</p><p>Se abre con <strong>Ajustar regla</strong> desde un tema o con <strong>Editar</strong> en la lista de reglas. Solo los Admin pueden cambiar algo; un Operador ve la regla y sus excepciones.</p><ul>
<li><strong>Hay una condición en la que no aplica:</strong> escribí la <strong>excepción</strong>, por ejemplo &quot;es lunes antes de las 9&quot;. Vale desde la próxima corrida.</li>
<li><strong>Avisa con una gravedad que no corresponde:</strong> elegí otra <strong>severidad</strong>, de P1 a P4. Cambia al guardar.</li>
<li><strong>El umbral o la condición están mal:</strong> corregí el <strong>texto</strong>. Vale desde la próxima corrida.</li>
<li><strong>No querés que controle por un tiempo:</strong> <strong>Desactivar</strong>.</li>
<li><strong>La regla no sirve:</strong> <strong>Eliminar regla</strong>. Pide confirmación y no se puede deshacer.</li>
</ul><p>Cuando cambia el texto o una excepción, la regla queda <strong>Por compilar</strong> y la rutina muestra después cómo la entendió. Las excepciones se pueden quitar. Desde un tema, <strong>Descartar también este tema</strong> cierra el incidente en el mismo paso, como falso positivo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:editor--></div><figcaption>Ejemplo con datos ficticios · vista de Admin, con una sugerencia de la rutina</figcaption></figure><div class="ay-accion" id="ayuda-re-guardar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar cambios</span><span class="role-b">Solo Admin</span></div><p><b>Guarda el texto, la severidad y las excepciones. En una propuesta dice Guardar y aprobar.</b></p><p>En una regla desactivada o rechazada dice <strong>Guardar y activar</strong>. El cambio queda en la actividad del tema si se hizo desde uno.</p></div><div class="ay-accion" id="ayuda-re-sev"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Severidad</span><span class="role-b">Solo Admin</span></div><p><b>Elige la severidad con la que avisa la regla, de P1 a P4. Cambia al guardar.</b></p><p>No aparece en reglas que marcan temas como conocidos o los ignoran, porque esas no avisan.</p></div><div class="ay-accion" id="ayuda-re-estado"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Desactivar (editor)</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar esta regla desde ya, sin borrarla.</b></p><p>Se puede volver a activar desde la lista de reglas.</p></div><div class="ay-accion" id="ayuda-re-eliminar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Eliminar regla</span><span class="role-b">Solo Admin</span></div><p><b>Borra la regla para siempre. Pide confirmación.</b></p><p>Si solo querés que deje de controlar un tiempo, conviene <strong>Desactivar</strong>.</p></div><div class="ay-accion" id="ayuda-re-sug-aplicar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aplicar sugerencia</span><span class="role-b">Solo Admin</span></div><p><b>Carga en el formulario el cambio que sugiere la rutina; vos confirmás con Guardar.</b></p><p>Si la sugerencia es desactivar la regla, el botón dice <strong>Desactivar</strong> y la desactiva directamente. Ver <a href="#ayuda-sugerencia">sugerencias de la rutina</a>.</p></div><div class="ay-accion" id="ayuda-re-sug-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">No, gracias</span><span class="role-b">Solo Admin</span></div><p><b>Descarta la sugerencia de la rutina. No vuelve a sugerirla por 90 días.</b></p><p>La regla queda como estaba.</p></div></section>
<section class="ay-sec n3" id="ayuda-propuestas" data-nivel="3"><h4>Propuestas de la rutina</h4><p class="ay-breve">Reglas y cambios que propone la rutina. Los aprueba un Admin, salvo que la aprobación automática esté activa.</p><p>La rutina propone por su cuenta, y todo llega a <strong>Para revisar</strong> y a <strong>Propuestas para aprobar</strong>:</p><ul>
<li><strong>Por <a href="#ayuda-similitud">similitud</a>:</strong> cuando un Admin aprueba o edita una regla, la rutina la ofrece a otros procesos que usan el mismo portal, la misma aplicación o la misma librería.</li>
<li><strong><a href="#ayuda-sugerencia">Cambios sugeridos</a>:</strong> una vez por día revisa los últimos 30 días y marca las reglas que conviene tocar.</li>
<li><strong>Reglas nuevas de la revisión diaria:</strong> si un mismo tema sin regla se descartó varias veces, o un aviso se repite sin que nadie lo mire.</li>
<li><strong>Aprendidas de un incidente:</strong> a partir de los descartes y las respuestas.</li>
</ul><p>Llegan como máximo 3 propuestas por proyecto por vez.</p><p>Por defecto nada se activa solo. Si un Admin activó la <a href="#ayuda-auto-reglas">aprobación automática</a> en Ajustes, las <strong>reglas nuevas</strong> se activan en la corrida siguiente y quedan marcadas como <strong>aprobada automáticamente</strong>. Los cambios sugeridos sobre reglas que ya existen siempre esperan a una persona.</p></section>
<section class="ay-sec n2" id="ayuda-registrar" data-nivel="2"><h3>Registrar proyecto</h3><p class="ay-breve">Solo Admin: suma una carpeta de Orchestrator al control.</p><p>Se llega desde <strong>Proyectos → Registrar proyecto</strong>. Un <a href="#ayuda-proyecto">proyecto</a> es una carpeta de Orchestrator. La rutina detecta sola sus procesos, sus librerías y su documentación a partir de los paquetes publicados, en la versión que está en producción.</p><ol>
<li>Registrá la carpeta desde los <a href="#ayuda-propuestos">proyectos propuestos</a> o con el formulario.</li>
<li>La próxima corrida hace el <a href="#ayuda-alta">alta</a>.</li>
<li>Revisá el proyecto y tocá <strong>Activar el control de este proyecto</strong>.</li>
</ol><p>Los procesos que se agreguen después a la carpeta se suman solos.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:registrar:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-registrar-analizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar y analizar</span><span class="role-b">Solo Admin</span></div><p><b>Crea el proyecto con el nombre y la carpeta indicados y pide su análisis.</b></p><p>Alcanza con el nombre y la carpeta. Las <strong>Opciones avanzadas</strong> son las mismas que en la <a href="#ayuda-proyecto-config">Configuración</a> y normalmente no hacen falta.</p></div></section>
<section class="ay-sec n3" id="ayuda-propuestos" data-nivel="3"><h4>Proyectos propuestos</h4><p class="ay-breve">Carpetas de Orchestrator con procesos que encontró el escaneo y que todavía no se controlan.</p><p>La rutina escanea la carpeta indicada en <a href="#ayuda-descubrimiento">Ajustes</a>: cuando un Admin lo pide y, además, una vez por día. Cada carpeta con procesos que todavía no es un proyecto aparece acá como <a href="#ayuda-proyecto-propuesto">proyecto propuesto</a>, con sus procesos y su actividad de los últimos 30 días.</p><p>Nada se registra solo: un Admin elige qué controlar. Si no hay propuestas, la pantalla dice por qué y lleva a Ajustes.</p><div class="ay-accion" id="ayuda-registrar-detectada"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar</span><span class="role-b">Solo Admin</span></div><p><b>Registra un proyecto propuesto y pide su análisis.</b></p><p>El proyecto toma el nombre y la carpeta propuestos. Se pueden cambiar después en su <a href="#ayuda-proyecto-config">Configuración</a>.</p></div><div class="ay-accion" id="ayuda-registrar-todos"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar todos</span><span class="role-b">Solo Admin</span></div><p><b>Registra de una vez todos los proyectos propuestos que quedan en la lista. Pide confirmación.</b></p><p>Conviene ignorar antes las carpetas que no son de producción. La rutina hace hasta 3 altas por corrida: con muchos proyectos, el análisis tarda varias horas.</p></div><div class="ay-accion" id="ayuda-ignorar-detectada"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ignorar</span><span class="role-b">Solo Admin</span></div><p><b>Saca la carpeta de las propuestas. No se vuelve a proponer.</b></p><p>Para carpetas de pruebas, de desarrollo o que no se quieren controlar.</p></div><div class="ay-accion" id="ayuda-restaurar-ignoradas"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Volver a proponerlas</span><span class="role-b">Solo Admin</span></div><p><b>Vuelve a mostrar como propuestas las carpetas ignoradas.</b></p><p>Aparece debajo de la lista cuando hay carpetas ignoradas.</p></div></section>
<section class="ay-sec n2" id="ayuda-ajustes" data-nivel="2"><h3>Ajustes</h3><p class="ay-breve">Solo Admin: carpeta a escanear, criterios globales del triage, umbrales, retención y aprobación de reglas.</p><ul>
<li><strong>Proyectos a controlar:</strong> la <a href="#ayuda-descubrimiento">carpeta de Orchestrator a escanear</a>.</li>
<li><strong>Criterios de triage globales:</strong> se aplican a todos los proyectos, junto con los de cada uno.</li>
<li><strong>Matriz de severidad:</strong> qué es P1, P2, P3 y P4.</li>
<li><strong>Minutos máximos en Pending:</strong> desde cuándo un job que espera se considera un problema.</li>
<li><strong>Retención:</strong> cuántos días se guardan las corridas y los incidentes cerrados.</li>
<li><strong>Reglas:</strong> la <a href="#ayuda-auto-reglas">aprobación automática</a>.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:ajustes:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-guardar-ajustes"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar ajustes</span><span class="role-b">Solo Admin</span></div><p><b>Guarda la carpeta, los criterios, los umbrales y la retención. Se usan desde la próxima corrida.</b></p><p>Los cambios en los criterios no reclasifican lo que ya está en el tablero: se aplican a los hallazgos de las próximas corridas. La aprobación automática no depende de este botón: se guarda al cambiar el interruptor.</p></div><div class="ay-accion" id="ayuda-auto-reglas"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aprobar automáticamente las reglas</span><span class="role-b">Solo Admin</span></div><p><b>Interruptor. Activado, las reglas que propone la rutina se activan solas en la corrida siguiente.</b></p><p>Viene <strong>desactivado</strong>: cada regla que propone la rutina espera a que un Admin la apruebe.</p><p>Al activarlo:</p><ul>
<li>La próxima corrida aprueba las reglas propuestas, también las que ya estaban esperando. Rechazá antes las que no quieras.</li>
<li>Una regla nueva se ve como <strong>Propuesta</strong> hasta la corrida siguiente a la que la propuso. En ese rato todavía se puede rechazar.</li>
<li>Las reglas aprobadas así quedan marcadas como <strong>aprobada automáticamente</strong> y se pueden desactivar, editar o eliminar como cualquier otra.</li>
<li>Los <strong>cambios sugeridos</strong> sobre reglas que ya existen (una excepción, otra severidad, desactivarla) no se aplican solos.</li>
</ul><p>Se guarda en el momento y vale desde la próxima corrida.</p></div></section>
<section class="ay-sec n3" id="ayuda-descubrimiento" data-nivel="3"><h4>Proyectos a controlar</h4><p class="ay-breve">La carpeta de Orchestrator que la rutina escanea para proponer proyectos. Es el primer paso en un tablero nuevo.</p><p>En Orchestrator los proyectos de producción suelen estar dentro de una misma carpeta, por ejemplo <code>Produccion</code>. Escribila acá, con su ruta completa si está dentro de otra (<code>Clientes/Produccion</code>). Se pueden indicar varias, separadas por coma.</p><p>La rutina recorre todas las carpetas que están adentro. Cada una que tiene procesos y todavía no se controla pasa a <a href="#ayuda-propuestos">Proyectos propuestos</a>. Lo que está fuera de esa carpeta no se propone.</p><p>Para que el escaneo vea las subcarpetas, la aplicación con la que la rutina lee Orchestrator tiene que poder verlas. Si no puede, debajo del campo aparece un aviso que dice qué falta.</p><div class="ay-accion" id="ayuda-escanear"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar y escanear</span><span class="role-b">Solo Admin</span></div><p><b>Guarda la carpeta y pide a la próxima corrida que la escanee y proponga los proyectos.</b></p><p>Mientras el pedido espera, dice <strong>Escaneo pedido</strong>. Después muestra cuándo fue el último escaneo y cuántos proyectos propuso. Además del pedido, la rutina repite el escaneo una vez por día para encontrar carpetas nuevas.</p></div></section>
<section class="ay-sec n2" id="ayuda-mas" data-nivel="2"><h3>Más (teléfono)</h3><p class="ay-breve">En el teléfono: Fuera de bandeja, Ajustes, Registrar proyecto, Ayuda y el estado de la rutina.</p><p>En el teléfono la barra de abajo tiene lugar para Bandeja, Proyectos, Corridas y Reglas. Lo demás está en <strong>Más</strong>, junto con el estado de la rutina y tu acceso.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:mas:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></section></template>

ce el triage con un hallazgo. Escalado: necesita a una persona y va a Requiere acción. Aviso: conviene verlo, pero no bloquea. En observación: se sigue la tendencia sin mostrarlo. Conocido: la memoria o una regla dicen que es esperado."},"discrepancia":{"titulo":"Discrepancia","breve":"Algo que no coincide entre el código, la documentación y Orchestrator de un proyecto, por ejemplo una cola del SDD que no existe o un trigger con otra frecuencia. La encuentra el análisis del proyecto. Se responde, se pospone o se descarta desde la pestaña Discrepancias del proyecto: no va a la bandeja."},"estado-proyecto":{"titulo":"Estado del proyecto","breve":"Esperando análisis, Analizando, En revisión, Activo, Pausado o Con error. Solo los proyectos activos se controlan en cada corrida."},"evidencia":{"titulo":"Evidencia (redactada)","breve":"Los logs, queue items, jobs y valores de reglas que respaldan una tarjeta, después de quitarles los datos personales. Las referencias de los casos se muestran como un código corto, nunca el dato original."},"excepcion":{"titulo":"Excepción de regla","breve":"Una condición en la que una regla que está bien no aplica, por ejemplo: es lunes antes de las 9. Se agrega desde el editor de reglas y vale desde la próxima corrida."},"incidente":{"titulo":"Incidente o tarjeta","breve":"Un problema detectado, con toda su historia: cuándo se vio por primera y por última vez, cuántas veces ocurrió, su triage, su análisis y la actividad del equipo."},"inventario":{"titulo":"Inventario","breve":"Lo que tiene la carpeta de Orchestrator de un proyecto: procesos con su versión, colas, triggers y assets. De los assets se guarda solo el nombre y el tipo, nunca el valor."},"libreria":{"titulo":"Librería","breve":"La etiqueta con el nombre de una librería indica que el error ocurrió dentro de una actividad de esa librería. El detalle dice qué otros proyectos la usan y si tienen tarjetas abiertas."},"memoria-de-proceso":{"titulo":"Memoria de proceso","breve":"Una d cias en la misma tarjeta. La etiqueta ×7 · última hace 12 min indica cuántas veces pasó y cuándo fue la última."},"regla":{"titulo":"Regla","breve":"Un punto de control escrito en lenguaje natural, por ejemplo: si hay más de 10 errores de login seguidos, escalar. La rutina la traduce a un control y muestra cómo la entendió."},"retencion":{"titulo":"Retención","breve":"Las corridas y los incidentes cerrados se borran después de cierta cantidad de días, que se configura en Ajustes. Antes de borrarlos se guarda un resumen mensual."},"rutina":{"titulo":"Rutina","breve":"El proceso de Claude que corre solo, en general cada hora. Es el único que crea corridas e incidentes, y nunca modifica nada en Orchestrator."},"severidad":{"titulo":"Severidad (P1 a P4)","breve":"P1: un proceso crítico se detuvo o se incumplió el SLA hoy. P2: proceso degradado con riesgo de SLA. P3: errores aislados. P4: informativo."},"similitud":{"titulo":"Propuesta por similitud","breve":"Cuando un Admin aprueba o edita una regla, la rutina propone la regla equivalente a otros procesos que usan el mismo portal, la misma aplicación o la misma librería. Llega como propuesta: la aprueba un Admin, salvo que esté activa la aprobación automática."},"solicitud":{"titulo":"Solicitud","breve":"Un pedido del equipo a la rutina, por ejemplo escanear una carpeta, analizar un proyecto nuevo o volver a analizar una tarjeta. Se atiende en la próxima corrida."},"sugerencia":{"titulo":"Sugerencia de la rutina","breve":"Un cambio en una regla que propone la revisión diaria de los últimos 30 días: una excepción o un umbral si casi siempre se descarta, una severidad más baja si sus temas se posponen, o desactivarla si no dispara hace 60 días. Se ve como Cambio sugerido."},"tema":{"titulo":"Tema","breve":"Lo que identifica a un problema, sin importar cuántas veces ocurra: el mismo error en el mismo lugar. Un tema tiene una sola tarjeta."},"triage":{"titulo":"Triage","breve":"La clasificación de cada hallazgo: categoría, // Convierte el formulario en el documento del proyecto. Devuelve { error } o { data }.
function proyectoDesdeForm(f) {
  if (!f.nombre.trim()) return { error: tx('base.err.sinNombre') };
  if (!f.carpeta.trim()) return { error: tx('base.err.sinCarpeta') };
  // Los procesos son opcionales: si no se cargan, la rutina toma todos los de la carpeta.
  const procs = f.procesos.filter((x) => x.label.trim() || x.repo.trim() || x.op.trim());
  if (f.soloLista && !procs.length) return { error: tx('base.err.soloLista') };
  const usados = new Set(); const processes = [];
  for (const [i, x] of procs.entries()) {
    // El repo es opcional: un proceso sin repo (p. ej. sin versionar en Bitbucket) se controla igual,
    // pero el análisis previo no puede mirar su código.
    const repo = x.repo.trim() ? parseRepo(x.repo) : null;
    if (x.repo.trim() && !repo) return { error: tx('base.err.repo', { n: i + 1 }) };
    if (!repo && !x.label.trim() && !x.op.trim()) return { error: tx('base.err.procSinNombre', { n: i + 1 }) };
    let id = x.id || slug(x.label || x.op || (repo && repo.slug)) || `proceso-${i + 1}`;
    while (usados.has(id)) id = `${id}-${i + 1}`;
    usados.add(id);

      folderPath: x.carpeta.trim() && x.carpeta.trim() !== f.carpeta.trim() ? x.carpeta.trim() : null,
      repo: repo ? { ...repo, branch: x.rama.trim() || 'main' } : null, docs: { paths: listaDocs(x.docs) } });
  }

const visibleByWork = (inc) => {
  const w = S.work[inc.id];

  }

const orden = (a, b) => (SEV_ORD[a.severity] - SEV_ORD[b.severity]) || ((a.decision === 'escalate' ? 0 : 1) - (b.decision === 'escalate' ? 0 : 1)) || String(b.lastSeenAt).localeCompare(String(a.lastSeenAt));

function conteos() {

// Pulso de la rutina: último control y alarma si está detenida.
function pulso() {
  const ult = S.runs[0];
  if (!ult) {
    if (S.error) return { cls: 'critical', t: tx('base.pulso.sinConexion'), d: S.error };
    return { cls: 'unknown', t: S.loaded.runs ? tx('base.pulso.sinCorridas') : tx('base.pulso.conectando'), d: S.loaded.runs ? tx('base.pulso.noCorrio') : '' };
  }
  const cuando = ult.finishedAt || ult.startedAt;
  const intervalo = (S.settings && S.settings.intervalMinutes) || 60;
  const d = tx('base.pulso.ultimo', { t: rel(cuando) });
  if ((Date.now() - Date.parse(cuando)) / 60000 > intervalo * 2.2) return { cls: 'critical', t: tx('base.pulso.detenida'), d, detenida: true };
  if (ult.status !== 'ok') return { cls: 'warn', t: tx('base.pulso.errores'), d };
  return { cls: 'ok', t: tx('base.pulso.alDia'), d };
}

// Pendiente: la rutina la sigue detectando y nadie la respondió, descartó ni pospuso. Vuelve a estar

function discPendiente(d) {
  if (d.status !== 'open') return false;
  const w = S.discWork[d.id]; if (!w) return true;
  const volvio = Boolean(d.reopenedAt && w.updatedAt && d.reopenedAt > w.updatedAt);
  if (w.state === 'dismissed' || w.state === 'responded') return volvio;
  if (w.state === 'snoozed' && w.snoozeUntil && w.snoozeUntil > nowIso()) return volvio;
  return true;
}

  const data = { ...(prev || {}), ...patch, updatedAt: nowIso(), updatedBy: S.me || null };
