<title>Torre de Control Momentum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: riel de navegación fijo a la izquierda (barra inferior en teléfono); una columna de trabajo con
   cabecera de vista y selector de proyecto; el detalle de cada tema se abre en un panel lateral sobre la lista. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#e9edf2; --hover:#f6f8fb; --fg:#121a24; --muted:#566273; --line:#dce2ea; --line-2:#c2cbd6;
  --accent:#2446d8; --accent-fg:#ffffff; --accent-soft:#e7ecfd;
  --rail:#0d1a28; --rail-fg:#e6edf5; --rail-muted:#9aabbd; --rail-line:#22364b; --rail-hover:#15273a; --rail-on:#1d3550;
  --rail-ok:#4cc38a; --rail-warn:#e5b53f; --rail-bad:#ff6b63;
  --p1:#c22525; --p2:#a84c08; --p3:#8a6a00; --p4:#566273; --ok:#1f7a4a;
  --p1-bg:#fdeceb; --p2-bg:#fdf0e3; --p3-bg:#fbf4d9; --p4-bg:#e9edf2; --ok-bg:#e4f4ea;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.12); --scrim:rgba(10,16,24,.48);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Archivo","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --r-s:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1017; --surface:#111923; --surface-2:#1a2431; --hover:#15202c; --fg:#e5ebf2; --muted:#9aa8b8; --line:#222e3c; --line-2:#36465a;
  --accent:#8fa8ff; --accent-fg:#0a1017; --accent-soft:#1a2648;
  --rail:#070c12; --rail-fg:#e1e8f0; --rail-muted:#8b9bad; --rail-line:#1a2532; --rail-hover:#101924; --rail-on:#18263a;
  --rail-ok:#4cc38a; --rail-warn:#e5b53f; --rail-bad:#ff6b63;
  --p1:#ff8279; --p2:#ffa657; --p3:#e3b341; --p4:#9aa8b8; --ok:#5bd08a;
  --p1-bg:#3b1a1c; --p2-bg:#3a2613; --p3-bg:#33290f; --p4-bg:#1a2431; --ok-bg:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1017; --surface:#111923; --surface-2:#1a2431; --hover:#15202c; --fg:#e5ebf2; --muted:#9aa8b8; --line:#222e3c; --line-2:#36465a;
  --accent:#8fa8ff; --accent-fg:#0a1017; --accent-soft:#1a2648;
  --rail:#070c12; --rail-fg:#e1e8f0; --rail-muted:#8b9bad; --rail-line:#1a2532; --rail-hover:#101924; --rail-on:#18263a;
  --rail-ok:#4cc38a; --rail-warn:#e5b53f; --rail-bad:#ff6b63;
  --p1:#ff8279; --p2:#ffa657; --p3:#e3b341; --p4:#9aa8b8; --ok:#5bd08a;
  --p1-bg:#3b1a1c; --p2-bg:#3a2613; --p3-bg:#33290f; --p4-bg:#1a2431; --ok-bg:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.62); color-scheme:dark}

*{box-sizing:border-box}
html.lock{overflow:hidden}
html.lock .app{padding-right:var(--sbw,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg{flex:none}
.i{width:16px;height:16px}
.skip{position:fixed;left:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:50;transform:translateY(-200%);background:var(--accent);color:var(--accent-fg);border:0;border-radius:var(--r-s);padding:8px 12px;font-weight:600}
.skip:focus-visible{transform:none;outline-color:var(--fg)}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr)}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:22px;padding:20px 12px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.rail :focus-visible,.mtop :focus-visible{outline-color:var(--rail-fg)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--rail-fg);padding:2px 8px;font-family:var(--display);font-stretch:112%;font-weight:650;font-size:15px;line-height:1.2;letter-spacing:.005em}
.brand svg{width:26px;height:26px;color:var(--rail-ok)}
.brand small{display:block;font-family:var(--sans);font-stretch:100%;font-weight:400;font-size:11.5px;color:var(--rail-muted);letter-spacing:0}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:38px;padding:7px 10px;border-radius:var(--r-s);color:var(--rail-muted);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--rail-hover);color:var(--rail-fg)}
.nav a[aria-current="page"]{background:var(--rail-on);color:var(--rail-fg)}
.nav .i{width:18px;height:18px}
.nav .sep{height:1px;background:var(--rail-line);margin:8px 6px}
.badge{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:500;line-height:1;padding:4px 7px;border-radius:999px;background:var(--rail-line);color:var(--rail-fg);font-variant-numeric:tabular-nums}
.badge.hot{background:var(--rail-fg);color:var(--rail)}
.rail-foot{margin-top:auto;display:grid;gap:10px;border-top:1px solid var(--rail-line);padding:14px 8px 0}
.pulse{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.35}
.pulse b{display:block;font-weight:600;color:var(--rail-fg)}
.pulse span.d{color:var(--rail-muted)}
.pulse .dot{margin-top:4px}
.quien{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--rail-muted);min-width:0}
.quien b{display:block;color:var(--rail-fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quien .av{width:26px;height:26px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--p4);flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--p3)} .dot.critical{background:var(--p1)}
.dot.off{background:none;box-shadow:inset 0 0 0 2px var(--p4)}
.rail .dot.ok,.mtop .dot.ok{background:var(--rail-ok)} .rail .dot.warn,.mtop .dot.warn{background:var(--rail-warn)} .rail .dot.critical,.mtop .dot.critical{background:var(--rail-bad)} .rail .dot.unknown,.mtop .dot.unknown{background:var(--rail-muted)}
.content{min-width:0}
.vw{max-width:1040px;margin:0 auto;padding-block:30px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.vw:focus{outline:none}
.mtop,.tabbar{display:none}

/* ---------- Cabecera de vista ---------- */
.vh{display:grid;gap:10px;margin-bottom:22px}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;width:max-content;min-height:28px}
.crumb:hover{color:var(--fg)}
.vh-row{display:flex;gap:14px 20px;align-items:flex-start;flex-wrap:wrap}
.vh-t{flex:1;min-width:min(100%,260px);display:grid;gap:4px}
h1{font-family:var(--display);font-stretch:112%;font-size:27px;line-height:1.15;font-weight:650;letter-spacing:-.012em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h1:focus{outline:none}
.vh-t p{max-width:68ch}
.vh-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Selector de proyecto ---------- */
.scope{position:relative;display:flex;gap:6px;align-items:center;min-width:0}
.scope-btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;max-width:100%;padding:6px 10px 6px 12px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;min-width:0}
.scope-btn:hover{border-color:var(--muted)}
.scope-btn .k{color:var(--muted);font-size:12.5px}
.scope-btn .v{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.scope.on .scope-btn{border-color:var(--accent);background:var(--accent-soft)}
.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:8;width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pop-q{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
.pop-q:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.pop-q input[type=text]{border:0;background:none;padding:0;min-height:24px;outline:none;width:100%;color:var(--fg);border-radius:0}
.pop ul{list-style:none;margin:0;padding:6px;max-height:min(340px,50vh);overflow:auto}
.pop li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;min-height:40px}
.pop li.act{background:var(--surface-2)}
.pop li .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop li .fp{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop li[aria-selected="true"] .nm{font-weight:600;color:var(--accent)}
.pop li .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pop .none{padding:16px;text-align:center}

/* ---------- Controles ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:6px 12px;min-height:34px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted);background:var(--hover)}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.ghost.on{background:var(--accent-soft);color:var(--accent)}
.btn.sm{min-height:30px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-s);border:1px solid transparent;background:none;color:var(--muted);text-decoration:none;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:7px 10px;font-size:14px;width:100%;min-height:36px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
textarea{min-height:76px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
.w-auto{width:auto!important}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;min-height:32px;font-size:13px;font-weight:500;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.seg button:hover{border-color:var(--muted);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg .n{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.85}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search{position:relative;margin-left:auto;flex:0 1 250px;min-width:170px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:33px}

/* ---------- Secciones y listas ---------- */
.sec{display:grid;gap:9px;margin-bottom:26px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2{font-family:var(--display);font-stretch:108%;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:0;color:var(--muted)}
.cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-h .hint{font-size:12.5px;color:var(--muted);margin-left:auto}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.list>*+*{border-top:1px solid var(--line)}
.list>:first-child{border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}
.list>:last-child{border-radius:0 0 calc(var(--r) - 1px) calc(var(--r) - 1px)}
.list>:only-child{border-radius:calc(var(--r) - 1px)}

/* Tema (tarjeta de incidente) */
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 16px;cursor:pointer;min-width:0}
.card:hover{background:var(--hover)}
.card.sel{background:var(--accent-soft)}
.pill{display:inline-grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.02em;border-radius:7px;min-width:34px;height:26px;padding:0 6px;background:var(--p4-bg);color:var(--p4);border:1px solid transparent;flex:none}
.pill.P1{background:var(--p1);color:var(--surface)} .pill.P2{background:var(--p2-bg);color:var(--p2);border-color:var(--p2)} .pill.P3{background:var(--p3-bg);color:var(--p3)}
.c-main{min-width:0;display:grid;gap:6px}
.c-title{margin:0;font-family:var(--sans);font-size:14.5px;font-weight:600;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere;letter-spacing:0;text-transform:none;color:var(--fg)}
.c-title a{color:inherit;text-decoration:none}
.c-title a:hover{text-decoration:underline}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.c-meta .cat{display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
.c-meta .cat .i{width:14px;height:14px;color:var(--muted)}
.tag{font-size:12px;border:1px solid var(--line-2);border-radius:6px;padding:0 6px;line-height:1.6;color:var(--fg);overflow-wrap:anywhere}
.tag.rec{border-color:transparent;background:var(--surface-2);font-family:var(--mono);font-size:11.5px}
.tag.reo{border-color:var(--p2);color:var(--p2)}
.tag.dec{border-color:transparent;background:var(--surface-2);color:var(--muted)}
.why{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:78ch}
.actions{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.card .actions{margin-left:-8px}
.actions .sp{flex:1}
.go{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);min-height:30px;padding:0 4px}
.go:hover{color:var(--accent)}
.panel{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:12px;display:grid;gap:10px;cursor:default}
.panel-t{font-weight:600;font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;min-height:32px;font-size:13px}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.people{display:grid;gap:2px}
.person{display:flex;gap:9px;align-items:center;border:1px solid transparent;border-radius:var(--r-s);padding:6px 8px;min-height:36px;background:none;text-align:left}
.person:hover{background:var(--surface-2)}
.av{width:22px;height:22px;border-radius:50%;flex:none;background:var(--surface-2)}
.who{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.who .av{width:18px;height:18px}

/* Filas enlazables */
.rowi{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:var(--fg);min-width:0}
a.rowi:hover{background:var(--hover)}
a.rowi:focus-visible{outline-offset:-2px}
.rowi .t{min-width:0;overflow-wrap:anywhere;display:grid;gap:1px}
.rowi .t b{font-weight:600}
.rowi .chev{color:var(--muted)}
.rowi.two{grid-template-columns:minmax(0,1fr) auto}
.rowi .end{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nums{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.warn{background:var(--p3-bg);color:var(--p3)} .st.bad{background:var(--p1-bg);color:var(--p1)} .st.info{background:var(--accent-soft);color:var(--accent)}
.ico-b{width:30px;height:30px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.ico-b.info{background:var(--accent-soft);color:var(--accent)} .ico-b.bad{background:var(--p1-bg);color:var(--p1)}

/* Cajas, avisos y estados vacíos */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.banner{border-radius:var(--r);padding:11px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;border:1px solid var(--line);background:var(--surface)}
.banner .i{margin-top:2px}
.banner.bad{background:var(--p1-bg);color:var(--p1);border-color:transparent} .banner.bad a{color:inherit;font-weight:600}
.banner.info{background:var(--surface-2);border-color:transparent}
.banner.note{background:var(--accent-soft);border-color:transparent}
.banner .grow{flex:1;min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:44px 20px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty svg{width:40px;height:40px;color:var(--ok)}
.empty b{font-family:var(--display);font-stretch:110%;font-size:18px;font-weight:650}
.empty.plain svg{color:var(--muted)}
.skel{display:grid;gap:10px}
.skel i{display:block;height:72px;border-radius:var(--r);background:var(--surface-2)}

/* Proyecto */
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;font-size:13px}
.role-b{font-family:var(--mono);font-size:11px;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:22px 0 16px}
.tabs button{border:0;background:none;padding:9px 12px;min-height:38px;color:var(--muted);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.md{min-width:0;overflow-wrap:anywhere;max-width:76ch}
.md h2,.md h3,.md h4{font-family:var(--sans);font-stretch:100%;font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg);margin:16px 0 4px} .md>:first-child{margin-top:0}
.md p{margin:6px 0} .md ul{margin:6px 0;padding-left:20px}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

<template id="ayuda-tpl"><nav class="ay-toc box" aria-label="Contenido de la ayuda"><div class="ay-toc-g"><a href="#ayuda-introduccion"><b>Qué es la Torre de Control</b></a><ul><li><a href="#ayuda-como-funciona">Cómo funciona</a></li><li><a href="#ayuda-solo-lectura">Lo que la Torre de Control nunca hace</a></li><li><a href="#ayuda-roles">Roles</a></li></ul></div><div class="ay-toc-g"><a href="#ayuda-glosario"><b>Glosario</b></a></div><div class="ay-toc-g"><a href="#ayuda-pantallas"><b>Pantallas y acciones</b></a><ul><li><a href="#ayuda-navegacion">Menú y selector de proyecto</a></li><li><a href="#ayuda-bandeja">Bandeja</a></li><li><a href="#ayuda-tarjeta">El tema y su detalle</a></li><li><a href="#ayuda-acciones">Acciones sobre un tema</a></li><li><a href="#ayuda-no-reportados">Fuera de bandeja</a></li><li><a href="#ayuda-corridas">Corridas</a></li><li><a href="#ayuda-proyectos">Proyectos</a></li><li><a href="#ayuda-pagina-proyecto">Página de un proyecto</a></li><li><a href="#ayuda-reglas">Reglas</a></li><li><a href="#ayuda-registrar">Registrar proyecto</a></li><li><a href="#ayuda-ajustes">Ajustes</a></li><li><a href="#ayuda-mas">Más (teléfono)</a></li></ul></div></nav>
<section class="ay-sec n1" id="ayuda-introduccion" data-nivel="1"><h2>Qué es la Torre de Control</h2><p>La Torre de Control vigila los robots de UiPath que Grupo Momentum tiene en producción. Cada hora una <strong>rutina</strong> de Claude revisa Orchestrator, detecta lo que anda mal, decide qué tan grave es y lo deja en este tablero, explicado y ordenado.</p><p>El tablero es donde el equipo trabaja: ve lo que requiere atención, lo responde, lo delega o lo descarta. Con cada respuesta la rutina aprende: la próxima vez sabe qué es normal en cada proyecto y qué no.</p></section>
<section class="ay-sec n2" id="ayuda-como-funciona" data-nivel="2"><h3>Cómo funciona</h3><ol>
<li><strong>Controla.</strong> La rutina lee los jobs, los logs, las colas y los triggers de cada proyecto activo, y evalúa sus <a href="#ayuda-regla">reglas</a>.</li>
<li><strong>Agrupa.</strong> Cada problema distinto es un <a href="#ayuda-tema">tema</a> y tiene una sola tarjeta. Si se repite, la tarjeta suma ocurrencias en lugar de duplicarse.</li>
<li><strong>Clasifica.</strong> El <a href="#ayuda-triage">triage</a> asigna categoría, <a href="#ayuda-severidad">severidad</a> y una <a href="#ayuda-decision">decisión</a>: escalar, avisar, observar o dar por conocido. Siempre dice por qué.</li>
<li><strong>Analiza.</strong> Antes de escalar, cruza el error con el código del paquete desplegado y su documentación. El resultado es el <a href="#ayuda-analisis-previo">análisis previo</a>.</li>
<li><strong>Publica.</strong> Lo que necesita a una persona aparece en la <a href="#ayuda-bandeja">Bandeja</a>. El resto queda en <a href="#ayuda-no-reportados">No reportados</a>.</li>
<li><strong>Aprende.</strong> Las respuestas del equipo se guardan en la <a href="#ayuda-memoria-de-produccion">memoria de producción</a> y pueden convertirse en reglas propuestas.</li>
</ol></section>
<section class="ay-sec n2" id="ayuda-solo-lectura" data-nivel="2"><h3>Lo que la Torre de Control nunca hace</h3><ul>
<li><strong>No cambia nada en Orchestrator.</strong> No inicia, detiene ni reintenta jobs, y no toca colas, assets ni procesos.</li>
<li><strong>No cambia código.</strong> Si un problema requiere un fix, lo sugiere con la evidencia. Lo hace una persona.</li>
<li><strong>No muestra datos personales.</strong> Todo lo que viene de Orchestrator pasa por una redacción de PII antes de llegar al tablero. Los valores de assets y el contenido de los queue items nunca se leen.</li>
</ul></section>
<section class="ay-sec n2" id="ayuda-roles" data-nivel="2"><h3>Roles</h3><p class="ay-breve">Tu rol define qué podés hacer: Lector mira, Operador trabaja las tarjetas y Admin además configura proyectos, reglas y ajustes.</p><p>Tu rol se ve abajo del menú, como <strong>Acceso de Operador</strong> (en el teléfono, dentro de <strong>Más</strong>). Se asigna desde el menú <strong>Compartir</strong> del tablero.</p><table><thead><tr><th>Rol</th><th>Acceso en Compartir</th><th>Puede</th></tr></thead><tbody><tr><td>Lector</td><td>Viewer</td><td>Ver todo, incluida esta ayuda.</td></tr><tr><td>Operador</td><td>Contributor</td><td>Delegar, posponer, descartar, responder y comentar tarjetas, y pedir un nuevo análisis.</td></tr><tr><td>Admin</td><td>Editor</td><td>Además: registrar y configurar proyectos, activar o pausar el control, aprobar, ajustar y eliminar reglas y editar los ajustes.</td></tr></tbody></table></section>
<section class="ay-sec n1" id="ayuda-glosario" data-nivel="1"><h2>Glosario</h2><p>Los términos que aparecen en el tablero, en orden alfabético.</p><div class="ay-glos"><div class="ay-term" id="ayuda-alta"><b class="ay-term-n">Alta</b><div class="ay-term-d">El primer análisis de un proyecto recién registrado. La rutina descubre sus procesos, colas, triggers y librerías, calcula el baseline y genera la memoria de proceso y las reglas propuestas. Después un Admin lo revisa y lo activa.</div></div><div class="ay-term" id="ayuda-analisis-previo"><b class="ay-term-n">Análisis previo</b><div class="ay-term-d">Lo que la rutina investiga antes de escalar una tarjeta: hipótesis con su probabilidad, acciones sugeridas, el código y la documentación relacionados, y qué cambió en el último deploy. Se lee en el detalle de la tarjeta.</div></div><div class="ay-term" id="ayuda-baseline"><b class="ay-term-n">Baseline</b><div class="ay-term-d">El comportamiento normal de un proyecto en los últimos 30 días: cuántos jobs corre, cuánto tardan y cuántos errores tiene. Sirve para distinguir un problema nuevo de lo habitual.</div></div><div class="ay-term" id="ayuda-categoria"><b class="ay-term-n">Categoría</b><div class="ay-term-d">El tipo de problema, con su ícono: login o credenciales, selector o UI, aplicación caída, infraestructura, configuración, programación, negocio, sistema, falla silenciosa, regresión, deploy o monitoreo.</div></div><div class="ay-term" id="ayuda-corrida"><b class="ay-term-n">Corrida</b><div class="ay-term-d">Una ejecución de la rutina. Registra qué ventana de tiempo revisó en cada proyecto, cada punto de control con su valor observado y los hallazgos con su triage.</div></div><div class="ay-term" id="ayuda-criterios"><b class="ay-term-n">Criterios de triage</b><div class="ay-term-d">Instrucciones en lenguaje natural que guían la clasificación. Hay criterios globales, en Ajustes, y criterios propios de cada proyecto, en su Configuración.</div></div><div class="ay-term" id="ayuda-decision"><b class="ay-term-n">Decisión</b><div class="ay-term-d">Qué hace el triage con un hallazgo. Escalado: necesita a una persona y va a Requiere acción. Aviso: conviene verlo, pero no bloquea. En observación: se sigue la tendencia sin mostrarlo. Conocido: la memoria o una regla dicen que es esperado.</div></div><div class="ay-term" id="ayuda-estado-proyecto"><b class="ay-term-n">Estado del proyecto</b><div class="ay-term-d">Esperando análisis, Analizando, En revisión, Activo, Pausado o Con error. Solo los proyectos activos se controlan en cada corrida.</div></div><div class="ay-term" id="ayuda-evidencia"><b class="ay-term-n">Evidencia (redactada)</b><div class="ay-term-d">Los logs, queue items, jobs y valores de reglas que respaldan una tarjeta, después de quitarles los datos personales. Las referencias de los casos se muestran como un código corto, nunca el dato original.</div></div><div class="ay-term" id="ayuda-excepcion"><b class="ay-term-n">Excepción de regla</b><div class="ay-term-d">Una condición en la que una regla que está bien no aplica, por ejemplo: es lunes antes de las 9. Se agrega desde el editor de reglas y vale desde la próxima corrida.</div></div><div class="ay-term" id="ayuda-incidente"><b class="ay-term-n">Incidente o tarjeta</b><div class="ay-term-d">Un problema detectado, con toda su historia: cuándo se vio por primera y por última vez, cuántas veces ocurrió, su triage, su análisis y la actividad del equipo.</div></div><div class="ay-term" id="ayuda-inventario"><b class="ay-term-n">Inventario</b><div class="ay-term-d">Lo que tiene la carpeta de Orchestrator de un proyecto: procesos con su versión, colas, triggers y assets. De los assets se guarda solo el nombre y el tipo, nunca el valor.</div></div><div class="ay-term" id="ayuda-libreria"><b class="ay-term-n">Librería</b><div class="ay-term-d">La etiqueta con el nombre de una librería indica que el error ocurrió dentro de una actividad de esa librería. El detalle dice qué otros proyectos la usan y si tienen tarjetas abiertas.</div></div><div class="ay-term" id="ayuda-memoria-de-proceso"><b class="ay-term-n">Memoria de proceso</b><div class="ay-term-d">Una descripción del proceso, similar a un PDD resumido, que la rutina genera en el alta a partir del código y la documentación. Sirve de contexto para el triage y el análisis.</div></div><div class="ay-term" id="ayuda-memoria-de-produccion"><b class="ay-term-n">Memoria de producción</b><div class="ay-term-d">El historial permanente de un proyecto: respuestas del equipo, deploys, re-controles y reglas nuevas, más un resumen que se actualiza solo. Es lo que hace que la rutina aprenda.</div></div><div class="ay-term" id="ayuda-nueva-version"><b class="ay-term-n">Nueva versión</b><div class="ay-term-d">Se desplegó una versión nueva del proceso después de que se abrió la tarjeta. La rutina la vuelve a analizar y explica qué cambió.</div></div><div class="ay-term" id="ayuda-proyecto"><b class="ay-term-n">Proyecto</b><div class="ay-term-d">Una carpeta de Orchestrator con sus procesos, por ejemplo Dispatcher, Performer y Reporter. Es la unidad que se registra, se analiza y se controla.</div></div><div class="ay-term" id="ayuda-pulso"><b class="ay-term-n">Pulso de la rutina</b><div class="ay-term-d">Abajo del menú (en el teléfono, arriba): cuándo fue el último control. Verde si salió bien, ámbar si tuvo errores de colecta, y rojo si la rutina dejó de correr; en ese caso la bandeja también lo avisa.</div></div><div class="ay-term" id="ayuda-punto-de-control"><b class="ay-term-n">Punto de control</b><div class="ay-term-d">Cada cosa que se revisa en una corrida, por ejemplo jobs fallidos, items abandonados o una regla. Su resultado es alerta, ok u omitido.</div></div><div class="ay-term" id="ayuda-re-control"><b class="ay-term-n">Re-control</b><div class="ay-term-d">Respuesta Volver a controlar con una fecha. La tarjeta se oculta hasta ese día y entonces la rutina verifica si el problema sigue. Queda en la memoria de producción como Re-control agendado y Re-control OK.</div></div><div class="ay-term" id="ayuda-reaparecio"><b class="ay-term-n">Reapareció</b><div class="ay-term-d">Un tema que se había cerrado volvió dentro de los 30 días. Se reabre la misma tarjeta en lugar de crear una nueva, para no perder su historia.</div></div><div class="ay-term" id="ayuda-recurrencia"><b class="ay-term-n">Recurrencia</b><div class="ay-term-d">Cuando un tema se repite, suma ocurrencias en la misma tarjeta. La etiqueta ×7 · última hace 12 min indica cuántas veces pasó y cuándo fue la última.</div></div><div class="ay-term" id="ayuda-regla"><b class="ay-term-n">Regla</b><div class="ay-term-d">Un punto de control escrito en lenguaje natural, por ejemplo: si hay más de 10 errores de login seguidos, escalar. La rutina la traduce a un control y muestra cómo la entendió.</div></div><div class="ay-term" id="ayuda-retencion"><b class="ay-term-n">Retención</b><div class="ay-term-d">Las corridas y los incidentes cerrados se borran después de cierta cantidad de días, que se configura en Ajustes. Antes de borrarlos se guarda un resumen mensual.</div></div><div class="ay-term" id="ayuda-rutina"><b class="ay-term-n">Rutina</b><div class="ay-term-d">El proceso de Claude que corre solo, en general cada hora. Es el único que crea corridas e incidentes, y nunca modifica nada en Orchestrator.</div></div><div class="ay-term" id="ayuda-severidad"><b class="ay-term-n">Severidad (P1 a P4)</b><div class="ay-term-d">P1: un proceso crítico se detuvo o se incumplió el SLA hoy. P2: proceso degradado con riesgo de SLA. P3: errores aislados. P4: informativo.</div></div><div class="ay-term" id="ayuda-similitud"><b class="ay-term-n">Propuesta por similitud</b><div class="ay-term-d">Cuando un Admin aprueba o edita una regla, la rutina propone la regla equivalente a otros procesos que usan el mismo portal, la misma aplicación o la misma librería. Llega como propuesta: nunca se activa sola.</div></div><div class="ay-term" id="ayuda-solicitud"><b class="ay-term-n">Solicitud</b><div class="ay-term-d">Un pedido del equipo a la rutina, por ejemplo analizar un proyecto nuevo o volver a analizar una tarjeta. Se atiende en la próxima corrida.</div></div><div class="ay-term" id="ayuda-sugerencia"><b class="ay-term-n">Sugerencia de la rutina</b><div class="ay-term-d">Un cambio en una regla que propone la revisión diaria de los últimos 30 días: una excepción o un umbral si casi siempre se descarta, una severidad más baja si sus temas se posponen, o desactivarla si no dispara hace 60 días. Se ve como Cambio sugerido.</div></div><div class="ay-term" id="ayuda-tema"><b class="ay-term-n">Tema</b><div class="ay-term-d">Lo que identifica a un problema, sin importar cuántas veces ocurra: el mismo error en el mismo lugar. Un tema tiene una sola tarjeta.</div></div><div class="ay-term" id="ayuda-triage"><b class="ay-term-n">Triage</b><div class="ay-term-d">La clasificación de cada hallazgo: categoría, severidad y decisión, con su porqué, su nivel de confianza y las reglas o memorias en las que se basó.</div></div></div></section>
<section class="ay-sec n1" id="ayuda-pantallas" data-nivel="1"><h2>Pantallas y acciones</h2><p>Cada pantalla tiene un botón <strong>?</strong> al lado del título que trae a su sección de esta ayuda. El link <strong>Ayuda</strong> del menú también abre la parte de la pantalla en la que estás. Al pasar el mouse por un botón o una etiqueta aparece una explicación breve, con un link a más detalle. Las vistas de esta página son las de la app, dibujadas con datos de ejemplo.</p></section>
<section class="ay-sec n2" id="ayuda-navegacion" data-nivel="2"><h3>Menú y selector de proyecto</h3><p>El menú está siempre a la vista: a la izquierda en una computadora y abajo en el teléfono. Lleva a la Bandeja, Proyectos, Corridas, Reglas, Fuera de bandeja, Ajustes (Admin) y esta Ayuda. El número de la Bandeja es la cantidad de temas abiertos; el de Reglas, las propuestas que esperan aprobación.</p><p>Abajo del menú está el <a href="#ayuda-pulso">pulso de la rutina</a> y tu <a href="#ayuda-roles">rol</a>. En el teléfono el pulso y el <strong>?</strong> están en la barra de arriba, y Fuera de bandeja, Ajustes y Ayuda están dentro de <a href="#ayuda-mas">Más</a>.</p><div class="ay-accion" id="ayuda-scope"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Proyecto</span></div><p><b>Filtra la Bandeja, Corridas, Reglas y Fuera de bandeja por un proyecto. La × quita el filtro.</b></p><p>Tocalo y escribí parte del nombre o de la carpeta. Elegí el proyecto con un clic, o con las flechas y Enter. Cada proyecto muestra un punto de color con su salud (verde: sin novedades; ámbar: con avisos; rojo: con problemas P1 o P2; gris: pausado o sin datos) y cuántos temas tiene abiertos. Primero aparecen los que tienen temas abiertos.</p><p>El filtro queda aplicado en todas esas pantallas, y se recuerda en este navegador, hasta que lo quites con la <strong>×</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:selector:abierto--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div></section>
<section class="ay-sec n2" id="ayuda-bandeja" data-nivel="2"><h3>Bandeja</h3><p class="ay-breve">La pantalla principal: lo que necesita a una persona, ordenado por severidad.</p><p>Es la pantalla de trabajo. Muestra solo los temas abiertos cuya decisión es escalar o avisar, y que nadie respondió, descartó o pospuso. Están ordenados por severidad, primero los escalados y después los más recientes. Si no hay nada pendiente, dice <strong>Todo en orden</strong>.</p><ul>
<li>Los botones <strong>Todo</strong>, <strong>Para vos</strong>, <strong>Requiere acción</strong> y <strong>Avisos</strong> muestran solo esa parte.</li>
<li>El buscador filtra por título, proyecto, categoría, proceso o severidad.</li>
<li>Si la rutina está detenida o la última corrida tuvo errores de colecta, arriba aparece un aviso rojo.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:bandeja:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-para-revisar" data-nivel="3"><h4>Para revisar</h4><p class="ay-breve">Solo Admin: reglas propuestas, cambios sugeridos en reglas y proyectos que terminaron su análisis.</p><p>Solo la ven los Admin, en la vista <strong>Todo</strong>. Junta las tareas de configuración pendientes: <a href="#ayuda-propuestas">reglas propuestas</a>, reglas con un cambio sugerido, proyectos <strong>En revisión</strong> que esperan ser activados y proyectos <strong>Con error</strong>. Cada fila lleva a donde se resuelve.</p></section>
<section class="ay-sec n3" id="ayuda-para-vos" data-nivel="3"><h4>Para vos</h4><p class="ay-breve">Temas que alguien te delegó.</p><p>Los temas que alguien te <a href="#ayuda-delegar">delegó</a>. Salen de esta lista cuando los respondés, descartás o posponés.</p></section>
<section class="ay-sec n3" id="ayuda-requiere-accion" data-nivel="3"><h4>Requiere acción</h4><p class="ay-breve">Temas escalados: el triage decidió que necesitan a una persona.</p><p>Los temas con decisión <strong>Escalado</strong>. En general son P1 o P2, o algo que la rutina nunca había visto. Cada uno trae su análisis previo en el detalle.</p></section>
<section class="ay-sec n3" id="ayuda-avisos" data-nivel="3"><h4>Avisos</h4><p class="ay-breve">Cosas para saber que no bloquean, en formato compacto.</p><p>Los temas con decisión <strong>Aviso</strong>, en general P3 o P4 nuevos. Se muestran compactos: sin el porqué y sin Delegar. El detalle tiene todo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:aviso--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-tarjeta" data-nivel="2"><h3>El tema y su detalle</h3><p class="ay-breve">Un problema por tema, con su severidad, su porqué y las acciones para trabajarlo.</p><p>Cada tarjeta es un <a href="#ayuda-tema">tema</a>. Si el problema vuelve a ocurrir no se crea otra: la misma suma ocurrencias.</p><ul>
<li><strong>A la izquierda:</strong> la <a href="#ayuda-severidad">severidad</a>.</li>
<li><strong>Etiquetas:</strong> la <a href="#ayuda-categoria">categoría</a>; el proyecto, cuando no hay filtro, y el proceso si el proyecto tiene varios; la <a href="#ayuda-recurrencia">recurrencia</a>; <a href="#ayuda-reaparecio">Reapareció</a>; la <a href="#ayuda-libreria">librería</a> donde ocurrió el error; <a href="#ayuda-nueva-version">Nueva versión</a>; <strong>Aviso</strong>, y a quién está delegado.</li>
<li><strong>Texto gris:</strong> el porqué del triage, en dos líneas.</li>
<li><strong>Acciones:</strong> abajo. Un Lector no las ve.</li>
</ul><p>Un clic en la tarjeta, o en <strong>Ver detalle</strong>, abre el detalle en un panel al costado, sin perder el lugar en la lista. Se cierra con la <strong>×</strong>, con Esc o tocando fuera.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-detalle" data-nivel="3"><h4>El detalle de un tema</h4><p class="ay-breve">Por qué está acá, el análisis previo, la evidencia y la actividad del tema.</p><p>El detalle muestra, en este orden:</p><ol>
<li><strong>Estado:</strong> si el tema está delegado, pospuesto, descartado o respondido, y por quién. Si salió de la bandeja, ofrece <a href="#ayuda-reabrir">Devolver a la bandeja</a>.</li>
<li><strong>Acciones:</strong> las mismas de la tarjeta.</li>
<li><strong>Por qué está acá:</strong> el porqué del triage, la decisión y su confianza, las reglas y memorias en las que se basó, desde cuándo se ve y en cuántas corridas.</li>
<li><strong>Análisis previo:</strong> resumen, hipótesis con su probabilidad, acciones sugeridas, código y documentación relacionados, y qué cambió en el último deploy. Si dice Pendiente, lo completa la próxima corrida.</li>
<li><strong>Librería:</strong> si el error ocurrió en una librería, su versión, la actividad y qué otros proyectos la usan.</li>
<li><strong>Evidencia (redactada):</strong> los últimos logs, queue items y jobs, sin datos personales.</li>
<li><strong>Actividad:</strong> quién hizo qué con el tema, y un cuadro para <a href="#ayuda-comentar">comentar</a>.</li>
</ol><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:detalle--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-acciones" data-nivel="2"><h3>Acciones sobre un tema</h3><p>Las usan los Operadores y los Admin. Cada acción queda en la actividad del tema. Las respuestas y los descartes además le enseñan a la rutina, que los procesa en la próxima corrida. Después de posponer, descartar o responder aparece un aviso con <strong>Deshacer</strong>.</p><div class="ay-accion" id="ayuda-responder"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Responder</span></div><p><b>Registra qué se encontró o qué se va a hacer. Queda en la memoria de producción.</b></p><p>Elegí una decisión y agregá notas:</p><ul>
<li><strong>Requiere fix:</strong> hay que corregir el robot. Podés cargar el ticket o la referencia del fix.</li>
<li><strong>Comportamiento esperado</strong>, <strong>Problema de datos</strong>, <strong>Sistema externo</strong> o <strong>Falso positivo / ajustar regla:</strong> la causa es otra; la rutina lo aprende.</li>
<li><strong>Volver a controlar:</strong> elegí una fecha. El tema se oculta hasta ese día y la rutina hace un <a href="#ayuda-re-control">re-control</a>.</li>
<li><strong>Derivar a desarrollo:</strong> lo toma el equipo de desarrollo.</li>
</ul><p>El tema sale de la bandeja y la respuesta queda en la memoria de producción del proyecto.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:responder--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-posponer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Posponer</span></div><p><b>Oculta el tema hasta una fecha. Vuelve antes si el problema empeora.</b></p><p>Elegí 1 día, 3 días, 1 semana o una fecha. Mientras tanto el tema pasa a <a href="#ayuda-no-reportados">Fuera de bandeja</a> como <strong>Pospuesto</strong>.</p><ul>
<li>Si la severidad sube antes de la fecha, el tema vuelve a la bandeja solo.</li>
<li>Al vencer, vuelve a mostrarse si el problema sigue.</li>
<li>Posponer no le enseña nada a la rutina. Si el problema es esperado, conviene <strong>Descartar</strong> o <strong>Responder</strong>.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:posponer--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar</span></div><p><b>Saca el tema de la bandeja con un motivo. La rutina lo aprende y puede proponer una regla.</b></p><p>Elegí un motivo y, si querés, agregá una nota que explique por qué:</p><ul>
<li><strong>Es esperado:</strong> pasa siempre y no es un problema, por ejemplo una ventana de mantenimiento.</li>
<li><strong>Falso positivo:</strong> la detección se equivocó.</li>
<li><strong>Dato de negocio:</strong> es una excepción de negocio esperable, no una falla del robot.</li>
<li><strong>Sistema externo:</strong> el problema está en un sistema que no depende del equipo.</li>
</ul><p>La rutina anota el motivo en la <a href="#ayuda-memoria-de-produccion">memoria de producción</a> y puede proponer una <a href="#ayuda-regla">regla</a> para no volver a avisar. Si el tema se repite, suma ocurrencias en la misma tarjeta, pero no vuelve a la bandeja como nuevo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:descartar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-delegar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Delegar</span></div><p><b>Asigna la revisión a una persona: el tema le aparece en Para vos.</b></p><p>Buscá a la persona por nombre y elegila. La tarjeta muestra a quién está delegado y sigue en la bandeja de todos, pero esa persona lo ve en <strong>Para vos</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:delegar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-ajustar-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ajustar regla o Crear regla</span></div><p><b>Abre el editor de la regla de este tema sin salir de la bandeja. Un Operador la ve pero no la cambia.</b></p><p>Si el tema salió de una regla, o una regla lo marcó como conocido, el botón dice <strong>Ajustar regla</strong> (o <strong>Ver regla</strong> para un Operador) y abre el <a href="#ayuda-editor-regla">editor de reglas</a> ahí mismo.</p><p>Si no salió de ninguna regla, un Admin ve <strong>Crear regla</strong>: escribís una para ese caso, por ejemplo &quot;los abandonados de esta cola los lunes antes de las 9 son normales; no avisar&quot;, y vale para ese proyecto desde la próxima corrida. Con <strong>Descartar también este tema</strong> el incidente se cierra en el mismo paso.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:regla--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></div><div class="ay-accion" id="ayuda-re-crear"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Crear regla (desde un tema)</span><span class="role-b">Solo Admin</span></div><p><b>Crea una regla nueva para el proyecto de este tema. Se compila en la próxima corrida.</b></p><p>La regla queda <strong>Por compilar</strong> hasta que la rutina la traduce. Si marcaste <strong>Descartar también este tema</strong>, el tema sale de la bandeja como falso positivo, con <strong>Deshacer</strong> en el aviso.</p></div><div class="ay-accion" id="ayuda-comentar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Comentar</span></div><p><b>Deja una nota para el equipo en la actividad del tema. No cambia su estado.</b></p><p>El cuadro está en la sección <strong>Actividad</strong> del detalle. El comentario no saca el tema de la bandeja ni le enseña nada a la rutina. Con Ctrl o Cmd + Enter se envía sin usar el mouse.</p></div><div class="ay-accion" id="ayuda-reanalizar-inc"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Volver a analizar</span></div><p><b>Pide a la próxima corrida un análisis previo nuevo de este tema.</b></p><p>Está junto al título <strong>Análisis previo</strong> del detalle (si el tema no tiene análisis, dice <strong>Pedir análisis</strong>). Sirve cuando el análisis quedó viejo, por ejemplo después de un cambio en el sistema o en la documentación.</p></div><div class="ay-accion" id="ayuda-reabrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Devolver a la bandeja</span></div><p><b>Deshace un posponer, un descarte o una respuesta: el tema vuelve a la bandeja.</b></p><p>Aparece en el detalle de un tema pospuesto, descartado o respondido. El tema vuelve como estaba antes y queda en su actividad.</p></div><div class="ay-accion" id="ayuda-deshacer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Deshacer</span></div><p><b>Revierte la última acción sobre el tema (posponer, descartar o responder).</b></p><p>Está en el aviso que aparece abajo durante unos segundos después de la acción. Pasado ese tiempo se usa <strong>Devolver a la bandeja</strong> desde el detalle.</p></div></section>
<section class="ay-sec n2" id="ayuda-no-reportados" data-nivel="2"><h3>Fuera de bandeja</h3><p class="ay-breve">Temas abiertos que no se muestran en la bandeja: pospuestos, respondidos, descartados o no reportados por el triage.</p><p>Todo lo abierto que no está en la bandeja, con el motivo. Los botones de arriba filtran por <strong>Pospuestos</strong>, <strong>Respondidos</strong>, <strong>Descartados</strong> o <strong>No reportados por el triage</strong> (decisiones En observación y Conocido).</p><p>Sirve para controlar el criterio de la rutina. Si algo de acá debería estar en la bandeja, abrilo y usá <strong>Devolver a la bandeja</strong>, respondé <strong>Falso positivo / ajustar regla</strong> o corregí los <a href="#ayuda-criterios">criterios</a>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:fuera:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-corridas" data-nivel="2"><h3>Corridas</h3><p class="ay-breve">Cada ejecución de la rutina, con lo que revisó y lo que encontró.</p><p>Las últimas 50 corridas, con su estado (Completa, Parcial o Con errores), cuántos proyectos revisó y cuántos temas nuevos, recurrentes y escalados encontró.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corridas:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-corrida-detalle" data-nivel="3"><h4>Detalle de una corrida</h4><p class="ay-breve">Qué revisó la rutina en cada proyecto y qué decidió con cada hallazgo.</p><p>Por cada proyecto muestra la ventana de tiempo revisada, un resumen de señales, la tabla de <a href="#ayuda-punto-de-control">puntos de control</a> con su valor observado y los <strong>Hallazgos y triage</strong>: cada hallazgo con su severidad, su decisión, si es nuevo, recurrente o reabierto, y su porqué. Un clic en un hallazgo abre su tema. Si hubo errores al leer Orchestrator, aparecen en la caja del proyecto.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corrida:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-proyectos" data-nivel="2"><h3>Proyectos</h3><p class="ay-breve">Todos los proyectos controlados, con su salud, su estado y sus temas abiertos.</p><p>La lista de proyectos con su carpeta de Orchestrator, sus temas abiertos y su <a href="#ayuda-estado-proyecto">estado</a>. Primero aparecen los que tienen problemas o esperan revisión. Con más de 5 proyectos aparece un buscador. Los Admin ven <strong>Registrar proyecto</strong> y un aviso si hay carpetas detectadas sin registrar.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyectos:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-pagina-proyecto" data-nivel="2"><h3>Página de un proyecto</h3><p class="ay-breve">Procesos, memoria, reglas, inventario y configuración de un proyecto.</p><p>Arriba está la carpeta, la cantidad de procesos y el estado, con las acciones. Debajo, cada proceso con su rol, su nombre en Orchestrator, el paquete y la versión desplegada, y sus librerías. Después vienen cinco pestañas.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:memoria--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-ver-bandeja"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ver temas abiertos</span></div><p><b>Abre la bandeja filtrada por este proyecto.</b></p><p>Aparece cuando el proyecto tiene temas en la bandeja. Aplica el <a href="#ayuda-scope">selector de proyecto</a>.</p></div><div class="ay-accion" id="ayuda-activar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Activar el control</span><span class="role-b">Solo Admin</span></div><p><b>Empieza a controlar el proyecto en cada corrida. También reanuda un control pausado.</b></p><p>Aparece cuando el proyecto terminó su <a href="#ayuda-alta">alta</a> y está <strong>En revisión</strong>: antes de activarlo, revisá la memoria de proceso, las reglas propuestas y el inventario. Si el proyecto está <strong>Pausado</strong>, el botón dice <strong>Reanudar control</strong>.</p></div><div class="ay-accion" id="ayuda-pausar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pausar control</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar el proyecto hasta que se reanude. No borra nada.</b></p><p>Útil durante un mantenimiento largo o mientras se rehace un proceso. Los temas abiertos quedan como están y el proyecto se ve gris.</p></div><div class="ay-accion" id="ayuda-reanalizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pedir re-análisis</span><span class="role-b">Solo Admin</span></div><p><b>Pide a la próxima corrida que regenere la memoria de proceso, el inventario y las reglas propuestas.</b></p><p>Conviene después de un cambio grande en el proceso o en su documentación. El proyecto sigue activo mientras tanto.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-memoria" data-nivel="3"><h4>Pestaña Memoria de proceso</h4><p class="ay-breve">Qué hace el proceso, según el alta: el contexto que usa la rutina.</p><p>La <a href="#ayuda-memoria-de-proceso">memoria de proceso</a>: qué hace el proceso, sus pasos, sistemas, colas y excepciones conocidas. La genera el alta a partir del código y la documentación.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-produccion" data-nivel="3"><h4>Pestaña Memoria de producción</h4><p class="ay-breve">Lo que pasó en producción: respuestas del equipo, deploys y re-controles.</p><p>La <a href="#ayuda-memoria-de-produccion">memoria de producción</a>: un resumen arriba y debajo el historial, del más nuevo al más viejo, con quién respondió y el ticket si lo hay.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:produccion--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-reglas" data-nivel="3"><h4>Pestaña Reglas</h4><p class="ay-breve">Las reglas de este proyecto y su estado.</p><p>Las reglas del proyecto, con las mismas acciones que la pantalla <a href="#ayuda-reglas">Reglas</a>.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-inventario" data-nivel="3"><h4>Pestaña Inventario</h4><p class="ay-breve">Procesos, colas, triggers y assets de la carpeta (de los assets, solo el nombre).</p><p>El <a href="#ayuda-inventario">inventario</a> de la carpeta: procesos con su versión y si son parte del proyecto, colas con sus reintentos, triggers y assets. De los assets se muestra solo el nombre y el tipo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:inventario--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-config" data-nivel="3"><h4>Pestaña Configuración</h4><p class="ay-breve">Nombre, carpeta, procesos, documentación y criterios del proyecto. Solo Admin puede editarla.</p><p>Un Lector o un Operador ven los criterios de triage y la documentación del proyecto. Un Admin puede editar:</p><ul>
<li>el nombre y la carpeta de Orchestrator;</li>
<li>en <strong>Opciones avanzadas</strong>: controlar solo algunos procesos, el repo de Bitbucket de respaldo de cada proceso, la documentación adicional y los criterios de triage del proyecto.</li>
</ul><p><strong>Editar configuración</strong>, debajo de la lista de procesos, abre esta pestaña.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:config--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-guardar-proyecto"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar y re-analizar</span><span class="role-b">Solo Admin</span></div><p><b>Guarda la configuración. Guardar y re-analizar además pide a la próxima corrida que regenere memoria e inventario.</b></p><p>Si cambiaste repos o procesos, conviene re-analizar. <strong>Solo guardar</strong> guarda sin pedir el análisis. Si el proyecto estaba activo, sigue activo.</p></div><div class="ay-accion" id="ayuda-descartar-cambios"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar cambios</span><span class="role-b">Solo Admin</span></div><p><b>Vuelve el formulario a la configuración guardada.</b></p><p>Deshace lo que editaste y no guardaste.</p></div></section>
<section class="ay-sec n2" id="ayuda-reglas" data-nivel="2"><h3>Reglas</h3><p class="ay-breve">Los puntos de control escritos en lenguaje natural, de todos los proyectos.</p><p>Las <a href="#ayuda-regla">reglas</a> de todos los proyectos. Arriba, las <strong>Propuestas para aprobar</strong>; después, para un Admin, el formulario <strong>Nueva regla</strong>, y al final el resto. Cada una muestra su estado, su proyecto, de dónde salió (a mano, del alta, aprendida de un incidente, por similitud o de la revisión diaria), sus excepciones y cómo la entendió la rutina.</p><ul>
<li><strong>Por compilar:</strong> la rutina la traduce a un control en la próxima corrida.</li>
<li><strong>Propuesta:</strong> la rutina la sugirió y dice por qué; un Admin la aprueba o la rechaza.</li>
<li><strong>Activa</strong>, <strong>Desactivada</strong> o <strong>Rechazada.</strong></li>
<li><strong>Cambio sugerido:</strong> la revisión diaria encontró algo para ajustar en la regla.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure><div class="ay-accion" id="ayuda-nueva-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Crear regla</span><span class="role-b">Solo Admin</span></div><p><b>Agrega una regla escrita en lenguaje natural. Se compila en la próxima corrida.</b></p><p>Elegí el proyecto, o Todos los proyectos, y escribí la regla como se la dirías a una persona: qué mirar, el umbral y qué hacer. Por ejemplo: si se ven más de 10 errores de login seguidos, escalar.</p></div><div class="ay-accion" id="ayuda-regla-active"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aprobar o Activar</span><span class="role-b">Solo Admin</span></div><p><b>La regla pasa a controlarse en cada corrida.</b></p><p><strong>Aprobar</strong> acepta una regla propuesta. <strong>Activar</strong> vuelve a encender una regla desactivada.</p></div><div class="ay-accion" id="ayuda-regla-rejected"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Rechazar</span><span class="role-b">Solo Admin</span></div><p><b>Descarta una regla propuesta. No se controla.</b></p><p>La regla queda como Rechazada, para que la rutina no la vuelva a proponer igual.</p></div><div class="ay-accion" id="ayuda-regla-disabled"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Desactivar</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar una regla activa, sin borrarla.</b></p><p>Se puede volver a activar en cualquier momento.</p></div><div class="ay-accion" id="ayuda-re-abrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Editar o Revisar</span><span class="role-b">Solo Admin</span></div><p><b>Abre el editor de la regla en la lista. Dice Revisar cuando la rutina sugiere un cambio.</b></p><p>Es el mismo <a href="#ayuda-editor-regla">editor</a> que se abre desde un tema.</p></div></section>
<section class="ay-sec n3" id="ayuda-editor-regla" data-nivel="3"><h4>Editor de reglas</h4><p class="ay-breve">Cambia el texto, la severidad o las excepciones de una regla, o la desactiva o elimina.</p><p>Se abre con <strong>Ajustar regla</strong> desde un tema o con <strong>Editar</strong> en la lista de reglas. Solo los Admin pueden cambiar algo; un Operador ve la regla y sus excepciones.</p><ul>
<li><strong>Hay una condición en la que no aplica:</strong> escribí la <strong>excepción</strong>, por ejemplo &quot;es lunes antes de las 9&quot;. Vale desde la próxima corrida.</li>
<li><strong>Avisa con una gravedad que no corresponde:</strong> elegí otra <strong>severidad</strong>, de P1 a P4. Cambia al guardar.</li>
<li><strong>El umbral o la condición están mal:</strong> corregí el <strong>texto</strong>. Vale desde la próxima corrida.</li>
<li><strong>No querés que controle por un tiempo:</strong> <strong>Desactivar</strong>.</li>
<li><strong>La regla no sirve:</strong> <strong>Eliminar regla</strong>. Pide confirmación y no se puede deshacer.</li>
</ul><p>Cuando cambia el texto o una excepción, la regla queda <strong>Por compilar</strong> y la rutina muestra después cómo la entendió. Las excepciones se pueden quitar. Desde un tema, <strong>Descartar también este tema</strong> cierra el incidente en el mismo paso, como falso positivo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:editor--></div><figcaption>Ejemplo con datos ficticios · vista de Admin, con una sugerencia de la rutina</figcaption></figure><div class="ay-accion" id="ayuda-re-guardar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar cambios</span><span class="role-b">Solo Admin</span></div><p><b>Guarda el texto, la severidad y las excepciones. En una propuesta dice Guardar y aprobar.</b></p><p>En una regla desactivada o rechazada dice <strong>Guardar y activar</strong>. El cambio queda en la actividad del tema si se hizo desde uno.</p></div><div class="ay-accion" id="ayuda-re-sev"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Severidad</span><span class="role-b">Solo Admin</span></div><p><b>Elige la severidad con la que avisa la regla, de P1 a P4. Cambia al guardar.</b></p><p>No aparece en reglas que marcan temas como conocidos o los ignoran, porque esas no avisan.</p></div><div class="ay-accion" id="ayuda-re-estado"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Desactivar (editor)</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar esta regla desde ya, sin borrarla.</b></p><p>Se puede volver a activar desde la lista de reglas.</p></div><div class="ay-accion" id="ayuda-re-eliminar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Eliminar regla</span><span class="role-b">Solo Admin</span></div><p><b>Borra la regla para siempre. Pide confirmación.</b></p><p>Si solo querés que deje de controlar un tiempo, conviene <strong>Desactivar</strong>.</p></div><div class="ay-accion" id="ayuda-re-sug-aplicar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aplicar sugerencia</span><span class="role-b">Solo Admin</span></div><p><b>Carga en el formulario el cambio que sugiere la rutina; vos confirmás con Guardar.</b></p><p>Si la sugerencia es desactivar la regla, el botón dice <strong>Desactivar</strong> y la desactiva directamente. Ver <a href="#ayuda-sugerencia">sugerencias de la rutina</a>.</p></div><div class="ay-accion" id="ayuda-re-sug-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">No, gracias</span><span class="role-b">Solo Admin</span></div><p><b>Descarta la sugerencia de la rutina. No vuelve a sugerirla por 90 días.</b></p><p>La regla queda como estaba.</p></div></section>
<section class="ay-sec n3" id="ayuda-propuestas" data-nivel="3"><h4>Propuestas de la rutina</h4><p class="ay-breve">Reglas y cambios que propone la rutina. Nunca activa nada: lo aprueba un Admin.</p><p>La rutina propone por su cuenta, y todo llega a <strong>Para revisar</strong> y a <strong>Propuestas para aprobar</strong>:</p><ul>
<li><strong>Por <a href="#ayuda-similitud">similitud</a>:</strong> cuando un Admin aprueba o edita una regla, la rutina la ofrece a otros procesos que usan el mismo portal, la misma aplicación o la misma librería.</li>
<li><strong><a href="#ayuda-sugerencia">Cambios sugeridos</a>:</strong> una vez por día revisa los últimos 30 días y marca las reglas que conviene tocar.</li>
<li><strong>Reglas nuevas de la revisión diaria:</strong> si un mismo tema sin regla se descartó varias veces, o un aviso se repite sin que nadie lo mire.</li>
<li><strong>Aprendidas de un incidente:</strong> a partir de los descartes y las respuestas.</li>
</ul><p>Llegan como máximo 3 propuestas por proyecto por vez.</p></section>
<section class="ay-sec n2" id="ayuda-registrar" data-nivel="2"><h3>Registrar proyecto</h3><p class="ay-breve">Solo Admin: suma una carpeta de Orchestrator al control.</p><p>Se llega desde <strong>Proyectos → Registrar proyecto</strong>. Un <a href="#ayuda-proyecto">proyecto</a> es una carpeta de Orchestrator. La rutina detecta sola sus procesos, sus librerías y su documentación a partir de los paquetes publicados, en la versión que está en producción.</p><ol>
<li>Registrá la carpeta desde la lista de detectadas o con el formulario.</li>
<li>La próxima corrida hace el <a href="#ayuda-alta">alta</a>.</li>
<li>Revisá el proyecto y tocá <strong>Activar el control de este proyecto</strong>.</li>
</ol><p>Los procesos que se agreguen después a la carpeta se suman solos.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:registrar:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-registrar-detectada"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar</span><span class="role-b">Solo Admin</span></div><p><b>Registra una carpeta que la rutina detectó en Orchestrator y pide su análisis.</b></p><p>La lista <strong>Carpetas detectadas sin registrar</strong> muestra las carpetas que ve la rutina y que todavía no son proyectos, con sus procesos y su actividad de los últimos 30 días.</p></div><div class="ay-accion" id="ayuda-registrar-analizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar y analizar</span><span class="role-b">Solo Admin</span></div><p><b>Crea el proyecto con el nombre y la carpeta indicados y pide su análisis.</b></p><p>Alcanza con el nombre y la carpeta. Las <strong>Opciones avanzadas</strong> son las mismas que en la <a href="#ayuda-proyecto-config">Configuración</a> y normalmente no hacen falta.</p></div></section>
<section class="ay-sec n2" id="ayuda-ajustes" data-nivel="2"><h3>Ajustes</h3><p class="ay-breve">Solo Admin: criterios globales del triage, severidad, umbrales y retención.</p><ul>
<li><strong>Criterios de triage globales:</strong> se aplican a todos los proyectos, junto con los de cada uno.</li>
<li><strong>Matriz de severidad:</strong> qué es P1, P2, P3 y P4.</li>
<li><strong>Minutos máximos en Pending:</strong> desde cuándo un job que espera se considera un problema.</li>
<li><strong>Retención:</strong> cuántos días se guardan las corridas y los incidentes cerrados.</li>

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nowIso = () => new Date().toISOString();
function rel(iso) {
  if (!iso) return '—';
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'recién';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 36) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}
const fecha = (iso) => iso ? new Date(iso).toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
const addDays = (d) => new Date(Date.now() + d * 86400000).toISOString();
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function toast(msg, deshacer) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${deshacer ? `<span data-inc="${esc(deshacer)}"><button data-act="deshacer">Deshacer</button></span>` : ''}`;
  t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, deshacer ? 8000 : 3200);
}
function md(src) {
  // Markdown mínimo y seguro: el texto se escapa primero.
  const lines = esc(src || '').split('\n'); let out = ''; let inList = false; let inTable = false;
  const inline = (s) => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\|.*\|$/.test(l.trim())) {
      if (/^\|[\s:-]+\|/.test(l.trim()) && l.replace(/[|\s:-]/g, '') === '') continue;
      if (!inTable) { out += '<div class="tblw"><table>'; inTable = true; }
      out += '<tr>' + l.trim().slice(1, -1).split('|').map((c) => `<td>${inline(c.trim())}</td>`).join('') + '</tr>'; continue;
    } else if (inTable) { out += '</table></div>'; inTable = false; }
    if (/^\s*[-*] /.test(l)) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    const h = l.match(/^(#{1,3}) (.*)/);
    if (h) out += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  if (inList) out += '</ul>'; if (inTable) out += '</table></div>';
  return out;
}

// ---------- modelo de proyecto: uno o más procesos, cada uno con su repo ----------
const ROLES = [['dispatcher', 'Dispatcher'], ['performer', 'Performer'], ['reporter', 'Reporter'], ['other', 'Otro']];
const rolDe = (t) => /dispatch/i.test(t) ? 'dispatcher' : /perform/i.test(t) ? 'performer' : /report/i.test(t) ? 'reporter' : 'other';
function procesosDe(p) {
  if (Array.isArray(p.processes) && p.processes.length) return p.processes;
  if (p.repo && p.repo.slug) return [{ id: slug(p.repo.slug), label: p.repo.slug, role: rolDe(p.repo.slug), repo: p.repo, docs: p.docs || { paths: [] } }]; // formato anterior
  return [];
}
const repoTxt = (r) => (r && r.workspace && r.slug ? `${r.workspace}/${r.slug}` : '');
function parseRepo(txt) {
  const x = String(txt || '').trim().replace(/^https?:\/\/(www\.)?bitbucket\.org\//i, '').replace(/\.git$/i, '').split('/').filter(Boolean);
  return x.length >= 2 ? { workspace: x[0], slug: x[1] } : null;
}
const listaDocs = (t) => String(t || '').split(',').map((x) => x.trim()).filter(Boolean);
// Formulario editable de un proyecto (alta o configuración): S.forms[clave].
function formDesde(p) {

    nombre: p ? p.name || '' : '', carpeta: p ? (p.orchestrator || {}).folderPath || '' : '', crit: p ? p.triageCriteria || '' : '',
    docs: p ? ((p.docs || {}).paths || []).join(', ') : '',

    procesos: p && procesosDe(p).length ? procesosDe(p).map((x) => ({ id: x.id, label: x.label || '', op: x.orchestratorProcess || '', role: x.role || rolDe(x.label || ''),
      repo: repoTxt(x.repo), rama: (x.repo || {}).branch || 'main', docs: ((x.docs || {}).paths || []).join(', '), carpeta: x.folderPath || '' }))
      : [],
  };
}
// Convierte el formulario en el documento del proyecto. Devuelve { error } o { data }.
function proyectoDesdeForm(f) {
  if (!f.nombre.trim()) return { error: 'Falta el nombre del proyecto' };
  if (!f.carpeta.trim()) return { error: 'Falta la carpeta de Orchestrator' };
  // Los procesos son opcionales: si no se cargan, la rutina toma todos los de la carpeta.
  const procs = f.procesos.filter((x) => x.label.trim() || x.repo.trim() || x.op.trim());
  if (f.soloLista && !procs.length) return { error: 'Para controlar solo algunos procesos, cargá al menos uno' };
  const usados = new Set(); const processes = [];
  for (const [i, x] of procs.entries()) {
    // El repo es opcional: un proceso sin repo (p. ej. sin versionar en Bitbucket) se controla igual,
    // pero el análisis previo no puede mirar su código.
    const repo = x.repo.trim() ? parseRepo(x.repo) : null;
    if (x.repo.trim() && !repo) return { error: `Proceso ${i + 1}: el repositorio tiene que ser la URL de Bitbucket o workspace/repo` };
    if (!repo && !x.label.trim() && !x.op.trim()) return { error: `Proceso ${i + 1}: falta el nombre` };
    let id = x.id || slug(x.label || x.op || (repo && repo.slug)) || `proceso-${i + 1}`;
    while (usados.has(id)) id = `${id}-${i + 1}`;
    usados.add(id);
    processes.push({ id, label: x.label.trim() || x.op.trim() || repo.slug, orchestratorProcess: x.op.trim() || null, role: x.role || 'other',
      folderPath: x.carpeta.trim() && x.carpeta.trim() !== f.carpeta.trim() ? x.carpeta.trim() : null,
      repo: repo ? { ...repo, branch: x.rama.trim() || 'main' } : null, docs: { paths: listaDocs(x.docs) } });
  }
  return { data: { name: f.nombre.trim(), orchestrator: { folderPath: f.carpeta.trim() }, includeAllProcesses: !f.soloLista, processes, docs: { paths: listaDocs(f.docs) }, triageCriteria: f.crit } };
}

try { S.filter = localStorage.getItem('torre.filtro') || null; } catch {}
function setFiltro(id) { S.filter = id || null; try { S.filter ? localStorage.setItem('torre.filtro', S.filter) : localStorage.removeItem('torre.filtro'); } catch {} }

const visibleByWork = (inc) => {
  const w = S.work[inc.id];
  if (!w) return true;
  if (w.state === 'dismissed' || w.state === 'responded') return false;
  if (w.state === 'snoozed' && w.snoozeUntil && w.snoozeUntil > nowIso()) {
    return Boolean(inc.severityRaisedAt && w.updatedAt && inc.severityRaisedAt > w.updatedAt); // vuelve si empeoró
  }
  return true;
};
const reportable = (i) => i.status === 'open' && (i.decision === 'escalate' || i.decision === 'notify');
const inFilter = (i) => !S.filter || i.projectId === S.filter;
const orden = (a, b) => (SEV_ORD[a.severity] - SEV_ORD[b.severity]) || ((a.decision === 'escalate' ? 0 : 1) - (b.decision === 'escalate' ? 0 : 1)) || String(b.lastSeenAt).localeCompare(String(a.lastSeenAt));
const projName = (id) => (S.projects[id] && S.projects[id].name) || id;
const nivel = (p) => (p.status !== 'active' ? 'off' : ((p.health && p.health.level) || 'unknown'));
function procLabel(i) {
  const p = S.projects[i.projectId]; if (!p) return '';
  const ps = procesosDe(p); if (ps.length < 2) return '';
  const x = ps.find((y) => y.id === i.processId) || ps.find((y) => y.orchestratorProcess && y.orchestratorProcess === i.process);
  return x ? x.label : '';
}
// Temas en la bandeja: total ('') y por proyecto.
function conteos() {
  const c = { '': 0 };
  for (const i of Object.values(S.incidents)) if (reportable(i) && visibleByWork(i)) { c[''] += 1; c[i.projectId] = (c[i.projectId] || 0) + 1; }
  return c;
}
// Pulso de la rutina: último control y alarma si está detenida.
function pulso() {
  const ult = S.runs[0];
  if (!ult) {
    if (S.error) return { cls: 'critical', t: 'Sin conexión', d: S.error };
    return { cls: 'unknown', t: S.loaded.runs ? 'Sin corridas todavía' : 'Conectando…', d: S.loaded.runs ? 'La rutina todavía no corrió.' : '' };
  }
  const cuando = ult.finishedAt || ult.startedAt;
  const intervalo = (S.settings && S.settings.intervalMinutes) || 60;
  const d = `Último control ${rel(cuando)}`;
  if ((Date.now() - Date.parse(cuando)) / 60000 > intervalo * 2.2) return { cls: 'critical', t: 'Rutina detenida', d, detenida: true };
  if (ult.status !== 'ok') return { cls: 'warn', t: 'Última corrida con errores', d };
  return { cls: 'ok', t: 'Rutina al día', d };
}

// ---------- personas (solo ids guardados; nombres resueltos al mostrar) ----------
async function resolveNames(ids) {
  if (!S.user) return;
  const faltan = [...new Set(ids.filter((x) => x && x.startsWith('u_') && !S.names[x]))];
  if (!faltan.length) return;
  const ps = await S.user.profiles(faltan);
  let cambio = false;
  for (const id of faltan) if (ps[id]) { S.names[id] = ps[id]; cambio = true; }
  if (cambio) schedule();
}
function who(id) {
  if (!id) return '';
  if (id === 'rutina') return '<span class="who">Rutina</span>';
  const p = S.names[id];
  if (!p) { resolveNames([id]); return '<span class="who">…</span>'; }
  const nombre = id === S.me ? 'Vos' : (p.name || 'Alguien');
  return `<span class="who"><img class="av" alt="" src="${esc(p.avatarUrl)}">${esc(nombre)}</span>`;
}

// ---------- escritura ----------
async function writeWork(inc, patch, activity, quitar = []) {
  if (!S.canWrite) { toast('Tu acceso es de solo lectura'); return false; }
  const prev = S.work[inc.id] ? { ...S.work[inc.id] } : null;
  const data = { ...(prev || {}), ...patch, updatedAt: nowIso(), updatedBy: S.me || null };
  delete data.id; for (const k of quitar) delete data[k];
  try {
    await S.db.doc(`incidentWork/${inc.id}`).set(data);
    if (activity) await S.db.collection('activity').add({ incidentId: inc.id, projectId: inc.projectId, at: nowIso(), by: S.me || null, ...activity });
    S.undo[inc.id] = prev;
    return true;
  } catch (e) { toast(e && e.code === 'invalid_argument' ? 'No tenés permiso para esta acción' : 'No se pudo guardar. Probá de nuevo.'); return false; }
}

// ---------- render ----------
let pending = false;
function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }
// Solo toca el DOM si el HTML cambió: conserva hover, selección y scroll entre refrescos de datos.
function put(el, html) { if (el._h === html) return; el._h = html; el.innerHTML = html; }

function render() {
  const h = ruta();
  const incAntes = drawerInc;
  if (h.startsWith('incidente-')) drawerInc = h.slice(10); else { base = h; drawerInc = null; }
  if (S.loaded.projects && S.filter && !S.projects[S.filter]) setFiltro(null);
  // Conservar foco, cursor y scroll interno entre renders.
  const act = document.activeElement; const actId = act && act.id; const selStart = act && act.selectionStart;
  const ks = {}; document.querySelectorAll('[data-ks]').forEach((el) => { if (el.id) ks[el.id] = el.scrollTop; });
  if (incAntes !== drawerInc) delete ks['dw-b'];

  renderShell();
  put($('#view'), vista(base));
  put($('#drawer'), drawerInc ? drawerHtml(drawerInc) : '');
  $('#app').inert = Boolean(drawerInc);
  // Bloquear el scroll del fondo sin que la página salte por el ancho de la barra de scroll.
  const raiz = document.documentElement;
  if (Boolean(drawerInc) !== raiz.classList.contains('lock')) {
    if (drawerInc) raiz.style.setProperty('--sbw', `${window.innerWidth - raiz.clientWidth}px`);
    raiz.classList.toggle('lock', Boolean(drawerInc));
  }

  for (const [id, y] of Object.entries(ks)) { const el = document.getElementById(id); if (el) el.scrollTop = y; }
  ocultarTip(true);
  if (S.scopeOpen && S.scopeScroll) { const a = $('#scope-list .act'); if (a) a.scrollIntoView({ block: 'nearest' }); S.scopeScroll = false; }
  if (S.focusNext) {
    const el = document.getElementById(S.focusNext) || document.getElementById('vt');
    if (el) el.focus({ preventScroll: el.id === 'vt' });
    S.focusNext = null;
    if (S.irAyuda) { S.irAyuda = false; const el = base !== 'ayuda' && base.startsWith('ayuda-') && document.getElementById(base); if (el) el.scrollIntoView(); }
  } else if (act && act !== document.body && !act.isConnected) {
    const el = (actId && document.getElementById(actId)) || (drawerInc ? document.getElementById('dw') : $('#view'));
    if (el) { el.focus({ preventScroll: true }); try { if (selStart != null && el.id === actId) el.setSelectionRange(selStart, selStart); } catch {} }
  }
}

function vista(b) {
  if (b === 'corridas') return viewCorridas();
  if (b.startsWith('corrida-')) return viewCorrida(b.slice(8));
  if (b === 'no-reportados') return viewFuera();
  if (b === 'proyectos') return viewProyectos();
  if (b.startsWith('proyecto-')) return viewProyecto(b.slice(9));
  if (b === 'reglas') return viewReglas();
  if (b === 'ajustes') return viewAjustes();
  if (b === 'registrar') return viewRegistrar();
  if (b === 'mas') return viewMas();
  if (b === 'ayuda' || b.startsWith('ayuda-')) return viewAyuda();
  return viewInicio();
}

// ---------- reglas: editor en línea ----------

const reKey = (ctx, rid) => `${ctx}|${rid}`;

// Reglas que intervinieron en un incidente (las que el triage citó o la que disparó el hallazgo).
function reglasDe(i) {

}
const reglaStCls = { proposed: 'info', active: 'ok', pending_compile: 'warn' };

// Cierra el editor después de un cambio: deja el rastro en el tema y, si se pidió, lo descarta.
async function cerrarEdicionRegla(inc, ctx, rid, actividad, nota) {
