<template id="ayuda-tpl"><nav class="ay-toc box" aria-label="Contenido de la ayuda"><div class="ay-toc-g"><a href="#ayuda-introduccion"><b>Qué es la Torre de Control</b></a><ul><li><a href="#ayuda-como-funciona">Cómo funciona</a></li><li><a href="#ayuda-solo-lectura">Lo que la Torre de Control nunca hace</a></li><li><a href="#ayuda-roles">Roles</a></li></ul></div><div class="ay-toc-g"><a href="#ayuda-glosario"><b>Glosario</b></a></div><div class="ay-toc-g"><a href="#ayuda-pantallas"><b>Pantallas y acciones</b></a><ul><li><a href="#ayuda-barra">Barra superior</a></li><li><a href="#ayuda-bandeja">Bandeja</a></li><li><a href="#ayuda-tarjeta">La tarjeta</a></li><li><a href="#ayuda-acciones">Acciones sobre una tarjeta</a></li><li><a href="#ayuda-corridas">Corridas</a></li><li><a href="#ayuda-no-reportados">No reportados</a></li><li><a href="#ayuda-proyectos">Proyectos</a></li><li><a href="#ayuda-pagina-proyecto">Página de un proyecto</a></li><li><a href="#ayuda-reglas">Reglas</a></li><li><a href="#ayuda-registrar">Registrar proyecto</a></li><li><a href="#ayuda-ajustes">Ajustes</a></li></ul></div></nav>
<section class="ay-sec n1" id="ayuda-introduccion" data-nivel="1"><h2>Qué es la Torre de Control</h2><p>La Torre de Control vigila los robots de UiPath que Grupo Momentum tiene en producción. Cada hora una <strong>rutina</strong> de Claude revisa Orchestrator, detecta lo que anda mal, decide qué tan grave es y lo deja en este tablero, explicado y ordenado.</p><p>El tablero es donde el equipo trabaja: ve lo que requiere atención, lo responde, lo delega o lo descarta. Con cada respuesta la rutina aprende: la próxima vez sabe qué es normal en cada proyecto y qué no.</p></section>
<section class="ay-sec n2" id="ayuda-como-funciona" data-nivel="2"><h3>Cómo funciona</h3><ol>
<li><strong>Controla.</strong> La rutina lee los jobs, los logs, las colas y los triggers de cada proyecto activo, y evalúa sus <a href="#ayuda-regla">reglas</a>.</li>
<li><strong>Agrupa.</strong> Cada problema distinto es un <a href="#ayuda-tema">tema</a> y tiene una sola tarjeta. Si se repite, la tarjeta suma ocurrencias en lugar de duplicarse.</li>
<li><strong>Clasifica.</strong> El <a href="#ayuda-triage">triage</a> asigna categoría, <a href="#ayuda-severidad">severidad</a> y una <a href="#ayuda-decision">decisión</a>: escalar, avisar, observar o dar por conocido. Siempre dice por qué.</li>
<li><strong>Analiza.</strong> Antes de escalar, cruza el error con el código del paquete desplegado y su documentación. El resultado es el <a href="#ayuda-analisis-previo">análisis previo</a>.</li>
<li><strong>Publica.</strong> Lo que necesita a una persona aparece en la <a href="#ayuda-bandeja">Bandeja</a>. El resto queda en <a href="#ayuda-no-reportados">No reportados</a>.</li>
<li><strong>Aprende.</strong> Las respuestas del equipo se guardan en la <a href="#ayuda-memoria-de-produccion">memoria de producción</a> y pueden convertirse en reglas propuestas.</li>
</ol></section>
<section class="ay-sec n2" id="ayuda-solo-lectura" data-nivel="2"><h3>Lo que la Torre de Control nunca hace</h3><ul>
<li><strong>No cambia nada en Orchestrator.</strong> No inicia, detiene ni reintenta jobs, y no toca colas, assets ni procesos.</li>
<li><strong>No cambia código.</strong> Si un problema requiere un fix, lo sugiere con la evidencia. Lo hace una persona.</li>
<li><strong>No muestra datos personales.</strong> Todo lo que viene de Orchestrator pasa por una redacción de PII antes de llegar al tablero. Los valores de assets y el contenido de los queue items nunca se leen.</li>
</ul></section>
<section class="ay-sec n2" id="ayuda-roles" data-nivel="2"><h3>Roles</h3><p class="ay-breve">Tu rol define qué podés hacer: Lector mira, Operador trabaja las tarjetas y Admin además configura proyectos, reglas y ajustes.</p><p>Tu rol se ve arriba, al lado del nombre del tablero. Se asigna desde el menú <strong>Compartir</strong> del tablero.</p><table><thead><tr><th>Rol</th><th>Acceso en Compartir</th><th>Puede</th></tr></thead><tbody><tr><td>Lector</td><td>Viewer</td><td>Ver todo, incluida esta ayuda.</td></tr><tr><td>Operador</td><td>Contributor</td><td>Delegar, posponer, descartar, responder y comentar tarjetas, y pedir un nuevo análisis.</td></tr><tr><td>Admin</td><td>Editor</td><td>Además: registrar y configurar proyectos, activar o pausar el control, aprobar reglas y editar los ajustes.</td></tr></tbody></table></section>
<section class="ay-sec n1" id="ayuda-glosario" data-nivel="1"><h2>Glosario</h2><p>Los términos que aparecen en el tablero, en orden alfabético.</p><div class="ay-glos"><div class="ay-term" id="ayuda-alta"><b class="ay-term-n">Alta</b><div class="ay-term-d">El primer análisis de un proyecto recién registrado. La rutina descubre sus procesos, colas, triggers y librerías, calcula el baseline y genera la memoria de proceso y las reglas propuestas. Después un Admin lo revisa y lo activa.</div></div><div class="ay-term" id="ayuda-analisis-previo"><b class="ay-term-n">Análisis previo</b><div class="ay-term-d">Lo que la rutina investiga antes de escalar una tarjeta: hipótesis con su probabilidad, acciones sugeridas, el código y la documentación relacionados, y qué cambió en el último deploy. Se lee en el detalle de la tarjeta.</div></div><div class="ay-term" id="ayuda-baseline"><b class="ay-term-n">Baseline</b><div class="ay-term-d">El comportamiento normal de un proyecto en los últimos 30 días: cuántos jobs corre, cuánto tardan y cuántos errores tiene. Sirve para distinguir un problema nuevo de lo habitual.</div></div><div class="ay-term" id="ayuda-categoria"><b class="ay-term-n">Categoría</b><div class="ay-term-d">El tipo de problema, con su ícono: login o credenciales, selector o UI, aplicación caída, infraestructura, configuración, programación, negocio, sistema, falla silenciosa, regresión, deploy o monitoreo.</div></div><div class="ay-term" id="ayuda-corrida"><b class="ay-term-n">Corrida</b><div class="ay-term-d">Una ejecución de la rutina. Registra qué ventana de tiempo revisó en cada proyecto, cada punto de control con su valor observado y los hallazgos con su triage.</div></div><div class="ay-term" id="ayuda-criterios"><b class="ay-term-n">Criterios de triage</b><div class="ay-term-d">Instrucciones en lenguaje natural que guían la clasificación. Hay criterios globales, en Ajustes, y criterios propios de cada proyecto, en su Configuración.</div></div><div class="ay-term" id="ayuda-decision"><b class="ay-term-n">Decisión</b><div class="ay-term-d">Qué hace el triage con un hallazgo. Escalado: necesita a una persona y va a Requiere acción. Aviso: conviene verlo, pero no bloquea. En observación: se sigue la tendencia sin mostrarlo. Conocido: la memoria o una regla dicen que es esperado.</div></div><div class="ay-term" id="ayuda-estado-proyecto"><b class="ay-term-n">Estado del proyecto</b><div class="ay-term-d">Esperando análisis, Analizando, En revisión, Activo, Pausado o Con error. Solo los proyectos activos se controlan en cada corrida.</div></div><div class="ay-term" id="ayuda-evidencia"><b class="ay-term-n">Evidencia (redactada)</b><div class="ay-term-d">Los logs, queue items, jobs y valores de reglas que respaldan una tarjeta, después de quitarles los datos personales. Las referencias de los casos se muestran como un código corto, nunca el dato original.</div></div><div class="ay-term" id="ayuda-incidente"><b class="ay-term-n">Incidente o tarjeta</b><div class="ay-term-d">Un problema detectado, con toda su historia: cuándo se vio por primera y por última vez, cuántas veces ocurrió, su triage, su análisis y la actividad del equipo.</div></div><div class="ay-term" id="ayuda-inventario"><b class="ay-term-n">Inventario</b><div class="ay-term-d">Lo que tiene la carpeta de Orchestrator de un proyecto: procesos con su versión, colas, triggers y assets. De los assets se guarda solo el nombre y el tipo, nunca el valor.</div></div><div class="ay-term" id="ayuda-libreria"><b class="ay-term-n">Librería</b><div class="ay-term-d">La etiqueta con el nombre de una librería indica que el error ocurrió dentro de una actividad de esa librería. El detalle dice qué otros proyectos la usan y si tienen tarjetas abiertas.</div></div><div class="ay-term" id="ayuda-memoria-de-proceso"><b class="ay-term-n">Memoria de proceso</b><div class="ay-term-d">Una descripción del proceso, similar a un PDD resumido, que la rutina genera en el alta a partir del código y la documentación. Sirve de contexto para el triage y el análisis.</div></div><div class="ay-term" id="ayuda-memoria-de-produccion"><b class="ay-term-n">Memoria de producción</b><div class="ay-term-d">El historial permanente de un proyecto: respuestas del equipo, deploys, re-controles y reglas nuevas, más un resumen que se actualiza solo. Es lo que hace que la rutina aprenda.</div></div><div class="ay-term" id="ayuda-nueva-version"><b class="ay-term-n">Nueva versión</b><div class="ay-term-d">Se desplegó una versión nueva del proceso después de que se abrió la tarjeta. La rutina la vuelve a analizar y explica qué cambió.</div></div><div class="ay-term" id="ayuda-proyecto"><b class="ay-term-n">Proyecto</b><div class="ay-term-d">Una carpeta de Orchestrator con sus procesos, por ejemplo Dispatcher, Performer y Reporter. Es la unidad que se registra, se analiza y se controla.</div></div><div class="ay-term" id="ayuda-pulso"><b class="ay-term-n">Pulso de la rutina</b><div class="ay-term-d">Arriba a la derecha: cuándo fue el último control. Verde si salió bien, ámbar si tuvo errores de colecta, y rojo si la rutina dejó de correr.</div></div><div class="ay-term" id="ayuda-punto-de-control"><b class="ay-term-n">Punto de control</b><div class="ay-term-d">Cada cosa que se revisa en una corrida, por ejemplo jobs fallidos, items abandonados o una regla. Su resultado es alerta, ok u omitido.</div></div><div class="ay-term" id="ayuda-re-control"><b class="ay-term-n">Re-control</b><div class="ay-term-d">Respuesta Volver a controlar con una fecha. La tarjeta se oculta hasta ese día y entonces la rutina verifica si el problema sigue. Queda en la memoria de producción como Re-control agendado y Re-control OK.</div></div><div class="ay-term" id="ayuda-reaparecio"><b class="ay-term-n">Reapareció</b><div class="ay-term-d">Un tema que se había cerrado volvió dentro de los 30 días. Se reabre la misma tarjeta en lugar de crear una nueva, para no perder su historia.</div></div><div class="ay-term" id="ayuda-recurrencia"><b class="ay-term-n">Recurrencia</b><div class="ay-term-d">Cuando un tema se repite, suma ocurrencias en la misma tarjeta. La etiqueta ×7 · última hace 12 min indica cuántas veces pasó y cuándo fue la última.</div></div><div class="ay-term" id="ayuda-regla"><b class="ay-term-n">Regla</b><div class="ay-term-d">Un punto de control escrito en lenguaje natural, por ejemplo: si hay más de 10 errores de login seguidos, escalar. La rutina la traduce a un control y muestra cómo la entendió.</div></div><div class="ay-term" id="ayuda-retencion"><b class="ay-term-n">Retención</b><div class="ay-term-d">Las corridas y los incidentes cerrados se borran después de cierta cantidad de días, que se configura en Ajustes. Antes de borrarlos se guarda un resumen mensual.</div></div><div class="ay-term" id="ayuda-rutina"><b class="ay-term-n">Rutina</b><div class="ay-term-d">El proceso de Claude que corre solo, en general cada hora. Es el único que crea corridas e incidentes, y nunca modifica nada en Orchestrator.</div></div><div class="ay-term" id="ayuda-severidad"><b class="ay-term-n">Severidad (P1 a P4)</b><div class="ay-term-d">P1: un proceso crítico se detuvo o se incumplió el SLA hoy. P2: proceso degradado con riesgo de SLA. P3: errores aislados. P4: informativo.</div></div><div class="ay-term" id="ayuda-solicitud"><b class="ay-term-n">Solicitud</b><div class="ay-term-d">Un pedido del equipo a la rutina, por ejemplo analizar un proyecto nuevo o volver a analizar una tarjeta. Se atiende en la próxima corrida.</div></div><div class="ay-term" id="ayuda-tema"><b class="ay-term-n">Tema</b><div class="ay-term-d">Lo que identifica a un problema, sin importar cuántas veces ocurra: el mismo error en el mismo lugar. Un tema tiene una sola tarjeta.</div></div><div class="ay-term" id="ayuda-triage"><b class="ay-term-n">Triage</b><div class="ay-term-d">La clasificación de cada hallazgo: categoría, severidad y decisión, con su porqué, su nivel de confianza y las reglas o memorias en las que se basó.</div></div></div></section>
<section class="ay-sec n1" id="ayuda-pantallas" data-nivel="1"><h2>Pantallas y acciones</h2><p>Cada pantalla tiene un botón <strong>?</strong> que trae a su sección de esta ayuda. Al pasar el mouse por un botón o una etiqueta aparece una explicación breve, con un link a más detalle. Las vistas de esta página son las de la app, dibujadas con datos de ejemplo.</p></section>
<section class="ay-sec n2" id="ayuda-barra" data-nivel="2"><h3>Barra superior</h3><p>Siempre visible. De izquierda a derecha: el nombre del tablero, que vuelve a la Bandeja; tu <a href="#ayuda-roles">rol</a>; el botón <strong>?</strong>, que abre la ayuda de la pantalla en la que estás, y el <a href="#ayuda-pulso">pulso de la rutina</a>.</p><p>Debajo hay un chip por proyecto. El punto de color resume su salud: verde, todo bien; ámbar, hay avisos; rojo, hay problemas P1 o P2; gris, pausado o sin datos. El número es la cantidad de tarjetas abiertas en la Bandeja.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:barra:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-filtro"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Chip de proyecto</span></div><p><b>Filtra todo el tablero por ese proyecto. Todos quita el filtro.</b></p><p>El filtro se aplica a la Bandeja, Corridas, No reportados y Reglas, y se recuerda la próxima vez que abras el tablero en este navegador.</p></div></section>
<section class="ay-sec n2" id="ayuda-bandeja" data-nivel="2"><h3>Bandeja</h3><p class="ay-breve">La pantalla principal: lo que necesita a una persona, ordenado por severidad.</p><p>Es la pantalla de trabajo. Muestra solo las tarjetas abiertas cuya decisión es escalar o avisar, y que nadie respondió, descartó o pospuso. Están ordenadas por severidad, primero las escaladas y después las más recientes. Si no hay nada pendiente, dice <strong>Todo en orden</strong>.</p><p>Si la última corrida tuvo errores de colecta, arriba aparece un aviso rojo con un link a esa corrida.</p><p>Al pie, <strong>Ver más</strong> lleva a las demás pantallas.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:bandeja:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-para-revisar" data-nivel="3"><h4>Para revisar</h4><p class="ay-breve">Solo Admin: reglas propuestas para aprobar y proyectos que terminaron su análisis.</p><p>Solo la ven los Admin. Junta las tareas de configuración pendientes: reglas propuestas, proyectos <strong>En revisión</strong> que esperan ser activados y proyectos <strong>Con error</strong>. Cada ítem lleva a donde se resuelve.</p></section>
<section class="ay-sec n3" id="ayuda-para-vos" data-nivel="3"><h4>Para vos</h4><p class="ay-breve">Tarjetas que alguien te delegó.</p><p>Las tarjetas que alguien te <a href="#ayuda-delegar">delegó</a>. Aparecen primero y salen de esta lista cuando las respondés, descartás o posponés.</p></section>
<section class="ay-sec n3" id="ayuda-requiere-accion" data-nivel="3"><h4>Requiere acción</h4><p class="ay-breve">Tarjetas escaladas: el triage decidió que necesitan a una persona.</p><p>Las tarjetas con decisión <strong>Escalado</strong>. En general son P1 o P2, o algo que la rutina nunca había visto. Cada una trae su análisis previo en el detalle.</p></section>
<section class="ay-sec n3" id="ayuda-avisos" data-nivel="3"><h4>Avisos</h4><p class="ay-breve">Cosas para saber que no bloquean, en formato compacto.</p><p>Las tarjetas con decisión <strong>Aviso</strong>, en general P3 o P4 nuevos. Se muestran compactas, solo con Descartar, Posponer y Responder. El porqué aparece al abrir el detalle.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:aviso--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-tarjeta" data-nivel="2"><h3>La tarjeta</h3><p class="ay-breve">Un problema por tema, con su severidad, su porqué y las acciones para trabajarlo.</p><p>Cada tarjeta es un <a href="#ayuda-tema">tema</a>. Si el problema vuelve a ocurrir no se crea otra: la misma suma ocurrencias.</p><ul>
<li><strong>Ícono y color:</strong> la <a href="#ayuda-categoria">categoría</a> y la <a href="#ayuda-severidad">severidad</a>. El borde izquierdo tiene el color de la severidad.</li>
<li><strong>Etiquetas:</strong> el proyecto, cuando no hay filtro, y el proceso si el proyecto tiene varios; la <a href="#ayuda-recurrencia">recurrencia</a>; <a href="#ayuda-reaparecio">Reapareció</a>; la <a href="#ayuda-libreria">librería</a> donde ocurrió el error; <a href="#ayuda-nueva-version">Nueva versión</a>; <strong>Aviso</strong>, y a quién está delegada.</li>
<li><strong>Texto gris:</strong> el porqué del triage, en dos líneas.</li>
<li><strong>Acciones:</strong> abajo. Un Lector no las ve.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-detalle" data-nivel="3"><h4>Ver detalle</h4><p class="ay-breve">Abre el porqué del triage, el análisis previo, la evidencia y la actividad de la tarjeta.</p><p><strong>Ver detalle</strong> despliega todo lo que sabe la rutina sobre el tema:</p><ul>
<li><strong>Librería:</strong> si el error ocurrió en una librería, su versión, la actividad y qué otros proyectos la usan.</li>
<li><strong>Triage:</strong> la decisión, su confianza, el porqué, las reglas y memorias en las que se basó, desde cuándo se ve y en cuántas corridas.</li>
<li><strong>Análisis previo:</strong> resumen, hipótesis ordenadas por probabilidad, acciones sugeridas, archivos de código y secciones de documentación relacionados, y qué cambió en el último deploy. Si dice Pendiente, lo completa la próxima corrida.</li>
<li><strong>Evidencia (redactada):</strong> los últimos logs, queue items y jobs, sin datos personales.</li>
<li><strong>Actividad:</strong> quién hizo qué con la tarjeta y los comentarios del equipo.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:detalle--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-acciones" data-nivel="2"><h3>Acciones sobre una tarjeta</h3><p>Las usan los Operadores y los Admin. Cada acción queda en la actividad de la tarjeta. Las respuestas y los descartes además le enseñan a la rutina, que los procesa en la próxima corrida.</p><div class="ay-accion" id="ayuda-delegar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Delegar</span></div><p><b>Asigna la revisión a una persona: la tarjeta le aparece en Para vos.</b></p><p>Buscá a la persona por nombre y elegila. La tarjeta muestra a quién está delegada y sigue en la Bandeja de todos, pero a esa persona le aparece primero, en <strong>Para vos</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:delegar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-posponer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Posponer</span></div><p><b>Oculta la tarjeta hasta una fecha. Vuelve antes si el problema empeora.</b></p><p>Elegí 1 día, 3 días, 1 semana o una fecha. Mientras tanto la tarjeta pasa a <a href="#ayuda-no-reportados">No reportados</a> como <strong>Pospuesto hasta…</strong>.</p><ul>
<li>Si la severidad sube antes de la fecha, la tarjeta vuelve a la Bandeja sola.</li>
<li>Al vencer, vuelve a mostrarse si el problema sigue.</li>
<li>Posponer no le enseña nada a la rutina. Si el problema es esperado, conviene <strong>Descartar</strong> o <strong>Responder</strong>.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:posponer--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar</span></div><p><b>Saca la tarjeta de la Bandeja con un motivo. La rutina lo aprende y puede proponer una regla.</b></p><p>Elegí un motivo y, si querés, agregá una nota que explique por qué:</p><ul>
<li><strong>Es esperado:</strong> pasa siempre y no es un problema, por ejemplo una ventana de mantenimiento.</li>
<li><strong>Falso positivo:</strong> la detección se equivocó.</li>
<li><strong>Dato de negocio:</strong> es una excepción de negocio esperable, no una falla del robot.</li>
<li><strong>Sistema externo:</strong> el problema está en un sistema que no depende del equipo.</li>
</ul><p>La rutina anota el motivo en la <a href="#ayuda-memoria-de-produccion">memoria de producción</a> y puede proponer una <a href="#ayuda-regla">regla</a> para no volver a avisar. Si el tema se repite, suma ocurrencias en la misma tarjeta, pero no vuelve a la Bandeja como nuevo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:descartar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-responder"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Responder</span></div><p><b>Registra qué se encontró o qué se va a hacer. Queda en la memoria de producción.</b></p><p>Elegí una decisión y agregá notas:</p><ul>
<li><strong>Requiere fix:</strong> hay que corregir el robot. Podés cargar el ticket o la referencia del fix.</li>
<li><strong>Comportamiento esperado</strong>, <strong>Problema de datos</strong>, <strong>Sistema externo</strong> o <strong>Falso positivo / ajustar regla:</strong> la causa es otra; la rutina lo aprende.</li>
<li><strong>Volver a controlar:</strong> elegí una fecha. La tarjeta se oculta hasta ese día y la rutina hace un <a href="#ayuda-re-control">re-control</a>.</li>
<li><strong>Derivar a desarrollo:</strong> lo toma el equipo de desarrollo.</li>
</ul><p>La tarjeta sale de la Bandeja y la respuesta queda en la memoria de producción del proyecto.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:responder--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-comentar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Comentar</span></div><p><b>Deja una nota para el equipo en la actividad de la tarjeta. No cambia su estado.</b></p><p>El comentario aparece en la sección <strong>Actividad</strong> del detalle. No saca la tarjeta de la Bandeja ni le enseña nada a la rutina. Con Ctrl o Cmd + Enter se envía sin usar el mouse.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:comentar--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></div><div class="ay-accion" id="ayuda-reanalizar-inc"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Volver a analizar</span></div><p><b>Pide a la próxima corrida un análisis previo nuevo de esta tarjeta.</b></p><p>Está al final del detalle. Sirve cuando el análisis quedó viejo, por ejemplo después de un cambio en el sistema o en la documentación. El nuevo análisis reemplaza al anterior en la próxima corrida.</p></div></section>
<section class="ay-sec n2" id="ayuda-corridas" data-nivel="2"><h3>Corridas</h3><p class="ay-breve">Cada ejecución de la rutina, con lo que revisó y lo que encontró.</p><p>La lista de las últimas 50 corridas. El punto indica cómo terminó: verde, completa; ámbar, parcial; rojo, con errores. A la derecha, cuántos temas nuevos, recurrentes y escalados encontró.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corridas:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-corrida-detalle" data-nivel="3"><h4>Detalle de una corrida</h4><p class="ay-breve">Qué revisó la rutina en cada proyecto y qué decidió con cada hallazgo.</p><p>Por cada proyecto muestra la ventana de tiempo revisada, un resumen de señales, la tabla de <a href="#ayuda-punto-de-control">puntos de control</a> con su valor observado y los <strong>Hallazgos y triage</strong>: cada hallazgo con su severidad, su decisión, si es nuevo, recurrente o reabierto, y su porqué. Un clic en un hallazgo abre su tarjeta.</p><p>Si hubo errores al leer Orchestrator, aparecen al final.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corrida:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-no-reportados" data-nivel="2"><h3>No reportados</h3><p class="ay-breve">Lo que no está en la Bandeja: en observación, conocido, pospuesto, descartado o respondido.</p><p>Todo lo abierto que no aparece en la Bandeja, con el motivo:</p><ul>
<li><strong>En observación</strong> o <strong>Conocido:</strong> el triage decidió no mostrarlo.</li>
<li><strong>Pospuesto hasta…</strong>, <strong>Descartado</strong> o <strong>Respondido:</strong> el equipo ya lo trabajó.</li>
</ul><p>Sirve para controlar el criterio de la rutina. Si algo de acá debería estar en la Bandeja, abrilo y respondé <strong>Falso positivo / ajustar regla</strong>, o corregí los <a href="#ayuda-criterios">criterios</a>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:no-reportados:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-proyectos" data-nivel="2"><h3>Proyectos</h3><p class="ay-breve">Todos los proyectos controlados, con su salud y su estado.</p><p>La lista de proyectos con su carpeta de Orchestrator, su salud y su <a href="#ayuda-estado-proyecto">estado</a>. Un clic abre la página del proyecto.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyectos:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-pagina-proyecto" data-nivel="2"><h3>Página de un proyecto</h3><p class="ay-breve">Procesos, memoria, reglas, inventario y configuración de un proyecto.</p><p>Arriba está la carpeta, la cantidad de procesos y el estado. Debajo, cada proceso con su rol, su nombre en Orchestrator, el paquete y la versión desplegada, y sus librerías. Después vienen las acciones de Admin y cinco pestañas.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:memoria--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-activar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Activar el control</span><span class="role-b">Solo Admin</span></div><p><b>Empieza a controlar el proyecto en cada corrida. También reanuda un control pausado.</b></p><p>Aparece cuando el proyecto terminó su <a href="#ayuda-alta">alta</a> y está <strong>En revisión</strong>: antes de activarlo, revisá la memoria de proceso, las reglas propuestas y el inventario. Si el proyecto está <strong>Pausado</strong>, el botón dice <strong>Reanudar control</strong>.</p></div><div class="ay-accion" id="ayuda-pausar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pausar control</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar el proyecto hasta que se reanude. No borra nada.</b></p><p>Útil durante un mantenimiento largo o mientras se rehace un proceso. Las tarjetas abiertas quedan como están y el chip del proyecto se ve gris.</p></div><div class="ay-accion" id="ayuda-reanalizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pedir re-análisis</span><span class="role-b">Solo Admin</span></div><p><b>Pide a la próxima corrida que regenere la memoria de proceso, el inventario y las reglas propuestas.</b></p><p>Conviene después de un cambio grande en el proceso o en su documentación. El proyecto sigue activo mientras tanto.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-memoria" data-nivel="3"><h4>Pestaña Memoria de proceso</h4><p class="ay-breve">Qué hace el proceso, según el alta: el contexto que usa la rutina.</p><p>La <a href="#ayuda-memoria-de-proceso">memoria de proceso</a>: qué hace el proceso, sus pasos, sistemas, colas y excepciones conocidas. La genera el alta a partir del código y la documentación.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-produccion" data-nivel="3"><h4>Pestaña Memoria de producción</h4><p class="ay-breve">Lo que pasó en producción: respuestas del equipo, deploys y re-controles.</p><p>La <a href="#ayuda-memoria-de-produccion">memoria de producción</a>: un resumen arriba y debajo el historial, del más nuevo al más viejo, con quién respondió y el ticket si lo hay.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:produccion--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-reglas" data-nivel="3"><h4>Pestaña Reglas</h4><p class="ay-breve">Las reglas de este proyecto y su estado.</p><p>Las reglas del proyecto, con las mismas acciones que la pantalla <a href="#ayuda-reglas">Reglas</a>.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-inventario" data-nivel="3"><h4>Pestaña Inventario</h4><p class="ay-breve">Procesos, colas, triggers y assets de la carpeta (de los assets, solo el nombre).</p><p>El <a href="#ayuda-inventario">inventario</a> de la carpeta: procesos con su versión y si son parte del proyecto, colas con sus reintentos, triggers y assets. De los assets se muestra solo el nombre y el tipo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:inventario--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-config" data-nivel="3"><h4>Pestaña Configuración</h4><p class="ay-breve">Nombre, carpeta, procesos, documentación y criterios del proyecto. Solo Admin puede editarla.</p><p>Un Lector o un Operador ven los criterios de triage y la documentación del proyecto. Un Admin puede editar:</p><ul>
<li>el nombre y la carpeta de Orchestrator;</li>
<li>en <strong>Opciones avanzadas</strong>: controlar solo algunos procesos, el repo de Bitbucket de respaldo de cada proceso, la documentación adicional y los criterios de triage del proyecto.</li>
</ul><p><strong>Editar configuración</strong>, debajo de la lista de procesos, abre esta pestaña.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:config--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-guardar-proyecto"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar y re-analizar</span><span class="role-b">Solo Admin</span></div><p><b>Guarda la configuración. Guardar y re-analizar además pide a la próxima corrida que regenere memoria e inventario.</b></p><p>Si cambiaste repos o procesos, conviene re-analizar. <strong>Solo guardar</strong> guarda sin pedir el análisis. Si el proyecto estaba activo, sigue activo.</p></div><div class="ay-accion" id="ayuda-descartar-cambios"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar cambios</span><span class="role-b">Solo Admin</span></div><p><b>Vuelve el formulario a la configuración guardada.</b></p><p>Deshace lo que editaste y no guardaste.</p></div></section>
<section class="ay-sec n2" id="ayuda-reglas" data-nivel="2"><h3>Reglas</h3><p class="ay-breve">Los puntos de control escritos en lenguaje natural, de todos los proyectos.</p><p>Las <a href="#ayuda-regla">reglas</a> de todos los proyectos, primero las propuestas. Cada una muestra su estado y de dónde salió: escrita a mano, del alta o aprendida de un incidente.</p><ul>
<li><strong>Por compilar:</strong> la rutina la traduce a un control en la próxima corrida.</li>
<li><strong>Propuesta:</strong> la rutina la sugirió; un Admin la aprueba o la rechaza.</li>
<li><strong>Activa</strong>, <strong>Desactivada</strong> o <strong>Rechazada.</strong></li>
</ul><p>Si la rutina no entendió una regla, lo dice al lado. Reescribila con más detalle.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure><div class="ay-accion" id="ayuda-nueva-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Crear regla</span><span class="role-b">Solo Admin</span></div><p><b>Agrega una regla escrita en lenguaje natural. Se compila en la próxima corrida.</b></p><p>Elegí el proyecto, o Todos los proyectos, y escribí la regla como se la dirías a una persona: qué mirar, el umbral y qué hacer. Por ejemplo: si se ven más de 10 errores de login seguidos, escalar.</p></div><div class="ay-accion" id="ayuda-regla-active"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aprobar o Activar</span><span class="role-b">Solo Admin</span></div><p><b>La regla pasa a controlarse en cada corrida.</b></p><p><strong>Aprobar</strong> acepta una regla propuesta. <strong>Activar</strong> vuelve a encender una regla desactivada.</p></div><div class="ay-accion" id="ayuda-regla-rejected"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Rechazar</span><span class="role-b">Solo Admin</span></div><p><b>Descarta una regla propuesta. No se controla.</b></p><p>La regla queda como Rechazada, para que la rutina no la vuelva a proponer igual.</p></div><div class="ay-accion" id="ayuda-regla-disabled"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Desactivar</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar una regla activa, sin borrarla.</b></p><p>Se puede volver a activar en cualquier momento.</p></div></section>
<section class="ay-sec n2" id="ayuda-registrar" data-nivel="2"><h3>Registrar proyecto</h3><p class="ay-breve">Solo Admin: suma una carpeta de Orchestrator al control.</p><p>Un <a href="#ayuda-proyecto">proyecto</a> es una carpeta de Orchestrator. La rutina detecta sola sus procesos, sus librerías y su documentación a partir de los paquetes publicados, en la versión que está en producción.</p><ol>
<li>Registrá la carpeta desde la lista de detectadas o con el formulario.</li>
<li>La próxima corrida hace el <a href="#ayuda-alta">alta</a>.</li>
<li>Revisá el proyecto y tocá <strong>Activar el control de este proyecto</strong>.</li>
</ol><p>Los procesos que se agreguen después a la carpeta se suman solos.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:registrar:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-registrar-detectada"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar</span><span class="role-b">Solo Admin</span></div><p><b>Registra una carpeta que la rutina detectó en Orchestrator y pide su análisis.</b></p><p>La lista <strong>Carpetas detectadas sin registrar</strong> muestra las carpetas que ve la rutina y que todavía no son proyectos, con sus procesos y su actividad de los últimos 30 días.</p></div><div class="ay-accion" id="ayuda-registrar-analizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar y analizar</span><span class="role-b">Solo Admin</span></div><p><b>Crea el proyecto con el nombre y la carpeta indicados y pide su análisis.</b></p><p>Alcanza con el nombre y la carpeta. Las <strong>Opciones avanzadas</strong> son las mismas que en la <a href="#ayuda-proyecto-config">Configuración</a> y normalmente no hacen falta.</p></div></section>
<section class="ay-sec n2" id="ayuda-ajustes" data-nivel="2"><h3>Ajustes</h3><p class="ay-breve">Solo Admin: criterios globales del triage, severidad y retención.</p><ul>
<li><strong>Criterios de triage globales:</strong> se aplican a todos los proyectos, junto con los de cada uno.</li>
<li><strong>Matriz de severidad:</strong> qué es P1, P2, P3 y P4.</li>
<li><strong>Minutos máximos en Pending:</strong> desde cuándo un job que espera se considera un problema.</li>
<li><strong>Retención:</strong> cuántos días se guardan las corridas y los incidentes cerrados.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:ajustes:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-guardar-ajustes"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar ajustes</span><span class="role-b">Solo Admin</span></div><p><b>Guarda los ajustes. Se usan desde la próxima corrida.</b></p><p>Los cambios en los criterios no reclasifican lo que ya está en el tablero: se aplican a los hallazgos de las próximas corridas.</p></div></section></template>

const nowIso = () => new Date().toISOString();
function rel(iso) {
  if (!iso) return '—';
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'recién';
  if (m < 60) return `hace ${m} min`;

}
const fecha = (iso) => iso ? new Date(iso).toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

function md(src) {
  // Markdown mínimo y seguro: el texto se escapa primero.
  const lines = esc(src || '').split('\n'); let out = ''; let inList = false; let inTable = false;
  const inline = (s) => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\|.*\|$/.test(l.trim())) {
      if (/^\|[\s:-]+\|/.test(l.trim()) && l.replace(/[|\s:-]/g, '') === '') continue;
      if (!inTable) { out += '<div class="tblw"><table>'; inTable = true; }
      out += '<tr>' + l.trim().slice(1, -1).split('|').map((c) => `<td>${inline(c.trim())}</td>`).join('') + '</tr>'; continue;
    } else if (inTable) { out += '</table></div>'; inTable = false; }
    if (/^\s*[-*] /.test(l)) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    const h = l.match(/^(#{1,3}) (.*)/);
    if (h) out += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  if (inList) out += '</ul>'; if (inTable) out += '</table></div>';
  return out;
}

async function writeWork(inc, patch, activity) {
  if (!S.canWrite) return toast('Tu acceso es de solo lectura');
  const ref = S.db.doc(`incidentWork/${inc.id}`);
  const data = { ...(S.work[inc.id] || {}), ...patch, updatedAt: nowIso(), updatedBy: S.me || null };
  delete data.id;
  try {
    await ref.set(data);
    if (activity) await S.db.collection('activity').add({ incidentId: inc.id, projectId: inc.projectId, at: nowIso(), by: S.me || null, ...activity });
    return true;
  } catch (e) { toast(e && e.code === 'invalid_argument' ? 'No tenés permiso para esta acción' : 'No se pudo guardar. Probá de nuevo.'); return false; }
}

function topHtml() {
  const role = { admin:'Admin', operador:'Operador', lector:'Lector' }[S.role];
  // Pulso de la rutina: último run y alarma si está detenida.
  const ult = S.runs[0];
  const intervalo = (S.settings && S.settings.intervalMinutes) || 60;
  let cls = 'unknown', txt = 'Sin corridas todavía';
  if (ult) {
    const min = (Date.now() - Date.parse(ult.finishedAt || ult.startedAt)) / 60000;
    const detenida = min > intervalo * 2.2;
    cls = detenida ? 'critical' : ult.status === 'ok' ? 'ok' : 'warn';
    txt = detenida ? `Rutina detenida · último control ${rel(ult.finishedAt || ult.startedAt)}` : `Último control ${rel(ult.finishedAt || ult.startedAt)}`;
  } else if (S.error) { cls = 'critical'; txt = S.error; }
  const pulse = `<span class="dot ${cls}"></span><span class="txt">${esc(txt)}</span>`;
  // Chips por proyecto con salud.
  const ps = Object.values(S.projects).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const abiertos = (pid) => Object.values(S.incidents).filter((i) => i.projectId === pid && reportable(i) && visibleByWork(i)).length;
  const chip = (id, label, dot, n) => `<button class="chip" data-filter="${esc(id)}" data-tip="filtro" aria-pressed="${(S.filter || '') === id}">${dot}${esc(label)}${n ? ` <span class="n">${n}</span>` : ''}</button>`;
  const total = Object.values(S.incidents).filter((i) => reportable(i) && visibleByWork(i)).length;
  const chips = chip('', 'Todos', '', total) + ps.map((p) => {
    const lvl = p.status !== 'active' ? 'off' : ((p.health && p.health.level) || 'unknown');
    return chip(p.id, p.name || p.id, `<span class="dot ${lvl}" title="${esc(p.status !== 'active' ? PSTATUS[p.status] || p.status : lvl)}"></span>`, abiertos(p.id));
  }).join('');
  return { role, pulse, chips };
}
function renderTop() {

function cardHtml(i, compacta = false) {

  let html = `<article class="card ${esc(i.severity)}${compacta ? ' compact' : ''}" data-inc="${esc(i.id)}">

        <div class="c-title">${esc(i.title)}</div>
        <div class="c-meta">
          <span class="pill ${esc(i.severity)}" data-tip="severidad">${esc(i.severity)}</span>
          <span data-tip="categoria">${esc(CAT[i.category] || i.category)}</span>
          ${S.filter ? '' : `<span class="tag">${esc(projName(i.projectId))}</span>`}
          ${procLabel(i) ? `<span class="tag">${esc(procLabel(i))}</span>` : ''}
          ${rec.length > 1 || i.occurrences > 1 ? `<span class="tag rec" data-tip="recurrencia">×${esc(i.occurrences)} · última ${esc(rel(i.lastSeenAt))}</span>` : `<span>${esc(rel(i.lastSeenAt))}</span>`}
          ${i.reopenCount ? '<span class="tag reo" data-tip="reaparecio">Reapareció</span>' : ''}
          ${i.library ? `<span class="tag" data-tip="libreria">${esc(i.library.name)}${i.library.activity ? ' · ' + esc(i.library.activity) : ''}</span>` : ''}

      </div>

  html += `<div class="actions">
    ${can && !compacta ? bt('delegar', 'user', 'Delegar') + bt('posponer', 'clock', 'Posponer') + bt('descartar', 'x', 'Descartar') + bt('responder', 'reply', 'Responder') + bt('comentar', 'send', 'Comentar') : ''}
    ${can && compacta ? bt('descartar', 'x', 'Descartar') + bt('posponer', 'clock', 'Posponer') + bt('responder', 'reply', 'Responder') : ''}
    <span class="sp"></span><button class="btn link" data-act="detalle" aria-expanded="${Boolean(open)}">${open ? 'Ocultar detalle' : 'Ver detalle'}</button>
  </div>`;
  if (panel === 'comentar') {
    html += `<div class="panel"><textarea id="${esc(i.id)}-coment" placeholder="Comentario para el equipo">${d('coment')}</textarea><div class="actions"><button class="btn primary" data-act="comentar">Agregar comentario</button>${ayudaLink('comentar', 'Más sobre Comentar')}</div></div>`;
  } else if (panel === 'delegar') {
    const hits = S.peopleHits[i.id] || [];
    html += `<div class="panel"><input type="text" id="${esc(i.id)}-buscar" placeholder="Buscar persona por nombre…" value="${d('buscar')}" data-act="buscar" autocomplete="off">
      <div class="people">${hits.map((p) => `<button class="person" data-act="asignar" data-uid="${esc(p.id)}"><img class="av" alt="" src="${esc(p.avatarUrl)}"><span>${esc(p.name)}</span></button>`).join('') || '<span class="muted">Escribí para buscar en tu organización.</span>'}</div>${ayudaLink('delegar', 'Más sobre Delegar')}</div>`;
  } else if (panel === 'posponer') {
    html += `<div class="panel"><div class="opts">
      <button class="opt" data-act="posponer" data-d="1">1 día</button><button class="opt" data-act="posponer" data-d="3">3 días</button><button class="opt" data-act="posponer" data-d="7">1 semana</button>
      <input type="date" id="${esc(i.id)}-fecha" value="${d('fecha')}" style="width:auto" aria-label="Hasta"><button class="btn" data-act="posponer-fecha">Hasta esa fecha</button></div>
      <span class="muted">La tarjeta se oculta hasta esa fecha. Vuelve antes si el problema empeora, y la rutina la vuelve a controlar al vencer. ${ayudaLink('posponer', 'Más sobre Posponer')}</span></div>`;
  } else if (panel === 'descartar') {
    html += `<div class="panel"><div class="opts">${DISMISS.map(([k, l]) => `<button class="opt" data-act="sel" data-k="motivo" data-v="${k}" aria-pressed="${sel.motivo === k}">${l}</button>`).join('')}</div>
      <input type="text" id="${esc(i.id)}-nota" placeholder="Nota opcional (por qué)" value="${d('nota')}">
      <div><button class="btn primary" data-act="descartar" ${sel.motivo ? '' : 'disabled'}>Descartar</button></div>
      <span class="muted">Con lo que indiques, la rutina actualiza la memoria del proyecto y puede proponer una regla. ${ayudaLink('descartar', 'Más sobre Descartar')}</span></div>`;

    html += `<div class="panel"><div class="opts">${RESP.map(([k, l]) => `<button class="opt" data-act="sel" data-k="decision" data-v="${k}" aria-pressed="${sel.decision === k}">${l}</button>`).join('')}</div>

  }
  if (open) html += detailHtml(i);
  return html + '</article>';
}

// Librería del error: quién más la usa y cuántas tarjetas abiertas tiene en otros proyectos.
function libreriaHtml(i) {
  const l = i.library;
  const usan = Object.values(S.projects).filter((p) => p.id !== i.projectId && ((p.inventory || {}).processes || []).some((x) => (x.libraries || []).some((y) => y.name === l.name)));
  const otras = Object.values(S.incidents).filter((x) => x.id !== i.id && x.projectId !== i.projectId && x.status === 'open' && x.library && x.library.name === l.name).length;
  return `<section><h4>Librería</h4><p style="margin:0"><b>${esc(l.name)} ${esc(l.version || '')}</b>${l.activity ? ` · actividad <span class="mono">${esc(l.activity)}</span>` : ''}</p>
    ${usan.length ? `<p class="muted" style="margin:4px 0 0">También la usan: ${usan.map((p) => esc(p.name)).join(', ')}${otras ? ` · ${otras} tarjeta(s) abierta(s) en esos proyectos` : ''}</p>` : ''}</section>`;
}

function detailHtml(i) {
  const ev = i.evidence || {}; const u = ev.ultima || ev.primera || {};
  const a = i.analysis || {}; const t = i.triage || {};
  const lines = [];
  for (const l of (u.logs || []).slice(-6)) lines.push(`<div class="l">${esc(fecha(l.fecha))} · ${esc(l.nivel)} · ${esc(l.mensaje)}</div>`);
  for (const q of (u.queueItems || []).slice(0, 6)) lines.push(`<div class="l">Item ${esc(q.referenciaHash || q.id)} · ${esc(q.estado)} ${esc(q.tipoExcepcion || '')} · ${esc(q.motivo || '')}</div>`);
  for (const j of (u.jobs || []).slice(0, 6)) lines.push(`<div class="l">Job ${esc(String(j.key).slice(0, 8))} · ${esc(j.estado || '')} · ${esc(fecha(j.fin || j.creado))}${j.maquina ? ' · ' + esc(j.maquina) : ''}</div>`);
  if (u.regla) lines.push(`<div class="l">Regla: ${esc(u.regla.texto)} · observado ${esc(u.regla.observado)} (umbral ${esc(u.regla.umbral)})</div>`);
  if (u.errores) for (const e of u.errores.slice(0, 5)) lines.push(`<div class="l">${esc(e)}</div>`);
  const acts = (S.activity[i.id] || []);
  if (!S.activity[i.id]) loadActivity(i.id);
  return `<div class="detail">
    ${i.library ? libreriaHtml(i) : ''}
    <section><h4>Triage</h4><dl class="kv">
      <dt>Decisión</dt><dd>${esc(DEC[i.decision] || i.decision)} · confianza ${esc(t.confidence || '—')}</dd>
      <dt>Por qué</dt><dd>${esc(t.rationale)}</dd>
      ${(t.matchedRules || []).length ? `<dt>Reglas</dt><dd class="mono">${(t.matchedRules).map(esc).join(', ')}</dd>` : ''}
      ${(t.memoryRefs || []).length ? `<dt>Memoria</dt><dd class="mono">${(t.memoryRefs).map(esc).join(', ')}</dd>` : ''}
      <dt>Visto</dt><dd>desde ${esc(fecha(i.firstSeenAt))} · ${esc(i.occurrences)} ocurrencia(s) en ${esc((i.recurrences || []).length)} corrida(s)</dd>
      ${i.process ? `<dt>Proceso</dt><dd class="mono">${esc(i.process)}</dd>` : ''}${i.queue ? `<dt>Cola</dt><dd class="mono">${esc(i.queue)}</dd>` : ''}
    </dl></section>
    ${a.status === 'done' ? `<section><h4>Análisis previo</h4>
      <p style="margin:0 0 8px">${esc(a.summary)}</p>
      ${(a.hypotheses || []).length ? `<ul class="hyp">${a.hypotheses.map((h) => `<li class="${esc(h.likelihood)}"><b>${esc(h.text)}</b><span class="muted">Probabilidad ${esc(h.likelihood)} · ${esc(h.evidence)}</span></li>`).join('')}</ul>` : ''}
      ${(a.suggestedActions || []).length ? `<h4 style="margin-top:10px">Acciones sugeridas</h4><ul style="margin:0;padding-left:18px">${a.suggestedActions.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      ${(a.codeRefs || []).length ? `<h4 style="margin-top:10px">Código</h4>${a.codeRefs.map((c) => `<div class="mono">${esc(c.file)}${c.line ? ':' + esc(c.line) : ''} <span class="muted">${c.pkg ? esc(c.pkg) : '@' + esc(String(c.sha || '').slice(0, 7))}</span> — ${esc(c.note)}</div>`).join('')}` : ''}
      ${(a.docRefs || []).length ? `<h4 style="margin-top:10px">Documentación</h4>${a.docRefs.map((c) => `<div><span class="mono">${esc(c.file)}</span> · ${esc(c.section)} — ${esc(c.note)}</div>`).join('')}` : ''}
      ${a.source ? `<p class="muted">Código analizado: ${a.source.kind === 'repo' ? 'repo de respaldo' : 'paquete'} ${esc(a.source.package)} ${esc(a.source.version)}${a.source.kind === 'package' ? ' (versión desplegada)' : ''}${a.source.library ? ' · librería ' + esc(a.source.library) : ''}.</p>`
        : a.repo && !a.repo.matchesDeployedVersion ? '<p class="muted">El código analizado es de la rama configurada, no del tag de la versión desplegada.</p>' : ''}
      ${a.changes ? `<h4 style="margin-top:10px">Qué cambió en el deploy</h4><p style="margin:0">${esc(a.changes)}</p>` : ''}
    </section>` : a.status === 'pending' ? '<section><h4>Análisis previo</h4><p class="muted" style="margin:0">Pendiente: lo completa la próxima corrida.</p></section>' : ''}
    ${lines.length ? `<section><h4>Evidencia (redactada)</h4><div class="ev">${lines.join('')}</div></section>` : ''}
    ${S.canWrite ? `<div><button class="btn link" data-act="reanalizar-inc" style="padding-left:0">Volver a analizar</button></div>` : ''}
    <section><h4>Actividad</h4>${acts.length ? `<ul class="tl">${acts.map((x) => `<li><time>${esc(fecha(x.at))}</time><span>${who(x.by)} ${esc(x.text || '')}</span></li>`).join('')}</ul>` : '<span class="muted">Sin actividad todavía.</span>'}</section>
  </div>`;
}

const subs = {};
function loadActivity(id) {
  if (S.demo || subs['act-' + id] || !S.db) return;
  S.activity[id] = [];
  subs['act-' + id] = S.db.collection('activity').where('incidentId', '==', id).onSnapshot((s) => {
    S.activity[id] = s.docs.map((d) => d.data()).sort((a, b) => String(a.at).localeCompare(String(b.at)));
    resolveNames(S.activity[id].map((x) => x.by)); schedule();
  }, () => {});
}

function viewInicio() {
  if (!S.db) return `<div class="banner info">${esc(S.error || 'Conectando con el tablero…')}</div>`;
  if (!S.loaded.incidents || !S.loaded.projects) return `<div class="banner info">${S.stale ? 'Los datos tardan en llegar. Puede que estés sin conexión.' : 'Cargando…'}</div>`;
  const todos = Object.values(S.incidents).filter((i) => reportable(i) && visibleByWork(i) && inFilter(i)).sort(orden);
  const mios = todos.filter((i) => { const w = S.work[i.id]; return w && w.state === 'delegated' && w.assignee && w.assignee === S.me; });
  const accion = todos.filter((i) => !mios.includes(i) && i.decision === 'escalate');
  const avisos = todos.filter((i) => !mios.includes(i) && i.decision !== 'escalate');
  let html = '';
  const ult = S.runs[0];
  if (ult && ult.status !== 'ok') html += `<div class="banner bad">${ico('alert', 'ico-s')} La última corrida terminó con errores de colecta. <a href="#corrida-${esc(ult.id)}">Ver detalle</a></div>`;
  if (S.isAdmin) {
    const prop = Object.values(S.rules).filter((r) => r.status === 'proposed' && (!S.filter || r.projectId === S.filter)).length;
    const rev = Object.values(S.projects).filter((p) => p.status === 'review' && (!S.filter || p.id === S.filter));
    const err = Object.values(S.projects).filter((p) => p.status === 'error' && (!S.filter || p.id === S.filter));
    const items = [];
    if (prop) items.push(`<a href="#reglas"><b class="n">${prop}</b> regla(s) propuesta(s) para aprobar</a>`);
    for (const p of rev) items.push(`<a href="#proyecto-${esc(p.id)}">Revisar alta de <b>${esc(p.name)}</b></a>`);
    for (const p of err) items.push(`<a href="#proyecto-${esc(p.id)}">${ico('alert', 'ico-s al-ico')} <b>${esc(p.name)}</b>: ${esc(PSTATUS.error)}</a>`);
    if (items.length) html += `<section><div class="sec-h"><h2>Para revisar</h2>${ayudaBtn('para-revisar', 'Para revisar')}</div><div class="mini">${items.join('')}</div></section>`;
  }
  if (mios.length) html += `<section><div class="sec-h"><h2>Para vos</h2><span class="cnt">${mios.length}</span>${ayudaBtn('para-vos', 'Para vos')}</div><div class="list">${mios.map((i) => cardHtml(i)).join('')}</div></section>`;
  if (accion.length) html += `<section><div class="sec-h"><h2>Requiere acción</h2><span class="cnt">${accion.length}</span>${ayudaBtn('requiere-accion', 'Requiere acción')}</div><div class="list">${accion.map((i) => cardHtml(i)).join('')}</div></section>`;
  if (avisos.length) html += `<section><div class="sec-h"><h2>Avisos</h2><span class="cnt">${avisos.length}</span>${ayudaBtn('avisos', 'Avisos')}</div><div class="list">${avisos.map((i) => cardHtml(i, true)).join('')}</div></section>`;
  if (!todos.length) {
    const p = S.filter && S.projects[S.filter];
    html += `<div class="empty">${ico('check')}<b>Todo en orden</b><span class="muted">${p ? `Nada pendiente en ${esc(p.name)}.` : 'No hay incidentes que requieran acción.'}${ult ? ` Último control ${esc(rel(ult.finishedAt || ult.startedAt))}.` : ''}</span>
      ${!Object.keys(S.projects).length ? `<span class="muted">Todavía no hay proyectos. ${S.isAdmin ? '<a href="#registrar">Registrá el primero</a>.' : 'Un Admin tiene que registrarlos.'}</span>` : ''}</div>`;
  }
  return html + navMore('inicio');
}

function navMore(cur) {
  const l = [['inicio', 'Bandeja'], ['corridas', 'Corridas'], ['no-reportados', 'No reportados'], ['proyectos', 'Proyectos'], ['reglas', 'Reglas']];
  if (S.isAdmin) l.push(['registrar', 'Registrar proyecto'], ['ajustes', 'Ajustes']);
  l.push(['ayuda', 'Ayuda']);
  return `<nav class="more" aria-label="Ver más">${l.map(([h, t]) => `<a href="#${h}" ${cur === h ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</nav>`;
}
const head = (title, sub, back = '#inicio', ayuda) => `<div class="view-h"><a class="back" href="${back}">← Volver</a><div class="view-h-t"><h1>${esc(title)}</h1>${ayuda ? ayudaBtn(ayuda, title) : ''}</div>${sub ? `<span class="muted">${sub}</span>` : ''}</div>`;

function viewCorridas() {
  const runs = S.runs.filter((r) => !S.filter || (r.projects || []).some((p) => p.projectId === S.filter));
  const rows = runs.map((r) => {
    const ps = (r.projects || []).filter((p) => !S.filter || p.projectId === S.filter);
    const nuevos = ps.reduce((a, p) => a + (p.incidentsNew || []).length, 0);
    const rec = ps.reduce((a, p) => a + (p.incidentsUpdated || []).length, 0);
    const esc_ = ps.reduce((a, p) => a + (p.findings || []).filter((f) => f.decision === 'escalate').length, 0);
    return `<a class="rowi" href="#corrida-${esc(r.id)}"><span class="dot ${r.status === 'ok' ? 'ok' : r.status === 'partial' ? 'warn' : 'critical'}"></span>
      <span class="t">${esc(fecha(r.startedAt))} <span class="muted">· ${ps.length} proyecto(s)${r.trigger !== 'scheduled' ? ' · ' + esc(r.trigger) : ''}</span></span>
      <span class="nums">${nuevos} nuevos · ${rec} recurrentes · ${esc_} escalados</span></a>`;
  }).join('');
  return head('Corridas', 'Cada ejecución de la rutina, con lo que revisó y encontró.', '#inicio', 'corridas') + `<div class="box"><div class="rows">${rows || '<span class="muted">Todavía no hay corridas.</span>'}</div></div>` + navMore('corridas');
}

function viewCorrida(id) {
  const r = S.runs.find((x) => x.id === id);
  if (!r) return head('Corrida', 'No está entre las últimas 50 corridas.', '#corridas');
  const ps = (r.projects || []).filter((p) => !S.filter || p.projectId === S.filter);
  const icoRes = (res) => res === 'alerta' ? ico('alert', 'ico-s al-ico') : res === 'ok' ? ico('check', 'ico-s ok-ico') : ico('minus', 'ico-s om-ico');
  return head(`Corrida del ${fecha(r.startedAt)}`, `${esc(r.status === 'ok' ? 'Completa' : r.status === 'partial' ? 'Parcial' : 'Con errores')} · duró ${r.finishedAt ? Math.max(1, Math.round((Date.parse(r.finishedAt) - Date.parse(r.startedAt)) / 60000)) + ' min' : '—'}${r.sessionUrl ? ` · <a href="${esc(r.sessionUrl)}" target="_blank" rel="noopener">sesión</a>` : ''}`, '#corridas', 'corrida-detalle')
    + ps.map((p) => `<section class="box">
      <div class="sec-h" style="margin:0"><h2>${esc(projName(p.projectId))}</h2><span class="cnt">${esc(fecha(p.window && p.window.desde))} → ${esc(fecha(p.window && p.window.hasta))}</span></div>
      ${p.signals ? `<div class="nums">${esc(p.signals.jobs)} jobs · ${esc(p.signals.logsErrorFatal)} logs error/fatal · ${esc(p.signals.queueItemsFallidos)} items fallidos · ${esc(p.signals.queueItemsAbandonados)} abandonados</div>` : ''}
      <div class="tblw"><table><thead><tr><th></th><th>Punto de control</th><th>Observado</th></tr></thead><tbody>
      ${(p.checks || []).map((c) => `<tr><td>${icoRes(c.resultado)}</td><td>${esc(c.nombre)}</td><td class="mono">${esc(c.observado ?? '—')}</td></tr>`).join('')}</tbody></table></div>
      ${(p.findings || []).length ? `<h4 class="muted" style="margin:4px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.07em">Hallazgos y triage</h4>
        <div class="rows">${p.findings.map((f) => `<a class="rowi" href="#incidente-${esc(f.incidentId)}"><span class="pill ${esc(f.severity)}">${esc(f.severity)}</span>
          <span class="t">${esc(f.title)}<br><span class="muted">${esc(DEC[f.decision])}${f.recurrence ? ' · recurrencia' : ' · nuevo'}${f.reopened ? ' · reabierto' : ''} — ${esc(f.rationale)}</span></span>${ico('chev', 'ico-s om-ico')}</a>`).join('')}</div>` : '<span class="muted">Sin hallazgos.</span>'}
      ${(p.errors || []).length ? `<div class="ev">${p.errors.map((e) => `<div class="l">${esc(e)}</div>`).join('')}</div>` : ''}
    </section>`).join('') + navMore('');
}

function viewIncidente(id) {
  const i = S.incidents[id];
  if (!i) return head('Incidente', 'Este incidente ya no está abierto o se depuró por retención.', '#corridas');
  S.open[id] = true;
  return head(i.title, `${esc(projName(i.projectId))} · ${esc(DEC[i.decision])}`, '#inicio', 'tarjeta') + `<div class="list">${cardHtml(i)}</div>` + navMore('');
}

function viewNoReportados() {
  const xs = Object.values(S.incidents).filter((i) => inFilter(i) && i.status === 'open' && (!reportable(i) || !visibleByWork(i))).sort(orden);
  const motivo = (i) => {
    const w = S.work[i.id];
    if (w && w.state === 'snoozed') return `Pospuesto hasta ${fecha(w.snoozeUntil)}`;
    if (w && w.state === 'dismissed') return `Descartado: ${(DISMISS.find((d) => d[0] === w.dismissReason) || [0, ''])[1]}`;
    if (w && w.state === 'responded') return `Respondido: ${(RESP.find((d) => d[0] === (w.response || {}).decision) || [0, ''])[1]}`;
    return DEC[i.decision];
  };

function subProject(id) {
  if (S.demo || subs['proj-' + id] || !S.db) return;
  subs['proj-' + id] = true;
  S.db.doc(`memory/${id}`).onSnapshot((d) => { S.memory[id] = d.exists ? d.data() : null; schedule(); }, () => {});
  S.db.collection('history').where('projectId', '==', id).orderBy('at', 'desc').limit(100).onSnapshot((s) => {
    S.history[id] = s.docs.map((d) => ({ id: d.id, ...d.data() })); resolveNames(S.history[id].map((h) => h.by)); schedule();
  }, () => {});
}

// Tooltip: explicación breve al pasar el mouse (o al enfocar con teclado), con link a la ayuda.
const TIP = { el: null, target: null, t: null };
function tipDe(el) {
  const d = el.dataset;
  if (d.tip) return d.tip;
  if (!d.act || SIN_TIP.includes(d.act)) return null;
  if (d.act === 'panel') return d.p;
  if (d.act === 'regla') return 'regla-' + d.s;
  if (d.act === 'tab') return 'proyecto-' + d.t;
  return TIP_ALIAS[d.act] || d.act;
}
function mostrarTip(el) {
  const id = tipDe(el); const x = id && AYUDA_TIPS[id];
  if (!x) return;
  const tip = $('#tip');
  tip.innerHTML = `<b>${esc(x.titulo)}</b>${esc(x.breve)}<br><a href="#ayuda-${esc(id)}">Más detalle en la ayuda →</a>`;
  tip.hidden = false; TIP.target = el; el.setAttribute('aria-describedby', 'tip');
  const r = el.getBoundingClientRect(); const w = tip.offsetWidth; const h = tip.offsetHeight;
  let top = r.bottom + 6; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  tip.style.top = `${top}px`; tip.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
}
function ocultarTip(soloSiHuerfano) {
  if (!TIP.target || (soloSiHuerfano && TIP.target.isConnected)) return;
  clearTimeout(TIP.t); $('#tip').hidden = true; TIP.target.removeAttribute('aria-describedby'); TIP.target = null;
}
const candidatoTip = (e) => { const el = e.target.closest && e.target.closest('[data-tip],[data-act]'); return el && !el.closest('[inert]') && el.tagName !== 'INPUT' && tipDe(el) ? el : null; };
document.addEventListener('pointerover', (e) => {
  if (e.pointerType === 'touch') return;
  if (e.target.closest && e.target.closest('#tip')) return clearTimeout(TIP.t);
  const el = candidatoTip(e);
  clearTimeout(TIP.t);
  if (!el) { if (TIP.target) TIP.t = setTimeout(() => ocultarTip(), 250); return; }
  if (el === TIP.target) return;
  TIP.t = setTimeout(() => { ocultarTip(); mostrarTip(el); }, TIP.target ? 0 : 450);
});
document.addEventListener('focusin', (e) => { const el = candidatoTip(e); if (el && el.matches(':focus-visible')) { clearTimeout(TIP.t); ocultarTip(); mostrarTip(el); } });
document.addEventListener('focusout', (e) => { if (e.target === TIP.target && !(e.relatedTarget && e.relatedTarget.closest('#tip'))) TIP.t = setTimeout(() => ocultarTip(), 150); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ocultarTip(); });
document.addEventListener('pointerdown', (e) => { if (!(e.target.closest && e.target.closest('#tip'))) { clearTimeout(TIP.t); ocultarTip(); } }, true);
window.addEventListener('scroll', () => ocultarTip(), { passive: true });

// ---------- eventos ----------

document.addEventListener('click', async (e) => {

// ---------- arranque ----------
async function start() {
  S.irAyuda = true;
  render();
  const cl = window.claude;
  const [db, user] = await Promise.all([cl && cl.use ? cl.use('db') : null, cl && cl.use ? cl.use('user') : null]);
  S.user = user;
  if (!db) { S.error = 'El tablero necesita una sesión de claude.ai para mostrar datos.'; return schedule(); }
  S.db = db;
  if (user) {
    S.me = await user.id();
    S.isAdmin = await user.canEdit();
    const w = await user.can('data.write');
    S.canWrite = S.isAdmin || w === true || w === null;
    S.role = S.isAdmin ? 'admin' : S.canWrite ? 'operador' : 'lector';
    if (S.me) resolveNames([S.me]);
  }
  const timer = setTimeout(() => { S.stale = true; schedule(); }, 10000);
  const onErr = (e) => { clearTimeout(timer); S.error = e && e.code === 'revoked' ? 'Tu acceso al tablero cambió.' : 'No se pudo leer el tablero.'; schedule(); };
  const coll = (name, key, fn) => db.collection(name).onSnapshot((s) => { clearTimeout(timer); S[key] = {}; for (const d of s.docs) S[key][d.id] = { id: d.id, ...d.data() }; S.loaded[key] = true; if (fn) fn(); schedule(); }, onErr);
  coll('projects', 'projects');
  coll('rules', 'rules');
  coll('incidentWork', 'work', () => resolveNames(Object.values(S.work).map((w) => w.assignee)));
  db.collection('incidents').where('status', '==', 'open').onSnapshot((s) => { clearTimeout(timer); S.incidents = {}; for (const d of s.docs) S.incidents[d.id] = { id: d.id, ...d.data() }; S.loaded.incidents = true; schedule(); }, onErr);
  db.collection('runs').orderBy('startedAt', 'desc').limit(50).onSnapshot((s) => { S.runs = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.runs = true; schedule(); }, onErr);
  db.doc('config/settings').onSnapshot((d) => { S.settings = d.exists ? d.data() : null; schedule(); }, () => {});
  db.doc('config/discovery').onSnapshot((d) => { S.discovery = d.exists ? d.data() : null; schedule(); }, () => {});
  coll('libraries', 'libraries');
  setInterval(schedule, 60000); // refresca los "hace X min"
}
start();
})();
