<section class="ay-sec n2" id="ayuda-pagina-proyecto" data-nivel="2"><h3>A project&#39;s page</h3><p class="ay-breve">Processes, memory, discrepancies, documentation, rules, inventory and settings of a project.</p><p>At the top are the folder, the number of processes, the status and how many discrepancies are pending, with the actions. Below, each process with its role, its name in Orchestrator, the package and the deployed version, and its libraries. If the last analysis failed, a red notice says which access or data was missing. Then come seven tabs. The notes from the last analysis (what it found and the criteria it suggests) are collapsed at the top of the Process memory tab.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:memoria--></div><figcaption>Example with sample data</figcaption></figure><div class="ay-accion" id="ayuda-ver-bandeja"><div class="ay-accion-h"><span class="btn" aria-hidden="true">View open topics</span></div><p><b>Opens the inbox filtered by this project.</b></p><p>It appears when the project has topics in the inbox. It applies the <a href="#ayuda-scope">project selector</a>.</p></div><div class="ay-accion" id="ayuda-activar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Activate monitoring</span><span class="role-b">Only Admin</span></div><p><b>Starts monitoring the project on every run. It also resumes paused monitoring.</b></p><p>It appears when the project finished its <a href="#ayuda-alta">onboarding</a> and is <strong>In review</strong>: before activating it, review the process memory, the proposed rules and the inventory. If the project is <strong>Paused</strong>, the button says <strong>Resume monitoring</strong>.</p></div><div class="ay-accion" id="ayuda-pausar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pause monitoring</span><span class="role-b">Only Admin</span></div><p><b>Stops monitoring the project until it is resumed. It deletes nothing.</b></p><p>Useful during a long maintenance or while a process is being rebuilt. Open topics stay as they are and the project looks gray.</p></div><div class="ay-accion" id="ayuda-reanalizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Request re-analysis</span><span class="role-b">Only Admin</span></div><p><b>Asks the next run to regenerate the process memory, the inventory and the proposed rules.</b></p><p>It is worth doing after a big change in the process or its documentation. The project stays active in the meantime.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-memoria" data-nivel="3"><h4>Process memory tab</h4><p class="ay-breve">What the process does, according to the onboarding: the context the routine uses.</p><p>The <a href="#ayuda-memoria-de-proceso">process memory</a>: what the process does, its steps, systems, queues and known exceptions. The onboarding generates it from the code and the documentation.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-produccion" data-nivel="3"><h4>Production memory tab</h4><p class="ay-breve">What happened in production: team replies, deploys and re-checks.</p><p>The <a href="#ayuda-memoria-de-produccion">production memory</a>: a summary at the top and below it the history, newest to oldest, with who replied and the ticket if there is one.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:produccion--></div><figcaption>Example with sample data</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-discrepancias" data-nivel="3"><h4>Discrepancies tab</h4><p class="ay-breve">What does not match between the code, the documentation and Orchestrator. It is replied to, snoozed or dismissed here: it does not go to the inbox.</p><p>The <a href="#ayuda-discrepancia">discrepancies</a> found by the project&#39;s analysis, for example:</p><ul>
<li>a queue or an asset that appears in the SDD or in the code and does not exist in Orchestrator, or the other way around;</li>
<li>a trigger with a different frequency than documented;</li>
<li>the Dispatcher and the Performer not using the same queue;</li>
<li>documentation that does not match the code;</li>
<li>a package that publishes screenshots or data it should not.</li>
</ul><p>Each one shows its type, the process, what was found, a suggestion and where it comes from. They are project cards: they <strong>do not appear in the inbox</strong> and do not change its health. The number on the tab, and the one in the project list, counts the pending ones.</p><ul>
<li><strong>Pending:</strong> the ones the routine keeps detecting and nobody has handled.</li>
<li><strong>Handled:</strong> the ones replied to, snoozed or dismissed, with who did it, and the <strong>resolved</strong> ones, which the routine stopped detecting.</li>
</ul><p>On each re-analysis the routine updates the list: it adds the new ones, closes the ones it no longer detects and respects what the team replied. A dismissed discrepancy does not appear again as new. If one that was considered fixed is detected again, it reappears as pending with the <strong>Reappeared</strong> mark.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:discrepancias--></div><figcaption>Example with sample data</figcaption></figure><div class="ay-accion" id="ayuda-disc-responder"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Respond</span></div><p><b>Records what will be done about the discrepancy. It goes into the project&#39;s production memory.</b></p><p>Pick a decision and add notes:</p><ul>
<li><strong>Fix the documentation</strong>, <strong>Fix in Orchestrator</strong> or <strong>Fix the code:</strong> there is something to repair. You can enter the ticket or the reference. The discrepancy moves to Handled and the routine closes it when a re-analysis stops detecting it.</li>
<li><strong>It is correct as is:</strong> there is nothing to fix. The routine records it and does not ask again.</li>
<li><strong>Hand over to development:</strong> the development team takes it.</li>
</ul></div><div class="ay-accion" id="ayuda-disc-posponer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Snooze</span></div><p><b>Takes the discrepancy out of the pending ones until a date.</b></p><p>Pick 1 week, 1 month, 3 months or a date. When it expires it goes back to Pending, if the routine still detects it.</p></div><div class="ay-accion" id="ayuda-disc-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Dismiss</span></div><p><b>Closes the discrepancy with a reason. The routine does not show it again as new.</b></p><p>Reasons: <strong>It is correct as is</strong>, <strong>The routine got it wrong</strong>, <strong>Already fixed</strong> or <strong>Not relevant</strong>, with an optional note. It stays in Handled and in the production memory.</p></div><div class="ay-accion" id="ayuda-disc-reabrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Reopen</span></div><p><b>Undoes the reply, the dismissal or the snooze: the discrepancy is pending again.</b></p><p>It appears on handled discrepancies that the routine still detects.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-documentacion" data-nivel="3"><h4>Documentation tab</h4><p class="ay-breve">The project&#39;s documents (PDD, SDD, Runbook and others), uploaded by hand and stored as Markdown.</p><p>The routine reads on its own the documentation that comes inside the published packages. When a document is not there, or is out of date, an Admin uploads it here. You can upload <strong>as many documents as needed</strong>. Each one has a category and, if you like, a title or a description:</p><ul>
<li><strong>PDD:</strong> the business process, its steps and its exceptions.</li>
<li><strong>SDD:</strong> how the solution is built, with its queues, assets and triggers.</li>
<li><strong>Runbook:</strong> what to do for each failure and whom to escalate to.</li>
<li><strong>Other:</strong> manuals, how-to guides, service agreements or any other useful document.</li>
</ul><p>There can be several of the same category, for example one SDD per process. Everything is stored <strong>as Markdown</strong> (.md), without images. The routine uses these documents in the project analysis, for the process memory and the discrepancies, and in the prior analysis of each topic. After uploading one it is worth using <strong>Request re-analysis</strong>.</p><p>A Reader or an Operator can view and download the documents; only an Admin uploads them, removes them or deactivates the ones that come with the package. To change a document, upload the new one and remove the old one.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:documentacion--></div><figcaption>Example with sample data · Admin view</figcaption></figure><div class="ay-accion" id="ayuda-doc-pkg"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Deactivate or Use again</span><span class="role-b">Only Admin</span></div><p><b>Makes the routine stop using, or use again, a document that comes inside the published package.</b></p><p>Below the documents uploaded by hand, <strong>In the published packages</strong> lists the documents the routine found inside each package, with the process and the version. They are <strong>In use</strong> unless an Admin deactivates them.</p><p>It is useful when the package document is old or about something else: deactivate it and, if needed, upload the right one. It applies from the next run; it is worth using <strong>Request re-analysis</strong> to rebuild the process memory without that document. If a new version of the package brings the document with the same path, it stays deactivated.</p></div><div class="ay-accion" id="ayuda-doc-subir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Upload file</span><span class="role-b">Only Admin</span></div><p><b>Uploads a Word (.docx), a PDF, a .md or a .txt and converts it to Markdown. It is reviewed before saving.</b></p><ul>
<li><strong>Word (.docx):</strong> headings, paragraphs, bold, lists and tables are converted. Images, headers and the table of contents are not carried over.</li>
<li><strong>PDF:</strong> the text is recovered. A PDF does not keep its structure, so headings are inferred from the font size and tables come out as running text: it is worth reviewing. A scanned PDF has no text to read. If the original Word file exists, it gives a better result.</li>
<li><strong>.md or .txt:</strong> taken as they are.</li>
</ul><p>The category is suggested from the file name and can be changed. Nothing is saved until you click <strong>Save document</strong>.</p></div><div class="ay-accion" id="ayuda-doc-pegar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Paste text</span><span class="role-b">Only Admin</span></div><p><b>Opens a box to paste or write the document, in Markdown or plain text.</b></p><p>It is useful for documents that are in a wiki or in a format that cannot be uploaded.</p></div><div class="ay-accion" id="ayuda-doc-guardar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Save document</span><span class="role-b">Only Admin</span></div><p><b>Saves the document as Markdown, with its category and title, after masking emails, IDs and usernames.</b></p><p>Before saving you choose the category, you can write a title or a description, and you can see the Markdown and correct it. The dashboard does not store personal data: emails, ID numbers and Windows usernames are masked automatically, but <strong>people&#39;s names are not detected</strong>: remove them by hand. Each document accepts up to 230 KB of text.</p></div><div class="ay-accion" id="ayuda-doc-ver"><div class="ay-accion-h"><span class="btn" aria-hidden="true">View</span></div><p><b>Shows the saved document, formatted.</b></p><p><strong>Hide</strong> closes it.</p></div><div class="ay-accion" id="ayuda-doc-descargar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Download .md</span></div><p><b>Downloads the saved document as a Markdown file.</b></p><p>It asks for confirmation before saving the file. If this view does not support downloads, the button does not appear.</p></div><div class="ay-accion" id="ayuda-doc-quitar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Remove</span><span class="role-b">Only Admin</span></div><p><b>Deletes the document from the project. It asks for confirmation.</b></p><p>It cannot be undone. The process memory already generated with that document does not change until the next re-analysis.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-reglas" data-nivel="3"><h4>Rules tab</h4><p class="ay-breve">This project&#39;s rules and their status.</p><p>The project&#39;s rules, with the same actions as the <a href="#ayuda-reglas">Rules</a> screen.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-inventario" data-nivel="3"><h4>Inventory tab</h4><p class="ay-breve">Processes, queues, triggers and assets of the folder (for assets, only the name).</p><p>The folder&#39;s <a href="#ayuda-inventario">inventory</a>: processes with their version and whether they are part of the project, queues with their retries, triggers and assets. For assets only the name and type are shown.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:inventario--></div><figcaption>Example with sample data</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-config" data-nivel="3"><h4>Settings tab</h4><p class="ay-breve">The project&#39;s name, folder, processes, documentation and criteria. Only an Admin can edit it.</p><p>A Reader or an Operator sees the project&#39;s triage criteria and documentation. An Admin can edit:</p><ul>
<li>the name and the Orchestrator folder;</li>
<li>under <strong>Advanced options</strong>: monitoring only some processes, each process&#39;s backup Bitbucket repo, the additional documentation and the project&#39;s triage criteria.</li>
</ul><p><strong>Edit settings</strong>, below the list of processes, opens this tab.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:config--></div><figcaption>Example with sample data</figcaption></figure><div class="ay-accion" id="ayuda-guardar-proyecto"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Save and re-analyze</span><span class="role-b">Only Admin</span></div><p><b>Saves the settings. Save and re-analyze also asks the next run to regenerate the memory and the inventory.</b></p><p>If you changed repos or processes, it is worth re-analyzing. <strong>Save only</strong> saves without requesting the analysis. If the project was active, it stays active.</p></div><div class="ay-accion" id="ayuda-descartar-cambios"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Discard changes</span><span class="role-b">Only Admin</span></div><p><b>Returns the form to the saved settings.</b></p><p>It undoes what you edited and did not save.</p></div></section>
<section class="ay-sec n2" id="ayuda-reglas" data-nivel="2"><h3>Rules</h3><p class="ay-breve">The checkpoints written in natural language, for all projects.</p><p>The <a href="#ayuda-regla">rules</a> of all projects. At the top, the <strong>Proposals to approve</strong>; then, for an Admin, the <strong>New rule</strong> form, and at the end the rest. Each one shows its status, its project, where it came from (by hand, from onboarding, learned from an incident, by similarity or from the daily review), its exceptions and how the routine understood it.</p><ul>
<li><strong>To compile:</strong> the routine translates it into a check in the next run.</li>
<li><strong>Proposed:</strong> the routine suggested it and says why; an Admin approves or rejects it. With <a href="#ayuda-auto-reglas">automatic approval</a> on there are no proposals: rules are born active.</li>
<li><strong>Active</strong>, <strong>Disabled</strong> or <strong>Rejected.</strong></li>
<li><strong>Suggested change:</strong> the daily review found something to adjust in the rule.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:--></div><figcaption>Example with sample data · Admin view</figcaption></figure><div class="ay-accion" id="ayuda-nueva-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Create rule</span><span class="role-b">Only Admin</span></div><p><b>Adds a rule written in natural language. It is compiled in the next run.</b></p><p>Pick the project, or All projects, and write the rule the way you would tell it to a person: what to look at, the threshold and what to do. For example: if more than 10 login errors in a row are seen, escalate.</p></div><div class="ay-accion" id="ayuda-regla-active"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Approve or Activate</span><span class="role-b">Only Admin</span></div><p><b>The rule starts being checked on every run.</b></p><p><strong>Approve</strong> accepts a proposed rule. <strong>Activate</strong> turns a disabled rule back on.</p></div><div class="ay-accion" id="ayuda-regla-rejected"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Reject</span><span class="role-b">Only Admin</span></div><p><b>Discards a proposed rule. It is not checked.</b></p><p>The rule stays as Rejected, so the routine does not propose it again in the same form.</p></div><div class="ay-accion" id="ayuda-regla-disabled"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Deactivate</span><span class="role-b">Only Admin</span></div><p><b>Stops checking an active rule, without deleting it.</b></p><p>It can be activated again at any time.</p></div><div class="ay-accion" id="ayuda-re-abrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Edit or Review</span><span class="role-b">Only Admin</span></div><p><b>Opens the rule editor in the list. It says Review when the routine suggests a change.</b></p><p>It is the same <a href="#ayuda-editor-regla">editor</a> that opens from a topic.</p></div></section>
<section class="ay-sec n3" id="ayuda-editor-regla" data-nivel="3"><h4>Rule editor</h4><p class="ay-breve">Changes a rule&#39;s text, severity or exceptions, or deactivates or deletes it.</p><p>It opens with <strong>Adjust rule</strong> from a topic or with <strong>Edit</strong> in the rules list. Only Admins can change anything; an Operator sees the rule and its exceptions.</p><ul>
<li><strong>There is a condition in which it does not apply:</strong> write the <strong>exception</strong>, for example &quot;it is Monday before 9&quot;. It applies from the next run.</li>
<li><strong>It warns with a severity that does not fit:</strong> pick another <strong>severity</strong>, from P1 to P4. It changes when you save.</li>
<li><strong>The threshold or the condition is wrong:</strong> fix the <strong>text</strong>. It applies from the next run.</li>
<li><strong>You do not want it to check for a while:</strong> <strong>Deactivate</strong>.</li>
<li><strong>The rule is useless:</strong> <strong>Delete rule</strong>. It asks for confirmation and cannot be undone.</li>
</ul><p>When the text or an exception changes, the rule becomes <strong>To compile</strong> and the routine then shows how it understood it. Exceptions can be removed. From a topic, <strong>Also dismiss this topic</strong> closes the incident in the same step, as a false positive.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:editor--></div><figcaption>Example with sample data · Admin view, with a suggestion from the routine</figcaption></figure><div class="ay-accion" id="ayuda-re-guardar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Save changes</span><span class="role-b">Only Admin</span></div><p><b>Saves the text, the severity and the exceptions. On a proposal it says Save and approve.</b></p><p>On a disabled or rejected rule it says <strong>Save and activate</strong>. The change is recorded in the topic&#39;s activity if it was made from one.</p></div><div class="ay-accion" id="ayuda-re-sev"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Severity</span><span class="role-b">Only Admin</span></div><p><b>Picks the severity the rule warns with, from P1 to P4. It changes when you save.</b></p><p>It does not appear on rules that mark topics as known or ignore them, because those do not warn.</p></div><div class="ay-accion" id="ayuda-re-estado"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Deactivate (editor)</span><span class="role-b">Only Admin</span></div><p><b>Stops checking this rule right away, without deleting it.</b></p><p>It can be activated again from the rules list.</p></div><div class="ay-accion" id="ayuda-re-eliminar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Delete rule</span><span class="role-b">Only Admin</span></div><p><b>Deletes the rule for good. It asks for confirmation.</b></p><p>If you only want it to stop checking for a while, it is better to <strong>Deactivate</strong>.</p></div><div class="ay-accion" id="ayuda-re-sug-aplicar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Apply suggestion</span><span class="role-b">Only Admin</span></div><p><b>Loads the change the routine suggests into the form; you confirm with Save.</b></p><p>If the suggestion is to deactivate the rule, the button says <strong>Deactivate</strong> and deactivates it directly. See <a href="#ayuda-sugerencia">routine suggestions</a>.</p></div><div class="ay-accion" id="ayuda-re-sug-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">No, thanks</span><span class="role-b">Only Admin</span></div><p><b>Dismisses the routine&#39;s suggestion. It is not suggested again for 90 days.</b></p><p>The rule stays as it was.</p></div></section>
<section class="ay-sec n3" id="ayuda-propuestas" data-nivel="3"><h4>Routine proposals</h4><p class="ay-breve">Rules and changes the routine proposes. An Admin approves them, unless automatic approval is on.</p><p>The routine proposes on its own, and everything arrives in <strong>To review</strong> and in <strong>Proposals to approve</strong>:</p><ul>
<li><strong>By <a href="#ayuda-similitud">similarity</a>:</strong> when an Admin approves or edits a rule, the routine offers it to other processes that use the same portal, the same application or the same library.</li>
<li><strong><a href="#ayuda-sugerencia">Suggested changes</a>:</strong> once a day it reviews the last 30 days and flags the rules that are worth touching.</li>
<li><strong>New rules from the daily review:</strong> if the same topic without a rule was dismissed several times, or a notice repeats without anyone looking at it.</li>
<li><strong>Learned from an incident:</strong> from dismissals and replies.</li>
</ul><p>At most 3 proposals per project arrive at a time.</p><p>By default nothing is activated on its own. If an Admin turned on <a href="#ayuda-auto-reglas">automatic approval</a> in Settings, <strong>new rules</strong> are activated immediately and marked as <strong>automatically approved</strong>. Suggested changes to rules that already exist always wait for a person.</p></section>
<section class="ay-sec n2" id="ayuda-registrar" data-nivel="2"><h3>Register project</h3><p class="ay-breve">Admin only: adds an Orchestrator folder to monitoring.</p><p>You get there from <strong>Projects → Register project</strong>. A <a href="#ayuda-proyecto">project</a> is an Orchestrator folder. The routine detects its processes, its libraries and its documentation on its own from the published packages, in the version that is in production.</p><ol>
<li>Register the folder from the <a href="#ayuda-propuestos">proposed projects</a> or with the form.</li>
<li>The next run does the <a href="#ayuda-alta">onboarding</a>.</li>
<li>Review the project and click <strong>Activate monitoring for this project</strong>.</li>
</ol><p>Processes added to the folder later are picked up automatically.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:registrar:--></div><figcaption>Example with sample data</figcaption></figure><div class="ay-accion" id="ayuda-registrar-analizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Register and analyze</span><span class="role-b">Only Admin</span></div><p><b>Creates the project with the given name and folder and requests its analysis.</b></p><p>The name and the folder are enough. The <strong>Advanced options</strong> are the same as in <a href="#ayuda-proyecto-config">Settings</a> and are normally not needed.</p></div></section>
<section class="ay-sec n3" id="ayuda-propuestos" data-nivel="3"><h4>Proposed projects</h4><p class="ay-breve">Orchestrator folders with processes that the scan found and that are not monitored yet.</p><p>The routine scans the folder set in <a href="#ayuda-descubrimiento">Settings</a>: when an Admin requests it and, in addition, once a day. Each folder with processes that is not yet a project appears here as a <a href="#ayuda-proyecto-propuesto">proposed project</a>, with its processes and its activity over the last 30 days.</p><p>Nothing is registered on its own: an Admin chooses what to monitor. If there are no proposals, the screen says why and leads to Settings.</p><div class="ay-accion" id="ayuda-registrar-detectada"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Register</span><span class="role-b">Only Admin</span></div><p><b>Registers a proposed project and requests its analysis.</b></p><p>The project takes the proposed name and folder. They can be changed later in its <a href="#ayuda-proyecto-config">Settings</a>.</p></div><div class="ay-accion" id="ayuda-registrar-todos"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Register all</span><span class="role-b">Only Admin</span></div><p><b>Registers at once all the proposed projects left in the list. It asks for confirmation.</b></p><p>It is better to ignore the non-production folders first. The routine does up to 3 onboardings per run: with many projects, the analysis takes several hours.</p></div><div class="ay-accion" id="ayuda-ignorar-detectada"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ignore</span><span class="role-b">Only Admin</span></div><p><b>Takes the folder out of the proposals. It is not proposed again.</b></p><p>For test or development folders, or ones you do not want to monitor.</p></div><div class="ay-accion" id="ayuda-restaurar-ignoradas"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Propose them again</span><span class="role-b">Only Admin</span></div><p><b>Shows the ignored folders as proposals again.</b></p><p>It appears below the list when there are ignored folders.</p></div></section>
<section class="ay-sec n2" id="ayuda-ajustes" data-nivel="2"><h3>Settings</h3><p class="ay-breve">Admin only: folder to scan, global triage criteria, thresholds, retention and rule approval.</p><ul>
<li><strong>Projects to monitor:</strong> the <a href="#ayuda-descubrimiento">Orchestrator folder to scan</a>.</li>
<li><strong>Global triage criteria:</strong> they apply to all projects, together with each project&#39;s own.</li>
<li><strong>Severity matrix:</strong> what P1, P2, P3 and P4 are.</li>
<li><strong>Maximum minutes in Pending:</strong> from when a waiting job is considered a problem.</li>
<li><strong>Retention:</strong> how many days runs and closed incidents are kept.</li>
<li><strong>Rules:</strong> the <a href="#ayuda-auto-reglas">automatic approval</a>.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:ajustes:--></div><figcaption>Example with sample data</figcaption></figure><div class="ay-accion" id="ayuda-guardar-ajustes"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Save settings</span><span class="role-b">Only Admin</span></div><p><b>Saves the folder, the criteria, the thresholds and the retention. They are used from the next run.</b></p><p>Changes to the criteria do not reclassify what is already on the dashboard: they apply to the findings of upcoming runs. Automatic approval does not depend on this button: it is saved when you change the switch.</p></div><div class="ay-accion" id="ayuda-idioma"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Español / English</span><span class="role-b">Only Admin</span></div><p><b>Changes the language of the whole dashboard and of what the routine writes from the next run. It applies to everyone.</b></p><p>It is a <strong>global</strong> setting: an Admin picks it and everyone sees the same. Menus, buttons, messages and this help change immediately, and from the next run the routine writes the topic titles, the analyses, the memories and the rules it proposes in that language.</p><p>Each text is written <strong>only once</strong>, in the language in force when it was generated: what was already stored is neither translated nor duplicated. To get a project&#39;s memory in the new language, re-analyze it from the project. Texts written by a person (notes, comments, rule text) and uploaded documents stay as they were written.</p></div><div class="ay-accion" id="ayuda-auto-reglas"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Automatically approve the rules the routine proposes</span><span class="role-b">Only Admin</span></div><p><b>Switch. When on, the rules the routine proposes become active right away, without waiting for an Admin.</b></p><p>It comes <strong>off</strong>: every rule the routine proposes waits for an Admin to approve it.</p><p>When you turn it on:</p><ul>
<li>The proposed rules that were waiting are approved right away. Reject first the ones you do not want.</li>
<li>From then on, every rule the routine proposes is born active: it does not go through <strong>Proposals to approve</strong>.</li>
<li>Rules approved this way are marked as <strong>automatically approved</strong> and can be deactivated, edited or deleted like any other.</li>
<li><strong>Suggested changes</strong> to rules that already exist (an exception, another severity, deactivating it) are not applied on their own.</li>
</ul><p>It is saved immediately. When you turn it off, rules that are already active stay active and new ones go back to waiting for approval.</p></div></section>
<section class="ay-sec n3" id="ayuda-descubrimiento" data-nivel="3"><h4>Projects to monitor</h4><p class="ay-breve">The Orchestrator folder the routine scans to propose projects. It is the first step on a new dashboard.</p><p>In Orchestrator, production projects are usually inside a single folder, for example <code>Produccion</code>. Type it here, with its full path if it is inside another (<code>Clientes/Produccion</code>). You can enter several, separated by commas.</p><p>The routine goes through all the folders inside. Each one that has processes and is not monitored yet moves to <a href="#ayuda-propuestos">Proposed projects</a>. Whatever is outside that folder is not proposed.</p><p>For the scan to see the subfolders, the application the routine uses to read Orchestrator has to be able to see them. If it cannot, a notice below the field says what is missing.</p><div class="ay-accion" id="ayuda-escanear"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Save and scan</span><span class="role-b">Only Admin</span></div><p><b>Saves the folder and asks the next run to scan it and propose the projects.</b></p><p>While the request is waiting, it says <strong>Scan requested</strong>. Afterwards it shows when the last scan was and how many projects it proposed. Besides the request, the routine repeats the scan once a day to find new folders.</p></div></section>
<section class="ay-sec n2" id="ayuda-mas" data-nivel="2"><h3>More (phone)</h3><p class="ay-breve">On the phone: Outside the inbox, Settings, Register project, Help and the routine&#39;s status.</p><p>On the phone the bottom bar has room for Inbox, Projects, Runs and Rules. Everything else is in <strong>More</strong>, together with the routine&#39;s status and your access.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:mas:--></div><figcaption>Example with sample data · Admin view</figcaption></figure></section>
<section class="ay-sec n1" id="ayuda-glosario" data-nivel="1"><h2>Glossary</h2><p class="ay-breve">The terms the dashboard uses, in alphabetical order.</p><p>Each term is also the explanation that appears when you hover over its label in the dashboard.</p><div class="ay-glos"><div class="ay-term" id="ayuda-aprobacion-automatica"><b class="ay-term-n">Automatic approval</b><div class="ay-term-d">A Settings option. When it is on, the rules the routine proposes become active right away, without waiting for an Admin. Suggested changes to rules that already exist are always applied by a person.</div></div><div class="ay-term" id="ayuda-baseline"><b class="ay-term-n">Baseline</b><div class="ay-term-d">A project&#39;s normal behavior over the last 30 days: how many jobs it runs, how long they take and how many errors it has. It helps tell a new problem from the usual.</div></div><div class="ay-term" id="ayuda-categoria"><b class="ay-term-n">Category</b><div class="ay-term-d">The type of problem, with its icon: login or credentials, selector or UI, application down, infrastructure, configuration, scheduling, business, system, silent failure, regression, deploy or monitoring.</div></div><div class="ay-term" id="ayuda-punto-de-control"><b class="ay-term-n">Checkpoint</b><div class="ay-term-d">Each thing that is checked in a run, for example failed jobs, abandoned items or a rule. Its result is Alert, OK or Skipped.</div></div><div class="ay-term" id="ayuda-decision"><b class="ay-term-n">Decision</b><div class="ay-term-d">What the triage does with a finding. Escalated: it needs a person and goes to Needs action. Notice: worth a look, but it does not block anything. Under watch: the trend is followed without showing it. Known: the memory or a rule says it is expected.</div></div><div class="ay-term" id="ayuda-discrepancia"><b class="ay-term-n">Discrepancy</b><div class="ay-term-d">Something that does not match between a project&#39;s code, documentation and Orchestrator, for example a queue in the SDD that does not exist or a trigger with a different frequency. The project analysis finds it. You answer it, postpone it or dismiss it from the project&#39;s Discrepancies tab: it does not go to the inbox.</div></div><div class="ay-term" id="ayuda-evidencia"><b class="ay-term-n">Evidence (redacted)</b><div class="ay-term-d">The logs, queue items, jobs and rule values that back a card, after personal data has been removed. Case references are shown as a short code, never the original data.</div></div><div class="ay-term" id="ayuda-incidente"><b class="ay-term-n">Incident or card</b><div class="ay-term-d">A detected problem, with its whole history: when it was first and last seen, how many times it happened, its triage, its analysis and the team&#39;s activity.</div></div><div class="ay-term" id="ayuda-inventario"><b class="ay-term-n">Inventory</b><div class="ay-term-d">What a project&#39;s Orchestrator folder contains: processes with their version, queues, triggers and assets. For assets only the name and type are kept, never the value.</div></div><div class="ay-term" id="ayuda-libreria"><b class="ay-term-n">Library</b><div class="ay-term-d">The label with a library&#39;s name means the error happened inside an activity of that library. The detail says which other projects use it and whether they have open cards.</div></div><div class="ay-term" id="ayuda-nueva-version"><b class="ay-term-n">New version</b><div class="ay-term-d">A new version of the process was deployed after the card was opened. The routine analyzes it again and explains what changed.</div></div><div class="ay-term" id="ayuda-alta"><b class="ay-term-n">Onboarding</b><div class="ay-term-d">The first analysis of a newly registered project. The routine discovers its processes, queues, triggers and libraries, calculates the baseline and generates the process memory, the discrepancies and the proposed rules. Then an Admin reviews and activates it.</div></div><div class="ay-term" id="ayuda-analisis-previo"><b class="ay-term-n">Prior analysis</b><div class="ay-term-d">What the routine investigates before escalating a card: hypotheses with their probability, suggested actions, the related code and documentation, and what changed in the last deploy. You read it in the card detail.</div></div><div class="ay-term" id="ayuda-memoria-de-proceso"><b class="ay-term-n">Process memory</b><div class="ay-term-d">A description of the process, similar to a condensed PDD, that the routine generates during onboarding from the code and the documentation. It serves as context for the triage and the analysis.</div></div><div class="ay-term" id="ayuda-memoria-de-produccion"><b class="ay-term-n">Production memory</b><div class="ay-term-d">A project&#39;s permanent history: team responses, deploys, re-checks and new rules, plus a summary that updates itself. It is what makes the routine learn.</div></div><div class="ay-term" id="ayuda-proyecto"><b class="ay-term-n">Project</b><div class="ay-term-d">An Orchestrator folder with its processes, for example Dispatcher, Performer and Reporter. It is the unit that is registered, analyzed and controlled.</div></div><div class="ay-term" id="ayuda-estado-proyecto"><b class="ay-term-n">Project status</b><div class="ay-term-d">Waiting for analysis, Analyzing, In review, Active, Paused or With error. Only active projects are controlled in each run.</div></div><div class="ay-term" id="ayuda-similitud"><b class="ay-term-n">Proposed by similarity</b><div class="ay-term-d">When an Admin approves or edits a rule, the routine proposes the equivalent rule for other processes that use the same portal, the same application or the same library. It arrives as a proposal: an Admin approves it, unless automatic approval is on.</div></div><div class="ay-term" id="ayuda-proyecto-propuesto"><b class="ay-term-n">Proposed project</b><div class="ay-term-d">An Orchestrator folder with processes that the scan found and that is not controlled yet. An Admin registers it, and then the routine performs its onboarding, or ignores it.</div></div><div class="ay-term" id="ayuda-re-control"><b class="ay-term-n">Re-check</b><div class="ay-term-d">The Check again response with a date. The card is hidden until that day, and then the routine verifies whether the problem is still there. It is kept in the production memory as Re-check scheduled and Re-check OK.</div></div><div class="ay-term" id="ayuda-reaparecio"><b class="ay-term-n">Reappeared</b><div class="ay-term-d">A topic that had been closed came back within 30 days. The same card is reopened instead of creating a new one, so its history is not lost.</div></div><div class="ay-term" id="ayuda-recurrencia"><b class="ay-term-n">Recurrence</b><div class="ay-term-d">When a topic repeats, it adds occurrences to the same card. The label ×7 · last 12 min ago shows how many times it happened and when the last one was.</div></div><div class="ay-term" id="ayuda-solicitud"><b class="ay-term-n">Request</b><div class="ay-term-d">An order from the team to the routine, for example scan a folder, analyze a new project or analyze a card again. It is handled in the next run.</div></div><div class="ay-term" id="ayuda-retencion"><b class="ay-term-n">Retention</b><div class="ay-term-d">Runs and closed incidents are deleted after a number of days, which is set in Settings. A monthly summary is saved before they are deleted.</div></div><div class="ay-term" id="ayuda-rutina"><b class="ay-term-n">Routine</b><div class="ay-term-d">The Claude process that runs on its own, usually every hour. It is the only one that creates runs and incidents, and it never modifies anything in Orchestrator.</div></div><div class="ay-term" id="ayuda-pulso"><b class="ay-term-n">Routine pulse</b><div class="ay-term-d">Below the menu (on the phone, at the top): when the last check was. Green if it went well, amber if it had collection errors, and red if the routine stopped running; in that case the inbox also warns about it.</div></div><div class="ay-term" id="ayuda-sugerencia"><b class="ay-term-n">Routine suggestion</b><div class="ay-term-d">A change to a rule proposed by the daily review of the last 30 days: an exception or a threshold if it is almost always dismissed, a lower severity if its topics get postponed, or disabling it if it has not fired in 60 days. It shows as Suggested change.</div></div><div class="ay-term" id="ayuda-regla"><b class="ay-term-n">Rule</b><div class="ay-term-d">A checkpoint written in natural language, for example: if there are more than 10 login errors in a row, escalate. The routine translates it into a check and shows how it understood it.</div></div><div class="ay-term" id="ayuda-excepcion"><b class="ay-term-n">Rule exception</b><div class="ay-term-d">A condition in which a rule that is fine does not apply, for example: it is Monday before 9. You add it from the rule editor and it applies from the next run.</div></div><div class="ay-term" id="ayuda-corrida"><b class="ay-term-n">Run</b><div class="ay-term-d">One execution of the routine. It records which time window it reviewed in each project, each checkpoint with its observed value and the findings with their triage.</div></div><div class="ay-term" id="ayuda-severidad"><b class="ay-term-n">Severity (P1 to P4)</b><div class="ay-term-d">P1: a critical process stopped or the SLA was missed today. P2: degraded process with SLA risk. P3: isolated errors. P4: informational.</div></div><div class="ay-term" id="ayuda-tema"><b class="ay-term-n">Topic</b><div class="ay-term-d">What identifies a problem, no matter how many times it happens: the same error in the same place. A topic has a single card.</div></div><div class="ay-term" id="ayuda-triage"><b class="ay-term-n">Triage</b><div class="ay-term-d">The classification of each finding: category, severity and decision, with its why, its confidence level and the rules or memories it was based on.</div></div><div class="ay-term" id="ayuda-criterios"><b class="ay-term-n">Triage criteria</b><div class="ay-term-d">Natural-language instructions that guide the classification. There are global criteria, in Settings, and criteria specific to each project, in its Settings.</div></div></div></section></template>

  if (p.repo && p.repo.slug) return [{ id: slug(p.repo.slug), label: p.repo.slug, role: rolDe(p.repo.slug), repo: p.repo, docs: p.docs || { paths: [] } }]; // formato anterior
  return [];
}
const repoTxt = (r) => (r && r.workspace && r.slug ? `${r.workspace}/${r.slug}` : '');
function parseRepo(txt) {
  const x = String(txt || '').trim().replace(/^https?:\/\/(www\.)?bitbucket\.org\//i, '').replace(/\.git$/i, '').split('/').filter(Boolean);
  return x.length >= 2 ? { workspace: x[0], slug: x[1] } : null;
}

}
// Convierte el formulario en el documento del proyecto. Devuelve { error } o { data }.
function proyectoDesdeForm(f) {
  if (!f.nombre.trim()) return { error: tx('base.err.sinNombre') };
  if (!f.carpeta.trim()) return { error: tx('base.err.sinCarpeta') };
  // Los procesos son opcionales: si no se cargan, la rutina toma todos los de la carpeta.
  const procs = f.procesos.filter((x) => x.label.trim() || x.repo.trim() || x.op.trim());
  if (f.soloLista && !procs.length) return { error: tx('base.err.soloLista') };
  const usados = new Set(); const processes = [];
  for (const [i, x] of procs.entries()) {
    // El repo es opcional: un proceso sin repo (p. ej. sin versionar en Bitbucket) se controla igual,
    // pero el análisis previo no puede mirar su código.
    const repo = x.repo.trim() ? parseRepo(x.repo) : null;
    if (x.repo.trim() && !repo) return { error: tx('base.err.repo', { n: i + 1 }) };
    if (!repo && !x.label.trim() && !x.op.trim()) return { error: tx('base.err.procSinNombre', { n: i + 1 }) };
    let id = x.id || slug(x.label || x.op || (repo && repo.slug)) || `proceso-${i + 1}`;
    while (usados.has(id)) id = `${id}-${i + 1}`;

      folderPath: x.carpeta.trim() && x.carpeta.trim() !== f.carpeta.trim() ? x.carpeta.trim() : null,
      repo: repo ? { ...repo, branch: x.rama.trim() || 'main' } : null, docs: { paths: listaDocs(x.docs) } });

    if (S.error) return { cls: 'critical', t: tx('base.pulso.sinConexion'), d: S.error };
    return { cls: 'unknown', t: S.loaded.runs ? tx('base.pulso.sinCorridas') : tx('base.pulso.conectando'), d: S.loaded.runs ? tx('base.pulso.noCorrio') : '' };
  }
  const cuando = ult.finishedAt || ult.startedAt;
  const intervalo = (S.settings && S.settings.intervalMinutes) || 60;
  const d = tx('base.pulso.ultimo', { t: rel(cuando) });

// Pendiente: la rutina la sigue detectando y nadie la respondió, descartó ni pospuso. Vuelve a estar

function discPendiente(d) {
  if (d.status !== 'open') return false;
  const w = S.discWork[d.id]; if (!w) return true;
  const volvio = Boolean(d.reopenedAt && w.updatedAt && d.reopenedAt > w.updatedAt);
  if (w.state === 'dismissed' || w.state === 'responded') return volvio;
  if (w.state === 'snoozed' && w.snoozeUntil && w.snoozeUntil > nowIso()) return volvio;
  return true;
}

  const data = { ...(prev || {}), ...patch, updatedAt: nowIso(), updatedBy: S.me || null };
  delete data.id; for (const k of quitar) delete data[k];

// ---------- reglas: editor en línea ----------

const reKey = (ctx, rid) => `${ctx}|${rid}`;
const reId = (ctx, rid, k) => `re-${ctx}-${rid}-${k}`;
// Reglas que intervinieron en un incidente (las que el triage citó o la que disparó el hallazgo).
function reglasDe(i) {
  const ev = i.evidence || {};
  const ids = [...((i.triage || {}).matchedRules || []), ...[ev.ultima, ev.primera].map((x) => x && x.regla && x.regla.id)];
  return [...new Set(ids.filter(Boolean))].map((id) => S.rules[id]).filter(Boolean);
}
const reglaStCls = { proposed: 'info', active: 'ok', pending_compile: 'warn' };

  }

  const l = i.library;
  const usan = Object.values(S.projects).filter((p) => p.id !== i.projectId && ((p.inventory || {}).processes || []).some((x) => (x.libraries || []).some((y) => y.name === l.name)));
  const otras = Object.values(S.incidents).filter((x) => x.id !== i.id && x.projectId !== i.projectId && x.status === 'open' && x.library && x.library.name === l.name).length;
  return `<section><h3 class="lbl">${tx('tema.lib.titulo')}</h3><div class="box"><p><b>${esc(l.name)} ${esc(l.version || '')}</b>${l.activity ? ` · ${tx('tema.lib.actividad')} <span class="mono">${esc(l.activity)}</span>` : ''}</p>
    ${usan.length ? `<p class="muted">${tx('tema.lib.tambien', { lista: usan.map((p) => esc(p.name)).join(', ') })}${otras ? ' · ' + txp(otras, 'tema.lib.otras') : ''}</p>` : ''}</div></section>`;
}

function analisisHtml(i) {
  const a = i.analysis || {};
  const pedir = S.canWrite ? `<button class="btn ghost sm" data-act="reanalizar-inc" style="margin-left:auto">${a.status === 'done' ? tx('tema.an.reanalizar') : tx('tema.an.pedir')}</button>` : '';
  let cuerpo;
  if (a.status === 'done') {
    cuerpo = `<p class="lead">${esc(a.summary)}</p>
      ${(a.hypotheses || []).length ? `<h4 class="lbl">${tx('tema.an.hipotesis')}</h4><ul class="hyp">${a.hypotheses.map((h) => `<li><span class="lk ${esc(h.likelihood)}">${esc(confTxt(h.likelihood))}</span><b>${esc(h.text)}</b><span class="muted">${esc(h.evidence)}</span></li>`).join('')}</ul>` : ''}
      ${(a.suggestedActions || []).length ? `<h4 class="lbl">${tx('tema.an.acciones')}</h4><ol class="steps">${a.suggestedActions.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
      ${(a.codeRefs || []).length ? `<h4 class="lbl">${tx('tema.an.codigoT')}</h4><div class="refs">${a.codeRefs.map((c) => `<div><span class="mono">${esc(c.file)}${c.line ? ':' + esc(c.line) : ''}</span> <span class="mono muted">${c.pkg ? esc(c.pkg) : '@' + esc(String(c.sha || '').slice(0, 7))}</span> — ${esc(c.note)}</div>`).join('')}</div>` : ''}
      ${(a.docRefs || []).length ? `<h4 class="lbl">${tx('tema.an.doc')}</h4><div class="refs">${a.docRefs.map((c) => `<div><span class="mono">${esc(c.file)}</span> · ${esc(c.section)} — ${esc(c.note)}</div>`).join('')}</div>` : ''}
      ${a.changes ? `<h4 class="lbl">${tx('tema.an.cambio')}</h4><p>${esc(a.changes)}</p>` : ''}
      ${a.source ? `<p class="muted">${esc(tx('tema.an.analizado', { tipo: a.source.kind === 'repo' ? tx('tema.an.repo') : tx('tema.an.paquete'), pkg: a.source.package, ver: a.source.version }))}${a.source.kind === 'package' ? ' ' + esc(tx('tema.an.desplegada')) : ''}${a.source.library ? ' · ' + esc(tx('tema.an.libreria', { lib: a.source.library })) : ''}.</p>`
        : a.repo && !a.repo.matchesDeployedVersion ? `<p class="muted">${tx('tema.an.ramaCfg')}</p>` : ''}`;
  } else if (a.status === 'pending') cuerpo = `<p class="muted">${tx('tema.an.pendiente')}</p>`;
  else cuerpo = `<p class="muted">${tx('tema.an.sin')}</p>`;
  return `<section><div class="sec-h"><h3 class="lbl">${tx('tema.an.titulo')}</h3>${pedir}</div><div class="box">${cuerpo}</div></section>`;
}

function detalleHtml(i) {
  const ev = i.evidence || {}; const u = ev.ultima || ev.primera || {}; const t = i.triage || {};
  const lines = [];
  for (const l of (u.logs || []).slice(-6)) lines.push(`<div class="l">${esc(fecha(l.fecha))} · ${esc(l.nivel)} · ${esc(l.mensaje)}</div>`);
  for (const q of (u.queueItems || []).slice(0, 6)) lines.push(`<div class="l">${esc(tx('tema.det.item', { ref: q.referenciaHash || q.id, estado: q.estado, tipo: q.tipoExcepcion || '', motivo: q.motivo || '' }))}</div>`);
  for (const j of (u.jobs || []).slice(0, 6)) lines.push(`<div class="l">${esc(tx('tema.det.job', { key: String(j.key).slice(0, 8), estado: j.estado || '', fin: fecha(j.fin || j.creado) }))}${j.maquina ? ' · ' + esc(j.maquina) : ''}</div>`);
  if (u.regla) lines.push(`<div class="l">${esc(tx('tema.det.regla', { texto: u.regla.texto, obs: u.regla.observado, umbral: u.regla.umbral }))}</div>`);
  if (u.errores) for (const e of u.errores.slice(0, 5)) lines.push(`<div class="l">${esc(e)}</div>`);
  if (!S.activity[i.id]) loadActivity(i.id);
  const acts = S.activity[i.id] || [];
  const id = esc(i.id);
  return `${estadoHtml(i)}
    ${S.canWrite ? `<section aria-label="${tx('tema.det.acciones')}"><div class="actions" style="gap:8px">${accionesHtml(i, 'd')}</div>${panelHtml(i)}</section>` : ''}
    <section><h3 class="lbl">${tx('tema.det.porque')}</h3><div class="box"><p class="lead">${esc(t.rationale)}</p><dl class="kv">
      <dt>${tx('tema.det.decision')}</dt><dd>${esc(DEC[i.decision] || i.decision)} · ${esc(tx('tema.det.confianza', { c: confTxt(t.confidence) || '—' }))}</dd>
      ${(t.matchedRules || []).length ? `<dt>${tx('tema.det.reglas')}</dt><dd>${t.matchedRules.map((x) => S.rules[x] ? esc(S.rules[x].text) : `<span class="mono">${esc(x)}</span>`).join('<br>')}</dd>` : ''}
      ${(t.memoryRefs || []).length ? `<dt>${tx('tema.det.memoria')}</dt><dd class="mono">${(t.memoryRefs).map(esc).join(', ')}</dd>` : ''}
      <dt>${tx('tema.det.visto')}</dt><dd>${esc(tx('tema.det.vistoDesde', { f: fecha(i.firstSeenAt), occ: txp(i.occurrences, 'tema.det.ocurrencias'), runs: txp((i.recurrences || []).length, 'tema.det.corridas') }))}</dd>
      ${i.process ? `<dt>${tx('tema.det.proceso')}</dt><dd class="mono">${esc(i.process)}</dd>` : ''}${i.queue ? `<dt>${tx('tema.det.cola')}</dt><dd class="mono">${esc(i.queue)}</dd>` : ''}
    </dl></div></section>
    ${analisisHtml(i)}
    ${i.library ? libreriaHtml(i) : ''}
    ${lines.length ? `<section><h3 class="lbl">${tx('tema.det.evidencia')}</h3><div class="ev" tabindex="0" role="group" aria-label="${tx('tema.det.evidenciaAria')}">${lines.join('')}</div></section>` : ''}
    <section><h3 class="lbl">${tx('tema.det.actividad')}</h3><div class="box">
      ${acts.length ? `<ul class="tl">${acts.map((x) => `<li><time>${esc(fecha(x.at))}</time><span>${who(x.by)} ${esc(actividadTxt(x))}</span></li>`).join('')}</ul>` : `<p class="muted">${tx('tema.det.sinAct')}</p>`}
      ${S.canWrite ? `<div class="composer"><textarea id="${id}-coment" aria-label="${tx('tema.det.comentAria')}" placeholder="${tx('tema.det.comentAria')}">${esc(S.drafts[`${i.id}-coment`] || '')}</textarea>
        <div class="actions" style="gap:10px"><button class="btn" data-act="comentar">${ico('send')}${tx('tema.det.comentar')}</button><span class="muted">${tx('tema.det.ctrl')}</span></div></div>` : ''}
    </div></section>`;
}

function drawerHtml(id) {
  const i = S.incidents[id];
  const cerrar = `<a class="icon-btn" id="dw-x" href="#${esc(base)}" aria-label="${tx('tema.dw.cerrarAria')}" title="${tx('tema.dw.cerrar')}">${ico('x')}</a>`;
  const marco = (attrs, top, titulo, meta, cuerpo) => `<a class="scrim" href="#${esc(base)}" tabindex="-1" aria-hidden="true"></a>
    <div class="drawer" id="dw" role="dialog" aria-modal="true" aria-labelledby="dw-t" tabindex="-1" ${attrs}>
      <header class="dw-h"><div class="dw-top">${top}<span class="sp"></span>${ayudaBtn('tarjeta', tx('tema.dw.ayuda'))}${cerrar}</div><h2 id="dw-t">${titulo}</h2>${meta}</header>
      <div class="dw-b" id="dw-b" data-ks>${cuerpo}</div></div>`;
  if (!i) {
    return S.loaded.incidents
      ? marco('', `<span class="muted">${tx('tema.dw.tema')}</span>`, tx('tema.dw.yaNo'), '', `<p class="muted">${tx('tema.dw.cerroRet')}</p>`)
      : marco('', `<span class="muted">${tx('tema.dw.tema')}</span>`, tx('tema.dw.cargando'), '', '');
  }
  return marco(`data-inc="${esc(i.id)}"`,
    `${sevHtml(i.severity)}<span class="st">${esc(DEC[i.decision] || i.decision)}</span><a class="tag" href="#proyecto-${esc(i.projectId)}">${esc(projName(i.projectId))}</a>`,
    esc(i.title), metaHtml(i, false), detalleHtml(i));
}

const subs = {};
function loadActivity(id) {
  if (S.demo || subs['act-' + id] || !S.db) return;
  S.activity[id] = [];
  subs['act-' + id] = S.db.collection('activity').where('incidentId', '==', id).onSnapshot((s) => {
    S.activity[id] = s.docs.map((d) => d.data()).sort((a, b) => String(a.at).localeCompare(String(b.at)));
    resolveNames(S.activity[id].map((x) => x.by)); schedule();
  }, () => {});
}

// ---------- vistas ----------
const seg = (k, opciones, label) => `<div class="seg" role="group" aria-label="${label}">${opciones.map(([v, t, n]) => `<button id="seg-${k}-${v}" data-act="seg" data-k="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${t}<span class="n">${n}</span></button>`).join('')}</div>`;
const buscador = (id, valor, label) => `<div class="search">${ico('search')}<input type="search" id="${id}" value="${esc(valor)}" placeholder="${label}" aria-label="${label}" autocomplete="off"></div>`;
const seccion = (titulo, n, cuerpo, hint = '', ayuda = '') => `<section class="sec"><div class="sec-h"><h2>${titulo}</h2>${n != null ? `<span class="cnt">${n}</span>` : ''}${ayuda ? ayudaBtn(ayuda, titulo) : ''}${hint ? `<span class="hint">${hint}</span>` : ''}</div>${cuerpo}</section>`;

function viewInicio() {
  const p = S.filter && S.projects[S.filter]; const pu = pulso();
  if (!S.db) return head(tx('vistas.inicio.titulo'), '') + `<div class="banner info">${ico('alert')}<span>${esc(S.error || tx('vistas.inicio.conectando'))}</span></div>`;
  if (!S.loaded.incidents || !S.loaded.projects) {
    return head(tx('vistas.inicio.titulo'), S.stale ? tx('vistas.inicio.tardan') : tx('vistas.cargando')) + '<div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>';
  }
  const enBandeja = Object.values(S.incidents).filter((i) => reportable(i) && visibleByWork(i) && inFilter(i)).sort(orden);
  const q = norm(S.q);
  const todos = q ? enBandeja.filter((i) => norm(`${i.title} ${projName(i.projectId)} ${CAT[i.category] || ''} ${i.process || ''} ${i.severity}`).includes(q)) : enBandeja;
  const esMio = (i) => { const w = S.work[i.id]; return Boolean(w && w.state === 'delegated' && w.assignee && w.assignee === S.me); };
  const mios = todos.filter(esMio);
  const accion = todos.filter((i) => !esMio(i) && i.decision === 'escalate');
  const avisos = todos.filter((i) => !esMio(i) && i.decision !== 'escalate');
  const nProy = new Set(enBandeja.map((i) => i.projectId)).size;
  const ult = S.runs[0];

  let html = head(tx('vistas.inicio.titulo'), `${enBandeja.length ? txp(enBandeja.length, 'vistas.inicio.abiertos') : tx('vistas.inicio.sinAbiertos')}${p ? ' ' + tx('vistas.inicio.enProyecto', { name: esc(p.name) }) : nProy > 1 ? ' ' + txp(nProy, 'vistas.inicio.enProyectos') : ''}${pu.d ? ` · ${esc(pu.d.toLowerCase())}` : ''}`, { scope: true });
  if (pu.detenida) html += `<div class="banner bad">${ico('alert')}<span class="grow">${tx('vistas.inicio.detenida', { d: esc(pu.d) })}</span></div>`;
  else if (ult && ult.status !== 'ok') html += `<div class="banner bad">${ico('alert')}<span class="grow">${tx('vistas.inicio.ultimaErrores')} <a href="#corrida-${esc(ult.id)}">${tx('vistas.inicio.verCorrida')}</a></span></div>`;

  if (enBandeja.length) {
    const tabs = [['todo', tx('vistas.inicio.tabTodo'), todos.length]];
    if (mios.length || S.tab === 'mios') tabs.push(['mios', tx('vistas.inicio.paraVos'), mios.length]);
    tabs.push(['accion', tx('vistas.inicio.requiereAccion'), accion.length], ['avisos', tx('vistas.inicio.avisos'), avisos.length]);
    html += `<div class="tools">${seg('tab', tabs, tx('vistas.inicio.filtrar'))}${buscador('q-inbox', S.q, tx('vistas.inicio.buscar'))}</div>`;
  }
  const ver = (k) => S.tab === 'todo' || S.tab === k;
  if (S.isAdmin && S.tab === 'todo' && !q) {
    const prop = Object.values(S.rules).filter((r) => r.status === 'proposed' && (!S.filter || r.projectId === S.filter)).length;
    const rev = Object.values(S.projects).filter((x) => x.status === 'review' && (!S.filter || x.id === S.filter));
    const err = Object.values(S.projects).filter((x) => x.status === 'error' && (!S.filter || x.id === S.filter));
    const fila = (href, icono, cls, txt) => `<a class="rowi" href="${href}"><span class="ico-b ${cls}">${ico(icono)}</span><span class="t">${txt}</span><span></span>${ico('chev', 'chev')}</a>`;
    const items = [];
    if (prop) items.push(fila('#reglas', 'rule', 'info', `<b>${txp(prop, 'vistas.inicio.reglasProp')}</b><span class="muted">${tx('vistas.inicio.reglasOrigen')}</span>`));
    const np = S.filter ? 0 : propuestos().length;
    if (np) items.push(fila('#registrar', 'folder', 'info', `<b>${txp(np, 'vistas.inicio.proyPropuestos')}</b><span class="muted">${tx('vistas.inicio.proyPropuestosSub')}</span>`));
    const sug = Object.values(S.rules).filter((r) => r.suggestion && r.status !== 'proposed' && (!S.filter || r.projectId === S.filter)).length;
    if (sug) items.push(fila('#reglas', 'rule', 'info', `<b>${txp(sug, 'vistas.inicio.cambiosSug')}</b><span class="muted">${tx('vistas.inicio.cambiosSugSub')}</span>`));
    for (const x of rev) items.push(fila(`#proyecto-${esc(x.id)}`, 'folder', 'info', `<b>${tx('vistas.inicio.revisarAlta', { name: esc(x.name) })}</b><span class="muted">${tx('vistas.inicio.revisarAltaSub')}</span>`));
    for (const x of err) items.push(fila(`#proyecto-${esc(x.id)}`, 'alert', 'bad', `<b>${esc(x.name)}: ${esc(PSTATUS.error)}</b><span class="muted">${esc(x.statusNote || tx('vistas.inicio.altaFallo'))}</span>`));
    if (items.length) html += seccion(tx('vistas.inicio.paraRevisar'), items.length, `<div class="list">${items.join('')}</div>`, tx('vistas.inicio.soloAdmin'), 'para-revisar');
  }
  if (ver('mios') && mios.length) html += seccion(tx('vistas.inicio.paraVos'), mios.length, `<div class="list">${mios.map((i) => cardHtml(i)).join('')}</div>`, tx('vistas.inicio.teDelegaron'), 'para-vos');
  if (ver('accion') && accion.length) html += seccion(tx('vistas.inicio.requiereAccion'), accion.length, `<div class="list">${accion.map((i) => cardHtml(i)).join('')}</div>`, tx('vistas.inicio.porSeveridad'), 'requiere-accion');
  if (ver('avisos') && avisos.length) html += seccion(tx('vistas.inicio.avisos'), avisos.length, `<div class="list">${avisos.map((i) => cardHtml(i, true)).join('')}</div>`, tx('vistas.inicio.sinUrgencia'), 'avisos');

  const visibles = (ver('mios') ? mios.length : 0) + (ver('accion') ? accion.length : 0) + (ver('avisos') ? avisos.length : 0);
  if (!Object.keys(S.projects).length) {
    // Tablero nuevo: todavía no hay nada que controlar.
    html += `<div class="empty plain">${ico('folder')}<b>${tx('vistas.sinProyectos')}</b><span class="muted">${S.isAdmin ? tx('vistas.primerosPasos') : tx('vistas.adminRegistra')}</span></div>${S.isAdmin ? primerosPasosHtml() : ''}`;
  } else if (!enBandeja.length) {
    html += `<div class="empty">${ico('check')}<b>${tx('vistas.inicio.todoOrden')}</b><span class="muted">${p ? tx('vistas.inicio.nadaEn', { name: esc(p.name) }) : tx('vistas.inicio.sinIncidentes')}${ult ? ` ${tx('vistas.inicio.ultimoControl', { t: esc(rel(ult.finishedAt || ult.startedAt)) })}` : ''}</span>
      ${p ? `<button class="btn sm" data-act="scope-clear">${tx('vistas.inicio.verTodosProy')}</button>` : ''}</div>`;
  } else if (!visibles) {
    html += `<div class="empty plain">${ico('search')}<b>${tx('vistas.inicio.nadaCoincide')}</b><span class="muted">${q ? tx('vistas.inicio.sinCoincidencias') : tx('vistas.inicio.sinTemasVista')}</span><button class="btn sm" data-act="limpiar">${tx('vistas.inicio.verTodaBandeja')}</button></div>`;
  }
  return html;
}

function viewFuera() {
  const tipo = (i) => { const w = S.work[i.id];
    if (w && w.state === 'dismissed') return 'descartados';
    if (w && w.state === 'responded') return 'respondidos';
    if (w && w.state === 'snoozed' && w.snoozeUntil && w.snoozeUntil > nowIso()) return 'pospuestos';
    return 'triage'; };
  const motivo = (i) => { const w = S.work[i.id] || {}; const t = tipo(i);
    if (t === 'pospuestos') return tx('vistas.fuera.pospuesto', { f: fecha(w.snoozeUntil) });
    if (t === 'descartados') return tx('vistas.fuera.descartado', { m: etiqueta(DISMISS(), w.dismissReason) });
    if (t === 'respondidos') return tx('vistas.fuera.respondido', { m: etiqueta(RESP(), (w.response || {}).decision) });
    return DEC[i.decision] || i.decision; };
  const xs = Object.values(S.incidents).filter((i) => inFilter(i) && i.status === 'open' && (!reportable(i) || !visibleByWork(i))).sort(orden);
  const n = (t) => xs.filter((i) => tipo(i) === t).length;
  const ver = xs.filter((i) => S.fuera === 'todos' || tipo(i) === S.fuera);
  return head(tx('vistas.fuera.titulo'), tx('vistas.fuera.sub'), { scope: true })
    + (xs.length ? `<div class="tools">${seg('fuera', [['todos', tx('vistas.fuera.todos'), xs.length], ['pospuestos', tx('vistas.fuera.pospuestos'), n('pospuestos')], ['respondidos', tx('vistas.fuera.respondidos'), n('respondidos')], ['descartados', tx('vistas.fuera.descartados'), n('descartados')], ['triage', tx('vistas.fuera.triage'), n('triage')]], tx('vistas.fuera.filtrar'))}</div>` : '')
    + (ver.length ? `<div class="list">${ver.map((i) => `<a class="rowi" id="t-${esc(i.id)}" href="#incidente-${esc(i.id)}">${sevHtml(i.severity)}
      <span class="t"><b>${esc(i.title)}</b><span class="muted">${esc(motivo(i))}${S.filter ? '' : ' · ' + esc(projName(i.projectId))} — ${esc(i.triage && i.triage.rationale)}</span></span><span class="nums">×${esc(i.occurrences)}</span>${ico('chev', 'chev')}</a>`).join('')}</div>`
      : `<div class="empty plain">${ico('archive')}<b>${tx('vistas.fuera.nadaAqui')}</b><span class="muted">${xs.length ? tx('vistas.fuera.sinMotivo') : tx('vistas.fuera.todoEnBandeja')}</span></div>`);
}

function viewCorridas() {
  const runs = S.runs.filter((r) => !S.filter || (r.projects || []).some((p) => p.projectId === S.filter));
  const rows = runs.map((r) => {
    const ps = (r.projects || []).filter((p) => !S.filter || p.projectId === S.filter);
    const nuevos = ps.reduce((a, p) => a + (p.incidentsNew || []).length, 0);
    const rec = ps.reduce((a, p) => a + (p.incidentsUpdated || []).length, 0);
    const esc_ = ps.reduce((a, p) => a + (p.findings || []).filter((f) => f.decision === 'escalate').length, 0);
    const st = r.status === 'ok' ? ['ok', tx('vistas.estado.ok')] : r.status === 'partial' ? ['warn', tx('vistas.estado.partial')] : ['bad', tx('vistas.estado.error')];
    return `<a class="rowi" href="#corrida-${esc(r.id)}"><span class="st ${st[0]}">${st[1]}</span>
      <span class="t"><b>${esc(fecha(r.startedAt))}</b><span class="muted">${esc(rel(r.finishedAt || r.startedAt))} · ${txp(ps.length, 'vistas.corridas.proyectos')}${r.trigger !== 'scheduled' ? ' · ' + esc(r.trigger) : ''}</span></span>
      <span class="nums">${tx('vistas.corridas.cifras', { nuevos, rec, esc: esc_ })}</span>${ico('chev', 'chev')}</a>`;
  }).join('');
  return head(tx('vistas.corridas.titulo'), tx('vistas.corridas.sub'), { scope: true })
    + (rows ? `<div class="list">${rows}</div>` : `<div class="empty plain">${ico('runs')}<b>${tx('vistas.corridas.vacio')}</b><span class="muted">${S.filter ? tx('vistas.corridas.vacioProy') : tx('vistas.corridas.vacioPrimera')}</span></div>`);
}

function viewCorrida(id) {
  const r = S.runs.find((x) => x.id === id);
  if (!r) return head(tx('vistas.corrida.titulo'), S.loaded.runs ? tx('vistas.corrida.noEsta') : tx('vistas.cargando'), { back: ['corridas', tx('vistas.corridas.titulo')] });
  const ps = (r.projects || []).filter((p) => !S.filter || p.projectId === S.filter);
  const res = (x) => (x === 'alerta' ? `${ico('alert')}<span class="sr">${tx('vistas.corrida.alerta')}</span>` : x === 'ok' ? `${ico('check')}<span class="sr">${tx('vistas.corrida.correcto')}</span>` : `${ico('minus')}<span class="sr">${tx('vistas.corrida.omitido')}</span>`);

function viewProyectos() {
  const c = conteos(); const q = norm(S.qp);
  const rango = (p) => (p.status === 'error' ? 0 : p.status === 'review' ? 1 : nivel(p) === 'critical' ? 2 : nivel(p) === 'warn' ? 3 : p.status === 'active' ? 4 : 5);
  const todos = Object.values(S.projects);
  const ps = todos.filter((p) => !q || norm(`${p.name} ${(p.orchestrator || {}).folderPath || ''}`).includes(q))
    .sort((a, b) => rango(a) - rango(b) || String(a.name).localeCompare(String(b.name), LANG));
  const det = propuestos().length;
  // Lo abierto de cada proyecto: temas en la bandeja y discrepancias pendientes (que no van a la bandeja).
  const abierto = (p) => { const nd = discPendientes(p.id); return [c[p.id] ? txp(c[p.id], 'vistas.inicio.abiertos') : '', nd ? txp(nd, 'vistas.proyectos.discrepancias') : ''].filter(Boolean).join(' · '); };
  const estado = (p) => { const l = nivel(p);
    if (p.status !== 'active') return `<span class="st ${p.status === 'error' ? 'bad' : p.status === 'review' ? 'info' : ''}">${esc(PSTATUS[p.status] || p.status)}</span>`;
    return `<span class="st ${l === 'critical' ? 'bad' : l === 'warn' ? 'warn' : l === 'ok' ? 'ok' : ''}">${esc(NIVEL[l])}</span>`; };
  return head(tx('vistas.proyectos.titulo'), `${txp(todos.length, 'vistas.proyectos.controlados')}. ${tx('vistas.proyectos.subResto')}`,
    { actions: S.isAdmin ? `<a class="btn primary" href="#registrar">${ico('plus')}${tx('vistas.proyectos.registrar')}</a>` : '' })
    + (S.isAdmin && det ? `<div class="banner note">${ico('folder')}<span class="grow">${txp(det, 'vistas.proyectos.propone')} <a href="#registrar">${txp(det, 'vistas.proyectos.revisar')}</a></span></div>` : '')
    + (todos.length > 5 ? `<div class="tools">${buscador('q-proj', S.qp, tx('vistas.proyectos.buscar'))}</div>` : '')
    + (ps.length ? `<div class="list">${ps.map((p) => `<a class="rowi" href="#proyecto-${esc(p.id)}"><span class="dot ${nivel(p)}" aria-hidden="true"></span>
      <span class="t"><b>${esc(p.name)}</b><span class="muted mono">${esc(p.orchestrator && p.orchestrator.folderPath)}</span></span>
      <span class="end"><span class="nums">${abierto(p)}</span>${estado(p)}</span>${ico('chev', 'chev')}</a>`).join('')}</div>`
      : `<div class="empty plain">${ico('folder')}<b>${todos.length ? tx('vistas.proyectos.ningunoCoincide') : tx('vistas.sinProyectos')}</b><span class="muted">${todos.length ? tx('vistas.proyectos.otroNombre') : S.isAdmin ? tx('vistas.primerosPasos') : tx('vistas.adminRegistra')}</span></div>${!todos.length && S.isAdmin ? primerosPasosHtml() : ''}`);
}

function subProject(id) {
  if (S.demo || subs['proj-' + id] || !S.db) return;
  subs['proj-' + id] = true;
  S.db.doc(`memory/${id}`).onSnapshot((d) => { S.memory[id] = d.exists ? d.data() : null; schedule(); }, () => {});
  S.db.collection('history').where('projectId', '==', id).orderBy('at', 'desc').limit(100).onSnapshot((s) => {
    S.history[id] = s.docs.map((d) => ({ id: d.id, ...d.data() })); resolveNames(S.history[id].map((h) => h.by)); schedule();
  }, () => {});
  // Documentación subida a mano (pesa: se lee solo al entrar al proyecto).
  S.db.collection('documents').where('projectId', '==', id).onSnapshot((s) => {
    S.docs[id] = s.docs.map((d) => ({ id: d.id, ...d.data() }));
    resolveNames(S.docs[id].map((x) => x.uploadedBy)); schedule();
  }, () => { S.docs[id] = S.docs[id] || []; schedule(); });
}

function discEstadoHtml(d) {
  const w = S.discWork[d.id];
  const caja = (icono, txt, btn = '') => `<div class="banner note">${ico(icono)}<span class="grow">${txt}</span>${btn}</div>`;
  const reabrir = S.canWrite && d.status === 'open' ? `<button class="btn sm" data-act="disc-reabrir">${ico('undo')}${tx('vistas.disc.reabrir')}</button>` : '';
  const notas = w && w.response && w.response.notes ? ` — ${esc(w.response.notes)}` : '';
  const por = w && w.updatedBy ? ` · ${who(w.updatedBy)}` : '';
  let humano = '';
  if (w && !discPendiente(d)) {
    if (w.state === 'snoozed' && d.status === 'open') humano = caja('clock', `${tx('vistas.disc.pospuesta', { f: esc(fecha(w.snoozeUntil)) })}${por}`, reabrir);
    else if (w.state === 'dismissed') humano = caja('x', `<b>${tx('vistas.disc.descartada')}</b> ${esc(etiqueta(DDISMISS(), w.dismissReason))}${notas}${por}`, reabrir);
    else if (w.state === 'responded') humano = caja('reply', `<b>${tx('vistas.disc.respondida')}</b> ${esc(etiqueta(DRESP(), (w.response || {}).decision))}${notas}${w.response && w.response.ticket ? ` <span class="mono">[${esc(w.response.ticket)}]</span>` : ''}${por}`, reabrir);
  }
  const resuelta = d.status === 'resolved' ? caja('check', `<b>${tx('vistas.disc.resuelta')}</b> ${esc(String(d.resolvedReason || tx('vistas.disc.dejoDetectar')).replace(/\.$/, ''))}${d.resolvedAt ? ` · ${esc(fecha(d.resolvedAt))}` : ''}`) : '';
  return humano + resuelta;
}

// Lee el archivo elegido, lo pasa a Markdown y lo deja en revisión: se guarda recién con "Guardar".
async function cargarDocumento(pid, file) {
  if (!S.isAdmin) return;
  const nombre = file.name || ''; const ext = ((nombre.match(/\.([A-Za-z0-9]+)$/) || [])[1] || '').toLowerCase();
  if (!['docx', 'pdf', 'md', 'markdown', 'txt'].includes(ext)) return toast(['doc', 'odt', 'rtf'].includes(ext) ? tx('vistas.docs.formatoNoConv') : tx('vistas.docs.formatoNoAdm'));
  if (file.size > 30 * 1024 * 1024) return toast(tx('vistas.docs.supera30'));
  // La categoría se propone por el nombre del archivo; se puede cambiar antes de guardar.
  const kind = /runbook|operaci[oó]n/i.test(nombre) ? 'runbook' : /(^|[^a-z])pdd([^a-z]|$)|process definition/i.test(nombre) ? 'pdd' : /(^|[^a-z])sdd([^a-z]|$)|solution design/i.test(nombre) ? 'sdd' : 'other';
  S.docDraft[pid] = { kind, cargando: true, fileName: nombre }; S.docDel[pid] = null; schedule();
  let aviso = ext === 'docx' ? tx('vistas.docs.noLeyoDocx') : ext === 'pdf' ? tx('vistas.docs.noLeyoPdf') : tx('vistas.docs.noLeyo');
  try {
    const crudo = ext === 'docx' ? await docxAMarkdown(await file.arrayBuffer()) : ext === 'pdf' ? await pdfAMarkdown(await file.arrayBuffer()) : await file.text();
    const m = enmascarar(crudo.replace(/\r\n?/g, '\n').trim());
    if (!m.texto) { if (ext === 'pdf') aviso = tx('vistas.docs.pdfVacio'); throw new Error('vacio'); }
    S.docDraft[pid] = { kind, fileName: nombre, source: ext === 'markdown' ? 'md' : ext, masked: m.n };
    S.drafts['doc-md-' + pid] = m.texto; delete S.drafts['doc-t-' + pid]; S.focusNext = 'doc-t-' + pid;
  } catch (err) { delete S.docDraft[pid]; toast(aviso); }
  schedule();
}

// Notas del último análisis: texto libre de la rutina, partido en puntos y plegado para que no tape la página.
function notasAnalisis(t) {

  const items = String(t || '').split(/(?<=\.)\s+(?=[A-ZÁÉÍÓÚÑ])|;\s+/).map((x) => x.trim()).filter(Boolean);

// ---------- arranque ----------
async function start() {
  S.irAyuda = true;
  render();
  const cl = window.claude;
  const [db, user] = await Promise.all([cl && cl.use ? cl.use('db') : null, cl && cl.use ? cl.use('user') : null]);
  S.user = user;
  // Descargas (bajar un documento como .md): opcional y sin demorar el arranque. Sin la capacidad, el botón no se muestra.
  if (cl && cl.use) Promise.resolve(cl.use('downloads')).then((d) => { S.downloads = d || null; schedule(); }, () => {});
  if (!db) { S.error = tx('acciones.err.sesion'); return schedule(); }
  S.db = db;
  if (user) {
    S.me = await user.id();
    S.isAdmin = await user.canEdit();
    const w = await user.can('data.write');
    S.canWrite = S.isAdmin || w === true || w === null;
    S.role = S.isAdmin ? 'admin' : S.canWrite ? 'operador' : 'lector';
    if (S.me) resolveNames([S.me]);
  }
  const timer = setTimeout(() => { S.stale = true; schedule(); }, 10000);
  const onErr = (e) => { clearTimeout(timer); S.error = tx(e && e.code === 'revoked' ? 'acciones.err.acceso' : 'acciones.err.leer'); schedule(); };
  const coll = (name, key, fn) => db.collection(name).onSnapshot((s) => { clearTimeout(timer); S[key] = {}; for (const d of s.docs) S[key][d.id] = { id: d.id, ...d.data() }; S.loaded[key] = true; if (fn) fn(); schedule(); }, onErr);
  coll('projects', 'projects');
  coll('rules', 'rules');
  coll('incidentWork', 'work', () => resolveNames(Object.values(S.work).flatMap((w) => [w.assignee, w.delegatedBy, w.updatedBy])));
  db.collection('incidents').where('status', '==', 'open').onSnapshot((s) => { clearTimeout(timer); S.incidents = {}; for (const d of s.docs) S.incidents[d.id] = { id: d.id, ...d.data() }; S.loaded.incidents = true; schedule(); }, onErr);
  db.collection('runs').orderBy('startedAt', 'desc').limit(50).onSnapshot((s) => { S.runs = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.runs = true; schedule(); }, onErr);
  db.doc('config/settings').onSnapshot((d) => { S.settings = d.exists ? d.data() : null; setIdioma(S.settings && S.settings.language); schedule(); }, () => {});
  db.doc('config/discovery').onSnapshot((d) => { S.discovery = d.exists ? d.data() : null; schedule(); }, () => {});
  coll('libraries', 'libraries');
  // Colecciones nuevas: si fallan (p. ej. el tablero publicado todavía no las conoce) el resto sigue funcionando.
  const blanda = (name, key, fn) => db.collection(name).onSnapshot((s) => { S[key] = {}; for (const d of s.docs) S[key][d.id] = { id: d.id, ...d.data() }; if (fn) fn(); schedule(); }, () => {});
  blanda('discrepancies', 'discs');
  blanda('discrepancyWork', 'discWork', () => resolveNames(Object.values(S.discWork).map((w) => w.updatedBy)));
  db.collection('requests').where('status', '==', 'pending').onSnapshot((s) => { S.pendReq = s.docs.map((d) => ({ id: d.id, ...d.data() })); schedule(); }, () => {});
  setInterval(schedule, 60000); // refresca los "hace X min"
}
document.documentElement.lang = LANG; document.title = tx('comun.titulo');
start();
})();
