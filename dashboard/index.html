      ${(a.codeRefs || []).length ? `<h4 class="lbl">Código</h4><div class="refs">${a.codeRefs.map((c) => `<div><span class="mono">${esc(c.file)}${c.line ? ':' + esc(c.line) : ''}</span> <span class="mono muted">${c.pkg ? esc(c.pkg) : '@' + esc(String(c.sha || '').slice(0, 7))}</span> — ${esc(c.note)}</div>`).join('')}</div>` : ''}
      ${(a.docRefs || []).length ? `<h4 class="lbl">Documentación</h4><div class="refs">${a.docRefs.map((c) => `<div><span class="mono">${esc(c.file)}</span> · ${esc(c.section)} — ${esc(c.note)}</div>`).join('')}</div>` : ''}
      ${a.changes ? `<h4 class="lbl">Qué cambió en el deploy</h4><p>${esc(a.changes)}</p>` : ''}
      ${a.source ? `<p class="muted">Código analizado: ${a.source.kind === 'repo' ? 'repo de respaldo' : 'paquete'} ${esc(a.source.package)} ${esc(a.source.version)}${a.source.kind === 'package' ? ' (versión desplegada)' : ''}${a.source.library ? ' · librería ' + esc(a.source.library) : ''}.</p>`
        : a.repo && !a.repo.matchesDeployedVersion ? '<p class="muted">El código analizado es de la rama configurada, no del tag de la versión desplegada.</p>' : ''}`;
  } else if (a.status === 'pending') cuerpo = '<p class="muted">Pendiente: lo completa la próxima corrida.</p>';
  else cuerpo = '<p class="muted">Este tema no tiene análisis previo.</p>';
  return `<section><div class="sec-h"><h3 class="lbl">Análisis previo</h3>${pedir}</div><div class="box">${cuerpo}</div></section>`;
}

function detalleHtml(i) {
  const ev = i.evidence || {}; const u = ev.ultima || ev.primera || {}; const t = i.triage || {};
  const lines = [];
  for (const l of (u.logs || []).slice(-6)) lines.push(`<div class="l">${esc(fecha(l.fecha))} · ${esc(l.nivel)} · ${esc(l.mensaje)}</div>`);
  for (const q of (u.queueItems || []).slice(0, 6)) lines.push(`<div class="l">Item ${esc(q.referenciaHash || q.id)} · ${esc(q.estado)} ${esc(q.tipoExcepcion || '')} · ${esc(q.motivo || '')}</div>`);
  for (const j of (u.jobs || []).slice(0, 6)) lines.push(`<div class="l">Job ${esc(String(j.key).slice(0, 8))} · ${esc(j.estado || '')} · ${esc(fecha(j.fin || j.creado))}${j.maquina ? ' · ' + esc(j.maquina) : ''}</div>`);
  if (u.regla) lines.push(`<div class="l">Regla: ${esc(u.regla.texto)} · observado ${esc(u.regla.observado)} (umbral ${esc(u.regla.umbral)})</div>`);
  if (u.errores) for (const e of u.errores.slice(0, 5)) lines.push(`<div class="l">${esc(e)}</div>`);
  if (!S.activity[i.id]) loadActivity(i.id);
  const acts = S.activity[i.id] || [];
  const id = esc(i.id);
  return `${estadoHtml(i)}
    ${S.canWrite ? `<section aria-label="Acciones"><div class="actions" style="gap:8px">${accionesHtml(i, 'd')}</div>${panelHtml(i)}</section>` : ''}
    <section><h3 class="lbl">Por qué está acá</h3><div class="box"><p class="lead">${esc(t.rationale)}</p><dl class="kv">
      <dt>Decisión</dt><dd>${esc(DEC[i.decision] || i.decision)} · confianza ${esc(t.confidence || '—')}</dd>
      ${(t.matchedRules || []).length ? `<dt>Reglas</dt><dd>${t.matchedRules.map((x) => S.rules[x] ? esc(S.rules[x].text) : `<span class="mono">${esc(x)}</span>`).join('<br>')}</dd>` : ''}
      ${(t.memoryRefs || []).length ? `<dt>Memoria</dt><dd class="mono">${(t.memoryRefs).map(esc).join(', ')}</dd>` : ''}
      <dt>Visto</dt><dd>desde ${esc(fecha(i.firstSeenAt))} · ${esc(i.occurrences)} ocurrencia(s) en ${esc((i.recurrences || []).length)} corrida(s)</dd>
      ${i.process ? `<dt>Proceso</dt><dd class="mono">${esc(i.process)}</dd>` : ''}${i.queue ? `<dt>Cola</dt><dd class="mono">${esc(i.queue)}</dd>` : ''}
    </dl></div></section>
    ${analisisHtml(i)}
    ${i.library ? libreriaHtml(i) : ''}
    ${lines.length ? `<section><h3 class="lbl">Evidencia (redactada)</h3><div class="ev" tabindex="0" role="group" aria-label="Evidencia redactada">${lines.join('')}</div></section>` : ''}
    <section><h3 class="lbl">Actividad</h3><div class="box">
      ${acts.length ? `<ul class="tl">${acts.map((x) => `<li><time>${esc(fecha(x.at))}</time><span>${who(x.by)} ${esc(x.text || '')}</span></li>`).join('')}</ul>` : '<p class="muted">Sin actividad todavía.</p>'}
      ${S.canWrite ? `<div class="composer"><textarea id="${id}-coment" aria-label="Comentario para el equipo" placeholder="Comentario para el equipo">${esc(S.drafts[`${i.id}-coment`] || '')}</textarea>
        <div class="actions" style="gap:10px"><button class="btn" data-act="comentar">${ico('send')}Comentar</button><span class="muted">Ctrl + Enter para enviar</span></div></div>` : ''}
    </div></section>`;
}

function drawerHtml(id) {
  const i = S.incidents[id];
  const cerrar = `<a class="icon-btn" id="dw-x" href="#${esc(base)}" aria-label="Cerrar el detalle" title="Cerrar (Esc)">${ico('x')}</a>`;
  const marco = (attrs, top, titulo, meta, cuerpo) => `<a class="scrim" href="#${esc(base)}" tabindex="-1" aria-hidden="true"></a>
    <div class="drawer" id="dw" role="dialog" aria-modal="true" aria-labelledby="dw-t" tabindex="-1" ${attrs}>
      <header class="dw-h"><div class="dw-top">${top}<span class="sp"></span>${ayudaBtn('tarjeta', 'detalle del tema')}${cerrar}</div><h2 id="dw-t">${titulo}</h2>${meta}</header>
      <div class="dw-b" id="dw-b" data-ks>${cuerpo}</div></div>`;
  if (!i) {
    return S.loaded.incidents
      ? marco('', '<span class="muted">Tema</span>', 'Este tema ya no está abierto', '', '<p class="muted">Se cerró o se depuró por retención. Lo que se aprendió queda en la memoria de producción de su proyecto.</p>')
      : marco('', '<span class="muted">Tema</span>', 'Cargando…', '', '');
  }
  return marco(`data-inc="${esc(i.id)}"`,
    `${sevHtml(i.severity)}<span class="st">${esc(DEC[i.decision] || i.decision)}</span><a class="tag" href="#proyecto-${esc(i.projectId)}">${esc(projName(i.projectId))}</a>`,
    esc(i.title), metaHtml(i, false), detalleHtml(i));
}

const subs = {};
function loadActivity(id) {
  if (S.demo || subs['act-' + id] || !S.db) return;
  S.activity[id] = [];
  subs['act-' + id] = S.db.collection('activity').where('incidentId', '==', id).onSnapshot((s) => {
    S.activity[id] = s.docs.map((d) => d.data()).sort((a, b) => String(a.at).localeCompare(String(b.at)));
    resolveNames(S.activity[id].map((x) => x.by)); schedule();
  }, () => {});
}

// ---------- vistas ----------
const seg = (k, opciones, label) => `<div class="seg" role="group" aria-label="${label}">${opciones.map(([v, t, n]) => `<button id="seg-${k}-${v}" data-act="seg" data-k="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${t}<span class="n">${n}</span></button>`).join('')}</div>`;
const buscador = (id, valor, label) => `<div class="search">${ico('search')}<input type="search" id="${id}" value="${esc(valor)}" placeholder="${label}" aria-label="${label}" autocomplete="off"></div>`;
const seccion = (titulo, n, cuerpo, hint = '', ayuda = '') => `<section class="sec"><div class="sec-h"><h2>${titulo}</h2>${n != null ? `<span class="cnt">${n}</span>` : ''}${ayuda ? ayudaBtn(ayuda, titulo) : ''}${hint ? `<span class="hint">${hint}</span>` : ''}</div>${cuerpo}</section>`;

function viewInicio() {
  const p = S.filter && S.projects[S.filter]; const pu = pulso();
  if (!S.db) return head('Bandeja', '') + `<div class="banner info">${ico('alert')}<span>${esc(S.error || 'Conectando con el tablero…')}</span></div>`;
  if (!S.loaded.incidents || !S.loaded.projects) {
    return head('Bandeja', S.stale ? 'Los datos tardan en llegar. Puede que estés sin conexión.' : 'Cargando…') + '<div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>';
  }
  const enBandeja = Object.values(S.incidents).filter((i) => reportable(i) && visibleByWork(i) && inFilter(i)).sort(orden);
  const q = norm(S.q);
  const todos = q ? enBandeja.filter((i) => norm(`${i.title} ${projName(i.projectId)} ${CAT[i.category] || ''} ${i.process || ''} ${i.severity}`).includes(q)) : enBandeja;
  const esMio = (i) => { const w = S.work[i.id]; return Boolean(w && w.state === 'delegated' && w.assignee && w.assignee === S.me); };
  const mios = todos.filter(esMio);
  const accion = todos.filter((i) => !esMio(i) && i.decision === 'escalate');
  const avisos = todos.filter((i) => !esMio(i) && i.decision !== 'escalate');
  const nProy = new Set(enBandeja.map((i) => i.projectId)).size;
  const ult = S.runs[0];

  let html = head('Bandeja', `${enBandeja.length ? pl(enBandeja.length, 'tema abierto', 'temas abiertos') : 'Sin temas abiertos'}${p ? ` en ${esc(p.name)}` : nProy > 1 ? ` en ${nProy} proyectos` : ''}${pu.d ? ` · ${esc(pu.d.toLowerCase())}` : ''}`, { scope: true });
  if (pu.detenida) html += `<div class="banner bad">${ico('alert')}<span class="grow"><b>La rutina está detenida.</b> ${esc(pu.d)}: lo que ves puede estar desactualizado.</span></div>`;
  else if (ult && ult.status !== 'ok') html += `<div class="banner bad">${ico('alert')}<span class="grow">La última corrida terminó con errores de colecta. <a href="#corrida-${esc(ult.id)}">Ver la corrida</a></span></div>`;

  if (enBandeja.length) {
    const tabs = [['todo', 'Todo', todos.length]];
    if (mios.length || S.tab === 'mios') tabs.push(['mios', 'Para vos', mios.length]);
    tabs.push(['accion', 'Requiere acción', accion.length], ['avisos', 'Avisos', avisos.length]);
    html += `<div class="tools">${seg('tab', tabs, 'Filtrar la bandeja')}${buscador('q-inbox', S.q, 'Buscar en la bandeja')}</div>`;
  }
  const ver = (k) => S.tab === 'todo' || S.tab === k;
  if (S.isAdmin && S.tab === 'todo' && !q) {
    const prop = Object.values(S.rules).filter((r) => r.status === 'proposed' && (!S.filter || r.projectId === S.filter)).length;
    const rev = Object.values(S.projects).filter((x) => x.status === 'review' && (!S.filter || x.id === S.filter));
    const err = Object.values(S.projects).filter((x) => x.status === 'error' && (!S.filter || x.id === S.filter));
    const fila = (href, icono, cls, txt) => `<a class="rowi" href="${href}"><span class="ico-b ${cls}">${ico(icono)}</span><span class="t">${txt}</span><span></span>${ico('chev', 'chev')}</a>`;
    const items = [];
    const auto = (S.settings || {}).autoApproveRules === true;
    if (prop) items.push(fila('#reglas', 'rule', 'info', `<b>${pl(prop, 'regla propuesta', 'reglas propuestas')} ${auto ? 'por aprobarse' : 'para aprobar'}</b><span class="muted">${auto ? 'La aprobación automática está activa: la próxima corrida las aprueba. Rechazá antes las que no quieras.' : 'De respuestas a incidentes, por similitud entre procesos o de la revisión diaria.'}</span>`));
    const np = S.filter ? 0 : propuestos().length;
    if (np) items.push(fila('#registrar', 'folder', 'info', `<b>${pl(np, 'proyecto propuesto', 'proyectos propuestos')} para agregar</b><span class="muted">Carpetas con procesos que encontró el escaneo de Orchestrator.</span>`));
    const sug = Object.values(S.rules).filter((r) => r.suggestion && r.status !== 'proposed' && (!S.filter || r.projectId === S.filter)).length;
    if (sug) items.push(fila('#reglas', 'rule', 'info', `<b>${pl(sug, 'cambio sugerido', 'cambios sugeridos')} en reglas</b><span class="muted">La revisión diaria de la rutina encontró reglas para ajustar.</span>`));
    for (const x of rev) items.push(fila(`#proyecto-${esc(x.id)}`, 'folder', 'info', `<b>Revisar alta de ${esc(x.name)}</b><span class="muted">El análisis inicial terminó. Revisalo y activá el control.</span>`));
    for (const x of err) items.push(fila(`#proyecto-${esc(x.id)}`, 'alert', 'bad', `<b>${esc(x.name)}: ${esc(PSTATUS.error)}</b><span class="muted">${esc(x.statusNote || 'El alta o el control falló.')}</span>`));
    if (items.length) html += seccion('Para revisar', items.length, `<div class="list">${items.join('')}</div>`, 'Solo Admin', 'para-revisar');
  }
  if (ver('mios') && mios.length) html += seccion('Para vos', mios.length, `<div class="list">${mios.map((i) => cardHtml(i)).join('')}</div>`, 'Te los delegaron', 'para-vos');
  if (ver('accion') && accion.length) html += seccion('Requiere acción', accion.length, `<div class="list">${accion.map((i) => cardHtml(i)).join('')}</div>`, 'Por severidad', 'requiere-accion');
  if (ver('avisos') && avisos.length) html += seccion('Avisos', avisos.length, `<div class="list">${avisos.map((i) => cardHtml(i, true)).join('')}</div>`, 'Para saber, sin urgencia', 'avisos');

  const visibles = (ver('mios') ? mios.length : 0) + (ver('accion') ? accion.length : 0) + (ver('avisos') ? avisos.length : 0);
  if (!Object.keys(S.projects).length) {
    // Tablero nuevo: todavía no hay nada que controlar.
    html += `<div class="empty plain">${ico('folder')}<b>Todavía no hay proyectos</b><span class="muted">${S.isAdmin ? 'Seguí los primeros pasos para empezar a controlar.' : 'Un Admin tiene que registrarlos.'}</span></div>${S.isAdmin ? primerosPasosHtml() : ''}`;
  } else if (!enBandeja.length) {
    html += `<div class="empty">${ico('check')}<b>Todo en orden</b><span class="muted">${p ? `Nada pendiente en ${esc(p.name)}.` : 'No hay incidentes que requieran acción.'}${ult ? ` Último control ${esc(rel(ult.finishedAt || ult.startedAt))}.` : ''}</span>
      ${p ? '<button class="btn sm" data-act="scope-clear">Ver todos los proyectos</button>' : ''}</div>`;
  } else if (!visibles) {
    html += `<div class="empty plain">${ico('search')}<b>Nada coincide</b><span class="muted">${q ? 'Ningún tema abierto coincide con la búsqueda.' : 'No hay temas en esta vista.'}</span><button class="btn sm" data-act="limpiar">Ver toda la bandeja</button></div>`;
  }
  return html;
}

function viewFuera() {
  const tipo = (i) => { const w = S.work[i.id];
    if (w && w.state === 'dismissed') return 'descartados';
    if (w && w.state === 'responded') return 'respondidos';
    if (w && w.state === 'snoozed' && w.snoozeUntil && w.snoozeUntil > nowIso()) return 'pospuestos';
    return 'triage'; };
  const motivo = (i) => { const w = S.work[i.id] || {}; const t = tipo(i);
    if (t === 'pospuestos') return `Pospuesto hasta ${fecha(w.snoozeUntil)}`;
    if (t === 'descartados') return `Descartado: ${etiqueta(DISMISS(), w.dismissReason)}`;
    if (t === 'respondidos') return `Respondido: ${etiqueta(RESP(), (w.response || {}).decision)}`;
    return DEC[i.decision] || i.decision; };
  const xs = Object.values(S.incidents).filter((i) => inFilter(i) && i.status === 'open' && (!reportable(i) || !visibleByWork(i))).sort(orden);
  const n = (t) => xs.filter((i) => tipo(i) === t).length;
  const ver = xs.filter((i) => S.fuera === 'todos' || tipo(i) === S.fuera);
  return head('Fuera de bandeja', 'Temas abiertos que no se muestran en la bandeja: los que el equipo pospuso, respondió o descartó, y los que el triage decidió no reportar.', { scope: true })
    + (xs.length ? `<div class="tools">${seg('fuera', [['todos', 'Todos', xs.length], ['pospuestos', 'Pospuestos', n('pospuestos')], ['respondidos', 'Respondidos', n('respondidos')], ['descartados', 'Descartados', n('descartados')], ['triage', 'No reportados por el triage', n('triage')]], 'Filtrar por motivo')}</div>` : '')
    + (ver.length ? `<div class="list">${ver.map((i) => `<a class="rowi" id="t-${esc(i.id)}" href="#incidente-${esc(i.id)}">${sevHtml(i.severity)}
      <span class="t"><b>${esc(i.title)}</b><span class="muted">${esc(motivo(i))}${S.filter ? '' : ' · ' + esc(projName(i.projectId))} — ${esc(i.triage && i.triage.rationale)}</span></span><span class="nums">×${esc(i.occurrences)}</span>${ico('chev', 'chev')}</a>`).join('')}</div>`
      : `<div class="empty plain">${ico('archive')}<b>Nada por aquí</b><span class="muted">${xs.length ? 'No hay temas con ese motivo.' : 'Todo lo abierto está en la bandeja.'}</span></div>`);
}

function viewCorridas() {
  const runs = S.runs.filter((r) => !S.filter || (r.projects || []).some((p) => p.projectId === S.filter));
  const rows = runs.map((r) => {
    const ps = (r.projects || []).filter((p) => !S.filter || p.projectId === S.filter);
    const nuevos = ps.reduce((a, p) => a + (p.incidentsNew || []).length, 0);
    const rec = ps.reduce((a, p) => a + (p.incidentsUpdated || []).length, 0);
    const esc_ = ps.reduce((a, p) => a + (p.findings || []).filter((f) => f.decision === 'escalate').length, 0);
    const st = r.status === 'ok' ? ['ok', 'Completa'] : r.status === 'partial' ? ['warn', 'Parcial'] : ['bad', 'Con errores'];
    return `<a class="rowi" href="#corrida-${esc(r.id)}"><span class="st ${st[0]}">${st[1]}</span>
      <span class="t"><b>${esc(fecha(r.startedAt))}</b><span class="muted">${esc(rel(r.finishedAt || r.startedAt))} · ${pl(ps.length, 'proyecto', 'proyectos')}${r.trigger !== 'scheduled' ? ' · ' + esc(r.trigger) : ''}</span></span>
      <span class="nums">${nuevos} nuevos · ${rec} recurrentes · ${esc_} escalados</span>${ico('chev', 'chev')}</a>`;
  }).join('');
  return head('Corridas', 'Cada ejecución de la rutina, con lo que revisó y lo que encontró.', { scope: true })
    + (rows ? `<div class="list">${rows}</div>` : `<div class="empty plain">${ico('runs')}<b>Todavía no hay corridas</b><span class="muted">${S.filter ? 'Ninguna corrida reciente incluyó este proyecto.' : 'Aparecen acá cuando la rutina corre por primera vez.'}</span></div>`);
}

function viewCorrida(id) {
  const r = S.runs.find((x) => x.id === id);
  if (!r) return head('Corrida', S.loaded.runs ? 'No está entre las últimas 50 corridas.' : 'Cargando…', { back: ['corridas', 'Corridas'] });
  const ps = (r.projects || []).filter((p) => !S.filter || p.projectId === S.filter);
  const res = (x) => (x === 'alerta' ? `${ico('alert')}<span class="sr">Alerta</span>` : x === 'ok' ? `${ico('check')}<span class="sr">Correcto</span>` : `${ico('minus')}<span class="sr">Omitido</span>`);
  const color = (x) => (x === 'alerta' ? 'var(--p2)' : x === 'ok' ? 'var(--ok)' : 'var(--p4)');
  const dur = r.finishedAt ? Math.max(1, Math.round((Date.parse(r.finishedAt) - Date.parse(r.startedAt)) / 60000)) + ' min' : '—';
  return head(`Corrida del ${fecha(r.startedAt)}`, `${r.status === 'ok' ? 'Completa' : r.status === 'partial' ? 'Parcial' : 'Con errores'} · duró ${dur}${r.sessionUrl ? ` · <a href="${esc(r.sessionUrl)}" target="_blank" rel="noopener">Abrir la sesión</a>` : ''}`, { back: ['corridas', 'Corridas'], scope: true })
    + (ps.length ? '' : `<div class="empty plain">${ico('runs')}<b>Sin datos para este proyecto</b><span class="muted">Esta corrida no lo incluyó.</span></div>`)
    + ps.map((p) => `<section class="sec"><div class="sec-h"><h2>${esc(projName(p.projectId))}</h2><span class="cnt">${esc(fecha(p.window && p.window.desde))} → ${esc(fecha(p.window && p.window.hasta))}</span></div>
      <div class="box">
      ${p.signals ? `<p class="nums" style="white-space:normal">${esc(p.signals.jobs)} jobs · ${esc(p.signals.logsErrorFatal)} logs error/fatal · ${esc(p.signals.queueItemsFallidos)} items fallidos · ${esc(p.signals.queueItemsAbandonados)} abandonados</p>` : ''}
      ${(p.checks || []).length ? `<div class="tblw"><table><thead><tr><th scope="col"><span class="sr">Resultado</span></th><th scope="col">Punto de control</th><th scope="col">Observado</th></tr></thead><tbody>
      ${p.checks.map((c) => `<tr><td style="color:${color(c.resultado)};width:28px">${res(c.resultado)}</td><td>${esc(c.nombre)}</td><td class="mono">${esc(c.observado ?? '—')}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${(p.errors || []).length ? `<div class="ev">${p.errors.map((e) => `<div class="l">${esc(e)}</div>`).join('')}</div>` : ''}
      </div>
      ${(p.findings || []).length ? `<h3 class="lbl" style="margin-top:6px">Hallazgos y triage</h3>
        <div class="list">${p.findings.map((f) => `<a class="rowi" id="t-${esc(f.incidentId)}" href="#incidente-${esc(f.incidentId)}">${sevHtml(f.severity)}
          <span class="t"><b>${esc(f.title)}</b><span class="muted">${esc(DEC[f.decision])}${f.recurrence ? ' · recurrencia' : ' · nuevo'}${f.reopened ? ' · reabierto' : ''} — ${esc(f.rationale)}</span></span><span></span>${ico('chev', 'chev')}</a>`).join('')}</div>` : '<p class="muted">Sin hallazgos.</p>'}
    </section>`).join('');
}

function viewProyectos() {
  const c = conteos(); const q = norm(S.qp);
  const rango = (p) => (p.status === 'error' ? 0 : p.status === 'review' ? 1 : nivel(p) === 'critical' ? 2 : nivel(p) === 'warn' ? 3 : p.status === 'active' ? 4 : 5);
  const todos = Object.values(S.projects);
  const ps = todos.filter((p) => !q || norm(`${p.name} ${(p.orchestrator || {}).folderPath || ''}`).includes(q))
    .sort((a, b) => rango(a) - rango(b) || String(a.name).localeCompare(String(b.name), LANG));
  const det = propuestos().length;
  // Lo abierto de cada proyecto: temas en la bandeja y discrepancias pendientes (que no van a la bandeja).

    + (todos.length > 5 ? `<div class="tools">${buscador('q-proj', S.qp, 'Buscar proyecto por nombre o carpeta')}</div>` : '')

function subProject(id) {
  if (S.demo || subs['proj-' + id] || !S.db) return;
  subs['proj-' + id] = true;
  S.db.doc(`memory/${id}`).onSnapshot((d) => { S.memory[id] = d.exists ? d.data() : null; schedule(); }, () => {});
  S.db.collection('history').where('projectId', '==', id).orderBy('at', 'desc').limit(100).onSnapshot((s) => {
    S.history[id] = s.docs.map((d) => ({ id: d.id, ...d.data() })); resolveNames(S.history[id].map((h) => h.by)); schedule();
  }, () => {});
  // Documentación subida a mano (pesa: se lee solo al entrar al proyecto).
  S.db.collection('documents').where('projectId', '==', id).onSnapshot((s) => {
    S.docs[id] = {}; for (const d of s.docs) { const x = d.data(); S.docs[id][x.kind] = x; }
    resolveNames(Object.values(S.docs[id]).map((x) => x.uploadedBy)); schedule();
  }, () => { S.docs[id] = S.docs[id] || {}; schedule(); });
}

  const w = S.discWork[d.id];

  const reabrir = S.canWrite && d.status === 'open' ? `<button class="btn sm" data-act="disc-reabrir">${ico('undo')}Volver a abrir</button>` : '';
  const notas = w && w.response && w.response.notes ? ` — ${esc(w.response.notes)}` : '';
  const por = w && w.updatedBy ? ` · ${who(w.updatedBy)}` : '';
  let humano = '';
  if (w && !discPendiente(d)) {
    if (w.state === 'snoozed' && d.status === 'open') humano = caja('clock', `Pospuesta hasta ${esc(fecha(w.snoozeUntil))}${por}`, reabrir);
    else if (w.state === 'dismissed') humano = caja('x', `<b>Descartada:</b> ${esc(etiqueta(DDISMISS(), w.dismissReason))}${notas}${por}`, reabrir);

const kb = (txt) => `${Math.max(1, Math.round(new TextEncoder().encode(txt || '').length / 1024))} KB`;

    const acciones = b ? '' : `<div class="actions">

// Lee el archivo elegido, lo pasa a Markdown y lo deja en revisión: se guarda recién con "Guardar".
async function cargarDocumento(pid, kind, file) {
  if (!S.isAdmin) return;
  const nombre = file.name || ''; const ext = ((nombre.match(/\.([A-Za-z0-9]+)$/) || [])[1] || '').toLowerCase();
  if (!['docx', 'md', 'markdown', 'txt'].includes(ext)) return toast(['pdf', 'doc', 'odt', 'rtf'].includes(ext) ? 'Ese formato no se puede convertir acá: guardalo como .docx o pegá el texto.' : 'Formato no admitido: subí un .docx, .md o .txt, o pegá el texto.');
  if (file.size > 30 * 1024 * 1024) return toast('El archivo supera los 30 MB');
  S.docDraft[pid] = { kind, cargando: true, fileName: nombre }; S.docDel[pid] = null; schedule();
  try {
    const crudo = ext === 'docx' ? await docxAMarkdown(await file.arrayBuffer()) : await file.text();
    const m = enmascarar(crudo.replace(/\r\n?/g, '\n').trim());
    if (!m.texto) throw new Error('vacio');
    S.docDraft[pid] = { kind, fileName: nombre, source: ext === 'docx' ? 'docx' : ext === 'txt' ? 'txt' : 'md', masked: m.n };
    S.drafts['doc-md-' + pid] = m.texto; S.focusNext = 'doc-md-' + pid;
  } catch (err) {
    delete S.docDraft[pid];
    toast(ext === 'docx' ? 'No se pudo leer el .docx. Guardalo de nuevo desde Word, o pegá el texto.' : 'No se pudo leer el archivo.');
  }
  schedule();
}

function rulesTable(reglas, enProyecto) {
  const ord = { proposed: 0, pending_compile: 2, active: 3, disabled: 4, rejected: 5 };
  const pos = (r) => (r.suggestion && r.status !== 'proposed' ? 1 : ord[r.status]); // con cambio sugerido: primero
  reglas = reglas.slice().sort((a, b) => pos(a) - pos(b));
  if (!reglas.length) return '<p class="muted">Sin reglas.</p>';
  return `<div class="list" style="border:0">${reglas.map((r) => `<div class="rowi two" style="padding:9px 0">
    <span class="t"><b>${esc(r.text)}</b><span class="muted"><span class="st ${reglaStCls[r.status] || ''}">${esc(RSTATUS[r.status] || r.status)}</span>${enProyecto ? '' : ' · ' + esc(r.projectId === '*' ? 'Todos los proyectos' : projName(r.projectId))}${origenTxt(r)}${(r.exceptions || []).length ? ` · ${pl(r.exceptions.length, 'excepción', 'excepciones')}` : ''}${r.compileNote ? ' — ' + esc(r.compileNote) : ''}</span>
      ${r.status === 'proposed' && r.why ? `<span class="muted">Por qué se propone: ${esc(r.why)}</span>` : ''}
      ${r.status === 'proposed' && (S.settings || {}).autoApproveRules === true ? '<span class="muted">Se aprueba sola en la próxima corrida, salvo que la rechaces antes.</span>' : ''}
      ${r.suggestion ? `<span class="muted"><span class="tag sugt">Cambio sugerido</span> ${esc(SUG[r.suggestion.kind] || '')}: ${esc(r.suggestion.why)}</span>` : ''}</span>
    <span class="actions">${S.isAdmin && r.status === 'proposed' ? `<button class="btn primary sm" data-act="regla" data-rid="${esc(r.id)}" data-s="active">Aprobar</button><button class="btn sm" data-act="regla" data-rid="${esc(r.id)}" data-s="rejected">Rechazar</button>` : ''}
      ${S.isAdmin && r.status === 'active' ? `<button class="btn sm" data-act="regla" data-rid="${esc(r.id)}" data-s="disabled">Desactivar</button>` : ''}
      ${S.isAdmin && r.status === 'disabled' ? `<button class="btn sm" data-act="regla" data-rid="${esc(r.id)}" data-s="active">Activar</button>` : ''}
      ${S.isAdmin ? `<button class="btn sm${S.reOpen[r.id] ? ' on' : ''}" id="re-abrir-${esc(r.id)}" data-act="re-abrir" data-rid="${esc(r.id)}" aria-expanded="${Boolean(S.reOpen[r.id])}">${r.suggestion ? 'Revisar' : 'Editar'}</button>` : ''}</span></div>
    ${S.isAdmin && S.reOpen[r.id] ? `<div class="rule-ed">${ruleEditorHtml(r, 'lista', null)}</div>` : ''}`).join('')}</div>`;
}

    const dd = (k) => (S.drafts[`${did}-${k}`] || '').trim();

    if (act === 'disc-posponer' || act === 'disc-posponer-fecha') {
      const hasta = act === 'disc-posponer' ? addDays(Number(b.dataset.d)) : (dd('dfecha') ? new Date(dd('dfecha') + 'T09:00:00').toISOString() : null);
      if (!hasta) return toast('Elegí una fecha');
      if (await writeDisc(d, { state: 'snoozed', snoozeUntil: hasta }, ['dismissReason', 'response'])) { limpiar('dfecha'); toast(`Pospuesta hasta ${fecha(hasta)}: queda en Atendidas`); }
    } else if (act === 'disc-descartar') {
      const motivo = (S.dsel[did] || {}).motivo; if (!motivo) return;
      if (await writeDisc(d, { state: 'dismissed', dismissReason: motivo, response: { notes: dd('dnota') || null } }, ['snoozeUntil'])) { limpiar('dnota'); toast('Descartada. Queda en Atendidas.'); }
    } else if (act === 'disc-responder') {
      const dec = (S.dsel[did] || {}).decision; if (!dec) return;
      if (await writeDisc(d, { state: 'responded', response: { decision: dec, notes: dd('dnotas') || null, ticket: dd('dticket') || null } }, ['snoozeUntil', 'dismissReason'])) { limpiar('dnotas', 'dticket'); toast('Respuesta enviada. La rutina la anota en la memoria del proyecto.'); }
    } else if (act === 'disc-reabrir') {
      if (await writeDisc(d, { state: 'open' }, ['snoozeUntil', 'dismissReason', 'response'])) toast('La discrepancia vuelve a estar pendiente');
    }
    return;
  }
  if (act === 'doc-descargar') {
    const doc = (S.docs[b.dataset.pid] || {})[b.dataset.kind]; if (!doc || !S.downloads) return;
    try { await S.downloads.save({ filename: `${slug(projName(b.dataset.pid)) || b.dataset.pid}-${b.dataset.kind}.md`, data: doc.markdown || '' }); }
    catch (e) { if (!e || e.code !== 'declined') toast('No se pudo descargar el documento'); }
    return;
  }
  if (act === 'reanalizar-inc') {
    try { await S.db.collection('requests').add({ type: 'reanalyze_incident', incidentId: id, projectId: inc.projectId, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' }); toast('Pedido: la próxima corrida vuelve a analizar esta tarjeta'); }
    catch { toast('No se pudo pedir el re-análisis'); }
    return;
  }
  if (act === 'comentar') {
    const txt = draft('coment'); if (!txt) return toast('Escribí el comentario');
    try { await S.db.collection('activity').add({ incidentId: id, projectId: inc.projectId, type: 'comment', text: txt, by: S.me || null, at: nowIso() }); clear('coment'); toast('Comentario agregado'); }
    catch { toast('No se pudo comentar'); }
    return;
  }
  if (act === 'asignar') {
    const uid = b.dataset.uid; const nombre = (S.peopleHits[id] || []).find((p) => p.id === uid);
    if (nombre) S.names[uid] = nombre;
    if (await writeWork(inc, { state: 'delegated', assignee: uid, delegatedBy: S.me || null, delegatedAt: nowIso() }, { type: 'delegate', text: 'delegó la revisión' })) { S.panel[id] = null; clear('buscar'); toast('Delegado'); }
    return;
  }
  if (act === 'posponer' || act === 'posponer-fecha') {
    const hasta = act === 'posponer' ? addDays(Number(b.dataset.d)) : (draft('fecha') ? new Date(draft('fecha') + 'T09:00:00').toISOString() : null);
    if (!hasta) return toast('Elegí una fecha');
    if (await writeWork(inc, { state: 'snoozed', snoozeUntil: hasta }, { type: 'snooze', text: `pospuso hasta ${fecha(hasta)}` })) { S.panel[id] = null; clear('fecha'); toast(`Pospuesto hasta ${fecha(hasta)}`, id); }
    return;
  }
  if (act === 'descartar') {
    const motivo = (S.sel[id] || {}).motivo; if (!motivo) return;
    const nota = draft('nota');
    if (await writeWork(inc, { state: 'dismissed', dismissReason: motivo, response: { notes: nota || null } }, { type: 'dismiss', text: `descartó: ${etiqueta(DISMISS(), motivo)}${nota ? ' — ' + nota : ''}` })) { S.panel[id] = null; clear('nota'); toast('Descartado. Queda en Fuera de bandeja.', id); }
    return;
  }
  if (act === 'responder') {
    const dec = (S.sel[id] || {}).decision; if (!dec) return;
    const notas = draft('notas');
    if (dec === 'recheck' && !draft('recheck')) return toast('Elegí la fecha del re-control');
    const response = { decision: dec, notes: notas || null, ticket: draft('ticket') || null, recheckAt: dec === 'recheck' ? new Date(draft('recheck') + 'T09:00:00').toISOString() : null };
    if (await writeWork(inc, { state: 'responded', response }, { type: 'respond', text: `respondió: ${etiqueta(RESP(), dec)}${notas ? ' — ' + notas : ''}` })) { S.panel[id] = null; clear('notas', 'ticket', 'recheck'); toast('Respuesta enviada. La rutina actualiza la memoria en la próxima corrida.', id); }
    return;
  }
  if (act === 'reabrir') {
    if (await writeWork(inc, { state: 'open' }, { type: 'reopen', text: 'devolvió el tema a la bandeja' }, ['snoozeUntil', 'dismissReason', 'response'])) { S.panel[id] = null; toast('De vuelta en la bandeja'); }
    return;
  }
  if (act === 'deshacer') {
    $('#toast').hidden = true;
    if (!inc || !(id in S.undo)) return;
    const data = S.undo[id] ? { ...S.undo[id] } : { state: 'open' }; delete data.id;
    try {
      await S.db.doc(`incidentWork/${id}`).set({ ...data, updatedAt: nowIso(), updatedBy: S.me || null });
      await S.db.collection('activity').add({ incidentId: id, projectId: inc.projectId, type: 'reopen', text: 'deshizo su última acción', by: S.me || null, at: nowIso() });
      delete S.undo[id]; toast('Acción deshecha');
    } catch { toast('No se pudo deshacer'); }
    return;
  }
  // ---- acciones de Admin ----
  try {
    if (act === 'activar' || act === 'pausar') {
      await S.db.doc(`projects/${b.dataset.pid}`).update({ status: act === 'activar' ? 'active' : 'paused', updatedAt: nowIso() });
      toast(act === 'activar' ? 'Proyecto activado' : 'Control pausado');
    } else if (act === 'reanalizar') {
      await S.db.collection('requests').add({ type: 'reanalyze_project', projectId: b.dataset.pid, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
      toast('Re-análisis pedido: lo hace la próxima corrida');
    } else if (act === 'regla') {
      const patch = { status: b.dataset.s }; if (b.dataset.s === 'active') { patch.approvedBy = S.me || null; patch.approvedAt = nowIso(); }
      await S.db.doc(`rules/${b.dataset.rid}`).update(patch);
      toast({ active: 'Regla activa', rejected: 'Regla rechazada', disabled: 'Regla desactivada' }[b.dataset.s]);
    } else if (act === 're-guardar') {
      const rid = b.dataset.rid; const ctx = b.dataset.ctx; const r = S.rules[rid]; if (!r) return toast('La regla ya no existe');
      const st = S.re[reKey(ctx, rid)] || {};
      const text = (S.drafts[reId(ctx, rid, 'text')] ?? r.text).trim(); if (!text) return toast('La regla no puede quedar vacía');
      const excNueva = (S.drafts[reId(ctx, rid, 'exc')] || '').trim().replace(/^(no aplica )?cuando\s+/i, '');
      const quitar = st.quitar || [];
      const sevAntes = (r.compiled || {}).severity || null; const sev = st.sev || sevAntes;
      const cambios = [];
      const patch = { updatedBy: S.me || null, updatedAt: nowIso() };
      if (text !== r.text) { patch.text = text; cambios.push('cambió el texto'); }
      if (sev !== sevAntes) { patch.compiled = { ...(r.compiled || {}), severity: sev }; cambios.push(`severidad ${sevAntes || '—'} → ${sev}`); }
      if (excNueva || quitar.length) {
        patch.exceptions = (r.exceptions || []).filter((_, n) => !quitar.includes(n));
        if (excNueva) { patch.exceptions.push({ text: excNueva, by: S.me || null, at: nowIso(), incidentId: inc ? inc.id : null }); cambios.push(`nueva excepción: no aplica cuando ${excNueva}`); }
        if (quitar.length) cambios.push(`quitó ${pl(quitar.length, 'excepción', 'excepciones')}`);
        if (patch.exceptions.length > 20) return toast('Una regla admite hasta 20 excepciones');
      }
      if (!cambios.length) return toast('No hay cambios para guardar');
      if (st.aplicada) patch.suggestion = null; // la sugerencia de la rutina quedó resuelta
      // Texto o excepciones nuevas: la rutina vuelve a traducir la regla. Solo severidad: vale ya.
      const recompilar = Boolean(patch.text || patch.exceptions);
      const inactiva = ['proposed', 'disabled', 'rejected'].includes(r.status);
      if (recompilar) patch.status = 'pending_compile'; else if (inactiva) patch.status = 'active';
      if (inactiva) { patch.approvedBy = S.me || null; patch.approvedAt = nowIso(); }
      await S.db.doc(`rules/${rid}`).update(patch);
      const des = await cerrarEdicionRegla(inc, ctx, rid, `ajustó la regla «${corto(text)}»: ${cambios.join('; ')}`, `se ajustó la regla (${cambios.join('; ')})`);
      toast(recompilar ? 'Regla guardada: la próxima corrida la vuelve a traducir' : 'Regla guardada', des);
    } else if (act === 're-sug-aplicar' || act === 're-sug-descartar') {
      const rid = b.dataset.rid; const r = S.rules[rid]; if (!r || !r.suggestion) return toast('La sugerencia ya no está');
      if (act === 're-sug-aplicar') { // solo llega acá la de desactivar: las demás se cargan en el formulario
        await S.db.doc(`rules/${rid}`).update({ status: 'disabled', suggestion: null, updatedBy: S.me || null, updatedAt: nowIso() });
        const des = await cerrarEdicionRegla(inc, b.dataset.ctx, rid, `desactivó la regla «${corto(r.text)}» (sugerencia de la rutina)`, 'se desactivó la regla');
        toast('Regla desactivada', des);
      } else {
        // Se recuerda el rechazo para que la rutina no vuelva a sugerir lo mismo enseguida.
        await S.db.doc(`rules/${rid}`).update({ suggestion: null, dismissedSuggestions: [...(r.dismissedSuggestions || []).slice(-19), { kind: r.suggestion.kind, at: nowIso(), by: S.me || null }] });
        toast('Sugerencia descartada');
      }
    } else if (act === 're-estado') {
      const rid = b.dataset.rid; const r = S.rules[rid]; if (!r) return toast('La regla ya no existe');
      await S.db.doc(`rules/${rid}`).update({ status: b.dataset.s, updatedBy: S.me || null, updatedAt: nowIso() });
      const des = await cerrarEdicionRegla(inc, b.dataset.ctx, rid, `desactivó la regla «${corto(r.text)}»`, 'se desactivó la regla');
      toast('Regla desactivada', des);
    } else if (act === 're-eliminar-ok') {
      const rid = b.dataset.rid; const r = S.rules[rid]; if (!r) return toast('La regla ya no existe');
      await S.db.doc(`rules/${rid}`).delete();
      const des = await cerrarEdicionRegla(inc, b.dataset.ctx, rid, `eliminó la regla «${corto(r.text)}»`, 'se eliminó la regla');
      toast('Regla eliminada', des);
    } else if (act === 're-crear') {
      const text = draft('rnueva'); if (!text) return toast('Escribí la regla');
      await S.db.doc(`rules/${slug(inc.projectId)}-${Date.now().toString(36)}`).set({ projectId: inc.projectId, text, status: 'pending_compile', origin: 'manual', sourceIncidentId: id, createdBy: S.me || null, createdAt: nowIso() });
      const des = await cerrarEdicionRegla(inc, id, 'nueva', `creó una regla a partir de este tema: «${corto(text)}»`, 'se creó una regla para este caso');
      clear('rnueva');
      toast('Regla creada: se traduce en la próxima corrida', des);
    } else if (act === 'nueva-regla') {
      const text = (S.drafts['nr-text'] || '').trim(); if (!text) return toast('Escribí la regla');
      const pid = S.drafts['nr-proj'] || (document.getElementById('nr-proj') || {}).value || S.filter || '*';
      await S.db.doc(`rules/${slug(pid)}-${Date.now().toString(36)}`).set({ projectId: pid, text, status: 'pending_compile', origin: 'manual', createdBy: S.me || null, createdAt: nowIso() });
      delete S.drafts['nr-text']; toast('Regla creada: se compila en la próxima corrida');
    } else if (act === 'guardar-ajustes') {
      const v = (k, d) => S.drafts['aj-' + k] ?? d; const s = S.settings || {}; const ds = s.discovery || {};
      await S.db.doc('config/settings').set({ ...s, triageCriteria: v('crit', s.triageCriteria || ''), severityMatrix: v('sev', s.severityMatrix || ''), pendingMaxMinutes: Number(v('pend', s.pendingMaxMinutes || 30)),
        retention: { runsDays: Number(v('runs', (s.retention || {}).runsDays || 60)), closedIncidentsDays: Number(v('inc', (s.retention || {}).closedIncidentsDays || 180)) },
        discovery: { ...ds, rootFolders: S.drafts['aj-raices'] === undefined ? ds.rootFolders || [] : listaCarpetas(S.drafts['aj-raices']).slice(0, 20) } });
      for (const k of ['crit', 'sev', 'pend', 'runs', 'inc', 'raices']) delete S.drafts['aj-' + k];
      toast('Ajustes guardados');
    } else if (act === 'escanear') {
      // Guarda la carpeta a escanear y pide el escaneo: lo hace la próxima corrida.
      const ds = ajDesc(); const raices = (S.drafts['aj-raices'] === undefined ? ds.rootFolders || [] : listaCarpetas(S.drafts['aj-raices'])).slice(0, 20);
      await guardarAjuste({ discovery: { rootFolders: raices, ignoredFolders: ds.ignoredFolders || [] } });
      if (!escaneoPedido()) await S.db.collection('requests').add({ type: 'discover_projects', roots: raices, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
      delete S.drafts['aj-raices'];
      toast(raices.length ? 'Guardado. La próxima corrida escanea la carpeta y propone los proyectos.' : 'Guardado. Sin carpeta indicada, la próxima corrida escanea todas las que puede ver.');
    } else if (act === 'auto-reglas') {
      const nuevo = !((S.settings || {}).autoApproveRules === true);
      await guardarAjuste({ autoApproveRules: nuevo });
      S.focusNext = 'aj-auto';
      toast(nuevo ? 'Aprobación automática activada: vale desde la próxima corrida' : 'Aprobación automática desactivada');
    } else if (act === 'ignorar-detectada') {
      const ds = ajDesc(); const folder = b.dataset.folder;
      await guardarAjuste({ discovery: { rootFolders: ds.rootFolders || [], ignoredFolders: [...(ds.ignoredFolders || []).filter((x) => norm(x) !== norm(folder)), folder].slice(-500) } });
      toast('Carpeta ignorada: no se vuelve a proponer');
    } else if (act === 'restaurar-ignoradas') {
      await guardarAjuste({ discovery: { rootFolders: ajDesc().rootFolders || [], ignoredFolders: [] } });
      toast('Las carpetas ignoradas vuelven a proponerse');
    } else if (act === 'registrar-todos-ok') {
      const usados = new Set(); const det = propuestos(); S.regAll = false;
      for (const f of det) await registrarCarpeta(f.folderPath, f.name || f.folderPath.split('/').pop(), usados);
      toast(`${pl(det.length, 'proyecto registrado', 'proyectos registrados')}: la rutina analiza hasta 3 por corrida`);
    } else if (act === 'doc-guardar') {
      const pid = b.dataset.pid; const kind = b.dataset.kind; const dr = S.docDraft[pid]; if (!dr || dr.kind !== kind) return;
      const nombre = etiqueta(DOCS(), kind);
      // Se vuelve a enmascarar: el texto pudo pegarse o editarse después de la conversión.
      const m = enmascarar(String(S.drafts['doc-md-' + pid] || '').replace(/\r\n?/g, '\n').trim());
      if (!m.texto) return toast('El documento está vacío');
      const bytes = new TextEncoder().encode(m.texto).length;
      if (bytes > DOC_MAX) return toast(`El documento pesa ${Math.round(bytes / 1024)} KB y el máximo es ${DOC_MAX / 1024} KB: recortalo o dejá solo las secciones útiles`);
      await S.db.doc(`documents/${pid}_${kind}`).set({ projectId: pid, kind, markdown: m.texto, fileName: dr.fileName ? enmascarar(dr.fileName).texto : null, source: dr.source || 'paste', chars: m.texto.length, masked: (dr.masked || 0) + m.n, uploadedBy: S.me || null, uploadedAt: nowIso() });
      delete S.docDraft[pid]; delete S.drafts['doc-md-' + pid]; S.focusNext = `doc-ver-${pid}-${kind}`;
      toast(`${nombre} guardado en Markdown. La rutina lo usa en el próximo análisis del proyecto.`);
    } else if (act === 'doc-quitar-ok') {
      const pid = b.dataset.pid; const kind = b.dataset.kind;
      await S.db.doc(`documents/${pid}_${kind}`).delete();
      S.docDel[pid] = null; if (S.docView[pid] === kind) S.docView[pid] = null;
      toast(`${etiqueta(DOCS(), kind)} quitado`);
    } else if (act === 'guardar-proyecto') {
      const pid = b.dataset.pid; const p = S.projects[pid];
      const r = proyectoDesdeForm(S.forms['cfg-' + pid] || formDesde(p));
      if (r.error) return toast(r.error);
      // `repo` era el formato anterior (un solo repo por proyecto): se reemplaza por `processes`.
      await S.db.doc(`projects/${pid}`).update({ ...r.data, repo: null, updatedAt: nowIso(), updatedBy: S.me || null });
      if (b.dataset.reanalizar) {
        await S.db.collection('requests').add({ type: 'reanalyze_project', projectId: pid, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
        toast('Guardado. La próxima corrida re-analiza el proyecto.');
      } else toast('Configuración guardada');
      S.forms['cfg-' + pid] = formDesde({ ...p, ...r.data });
    } else if (act === 'registrar-detectada') {
      const folder = b.dataset.folder; const nombre = b.dataset.name || folder.split('/').pop();
      await registrarCarpeta(folder, nombre);
      toast(`${nombre} registrado: la rutina lo analiza en la próxima corrida`);
    } else if (act === 'registrar') {
      const r = proyectoDesdeForm(S.forms.nuevo || formDesde(null));
      if (r.error) return toast(r.error);
      let id2 = slug(r.data.name); if (S.projects[id2]) id2 = `${id2}-${Date.now().toString(36).slice(-4)}`;
      await S.db.doc(`projects/${id2}`).set({ ...r.data, status: 'pending_analysis', createdBy: S.me || null, createdAt: nowIso(), updatedAt: nowIso() });
      await S.db.collection('requests').add({ type: 'onboard_project', projectId: id2, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
      delete S.forms.nuevo;
      toast('Proyecto registrado: la rutina lo analiza en la próxima corrida');
      location.hash = '#proyecto-' + id2;
    }
  } catch (err) { toast(err && err.code === 'invalid_argument' ? 'No tenés permiso para esta acción' : 'No se pudo guardar. Probá de nuevo.'); }
}

window.addEventListener('hashchange', () => {
  const h = ruta(); const esInc = h.startsWith('incidente-'); const eraInc = prevHash.startsWith('incidente-') ? prevHash.slice(10) : null;
  if (esInc) {
    // El detalle se abre sobre la vista actual: no se pierde el lugar en la lista.
    S.focusNext = 'dw';
    if (!eraInc) { const d = $('#drawer'); d.classList.add('opening'); setTimeout(() => d.classList.remove('opening'), 260); }
  } else if (eraInc && h === base) S.focusNext = 't-' + eraInc; // al cerrar, el foco vuelve a la tarjeta
  else { window.scrollTo(0, 0); S.focusNext = 'vt'; }
  if (h.startsWith('ayuda')) S.irAyuda = true;
  S.scopeOpen = false; prevHash = h; render();
});

// ---------- arranque ----------
async function start() {
  S.irAyuda = true;
  render();
  const cl = window.claude;
  const [db, user] = await Promise.all([cl && cl.use ? cl.use('db') : null, cl && cl.use ? cl.use('user') : null]);
  S.user = user;
  // Descargas (bajar un documento como .md): opcional y sin demorar el arranque. Sin la capacidad, el botón no se muestra.
  if (cl && cl.use) Promise.resolve(cl.use('downloads')).then((d) => { S.downloads = d || null; schedule(); }, () => {});
  if (!db) { S.error = 'El tablero necesita una sesión de claude.ai para mostrar datos.'; return schedule(); }
  S.db = db;
  if (user) {
    S.me = await user.id();
    S.isAdmin = await user.canEdit();
    const w = await user.can('data.write');
    S.canWrite = S.isAdmin || w === true || w === null;
    S.role = S.isAdmin ? 'admin' : S.canWrite ? 'operador' : 'lector';
    if (S.me) resolveNames([S.me]);
  }
  const timer = setTimeout(() => { S.stale = true; schedule(); }, 10000);
  const onErr = (e) => { clearTimeout(timer); S.error = e && e.code === 'revoked' ? 'Tu acceso al tablero cambió.' : 'No se pudo leer el tablero.'; schedule(); };
  const coll = (name, key, fn) => db.collection(name).onSnapshot((s) => { clearTimeout(timer); S[key] = {}; for (const d of s.docs) S[key][d.id] = { id: d.id, ...d.data() }; S.loaded[key] = true; if (fn) fn(); schedule(); }, onErr);
  coll('projects', 'projects');
  coll('rules', 'rules');
  coll('incidentWork', 'work', () => resolveNames(Object.values(S.work).flatMap((w) => [w.assignee, w.delegatedBy, w.updatedBy])));
  db.collection('incidents').where('status', '==', 'open').onSnapshot((s) => { clearTimeout(timer); S.incidents = {}; for (const d of s.docs) S.incidents[d.id] = { id: d.id, ...d.data() }; S.loaded.incidents = true; schedule(); }, onErr);
  db.collection('runs').orderBy('startedAt', 'desc').limit(50).onSnapshot((s) => { S.runs = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.runs = true; schedule(); }, onErr);
  db.doc('config/settings').onSnapshot((d) => { S.settings = d.exists ? d.data() : null; setIdioma(S.settings && S.settings.language); schedule(); }, () => {});
  db.doc('config/discovery').onSnapshot((d) => { S.discovery = d.exists ? d.data() : null; schedule(); }, () => {});
  coll('libraries', 'libraries');
  // Colecciones nuevas: si fallan (p. ej. el tablero publicado todavía no las conoce) el resto sigue funcionando.
  const blanda = (name, key, fn) => db.collection(name).onSnapshot((s) => { S[key] = {}; for (const d of s.docs) S[key][d.id] = { id: d.id, ...d.data() }; if (fn) fn(); schedule(); }, () => {});
  blanda('discrepancies', 'discs');
  blanda('discrepancyWork', 'discWork', () => resolveNames(Object.values(S.discWork).map((w) => w.updatedBy)));
  db.collection('requests').where('status', '==', 'pending').onSnapshot((s) => { S.pendReq = s.docs.map((d) => ({ id: d.id, ...d.data() })); schedule(); }, () => {});
  setInterval(schedule, 60000); // refresca los "hace X min"
}
document.documentElement.lang = LANG; document.title = tx('comun.titulo');
start();
})();
