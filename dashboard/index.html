</ul><p>Puede haber varios de la misma categoría, por ejemplo un SDD por proceso. Todo se guarda <strong>en Markdown</strong> (.md), sin imágenes. La rutina usa estos documentos en el análisis del proyecto, para la memoria de proceso y las discrepancias, y en el análisis previo de cada tema. Después de subir uno conviene <strong>Pedir re-análisis</strong>.</p><p>Un Lector o un Operador pueden ver y descargar los documentos; solo un Admin los sube, los quita o desactiva los del paquete. Para cambiar un documento, subí el nuevo y quitá el anterior.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:documentacion--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure><div class="ay-accion" id="ayuda-doc-pkg"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Desactivar o Volver a usar</span><span class="role-b">Solo Admin</span></div><p><b>Hace que la rutina deje de usar, o vuelva a usar, un documento que viene dentro del paquete publicado.</b></p><p>Debajo de los documentos subidos a mano, <strong>En los paquetes publicados</strong> lista los documentos que la rutina encontró dentro de cada paquete, con el proceso y la versión. Están <strong>En uso</strong> salvo que un Admin los desactive.</p><p>Sirve cuando el documento del paquete está viejo o es de otra cosa: desactivalo y, si hace falta, subí el correcto. Vale desde la próxima corrida; conviene <strong>Pedir re-análisis</strong> para rehacer la memoria de proceso sin ese documento. Si una versión nueva del paquete trae el documento con la misma ruta, sigue desactivado.</p></div><div class="ay-accion" id="ayuda-doc-subir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Subir archivo</span><span class="role-b">Solo Admin</span></div><p><b>Sube un Word (.docx), un PDF, un .md o un .txt y lo convierte a Markdown. Se revisa antes de guardar.</b></p><ul>
<li><strong>Word (.docx):</strong> se convierten títulos, párrafos, negritas, listas y tablas. Las imágenes, los encabezados y el índice no se pasan.</li>
<li><strong>PDF:</strong> se recupera el texto. Un PDF no guarda la estructura, así que los títulos se deducen del tamaño de la letra y las tablas quedan como texto corrido: conviene revisarlo. Un PDF escaneado no tiene texto para leer. Si existe el Word original, da mejor resultado.</li>
<li><strong>.md o .txt:</strong> se toman como están.</li>
</ul><p>La categoría se propone por el nombre del archivo y se puede cambiar. Nada se guarda hasta tocar <strong>Guardar documento</strong>.</p></div><div class="ay-accion" id="ayuda-doc-pegar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Pegar texto</span><span class="role-b">Solo Admin</span></div><p><b>Abre un cuadro para pegar o escribir el documento, en Markdown o texto plano.</b></p><p>Sirve para documentos que están en una wiki o en un formato que no se puede subir.</p></div><div class="ay-accion" id="ayuda-doc-guardar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar documento</span><span class="role-b">Solo Admin</span></div><p><b>Guarda el documento en Markdown, con su categoría y su título, después de enmascarar emails, documentos y usuarios.</b></p><p>Antes de guardar se elige la categoría, se puede escribir un título o una descripción, y se ve el Markdown para corregirlo. El tablero no guarda datos personales: los emails, los números de documento y los usuarios de Windows se enmascaran solos, pero los <strong>nombres de personas no se detectan</strong>: quitalos a mano. Cada documento admite hasta 230 KB de texto.</p></div><div class="ay-accion" id="ayuda-doc-ver"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ver</span></div><p><b>Muestra el documento guardado, con formato.</b></p><p><strong>Ocultar</strong> lo cierra.</p></div><div class="ay-accion" id="ayuda-doc-descargar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descargar .md</span></div><p><b>Baja el documento guardado como un archivo Markdown.</b></p><p>Pide confirmación antes de guardar el archivo. Si esta vista no admite descargas, el botón no aparece.</p></div><div class="ay-accion" id="ayuda-doc-quitar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Quitar</span><span class="role-b">Solo Admin</span></div><p><b>Borra el documento del proyecto. Pide confirmación.</b></p><p>No se puede deshacer. La memoria de proceso que ya se generó con ese documento no cambia hasta el próximo re-análisis.</p></div></section>
<section class="ay-sec n3" id="ayuda-proyecto-reglas" data-nivel="3"><h4>Pestaña Reglas</h4><p class="ay-breve">Las reglas de este proyecto y su estado.</p><p>Las reglas del proyecto, con las mismas acciones que la pantalla <a href="#ayuda-reglas">Reglas</a>.</p></section>
<section class="ay-sec n3" id="ayuda-proyecto-inventario" data-nivel="3"><h4>Pestaña Inventario</h4><p class="ay-breve">Procesos, colas, triggers y assets de la carpeta (de los assets, solo el nombre).</p><p>El <a href="#ayuda-inventario">inventario</a> de la carpeta: procesos con su versión y si son parte del proyecto, colas con sus reintentos, triggers y assets. De los assets se muestra solo el nombre y el tipo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:inventario--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-proyecto-config" data-nivel="3"><h4>Pestaña Configuración</h4><p class="ay-breve">Nombre, carpeta, procesos, documentación y criterios del proyecto. Solo Admin puede editarla.</p><p>Un Lector o un Operador ven los criterios de triage y la documentación del proyecto. Un Admin puede editar:</p><ul>
<li>el nombre y la carpeta de Orchestrator;</li>
<li>en <strong>Opciones avanzadas</strong>: controlar solo algunos procesos, el repo de Bitbucket de respaldo de cada proceso, la documentación adicional y los criterios de triage del proyecto.</li>
</ul><p><strong>Editar configuración</strong>, debajo de la lista de procesos, abre esta pestaña.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyecto:config--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-guardar-proyecto"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar y re-analizar</span><span class="role-b">Solo Admin</span></div><p><b>Guarda la configuración. Guardar y re-analizar además pide a la próxima corrida que regenere memoria e inventario.</b></p><p>Si cambiaste repos o procesos, conviene re-analizar. <strong>Solo guardar</strong> guarda sin pedir el análisis. Si el proyecto estaba activo, sigue activo.</p></div><div class="ay-accion" id="ayuda-descartar-cambios"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Descartar cambios</span><span class="role-b">Solo Admin</span></div><p><b>Vuelve el formulario a la configuración guardada.</b></p><p>Deshace lo que editaste y no guardaste.</p></div></section>
<section class="ay-sec n2" id="ayuda-reglas" data-nivel="2"><h3>Reglas</h3><p class="ay-breve">Los puntos de control escritos en lenguaje natural, de todos los proyectos.</p><p>Las <a href="#ayuda-regla">reglas</a> de todos los proyectos. Arriba, las <strong>Propuestas para aprobar</strong>; después, para un Admin, el formulario <strong>Nueva regla</strong>, y al final el resto. Cada una muestra su estado, su proyecto, de dónde salió (a mano, del alta, aprendida de un incidente, por similitud o de la revisión diaria), sus excepciones y cómo la entendió la rutina.</p><ul>
<li><strong>Por compilar:</strong> la rutina la traduce a un control en la próxima corrida.</li>
<li><strong>Propuesta:</strong> la rutina la sugirió y dice por qué; un Admin la aprueba o la rechaza. Con la <a href="#ayuda-auto-reglas">aprobación automática</a> activa no hay propuestas: las reglas nacen activas.</li>
<li><strong>Activa</strong>, <strong>Desactivada</strong> o <strong>Rechazada.</strong></li>
<li><strong>Cambio sugerido:</strong> la revisión diaria encontró algo para ajustar en la regla.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure><div class="ay-accion" id="ayuda-nueva-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Crear regla</span><span class="role-b">Solo Admin</span></div><p><b>Agrega una regla escrita en lenguaje natural. Se compila en la próxima corrida.</b></p><p>Elegí el proyecto, o Todos los proyectos, y escribí la regla como se la dirías a una persona: qué mirar, el umbral y qué hacer. Por ejemplo: si se ven más de 10 errores de login seguidos, escalar.</p></div><div class="ay-accion" id="ayuda-regla-active"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aprobar o Activar</span><span class="role-b">Solo Admin</span></div><p><b>La regla pasa a controlarse en cada corrida.</b></p><p><strong>Aprobar</strong> acepta una regla propuesta. <strong>Activar</strong> vuelve a encender una regla desactivada.</p></div><div class="ay-accion" id="ayuda-regla-rejected"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Rechazar</span><span class="role-b">Solo Admin</span></div><p><b>Descarta una regla propuesta. No se controla.</b></p><p>La regla queda como Rechazada, para que la rutina no la vuelva a proponer igual.</p></div><div class="ay-accion" id="ayuda-regla-disabled"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Desactivar</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar una regla activa, sin borrarla.</b></p><p>Se puede volver a activar en cualquier momento.</p></div><div class="ay-accion" id="ayuda-re-abrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Editar o Revisar</span><span class="role-b">Solo Admin</span></div><p><b>Abre el editor de la regla en la lista. Dice Revisar cuando la rutina sugiere un cambio.</b></p><p>Es el mismo <a href="#ayuda-editor-regla">editor</a> que se abre desde un tema.</p></div></section>
<section class="ay-sec n3" id="ayuda-editor-regla" data-nivel="3"><h4>Editor de reglas</h4><p class="ay-breve">Cambia el texto, la severidad o las excepciones de una regla, o la desactiva o elimina.</p><p>Se abre con <strong>Ajustar regla</strong> desde un tema o con <strong>Editar</strong> en la lista de reglas. Solo los Admin pueden cambiar algo; un Operador ve la regla y sus excepciones.</p><ul>
<li><strong>Hay una condición en la que no aplica:</strong> escribí la <strong>excepción</strong>, por ejemplo &quot;es lunes antes de las 9&quot;. Vale desde la próxima corrida.</li>
<li><strong>Avisa con una gravedad que no corresponde:</strong> elegí otra <strong>severidad</strong>, de P1 a P4. Cambia al guardar.</li>
<li><strong>El umbral o la condición están mal:</strong> corregí el <strong>texto</strong>. Vale desde la próxima corrida.</li>
<li><strong>No querés que controle por un tiempo:</strong> <strong>Desactivar</strong>.</li>
<li><strong>La regla no sirve:</strong> <strong>Eliminar regla</strong>. Pide confirmación y no se puede deshacer.</li>
</ul><p>Cuando cambia el texto o una excepción, la regla queda <strong>Por compilar</strong> y la rutina muestra después cómo la entendió. Las excepciones se pueden quitar. Desde un tema, <strong>Descartar también este tema</strong> cierra el incidente en el mismo paso, como falso positivo.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:reglas:editor--></div><figcaption>Ejemplo con datos ficticios · vista de Admin, con una sugerencia de la rutina</figcaption></figure><div class="ay-accion" id="ayuda-re-guardar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar cambios</span><span class="role-b">Solo Admin</span></div><p><b>Guarda el texto, la severidad y las excepciones. En una propuesta dice Guardar y aprobar.</b></p><p>En una regla desactivada o rechazada dice <strong>Guardar y activar</strong>. El cambio queda en la actividad del tema si se hizo desde uno.</p></div><div class="ay-accion" id="ayuda-re-sev"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Severidad</span><span class="role-b">Solo Admin</span></div><p><b>Elige la severidad con la que avisa la regla, de P1 a P4. Cambia al guardar.</b></p><p>No aparece en reglas que marcan temas como conocidos o los ignoran, porque esas no avisan.</p></div><div class="ay-accion" id="ayuda-re-estado"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Desactivar (editor)</span><span class="role-b">Solo Admin</span></div><p><b>Deja de controlar esta regla desde ya, sin borrarla.</b></p><p>Se puede volver a activar desde la lista de reglas.</p></div><div class="ay-accion" id="ayuda-re-eliminar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Eliminar regla</span><span class="role-b">Solo Admin</span></div><p><b>Borra la regla para siempre. Pide confirmación.</b></p><p>Si solo querés que deje de controlar un tiempo, conviene <strong>Desactivar</strong>.</p></div><div class="ay-accion" id="ayuda-re-sug-aplicar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aplicar sugerencia</span><span class="role-b">Solo Admin</span></div><p><b>Carga en el formulario el cambio que sugiere la rutina; vos confirmás con Guardar.</b></p><p>Si la sugerencia es desactivar la regla, el botón dice <strong>Desactivar</strong> y la desactiva directamente. Ver <a href="#ayuda-sugerencia">sugerencias de la rutina</a>.</p></div><div class="ay-accion" id="ayuda-re-sug-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">No, gracias</span><span class="role-b">Solo Admin</span></div><p><b>Descarta la sugerencia de la rutina. No vuelve a sugerirla por 90 días.</b></p><p>La regla queda como estaba.</p></div></section>
<section class="ay-sec n3" id="ayuda-propuestas" data-nivel="3"><h4>Propuestas de la rutina</h4><p class="ay-breve">Reglas y cambios que propone la rutina. Los aprueba un Admin, salvo que la aprobación automática esté activa.</p><p>La rutina propone por su cuenta, y todo llega a <strong>Para revisar</strong> y a <strong>Propuestas para aprobar</strong>:</p><ul>
<li><strong>Por <a href="#ayuda-similitud">similitud</a>:</strong> cuando un Admin aprueba o edita una regla, la rutina la ofrece a otros procesos que usan el mismo portal, la misma aplicación o la misma librería.</li>
<li><strong><a href="#ayuda-sugerencia">Cambios sugeridos</a>:</strong> una vez por día revisa los últimos 30 días y marca las reglas que conviene tocar.</li>
<li><strong>Reglas nuevas de la revisión diaria:</strong> si un mismo tema sin regla se descartó varias veces, o un aviso se repite sin que nadie lo mire.</li>
<li><strong>Aprendidas de un incidente:</strong> a partir de los descartes y las respuestas.</li>
</ul><p>Llegan como máximo 3 propuestas por proyecto por vez.</p><p>Por defecto nada se activa solo. Si un Admin activó la <a href="#ayuda-auto-reglas">aprobación automática</a> en Ajustes, las <strong>reglas nuevas</strong> se activan en el momento y quedan marcadas como <strong>aprobada automáticamente</strong>. Los cambios sugeridos sobre reglas que ya existen siempre esperan a una persona.</p></section>
<section class="ay-sec n2" id="ayuda-registrar" data-nivel="2"><h3>Registrar proyecto</h3><p class="ay-breve">Solo Admin: suma una carpeta de Orchestrator al control.</p><p>Se llega desde <strong>Proyectos → Registrar proyecto</strong>. Un <a href="#ayuda-proyecto">proyecto</a> es una carpeta de Orchestrator. La rutina detecta sola sus procesos, sus librerías y su documentación a partir de los paquetes publicados, en la versión que está en producción.</p><ol>
<li>Registrá la carpeta desde los <a href="#ayuda-propuestos">proyectos propuestos</a> o con el formulario.</li>
<li>La próxima corrida hace el <a href="#ayuda-alta">alta</a>.</li>
<li>Revisá el proyecto y tocá <strong>Activar el control de este proyecto</strong>.</li>
</ol><p>Los procesos que se agreguen después a la carpeta se suman solos.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:registrar:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-registrar-analizar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar y analizar</span><span class="role-b">Solo Admin</span></div><p><b>Crea el proyecto con el nombre y la carpeta indicados y pide su análisis.</b></p><p>Alcanza con el nombre y la carpeta. Las <strong>Opciones avanzadas</strong> son las mismas que en la <a href="#ayuda-proyecto-config">Configuración</a> y normalmente no hacen falta.</p></div></section>
<section class="ay-sec n3" id="ayuda-propuestos" data-nivel="3"><h4>Proyectos propuestos</h4><p class="ay-breve">Carpetas de Orchestrator con procesos que encontró el escaneo y que todavía no se controlan.</p><p>La rutina escanea la carpeta indicada en <a href="#ayuda-descubrimiento">Ajustes</a>: cuando un Admin lo pide y, además, una vez por día. Cada carpeta con procesos que todavía no es un proyecto aparece acá como <a href="#ayuda-proyecto-propuesto">proyecto propuesto</a>, con sus procesos y su actividad de los últimos 30 días.</p><p>Nada se registra solo: un Admin elige qué controlar. Si no hay propuestas, la pantalla dice por qué y lleva a Ajustes.</p><div class="ay-accion" id="ayuda-registrar-detectada"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar</span><span class="role-b">Solo Admin</span></div><p><b>Registra un proyecto propuesto y pide su análisis.</b></p><p>El proyecto toma el nombre y la carpeta propuestos. Se pueden cambiar después en su <a href="#ayuda-proyecto-config">Configuración</a>.</p></div><div class="ay-accion" id="ayuda-registrar-todos"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Registrar todos</span><span class="role-b">Solo Admin</span></div><p><b>Registra de una vez todos los proyectos propuestos que quedan en la lista. Pide confirmación.</b></p><p>Conviene ignorar antes las carpetas que no son de producción. La rutina hace hasta 3 altas por corrida: con muchos proyectos, el análisis tarda varias horas.</p></div><div class="ay-accion" id="ayuda-ignorar-detectada"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Ignorar</span><span class="role-b">Solo Admin</span></div><p><b>Saca la carpeta de las propuestas. No se vuelve a proponer.</b></p><p>Para carpetas de pruebas, de desarrollo o que no se quieren controlar.</p></div><div class="ay-accion" id="ayuda-restaurar-ignoradas"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Volver a proponerlas</span><span class="role-b">Solo Admin</span></div><p><b>Vuelve a mostrar como propuestas las carpetas ignoradas.</b></p><p>Aparece debajo de la lista cuando hay carpetas ignoradas.</p></div></section>
<section class="ay-sec n2" id="ayuda-ajustes" data-nivel="2"><h3>Ajustes</h3><p class="ay-breve">Solo Admin: carpeta a escanear, criterios globales del triage, umbrales, retención y aprobación de reglas.</p><ul>
<li><strong>Idioma:</strong> el <a href="#ayuda-idioma">idioma del tablero</a> y de lo que escribe la rutina.</li>
<li><strong>Proyectos a controlar:</strong> la <a href="#ayuda-descubrimiento">carpeta de Orchestrator a escanear</a>.</li>
<li><strong>Criterios de triage globales:</strong> se aplican a todos los proyectos, junto con los de cada uno.</li>
<li><strong>Matriz de severidad:</strong> qué es P1, P2, P3 y P4.</li>
<li><strong>Minutos máximos en Pending:</strong> desde cuándo un job que espera se considera un problema.</li>
<li><strong>Retención:</strong> cuántos días se guardan las corridas y los incidentes cerrados.</li>
<li><strong>Reglas:</strong> la <a href="#ayuda-auto-reglas">aprobación automática</a>.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:ajustes:--></div><figcaption>Ejemplo con datos ficticios</figcaption></figure><div class="ay-accion" id="ayuda-guardar-ajustes"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar ajustes</span><span class="role-b">Solo Admin</span></div><p><b>Guarda la carpeta, los criterios, los umbrales y la retención. Se usan desde la próxima corrida.</b></p><p>Los cambios en los criterios no reclasifican lo que ya está en el tablero: se aplican a los hallazgos de las próximas corridas. La aprobación automática no depende de este botón: se guarda al cambiar el interruptor.</p></div><div class="ay-accion" id="ayuda-idioma"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Español / English</span><span class="role-b">Solo Admin</span></div><p><b>Cambia el idioma de todo el tablero y de lo que escribe la rutina desde la próxima corrida. Vale para todas las personas.</b></p><p>Es un ajuste <strong>global</strong>: lo elige un Admin y lo ven igual todas las personas. Cambia en el acto los menús, botones, mensajes y esta ayuda, y desde la próxima corrida la rutina escribe en ese idioma los títulos de los temas, los análisis, las memorias y las reglas que propone.</p><p>Cada texto se escribe <strong>una sola vez</strong>, en el idioma vigente cuando se generó: lo que ya estaba guardado no se traduce ni se duplica. Para tener la memoria de un proyecto en el idioma nuevo, volvé a analizarlo desde el proyecto. Los textos que escribe una persona (notas, comentarios, texto de una regla) y los documentos subidos quedan como se escribieron.</p></div><div class="ay-accion" id="ayuda-auto-reglas"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Aprobar automáticamente las reglas</span><span class="role-b">Solo Admin</span></div><p><b>Interruptor. Activado, las reglas que propone la rutina quedan activas en el momento, sin esperar a un Admin.</b></p><p>Viene <strong>desactivado</strong>: cada regla que propone la rutina espera a que un Admin la apruebe.</p><p>Al activarlo:</p><ul>
<li>Las reglas propuestas que estaban esperando se aprueban en ese momento. Rechazá antes las que no quieras.</li>
<li>Desde entonces, cada regla que propone la rutina nace activa: no pasa por <strong>Propuestas para aprobar</strong>.</li>
<li>Las reglas aprobadas así quedan marcadas como <strong>aprobada automáticamente</strong> y se pueden desactivar, editar o eliminar como cualquier otra.</li>
<li>Los <strong>cambios sugeridos</strong> sobre reglas que ya existen (una excepción, otra severidad, desactivarla) no se aplican solos.</li>
</ul><p>Se guarda en el momento. Al apagarlo, las reglas ya activas siguen activas y las nuevas vuelven a esperar aprobación.</p></div></section>
<section class="ay-sec n3" id="ayuda-descubrimiento" data-nivel="3"><h4>Proyectos a controlar</h4><p class="ay-breve">La carpeta de Orchestrator que la rutina escanea para proponer proyectos. Es el primer paso en un tablero nuevo.</p><p>En Orchestrator los proyectos de producción suelen estar dentro de una misma carpeta, por ejemplo <code>Produccion</code>. Escribila acá, con su ruta completa si está dentro de otra (<code>Clientes/Produccion</code>). Se pueden indicar varias, separadas por coma.</p><p>La rutina recorre todas las carpetas que están adentro. Cada una que tiene procesos y todavía no se controla pasa a <a href="#ayuda-propuestos">Proyectos propuestos</a>. Lo que está fuera de esa carpeta no se propone.</p><p>Para que el escaneo vea las subcarpetas, la aplicación con la que la rutina lee Orchestrator tiene que poder verlas. Si no puede, debajo del campo aparece un aviso que dice qué falta.</p><div class="ay-accion" id="ayuda-escanear"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Guardar y escanear</span><span class="role-b">Solo Admin</span></div><p><b>Guarda la carpeta y pide a la próxima corrida que la escanee y proponga los proyectos.</b></p><p>Mientras el pedido espera, dice <strong>Escaneo pedido</strong>. Después muestra cuándo fue el último escaneo y cuántos proyectos propuso. Además del pedido, la rutina repite el escaneo una vez por día para encontrar carpetas nuevas.</p></div></section>
<section class="ay-sec n2" id="ayuda-mas" data-nivel="2"><h3>Más (teléfono)</h3><p class="ay-breve">En el teléfono: Fuera de bandeja, Ajustes, Registrar proyecto, Ayuda y el estado de la rutina.</p><p>En el teléfono la barra de abajo tiene lugar para Bandeja, Proyectos, Corridas y Reglas. Lo demás está en <strong>Más</strong>, junto con el estado de la rutina y tu acceso.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:mas:--></div><figcaption>Ejemplo con datos ficticios · vista de Admin</figcaption></figure></section>
<section class="ay-sec n1" id="ayuda-glosario" data-nivel="1"><h2>Glosario</h2><p class="ay-breve">Los términos que usa el tablero, en orden alfabético.</p><p>Cada término es también la explicación que aparece al pasar el mouse por su etiqueta en el tablero.</p><div class="ay-glos"><div class="ay-term" id="ayuda-alta"><b class="ay-term-n">Alta</b><div class="ay-term-d">El primer análisis de un proyecto recién registrado. La rutina descubre sus procesos, colas, triggers y librerías, calcula el baseline y genera la memoria de proceso, las discrepancias y las reglas propuestas. Después un Admin lo revisa y lo activa.</div></div><div class="ay-term" id="ayuda-analisis-previo"><b class="ay-term-n">Análisis previo</b><div class="ay-term-d">Lo que la rutina investiga antes de escalar una tarjeta: hipótesis con su probabilidad, acciones sugeridas, el código y la documentación relacionados, y qué cambió en el último deploy. Se lee en el detalle de la tarjeta.</div></div><div class="ay-term" id="ayuda-aprobacion-automatica"><b class="ay-term-n">Aprobación automática</b><div class="ay-term-d">Una opción de Ajustes. Cuando está activa, las reglas que propone la rutina quedan activas en el momento, sin esperar a un Admin. Los cambios sugeridos sobre reglas que ya existen siempre los aplica una persona.</div></div><div class="ay-term" id="ayuda-baseline"><b class="ay-term-n">Baseline</b><div class="ay-term-d">El comportamiento normal de un proyecto en los últimos 30 días: cuántos jobs corre, cuánto tardan y cuántos errores tiene. Sirve para distinguir un problema nuevo de lo habitual.</div></div><div class="ay-term" id="ayuda-categoria"><b class="ay-term-n">Categoría</b><div class="ay-term-d">El tipo de problema, con su ícono: login o credenciales, selector o UI, aplicación caída, infraestructura, configuración, programación, negocio, sistema, falla silenciosa, regresión, deploy o monitoreo.</div></div><div class="ay-term" id="ayuda-corrida"><b class="ay-term-n">Corrida</b><div class="ay-term-d">Una ejecución de la rutina. Registra qué ventana de tiempo revisó en cada proyecto, cada punto de control con su valor observado y los hallazgos con su triage.</div></div><div class="ay-term" id="ayuda-criterios"><b class="ay-term-n">Criterios de triage</b><div class="ay-term-d">Instrucciones en lenguaje natural que guían la clasificación. Hay criterios globales, en Ajustes, y criterios propios de cada proyecto, en su Configuración.</div></div><div class="ay-term" id="ayuda-decision"><b class="ay-term-n">Decisión</b><div class="ay-term-d">Qué hace el triage con un hallazgo. Escalado: necesita a una persona y va a Requiere acción. Aviso: conviene verlo, pero no bloquea. En observación: se sigue la tendencia sin mostrarlo. Conocido: la memoria o una regla dicen que es esperado.</div></div><div class="ay-term" id="ayuda-discrepancia"><b class="ay-term-n">Discrepancia</b><div class="ay-term-d">Algo que no coincide entre el código, la documentación y Orchestrator de un proyecto, por ejemplo una cola del SDD que no existe o un trigger con otra frecuencia. La encuentra el análisis del proyecto. Se responde, se pospone o se descarta desde la pestaña Discrepancias del proyecto: no va a la bandeja.</div></div><div class="ay-term" id="ayuda-estado-proyecto"><b class="ay-term-n">Estado del proyecto</b><div class="ay-term-d">Esperando análisis, Analizando, En revisión, Activo, Pausado o Con error. Solo los proyectos activos se controlan en cada corrida.</div></div><div class="ay-term" id="ayuda-evidencia"><b class="ay-term-n">Evidencia (redactada)</b><div class="ay-term-d">Los logs, queue items, jobs y valores de reglas que respaldan una tarjeta, después de quitarles los datos personales. Las referencias de los casos se muestran como un código corto, nunca el dato original.</div></div><div class="ay-term" id="ayuda-excepcion"><b class="ay-term-n">Excepción de regla</b><div class="ay-term-d">Una condición en la que una regla que está bien no aplica, por ejemplo: es lunes antes de las 9. Se agrega desde el editor de reglas y vale desde la próxima corrida.</div></div><div class="ay-term" id="ayuda-incidente"><b class="ay-term-n">Incidente o tarjeta</b><div class="ay-term-d">Un problema detectado, con toda su historia: cuándo se vio por primera y por última vez, cuántas veces ocurrió, su triage, su análisis y la actividad del equipo.</div></div><div class="ay-term" id="ayuda-inventario"><b class="ay-term-n">Inventario</b><div class="ay-term-d">Lo que tiene la carpeta de Orchestrator de un proyecto: procesos con su versión, colas, triggers y assets. De los assets se guarda solo el nombre y el tipo, nunca el valor.</div></div><div class="ay-term" id="ayuda-libreria"><b class="ay-term-n">Librería</b><div class="ay-term-d">La etiqueta con el nombre de una librería indica que el error ocurrió dentro de una actividad de esa librería. El detalle dice qué otros proyectos la usan y si tienen tarjetas abiertas.</div></div><div class="ay-term" id="ayuda-memoria-de-proceso"><b class="ay-term-n">Memoria de proceso</b><div class="ay-term-d">Una descripción del proceso, similar a un PDD resumido, que la rutina genera en el alta a partir del código y la documentación. Sirve de contexto para el triage y el análisis.</div></div><div class="ay-term" id="ayuda-memoria-de-produccion"><b class="ay-term-n">Memoria de producción</b><div class="ay-term-d">El historial permanente de un proyecto: respuestas del equipo, deploys, re-controles y reglas nuevas, más un resumen que se actualiza solo. Es lo que hace que la rutina aprenda.</div></div><div class="ay-term" id="ayuda-nueva-version"><b class="ay-term-n">Nueva versión</b><div class="ay-term-d">Se desplegó una versión nueva del proceso después de que se abrió la tarjeta. La rutina la vuelve a analizar y explica qué cambió.</div></div><div class="ay-term" id="ayuda-proyecto"><b class="ay-term-n">Proyecto</b><div class="ay-term-d">Una carpeta de Orchestrator con sus procesos, por ejemplo Dispatcher, Performer y Reporter. Es la unidad que se registra, se analiza y se controla.</div></div><div class="ay-term" id="ayuda-proyecto-propuesto"><b class="ay-term-n">Proyecto propuesto</b><div class="ay-term-d">Una carpeta de Orchestrator con procesos que encontró el escaneo y que todavía no se controla. Un Admin la registra, y entonces la rutina hace su alta, o la ignora.</div></div><div class="ay-term" id="ayuda-pulso"><b class="ay-term-n">Pulso de la rutina</b><div class="ay-term-d">Abajo del menú (en el teléfono, arriba): cuándo fue el último control. Verde si salió bien, ámbar si tuvo errores de colecta, y rojo si la rutina dejó de correr; en ese caso la bandeja también lo avisa.</div></div><div class="ay-term" id="ayuda-punto-de-control"><b class="ay-term-n">Punto de control</b><div class="ay-term-d">Cada cosa que se revisa en una corrida, por ejemplo jobs fallidos, items abandonados o una regla. Su resultado es alerta, ok u omitido.</div></div><div class="ay-term" id="ayuda-re-control"><b class="ay-term-n">Re-control</b><div class="ay-term-d">Respuesta Volver a controlar con una fecha. La tarjeta se oculta hasta ese día y entonces la rutina verifica si el problema sigue. Queda en la memoria de producción como Re-control agendado y Re-control OK.</div></div><div class="ay-term" id="ayuda-reaparecio"><b class="ay-term-n">Reapareció</b><div class="ay-term-d">Un tema que se había cerrado volvió dentro de los 30 días. Se reabre la misma tarjeta en lugar de crear una nueva, para no perder su historia.</div></div><div class="ay-term" id="ayuda-recurrencia"><b class="ay-term-n">Recurrencia</b><div class="ay-term-d">Cuando un tema se repite, suma ocurrencias en la misma tarjeta. La etiqueta ×7 · última hace 12 min indica cuántas veces pasó y cuándo fue la última.</div></div><div class="ay-term" id="ayuda-regla"><b class="ay-term-n">Regla</b><div class="ay-term-d">Un punto de control escrito en lenguaje natural, por ejemplo: si hay más de 10 errores de login seguidos, escalar. La rutina la traduce a un control y muestra cómo la entendió.</div></div><div class="ay-term" id="ayuda-retencion"><b class="ay-term-n">Retención</b><div class="ay-term-d">Las corridas y los incidentes cerrados se borran después de cierta cantidad de días, que se configura en Ajustes. Antes de borrarlos se guarda un resumen mensual.</div></div><div class="ay-term" id="ayuda-rutina"><b class="ay-term-n">Rutina</b><div class="ay-term-d">El proceso de Claude que corre solo, en general cada hora. Es el único que crea corridas e incidentes, y nunca modifica nada en Orchestrator.</div></div><div class="ay-term" id="ayuda-severidad"><b class="ay-term-n">Severidad (P1 a P4)</b><div class="ay-term-d">P1: un proceso crítico se detuvo o se incumplió el SLA hoy. P2: proceso degradado con riesgo de SLA. P3: errores aislados. P4: informativo.</div></div><div class="ay-term" id="ayuda-similitud"><b class="ay-term-n">Propuesta por similitud</b><div class="ay-term-d">Cuando un Admin aprueba o edita una regla, la rutina propone la regla equivalente a otros procesos que usan el mismo portal, la misma aplicación o la misma librería. Llega como propuesta: la aprueba un Admin, salvo que esté activa la aprobación automática.</div></div><div class="ay-term" id="ayuda-solicitud"><b class="ay-term-n">Solicitud</b><div class="ay-term-d">Un pedido del equipo a la rutina, por ejemplo escanear una carpeta, analizar un proyecto nuevo o volver a analizar una tarjeta. Se atiende en la próxima corrida.</div></div><div class="ay-term" id="ayuda-sugerencia"><b class="ay-term-n">Sugerencia de la rutina</b><div class="ay-term-d">Un cambio en una regla que propone la revisión diaria de los últimos 30 días: una excepción o un umbral si casi siempre se descarta, una severidad más baja si sus temas se posponen, o desactivarla si no dispara hace 60 días. Se ve como Cambio sugerido.</div></div><div class="ay-term" id="ayuda-tema"><b class="ay-term-n">Tema</b><div class="ay-term-d">Lo que identifica a un problema, sin importar cuántas veces ocurra: el mismo error en el mismo lugar. Un tema tiene una sola tarjeta.</div></div><div class="ay-term" id="ayuda-triage"><b class="ay-term-n">Triage</b><div class="ay-term-d">La clasificación de cada hallazgo: categoría, severidad y decisión, con su porqué, su nivel de confianza y las reglas o memorias en las que se basó.</div></div></div></section></template>

screpancia. Queda en la memoria de producción del proyecto."},"disc-posponer":{"titulo":"Posponer","breve":"Saca la discrepancia de las pendientes hasta una fecha."},"disc-descartar":{"titulo":"Descartar","breve":"Cierra la discrepancia con un motivo. La rutina no la vuelve a mostrar como nueva."},"disc-reabrir":{"titulo":"Volver a abrir","breve":"Deshace la respuesta, el descarte o la posposición: la discrepancia vuelve a estar pendiente."},"proyecto-discrepancias":{"titulo":"Pestaña Discrepancias","breve":"Lo que no coincide entre el código, la documentación y Orchestrator. Se responde, se pospone o se descarta acá: no va a la bandeja."},"doc-pkg":{"titulo":"Desactivar o Volver a usar","breve":"Hace que la rutina deje de usar, o vuelva a usar, un documento que viene dentro del paquete publicado."},"doc-subir":{"titulo":"Subir archivo","breve":"Sube un Word (.docx), un PDF, un .md o un .txt y lo convierte a Markdown. Se revisa antes de guardar."},"doc-pegar":{"titulo":"Pegar texto","breve":"Abre un cuadro para pegar o escribir el documento, en Markdown o texto plano."},"doc-guardar":{"titulo":"Guardar documento","breve":"Guarda el documento en Markdown, con su categoría y su título, después de enmascarar emails, documentos y usuarios."},"doc-ver":{"titulo":"Ver","breve":"Muestra el documento guardado, con formato."},"doc-descargar":{"titulo":"Descargar .md","breve":"Baja el documento guardado como un archivo Markdown."},"doc-quitar":{"titulo":"Quitar","breve":"Borra el documento del proyecto. Pide confirmación."},"proyecto-documentacion":{"titulo":"Pestaña Documentación","breve":"Los documentos del proyecto (PDD, SDD, Runbook y otros), subidos a mano y guardados en Markdown."},"proyecto-reglas":{"titulo":"Pestaña Reglas","breve":"Las reglas de este proyecto y su estado."},"proyecto-inventario":{"titulo":"Pestaña Inventario","breve":"Procesos, colas, triggers y assets de la carpeta (de los assets, solo el nombre)."},"guardar-proyecto":{"titulo":"Guardar y re-analiza ess memory tab</a></li><li><a href="#ayuda-proyecto-produccion">Production memory tab</a></li><li><a href="#ayuda-proyecto-discrepancias">Discrepancies tab</a></li><li><a href="#ayuda-proyecto-documentacion">Documentation tab</a></li><li><a href="#ayuda-proyecto-reglas">Rules tab</a></li><li><a href="#ayuda-proyecto-inventario">Inventory tab</a></li><li><a href="#ayuda-proyecto-config">Settings tab</a></li></ol></li><li><a href="#ayuda-reglas">Rules</a><ol class="n3"><li><a href="#ayuda-editor-regla">Rule editor</a></li><li><a href="#ayuda-propuestas">Routine proposals</a></li></ol></li><li><a href="#ayuda-registrar">Register project</a><ol class="n3"><li><a href="#ayuda-propuestos">Proposed projects</a></li></ol></li><li><a href="#ayuda-ajustes">Settings</a><ol class="n3"><li><a href="#ayuda-descubrimiento">Projects to monitor</a></li></ol></li><li><a href="#ayuda-mas">More (phone)</a></li></ol></li><li><a href="#ayuda-glosario">Glossary</a></li></ol></nav><div class="ay-inicio"><a class="ay-card" href="#ayuda-introduccion"><b>What the Control Tower is</b><span>What it does, how it works, what it never does and what each role can do.</span></a><a class="ay-card" href="#ayuda-configuracion-inicial"><b>Initial setup</b><span>The one-time start-up: UiPath and Bitbucket access, Claude environment, routine and first scan.</span></a><a class="ay-card" href="#ayuda-pantallas"><b>Screens and actions</b><span>Every screen, tab and button of the dashboard, with sample views.</span></a><a class="ay-card" href="#ayuda-glosario"><b>Glossary</b><span>The terms the dashboard uses, in alphabetical order.</span></a></div>
<section class="ay-sec n1" id="ayuda-introduccion" data-nivel="1"><h2>What the Control Tower is</h2><p class="ay-breve">What it does, how it works, what it never does and what each role can do.</p><p>The Control Tower watches over the UiPath robots that Grupo Momentum runs in production. Every hour a Claude <strong>routine</strong> reviews Orchestrator, detects what is going wrong, decides how serious it is and leaves it on this dashboard, explained and sorted.</p><p>The dashboard is where the team works: you see what needs attention, then answer it, delegate it or dismiss it. With every answer the routine learns: next time it knows what is normal in each project and what is not.</p></section>
<section class="ay-sec n2" id="ayuda-como-funciona" data-nivel="2"><h3>How it works</h3><ol>
<li><strong>Monitors.</strong> The routine reads the jobs, logs, queues and triggers of each active project, and evaluates its <a href="#ayuda-regla">rules</a>.</li>
<li><strong>Groups.</strong> Each distinct problem is a <a href="#ayuda-tema">topic</a> and has a single card. If it recurs, the card adds occurrences instead of being duplicated.</li>
<li><strong>Classifies.</strong> The <a href="#ayuda-triage">triage</a> assigns a category, a <a href="#ayuda-severidad">severity</a> and a <a href="#ayuda-decision">decision</a>: escalate, notify, watch or mark as known. It always says why.</li>
<li><strong>Analyzes.</strong> Before escalating, it cross-checks the error against the code of the deployed package and its documentation. The result is the <a href="#ayuda-analisis-previo">prior analysis</a>.</li>
<li><strong>Publishes.</strong> Whatever needs a person appears in the <a href="#ayuda-bandeja">Inbox</a>. The rest stays in <a href="#ayuda-no-reportados">Not reported by the triage</a>.</li>
<li><strong>Learns.</strong> The team&#39;s answers are saved in the <a href="#ayuda-memoria-de-produccion">production memory</a> and can become proposed rules.</li>
</ol></section>
<section class="ay-sec n2" id="ayuda-solo-lectura" data-nivel="2"><h3>What the Control Tower never does</h3><ul>
<li><strong>It changes nothing in Orchestrator.</strong> It does not start, stop or retry jobs, and does not touch queues, assets or processes.</li>
<li><strong>It changes no code.</strong> If a problem needs a fix, it suggests one with the evidence. A person makes it.</li>
<li><strong>It shows no personal data.</strong> Everything coming from Orchestrator goes through PII redaction before reaching the dashboard. Asset values and the contents of queue items are never read.</li>
</ul></section>
<section class="ay-sec n2" id="ayuda-roles" data-nivel="2"><h3>Roles</h3><p class="ay-breve">Your role defines what you can do: Reader views, Operator works the cards, and Admin also configures projects, rules and settings.</p><p>Your role appears below the menu, as <strong>Operator access</strong> (on the phone, inside <strong>More</strong>). It is assigned from the dashboard&#39;s <strong>Share</strong> menu.</p><table><thead><tr><th>Role</th><th>Access in Share</th><th>Can</th></tr></thead><tbody><tr><td>Reader</td><td>Viewer</td><td>View everything, including this help.</td></tr><tr><td>Operator</td><td>Contributor</td><td>Delegate, postpone, dismiss, answer and comment on cards, request a new analysis, and answer, postpone or dismiss a project&#39;s discrepancies.</td></tr><tr><td>Admin</td><td>Editor</td><td>Also: set the folder to scan, register and configure projects, upload their documentation, activate or pause monitoring, approve, adjust and delete rules, and edit the settings.</td></tr></tbody></table></section>
<section class="ay-sec n1" id="ayuda-configuracion-inicial" data-nivel="1"><h2>Initial setup</h2><p class="ay-breve">The one-time start-up: UiPath and Bitbucket access, Claude environment, routine and first scan.</p><p>This is done once, before the first run. It is done by whoever installs the Control Tower, together with a UiPath Automation Cloud administrator and, if used, a Bitbucket one. If the dashboard already shows runs, this is done: this part is then useful to <a href="#ayuda-config-credenciales">renew a credential</a> or add folders.</p><p>The Tower needs two accesses, both <strong>read-only</strong>: one to <a href="#ayuda-config-uipath">Orchestrator</a>, required, and one to <a href="#ayuda-config-bitbucket">Bitbucket</a>, optional. Both are loaded into the <a href="#ayuda-config-entorno">Claude environment</a> where the routine runs.</p><table><thead><tr><th>Step</th><th>Where it is done</th><th>Who</th></tr></thead><tbody><tr><td><a href="#ayuda-config-uipath">1. External App</a> and <a href="#ayuda-config-uipath-carpetas">folder access</a></td><td>UiPath Automation Cloud and Orchestrator</td><td>UiPath organization administrator</td></tr><tr><td><a href="#ayuda-config-bitbucket">2. Bitbucket token</a> (optional)</td><td>Bitbucket</td><td>Repository or workspace administrator</td></tr><tr><td><a href="#ayuda-config-entorno">3. Environment</a></td><td>Claude</td><td>Whoever installs the Tower</td></tr><tr><td><a href="#ayuda-config-verificar">4. Verification</a></td><td>A Claude session in that environment</td><td>Whoever installs the Tower</td></tr><tr><td><a href="#ayuda-config-tablero">5. Dashboard and routine</a></td><td>Claude</td><td>The account that owns the dashboard</td></tr><tr><td><a href="#ayuda-primeros-pasos">6. First steps</a></td><td>This dashboard</td><td>A dashboard Admin</td></tr></tbody></table><div class="ay-nota" role="note"><b>Secrets are not shared</b><p>The External App secret and the Bitbucket token are copied only once, from the screen where they are created to the environment configuration. Do not paste them into a chat, an email or this dashboard.</p></div></section>
<section class="ay-sec n2" id="ayuda-config-uipath" data-nivel="2"><h3>1. External App in UiPath Cloud</h3><p class="ay-breve">The identity the routine uses to read Orchestrator: a confidential application with read-only permissions.</p><p>The routine does not sign in to UiPath as a person. It signs in as its own <strong>External Application</strong>, which can only read. Create it like this:</p><ol>
<li>Go to <code>cloud.uipath.com</code> with an organization administrator account and open <strong>Admin</strong>.</li>
<li>Select the organization in the left panel and go to <strong>External Applications</strong>. If there are tabs, use <strong>OAuth Applications</strong>.</li>
<li>Click <strong>Add application</strong> and fill in:
<ul>
<li><strong>Application name:</strong> a name that identifies it, for example <code>Torre de Control Operaciones</code>.</li>
<li><strong>Application type:</strong> <strong>Confidential application</strong>.</li>
</ul>
</li>
<li>Under <strong>Resources</strong>, click <strong>Add scopes</strong>. Choose the <strong>Orchestrator API Access</strong> resource and switch to the <strong>Application scope(s)</strong> tab, not User scope(s). Check only these eight:
<ul>
<li><code>OR.Folders.Read</code></li>
<li><code>OR.Jobs.Read</code></li>
<li><code>OR.Queues.Read</code></li>
<li><code>OR.Assets.Read</code></li>
<li><code>OR.Execution.Read</code></li>
<li><code>OR.Monitoring.Read</code></li>
<li><code>OR.Robots.Read</code></li>
<li><code>OR.Machines.Read</code></li>
</ul>
</li>
<li>Leave <strong>Redirect URL</strong> empty: nobody signs in with this application.</li>
<li>Click <strong>Add</strong>. UiPath shows the <strong>App Secret</strong> only once: copy it right then. The <strong>App ID</strong> stays visible in the applications list.</li>
</ol><p>Menu names may vary slightly depending on the Automation Cloud version.</p><p>This screen gives you four values for the <a href="#ayuda-config-entorno">environment</a>:</p><table><thead><tr><th>Value</th><th>Where to find it</th><th>Variable</th></tr></thead><tbody><tr><td>App ID</td><td>The External Applications list</td><td><code>UIPATH_CLIENT_ID</code></td></tr><tr><td>App Secret</td><td>Only in the notice shown when the application is created</td><td><code>UIPATH_APP_SECRET</code></td></tr><tr><td>Organization</td><td>The first part of the address after <code>cloud.uipath.com/</code></td><td><code>UIPATH_ORG</code></td></tr><tr><td>Tenant</td><td>The name of the production tenant, as it appears in the tenant selector</td><td><code>UIPATH_TENANT</code></td></tr></tbody></table><div class="ay-nota" role="note"><b>Read scopes only</b><p>Do not check any scope that does not end in <code>.Read</code>. The routine never writes to Orchestrator, and without write scopes UiPath itself prevents it.</p></div></section>
<section class="ay-sec n3" id="ayuda-config-uipath-carpetas" data-nivel="3"><h4>Access to production folders</h4><p class="ay-breve">The External App only sees the Orchestrator folders it is assigned to, with a read-only role.</p><p>Scopes define which type of data the application can read. Which folders it sees is defined separately, in Orchestrator. Without this step, reads come back empty or with a 403 error.</p><ol>
<li><strong>Create a read-only folder role.</strong> In Orchestrator, <strong>Tenant → Manage Access → Roles</strong>, add a role of type <strong>Folder</strong>, for example <code>Monitor Operaciones</code>, with the <strong>View</strong> permission and no other on Jobs, Logs, Queues, Transactions, Assets, Processes and Triggers.</li>
<li><strong>Assign the application to each production folder.</strong> In <strong>Tenant → Folders</strong>, choose the folder, click <strong>Assign Account/Group/External App</strong>, look up the application by name and give it the role from the previous step. Subfolders inherit access from the folder that contains them.</li>
<li><strong>For the scan, give it a tenant role.</strong> In <strong>Tenant → Manage Access → Assign roles → External app</strong>, assign it a tenant role that has <strong>View</strong> on Folders. With that, the <a href="#ayuda-descubrimiento">scan</a> can walk through the subfolders. Without it, it only reads the folder set in Settings, and the dashboard warns you.</li>
</ol><p>When a new production folder is added, repeat step 2 for that folder.</p></section>
<section class="ay-sec n2" id="ayuda-config-bitbucket" data-nivel="2"><h3>2. Bitbucket token (optional)</h3><p class="ay-breve">A read-only token to clone a project&#39;s repository. It is a fallback: the code comes from the packages published in Orchestrator.</p><p>The routine reads the code and documentation from the <strong>packages published in Orchestrator</strong>, in the deployed version. Bitbucket is used only when a package does not include the sources or the documentation and the process has a repository set in its <a href="#ayuda-proyecto-config">configuration</a>. If no token is loaded, that fallback does not exist and everything else works the same.</p><p>The Tower uses <strong>a single token</strong>, so it must reach every repository you want to read. There are two ways to create it:</p><p><strong>Repository, project or workspace access token (recommended).</strong> It does not depend on a person&#39;s account.</p><ol>
<li>In Bitbucket, open the repository and go to <strong>Repository settings → Security → Access tokens</strong>.</li>
<li>Click <strong>Create Repository Access Token</strong>.</li>
<li>Give it a name, for example <code>torre-control-lectura</code>, and check a single permission: <strong>Repositories → Read</strong>.</li>
<li>Click <strong>Create</strong> and copy the token: Bitbucket shows it only once.</li>
</ol><p>To cover several repositories with one token, create it the same way from the project or workspace settings (<strong>Workspace settings → Security → Access tokens</strong>). Those two levels require a Bitbucket Premium plan.</p><p><strong>Atlassian account API token.</strong> Use it when workspace access tokens are not available. A service account is preferable to a person&#39;s account.</p><ol>
<li>With that account, go to <code>id.atlassian.com/manage-profile/security/api-tokens</code>.</li>
<li>Click <strong>Create API token with scopes</strong>, choose the <strong>Bitbucket</strong> application and check only the repository read scope (<code>read:repository:bitbucket</code>).</li>
<li>Choose the expiration, create the token and copy it.</li>
</ol><table><thead><tr><th>Token type</th><th><code>BITBUCKET_TOKEN</code></th><th><code>BITBUCKET_USER</code></th></tr></thead><tbody><tr><td>Access token</td><td>The token</td><td>Empty</td></tr><tr><td>Atlassian API token</td><td>The token</td><td>The email of the account that created it</td></tr></tbody></table><div class="ay-nota" role="note"><b>Read-only here too</b><p>Do not check write, pull request or administration permissions. The Tower never commits, pushes or opens a PR: if a problem requires a fix, it reports it so a person can take it. Bitbucket App passwords are being retired: do not use them.</p></div></section>
<section class="ay-sec n2" id="ayuda-config-entorno" data-nivel="2"><h3>3. Environment in Claude</h3><p class="ay-breve">The cloud environment where the routine runs: limited network, variables with the credentials and the script that installs the UiPath CLI.</p><p>The routine runs in a Claude Code cloud environment, which at Momentum is called <code>momentum-operaciones</code>. It is created from Claude Code on the web, in the environment settings, with three parts:</p><p><strong>Network.</strong> <strong>Limited</strong> access, with <strong>Allow package managers</strong> checked and these domains allowed:</p><ul>
<li><code>cloud.uipath.com</code></li>
<li><code>bitbucket.org</code></li>
<li><code>api.bitbucket.org</code></li>
</ul><p><strong>Variables.</strong> They are loaded in the environment configuration.</p><table><thead><tr><th>Variable</th><th>Value</th><th>Secret</th></tr></thead><tbody><tr><td><code>UIPATH_ORG</code></td><td>Automation Cloud organization</td><td>No</td></tr><tr><td><code>UIPATH_TENANT</code></td><td>Production tenant</td><td>No</td></tr><tr><td><code>UIPATH_CLIENT_ID</code></td><td>External App ID</td><td>Yes</td></tr><tr><td><code>UIPATH_APP_SECRET</code></td><td>External App secret</td><td>Yes</td></tr><tr><td><code>BITBUCKET_TOKEN</code></td><td>Read-only token. Optional.</td><td>Yes</td></tr><tr><td><code>BITBUCKET_USER</code></td><td>Only with an Atlassian API token</td><td>No</td></tr><tr><td><code>OPS_ARTIFACT_URL</code></td><td>The address of this dashboard</td><td>No</td></tr><tr><td><code>UIPATH_TELEMETRY_DISABLED</code></td><td><code>true</code></td><td>No</td></tr><tr><td><code>UIPATH_CLI_DISABLE_VERSION_SYNC</code></td><td><code>true</code></td><td>No</td></tr><tr><td><code>UIPATH_CARPETA_PRUEBA</code></td><td>A production folder with activity in the last 24 hours. For verification only.</td><td>No</td></tr><tr><td><code>BITBUCKET_REPO_PRUEBA</code></td><td>A repository, such as <code>workspace/repo</code> or its address. For verification only.</td><td>No</td></tr></tbody></table><p><strong>Setup script.</strong> The contents of <code>scripts/setup-entorno.sh</code>, from the Tower repository. It installs the UiPath CLI at a pinned version. It does not read any secret.</p><p>A change to the variables applies only to new sessions: sessions that are already open keep the previous values.</p></section>
<section class="ay-sec n2" id="ayuda-config-verificar" data-nivel="2"><h3>4. Verify access</h3><p class="ay-breve">A read-only test that confirms the environment reaches Orchestrator, Bitbucket and the dashboard.</p><p>Open a <strong>new session</strong> in Claude in the environment, with the Tower repository, and ask:</p><p><code>/verificar-entorno</code></p><p>The test signs in with the External App, performs one read of each type, clones the test repository and writes and deletes a test document on the dashboard. The report contains counts and field names, never data. It ends with a verdict:</p><ul>
<li><strong>GO:</strong> login and reads work with the CLI. You can continue.</li>
<li><strong>GO CON FALLBACK:</strong> the CLI fails but the Orchestrator API responds. The routine uses the API.</li>
<li><strong>NO-GO:</strong> neither responds. The report says which access is missing.</li>
</ul><table><thead><tr><th>If the report says</th><th>Probable cause</th><th>What to do</th></tr></thead><tbody><tr><td><code>invalid_client</code> on sign-in</td><td>App ID or secret copied incorrectly, or the application is disabled</td><td>Check the <a href="#ayuda-config-uipath">External App</a> and the variables</td></tr><tr><td>Login succeeds and a read returns a 403 error</td><td>A scope is missing, or the application is not assigned to the folder</td><td>Add the scope named in the report or <a href="#ayuda-config-uipath-carpetas">assign the folder</a></td></tr><tr><td>Empty list in a folder with activity</td><td>The folder name is misspelled, or the application cannot see it</td><td>Check <code>UIPATH_CARPETA_PRUEBA</code> and the folder assignment</td></tr><tr><td>A package or library could not be downloaded</td><td>The role is missing permission to view packages</td><td>Add <strong>View</strong> on Packages to the folder role, and on Libraries to the tenant role</td></tr><tr><td>Host blocked</td><td>The domain is not among the allowed ones</td><td>Add it to the <a href="#ayuda-config-entorno">environment</a> network</td></tr><tr><td><code>Authentication failed</code> on Bitbucket</td><td>Token expired or without repository read, or <code>BITBUCKET_USER</code> is missing with an API token</td><td>Create the <a href="#ayuda-config-bitbucket">token</a> again</td></tr></tbody></table></section>
<section class="ay-sec n2" id="ayuda-config-tablero" data-nivel="2"><h3>5. Dashboard and routine</h3><p class="ay-breve">Publish the dashboard, load its initial configuration, schedule the hourly run and share it with the team.</p><ol>
<li><strong>Publish the dashboard.</strong> It is the <code>dashboard/index.html</code> file in the repository, published as an artifact with the capabilities from <code>dashboard/capabilities.json</code>. It gets its own address and an empty database.</li>
<li><strong>Load that address</strong> into the <code>OPS_ARTIFACT_URL</code> variable of the environment.</li>
<li><strong>Seed the initial configuration.</strong> In a new session of the environment, ask for <code>/control-mantenimiento seed</code>. It loads the triage criteria, thresholds and retention that you later see in <a href="#ayuda-ajustes">Settings</a>.</li>
<li><strong>Schedule the routine.</strong> A scheduled Claude task that opens a new session in the environment every hour, during business hours, with the request <code>Ejecutá /control-corrida.</code> The time of each run is shown in the <a href="#ayuda-pulso">routine pulse</a>.</li>
<li><strong>Share the dashboard</strong> with the team and give each person their <a href="#ayuda-roles">role</a>.</li>
</ol><p>The routine runs as the account that owns the dashboard. That is why it is the only one that writes runs and topics.</p></section>
<section class="ay-sec n2" id="ayuda-primeros-pasos" data-nivel="2"><h3>6. First steps on a new dashboard</h3><p class="ay-breve">With the routine running, an Admin sets the folder to scan and registers the projects.</p><p>A newly published dashboard has no projects. An Admin gets it going like this:</p><ol>
<li><strong>Set the folder to scan.</strong> In <a href="#ayuda-descubrimiento">Settings</a>, enter the Orchestrator folder where the production projects are and click <strong>Save and scan</strong>.</li>
<li><strong>Review the proposed projects.</strong> The next run walks through that folder and proposes as a project each folder that has processes. They appear in <a href="#ayuda-propuestos">Register project</a>.</li>
<li><strong>Register the ones you want to monitor</strong> and ignore the rest. The routine performs the <a href="#ayuda-alta">onboarding</a> of each one, up to 3 per run.</li>
<li><strong>Review and activate.</strong> Each project is left In review with its process memory, its discrepancies and its proposed rules. When it looks right, activate monitoring.</li>
</ol><p>While there are no projects, the Inbox and Projects show these steps.</p></section>
<section class="ay-sec n2" id="ayuda-config-credenciales" data-nivel="2"><h3>Renew credentials and troubleshoot</h3><p class="ay-breve">What to do when the UiPath secret or the Bitbucket token expires or changes, and what to check if the routine stops reading.</p><p><strong>External App secret.</strong> In <strong>Admin → External Applications</strong>, edit the application and generate a new secret. Load it into <code>UIPATH_APP_SECRET</code>. The previous secret stops working.</p><p><strong>Bitbucket token.</strong> Revoke the old one, create a new one with the <a href="#ayuda-config-bitbucket">same permissions</a> and load it into <code>BITBUCKET_TOKEN</code>. Atlassian API tokens expire: it is a good idea to note the date.</p><p>After any change, run <code>/verificar-entorno</code> in a new session. The next run already uses the new value.</p><table><thead><tr><th>What you see on the dashboard</th><th>What to check</th></tr></thead><tbody><tr><td><strong>Routine stopped</strong>, in red</td><td>The scheduled task is paused or fails to start. Check its run history in Claude.</td></tr><tr><td>A Monitoring category topic saying it could not sign in</td><td>The External App secret expired or was changed. Renew it and verify.</td></tr><tr><td>A project <strong>With error</strong></td><td>The project note gives the reason. Most commonly the External App is not <a href="#ayuda-config-uipath-carpetas">assigned to that folder</a>.</td></tr><tr><td>The scan finds no subfolders</td><td>The External App is missing the tenant role with View on Folders.</td></tr><tr><td>A pre-escalation analysis with no related code</td><td>The package does not include the sources and there is no Bitbucket repository or token for that process.</td></tr></tbody></table></section>
<section class="ay-sec n1" id="ayuda-pantallas" data-nivel="1"><h2>Screens and actions</h2><p class="ay-breve">Every screen, tab and button of the dashboard, with sample views.</p><p>Every screen has a <strong>?</strong> button next to its title that takes you to its section of this help. The <strong>Help</strong> link in the menu also opens the part for the screen you are on. Hovering over a button or a label shows a short explanation, with a link to more detail. The views on this page are the app&#39;s own, drawn with sample data.</p></section>
<section class="ay-sec n2" id="ayuda-navegacion" data-nivel="2"><h3>Menu and project selector</h3><p>The menu is always in view: on the left on a computer and at the bottom on a phone. It leads to Inbox, Projects, Runs, Rules, Outside the inbox, Settings (Admin) and this Help. The number on Inbox is the count of open topics; the one on Rules is the proposals waiting for approval.</p><p>Below the menu are the <a href="#ayuda-pulso">routine pulse</a> and your <a href="#ayuda-roles">role</a>. On a phone the pulse and the <strong>?</strong> are in the top bar, and Outside the inbox, Settings and Help are inside <a href="#ayuda-mas">More</a>.</p><div class="ay-accion" id="ayuda-scope"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Project</span></div><p><b>Filters Inbox, Runs, Rules and Outside the inbox by one project. The × removes the filter.</b></p><p>Tap it and type part of the name or the folder. Pick the project with a click, or with the arrow keys and Enter. Each project shows a colored dot with its health (green: no news; amber: with notices; red: with P1 or P2 problems; gray: paused or no data) and how many topics it has open. Projects with open topics come first.</p><p>The filter stays applied on all those screens, and is remembered in this browser, until you remove it with the <strong>×</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:selector:abierto--></div><figcaption>Example with sample data</figcaption></figure></div></section>
<section class="ay-sec n2" id="ayuda-bandeja" data-nivel="2"><h3>Inbox</h3><p class="ay-breve">The main screen: what needs a person, sorted by severity.</p><p>This is the work screen. It shows only the open topics whose decision is to escalate or notify, and that nobody has replied to, dismissed or snoozed. They are sorted by severity, escalated first and then the most recent. If nothing is pending, it says <strong>All clear</strong>.</p><ul>
<li>The <strong>All</strong>, <strong>For you</strong>, <strong>Needs action</strong> and <strong>Notices</strong> buttons show only that part.</li>
<li>The search box filters by title, project, category, process or severity.</li>
<li>If the routine is stopped or the last run had collection errors, a red warning appears at the top.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:bandeja:--></div><figcaption>Example with sample data · Admin view</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-para-revisar" data-nivel="3"><h4>To review</h4><p class="ay-breve">Admin only: proposed rules, suggested rule changes, proposed projects and projects that finished their analysis.</p><p>Only Admins see it, in the <strong>All</strong> view. It gathers the pending configuration tasks: <a href="#ayuda-propuestas">proposed rules</a>, rules with a suggested change, <a href="#ayuda-propuestos">projects proposed</a> by the scan, projects <strong>In review</strong> waiting to be activated and projects <strong>With error</strong>. Each row leads to where it is resolved.</p><p>A project&#39;s <a href="#ayuda-discrepancia">discrepancies</a> do not appear here or in the rest of the inbox: they are handled from the project page.</p></section>
<section class="ay-sec n3" id="ayuda-para-vos" data-nivel="3"><h4>For you</h4><p class="ay-breve">Topics someone delegated to you.</p><p>The topics someone <a href="#ayuda-delegar">delegated</a> to you. They leave this list when you reply, dismiss or snooze them.</p></section>
<section class="ay-sec n3" id="ayuda-requiere-accion" data-nivel="3"><h4>Needs action</h4><p class="ay-breve">Escalated topics: the triage decided they need a person.</p><p>The topics with the <strong>Escalated</strong> decision. They are usually P1 or P2, or something the routine had never seen. Each one carries its prior analysis in the detail.</p></section>
<section class="ay-sec n3" id="ayuda-avisos" data-nivel="3"><h4>Notices</h4><p class="ay-breve">Things worth knowing that do not block anything, in compact form.</p><p>The topics with the <strong>Notice</strong> decision, usually new P3 or P4. They are shown compactly: without the why and without Delegate. The detail has everything.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:aviso--></div><figcaption>Example with sample data</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-tarjeta" data-nivel="2"><h3>The topic and its detail</h3><p class="ay-breve">One problem per topic, with its severity, its why and the actions to work on it.</p><p>Each card is a <a href="#ayuda-tema">topic</a>. If the problem happens again, no new card is created: the same one adds occurrences.</p><ul>
<li><strong>On the left:</strong> the <a href="#ayuda-severidad">severity</a>.</li>
<li><strong>Labels:</strong> the <a href="#ayuda-categoria">category</a>; the project, when there is no filter, and the process if the project has several; the <a href="#ayuda-recurrencia">recurrence</a>; <a href="#ayuda-reaparecio">Reappeared</a>; the <a href="#ayuda-libreria">library</a> where the error happened; <a href="#ayuda-nueva-version">New version</a>; <strong>Notice</strong>, and who it is delegated to.</li>
<li><strong>Gray text:</strong> the triage&#39;s why, in two lines.</li>
<li><strong>Actions:</strong> at the bottom. A Reader does not see them.</li>
</ul><p>A click on the card, or on <strong>View details</strong>, opens the detail in a side panel, without losing your place in the list. It closes with the <strong>×</strong>, with Esc or by clicking outside.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:--></div><figcaption>Example with sample data</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-detalle" data-nivel="3"><h4>A topic&#39;s detail</h4><p class="ay-breve">Why it is here, the prior analysis, the evidence and the topic&#39;s activity.</p><p>The detail shows, in this order:</p><ol>
<li><strong>Status:</strong> whether the topic is delegated, snoozed, dismissed or replied to, and by whom. If it left the inbox, it offers <a href="#ayuda-reabrir">Return to inbox</a>.</li>
<li><strong>Actions:</strong> the same as on the card.</li>
<li><strong>Why it is here:</strong> the triage&#39;s why, the decision and its confidence, the rules and memories it was based on, since when it has been seen and in how many runs.</li>
<li><strong>Prior analysis:</strong> summary, hypotheses with their probability, suggested actions, related code and documentation, and what changed in the last deploy. If it says Pending, the next run completes it.</li>
<li><strong>Library:</strong> if the error happened in a library, its version, its activity and which other projects use it.</li>
<li><strong>Evidence (redacted):</strong> the latest logs, queue items and jobs, without personal data.</li>
<li><strong>Activity:</strong> who did what with the topic, and a box to <a href="#ayuda-comentar">comment</a>.</li>
</ol><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:detalle--></div><figcaption>Example with sample data</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-acciones" data-nivel="2"><h3>Actions on a topic</h3><p>Operators and Admins use them. Every action is recorded in the topic&#39;s activity. Replies and dismissals also teach the routine, which processes them in the next run. After snoozing, dismissing or replying, a notice with <strong>Undo</strong> appears.</p><div class="ay-accion" id="ayuda-responder"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Reply</span></div><p><b>Records what was found or what will be done. It goes into the production memory.</b></p><p>Pick a decision and add notes:</p><ul>
<li><strong>Fix required:</strong> the robot has to be corrected. You can enter the ticket or the fix reference.</li>
<li><strong>Expected behavior</strong>, <strong>Data issue</strong>, <strong>External system</strong> or <strong>False positive / adjust rule:</strong> the cause is something else; the routine learns it.</li>
<li><strong>Check again:</strong> pick a date. The topic is hidden until that day and the routine does a <a href="#ayuda-re-control">re-check</a>.</li>
<li><strong>Hand over to development:</strong> the development team takes it.</li>
</ul><p>The topic leaves the inbox and the reply goes into the project&#39;s production memory.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:responder--></div><figcaption>Example with sample data</figcaption></figure></div><div class="ay-accion" id="ayuda-posponer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Snooze</span></div><p><b>Hides the topic until a date. It comes back sooner if the problem gets worse.</b></p><p>Pick 1 day, 3 days, 1 week or a date. In the meantime the topic moves to <a href="#ayuda-no-reportados">Outside the inbox</a> as <strong>Snoozed</strong>.</p><ul>
<li>If the severity goes up before the date, the topic returns to the inbox by itself.</li>
<li>When it expires, it is shown again if the problem persists.</li>
<li>Snoozing teaches the routine nothing. If the problem is expected, it is better to <strong>Dismiss</strong> or <strong>Reply</strong>.</li>
</ul><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:posponer--></div><figcaption>Example with sample data</figcaption></figure></div><div class="ay-accion" id="ayuda-descartar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Dismiss</span></div><p><b>Takes the topic out of the inbox with a reason. The routine learns from it and may propose a rule.</b></p><p>Pick a reason and, if you want, add a note explaining why:</p><ul>
<li><strong>It is expected:</strong> it always happens and is not a problem, for example a maintenance window.</li>
<li><strong>False positive:</strong> the detection got it wrong.</li>
<li><strong>Business data:</strong> it is an expected business exception, not a robot failure.</li>
<li><strong>External system:</strong> the problem is in a system the team does not control.</li>
</ul><p>The routine records the reason in the <a href="#ayuda-memoria-de-produccion">production memory</a> and may propose a <a href="#ayuda-regla">rule</a> so it does not warn again. If the topic repeats, it adds occurrences to the same card, but it does not return to the inbox as new.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:descartar--></div><figcaption>Example with sample data</figcaption></figure></div><div class="ay-accion" id="ayuda-delegar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Delegate</span></div><p><b>Assigns the review to a person: the topic shows up in For you for them.</b></p><p>Search for the person by name and pick them. The card shows who it is delegated to and stays in everyone&#39;s inbox, but that person sees it in <strong>For you</strong>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:delegar--></div><figcaption>Example with sample data</figcaption></figure></div><div class="ay-accion" id="ayuda-ajustar-regla"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Adjust rule or Create rule</span></div><p><b>Opens the editor for this topic&#39;s rule without leaving the inbox. An Operator sees it but cannot change it.</b></p><p>If the topic came from a rule, or a rule marked it as known, the button says <strong>Adjust rule</strong> (or <strong>View rule</strong> for an Operator) and opens the <a href="#ayuda-editor-regla">rule editor</a> right there.</p><p>If it did not come from any rule, an Admin sees <strong>Create rule</strong>: you write one for that case, for example &quot;abandoned items in this queue on Mondays before 9 are normal; do not notify&quot;, and it applies to that project from the next run. With <strong>Also dismiss this topic</strong> the incident is closed in the same step.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:tarjeta:regla--></div><figcaption>Example with sample data · Admin view</figcaption></figure></div><div class="ay-accion" id="ayuda-re-crear"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Create rule (from a topic)</span><span class="role-b">Only Admin</span></div><p><b>Creates a new rule for this topic&#39;s project. It is compiled in the next run.</b></p><p>The rule stays <strong>To compile</strong> until the routine translates it. If you checked <strong>Also dismiss this topic</strong>, the topic leaves the inbox as a false positive, with <strong>Undo</strong> in the notice.</p></div><div class="ay-accion" id="ayuda-comentar"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Comment</span></div><p><b>Leaves a note for the team in the topic&#39;s activity. It does not change its status.</b></p><p>The box is in the <strong>Activity</strong> section of the detail. The comment does not take the topic out of the inbox and teaches the routine nothing. With Ctrl or Cmd + Enter it is sent without using the mouse.</p></div><div class="ay-accion" id="ayuda-reanalizar-inc"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Analyze again</span></div><p><b>Asks the next run for a new prior analysis of this topic.</b></p><p>It is next to the <strong>Prior analysis</strong> heading in the detail (if the topic has no analysis, it says <strong>Request analysis</strong>). It is useful when the analysis got old, for example after a change in the system or in the documentation.</p></div><div class="ay-accion" id="ayuda-reabrir"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Return to inbox</span></div><p><b>Undoes a snooze, a dismissal or a reply: the topic goes back to the inbox.</b></p><p>It appears in the detail of a snoozed, dismissed or replied topic. The topic returns as it was before and it is recorded in its activity.</p></div><div class="ay-accion" id="ayuda-deshacer"><div class="ay-accion-h"><span class="btn" aria-hidden="true">Undo</span></div><p><b>Reverts the last action on the topic (snooze, dismiss or reply).</b></p><p>It is in the notice that appears at the bottom for a few seconds after the action. After that time, use <strong>Return to inbox</strong> from the detail.</p></div></section>
<section class="ay-sec n2" id="ayuda-no-reportados" data-nivel="2"><h3>Outside the inbox</h3><p class="ay-breve">Open topics not shown in the inbox: snoozed, replied to, dismissed or not reported by the triage.</p><p>Everything open that is not in the inbox, with the reason. The buttons at the top filter by <strong>Snoozed</strong>, <strong>Responded</strong>, <strong>Dismissed</strong> or <strong>Not reported by the triage</strong> (Under observation and Known decisions).</p><p>It is useful for checking the routine&#39;s criteria. If something here should be in the inbox, open it and use <strong>Return to inbox</strong>, reply <strong>False positive / adjust rule</strong> or fix the <a href="#ayuda-criterios">criteria</a>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:fuera:--></div><figcaption>Example with sample data</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-corridas" data-nivel="2"><h3>Runs</h3><p class="ay-breve">Each execution of the routine, with what it reviewed and what it found.</p><p>The last 50 runs, with their status (Complete, Partial or With errors), how many projects they reviewed and how many new, recurring and escalated topics they found.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corridas:--></div><figcaption>Example with sample data</figcaption></figure></section>
<section class="ay-sec n3" id="ayuda-corrida-detalle" data-nivel="3"><h4>A run&#39;s detail</h4><p class="ay-breve">What the routine reviewed in each project and what it decided for each finding.</p><p>For each project it shows the time window reviewed, a summary of signals, the table of <a href="#ayuda-punto-de-control">checkpoints</a> with their observed value and the <strong>Findings and triage</strong>: each finding with its severity, its decision, whether it is new, recurring or reopened, and its why. A click on a finding opens its topic. If there were errors reading Orchestrator, they appear in the project&#39;s box.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:corrida:--></div><figcaption>Example with sample data</figcaption></figure></section>
<section class="ay-sec n2" id="ayuda-proyectos" data-nivel="2"><h3>Projects</h3><p class="ay-breve">All monitored projects, with their health, their status and their open topics.</p><p>The list of projects with their Orchestrator folder, their open topics, their pending <a href="#ayuda-discrepancia">discrepancies</a> and their <a href="#ayuda-estado-proyecto">status</a>. Those with problems or waiting for review come first. With more than 5 projects a search box appears. Admins see <strong>Register project</strong> and a notice if the routine <a href="#ayuda-propuestos">proposes projects</a> to add.</p><p>If there are no projects yet, an Admin sees the <a href="#ayuda-primeros-pasos">first steps</a>.</p><figure class="ay-vista" inert><div class="ay-vista-c"><!--vista:proyectos:--></div><figcaption>Example with sample data</figcaption></figure></section>
