// ---------- eventos ----------
document.addEventListener('input', (e) => {
  const t = e.target; if (!t.id) return;
  if (t.id === 'scope-q') { S.scopeQ = t.value; S.scopeIdx = 0; S.scopeScroll = true; return schedule(); }
  if (t.id === 'q-inbox') { S.q = t.value; return schedule(); }
  if (t.id === 'q-proj') { S.qp = t.value; return schedule(); }
  S.drafts[t.id] = t.value;
  if (t.type !== 'checkbox' && t.dataset.form && S.forms[t.dataset.form]) {
    const f = S.forms[t.dataset.form];
    if (t.dataset.i !== undefined) {
      const x = f.procesos[Number(t.dataset.i)]; x[t.dataset.k] = t.value;
      // El rol se deduce del nombre mientras no se haya elegido uno.
      if (['label', 'op'].includes(t.dataset.k) && (x.role === 'other' || x.autoRole)) { const r = rolDe(`${x.label} ${x.op}`); if (r !== 'other' || x.autoRole) { x.role = r; x.autoRole = true; const sel = document.getElementById(`f-${t.dataset.form}-${t.dataset.i}-role`); if (sel) sel.value = r; } }
    } else f[t.dataset.k] = t.value;
  }
  if (t.dataset.act === 'buscar' && S.user) {
    const card = t.closest('[data-inc]'); const id = card && card.dataset.inc;
    S.user.search(t.value).then((hits) => { S.peopleHits[id] = hits; schedule(); });
  }
});
document.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.adv) S.adv[d.dataset.adv] = d.open; }, true);
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.type === 'checkbox' && t.dataset.form && S.forms[t.dataset.form]) { S.forms[t.dataset.form][t.dataset.k] = t.checked; return; }
  if (t.tagName === 'SELECT' && t.dataset.form && S.forms[t.dataset.form]) { const x = S.forms[t.dataset.form].procesos[Number(t.dataset.i)]; x[t.dataset.k] = t.value; x.autoRole = false; }
});
document.addEventListener('focusin', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'buscar' && S.user && !t.value) { const id = t.closest('[data-inc]').dataset.inc; S.user.search('').then((h) => { S.peopleHits[id] = h; schedule(); }); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Escape') {
    if (S.scopeOpen) { e.preventDefault(); S.scopeOpen = false; S.focusNext = 'scope-btn'; return schedule(); }
    if (drawerInc) { e.preventDefault(); location.hash = '#' + base; }
    return;
  }
  if (t.id === 'scope-q') {
    const os = opcionesScope(conteos());
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (os.length) { S.scopeIdx = (Math.min(S.scopeIdx, os.length - 1) + (e.key === 'ArrowDown' ? 1 : os.length - 1)) % os.length; S.scopeScroll = true; schedule(); } }
    else if (e.key === 'Enter') { e.preventDefault(); const o = os[Math.min(S.scopeIdx, os.length - 1)]; if (o) elegirScope(o.id); }
    else if (e.key === 'Tab') { S.scopeOpen = false; schedule(); }
    return;
  }
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const ts = [...t.parentElement.querySelectorAll('[role="tab"]')]; const k = ts.indexOf(t);
    const n = e.key === 'Home' ? 0 : e.key === 'End' ? ts.length - 1 : (k + (e.key === 'ArrowRight' ? 1 : ts.length - 1)) % ts.length;
    e.preventDefault(); S.projTab = ts[n].dataset.t; S.focusNext = ts[n].id; return schedule();
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && t.id && t.id.endsWith('-coment')) { e.preventDefault(); const b = t.closest('[data-inc]').querySelector('[data-act="comentar"]'); if (b) b.click(); }
});
let ocupado = false;
document.addEventListener('click', async (e) => {
  if (S.scopeOpen && !e.target.closest('#scope')) { S.scopeOpen = false; schedule(); }
  const b = e.target.closest('[data-act]');
  if (!b) {
    // Clic en cualquier parte libre de una tarjeta: abre el detalle.
    const c = e.target.closest('.card[data-inc]');
    if (c && !e.target.closest('a,button,input,textarea,select,label,.panel') && !String(window.getSelection()).trim()) location.hash = '#incidente-' + c.dataset.inc;
    return;
  }
  if (b.tagName === 'INPUT') return;
  const card = b.closest('[data-inc]'); const id = card && card.dataset.inc; const inc = id && S.incidents[id];
  const draft = (k) => (S.drafts[`${id}-${k}`] || '').trim();
  const clear = (...ks) => ks.forEach((k) => delete S.drafts[`${id}-${k}`]);
  const act = b.dataset.act;
  // ---- navegación y filtros ----
  if (act === 'saltar') { S.focusNext = 'vt'; return schedule(); }
  if (act === 'scope') { S.scopeOpen = !S.scopeOpen; S.scopeQ = ''; S.scopeScroll = true; S.focusNext = S.scopeOpen ? 'scope-q' : 'scope-btn';
    S.scopeIdx = Math.max(0, opcionesScope(conteos()).findIndex((o) => o.id === (S.filter || ''))); return schedule(); }
  if (act === 'scope-pick') return elegirScope(b.dataset.id);
  if (act === 'scope-clear') return elegirScope('');
  if (act === 'seg') { if (['tab', 'fuera'].includes(b.dataset.k)) S[b.dataset.k] = b.dataset.v; return schedule(); }
  if (act === 'limpiar') { S.q = ''; S.tab = 'todo'; S.focusNext = 'vt'; return schedule(); }
  if (act === 'ver-bandeja') { setFiltro(b.dataset.pid); S.tab = 'todo'; S.q = ''; location.hash = '#inicio'; return; }
  if (act === 'panel') { S.panel[id] = S.panel[id] === b.dataset.p ? null : b.dataset.p; S.sel[id] = {}; return schedule(); }
  if (act === 'sel') { S.sel[id] = { ...(S.sel[id] || {}), [b.dataset.k]: b.dataset.v }; return schedule(); }
  if (act === 'tab') { S.projTab = b.dataset.t; return schedule(); }
  if (act === 'agregar-proceso') { S.forms[b.dataset.form].procesos.push({ id: '', label: '', op: '', role: 'other', repo: '', rama: 'main', docs: '', carpeta: '' }); return schedule(); }
  if (act === 'quitar-proceso') { S.forms[b.dataset.form].procesos.splice(Number(b.dataset.i), 1); return schedule(); }
  if (act === 'descartar-cambios') { delete S.forms['cfg-' + b.dataset.pid]; return schedule(); }
  if (ocupado) return;
  ocupado = true;
  try { await accion(act, b, { id, inc, draft, clear }); } finally { ocupado = false; }
  schedule();
});

// Acciones que escriben en el tablero.
async function accion(act, b, { id, inc, draft, clear }) {
  if (act === 'reanalizar-inc') {
    try { await S.db.collection('requests').add({ type: 'reanalyze_incident', incidentId: id, projectId: inc.projectId, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' }); toast('Pedido: la próxima corrida vuelve a analizar esta tarjeta'); }
    catch { toast('No se pudo pedir el re-análisis'); }
    return;
  }
  if (act === 'comentar') {
    const txt = draft('coment'); if (!txt) return toast('Escribí el comentario');
    try { await S.db.collection('activity').add({ incidentId: id, projectId: inc.projectId, type: 'comment', text: txt, by: S.me || null, at: nowIso() }); clear('coment'); toast('Comentario agregado'); }
    catch { toast('No se pudo comentar'); }
    return;
  }
  if (act === 'asignar') {
    const uid = b.dataset.uid; const nombre = (S.peopleHits[id] || []).find((p) => p.id === uid);
    if (nombre) S.names[uid] = nombre;
    if (await writeWork(inc, { state: 'delegated', assignee: uid, delegatedBy: S.me || null, delegatedAt: nowIso() }, { type: 'delegate', text: 'delegó la revisión' })) { S.panel[id] = null; clear('buscar'); toast('Delegado'); }
    return;
  }
  if (act === 'posponer' || act === 'posponer-fecha') {
    const hasta = act === 'posponer' ? addDays(Number(b.dataset.d)) : (draft('fecha') ? new Date(draft('fecha') + 'T09:00:00').toISOString() : null);
    if (!hasta) return toast('Elegí una fecha');
    if (await writeWork(inc, { state: 'snoozed', snoozeUntil: hasta }, { type: 'snooze', text: `pospuso hasta ${fecha(hasta)}` })) { S.panel[id] = null; clear('fecha'); toast(`Pospuesto hasta ${fecha(hasta)}`, id); }
    return;
  }
  if (act === 'descartar') {
    const motivo = (S.sel[id] || {}).motivo; if (!motivo) return;
    const nota = draft('nota');
    if (await writeWork(inc, { state: 'dismissed', dismissReason: motivo, response: { notes: nota || null } }, { type: 'dismiss', text: `descartó: ${etiqueta(DISMISS, motivo)}${nota ? ' — ' + nota : ''}` })) { S.panel[id] = null; clear('nota'); toast('Descartado. Queda en Fuera de bandeja.', id); }
    return;
  }
  if (act === 'responder') {
    const dec = (S.sel[id] || {}).decision; if (!dec) return;
    const notas = draft('notas');
    if (dec === 'recheck' && !draft('recheck')) return toast('Elegí la fecha del re-control');
    const response = { decision: dec, notes: notas || null, ticket: draft('ticket') || null, recheckAt: dec === 'recheck' ? new Date(draft('recheck') + 'T09:00:00').toISOString() : null };
    if (await writeWork(inc, { state: 'responded', response }, { type: 'respond', text: `respondió: ${etiqueta(RESP, dec)}${notas ? ' — ' + notas : ''}` })) { S.panel[id] = null; clear('notas', 'ticket', 'recheck'); toast('Respuesta enviada. La rutina actualiza la memoria en la próxima corrida.', id); }
    return;
  }
  if (act === 'reabrir') {
    if (await writeWork(inc, { state: 'open' }, { type: 'reopen', text: 'devolvió el tema a la bandeja' }, ['snoozeUntil', 'dismissReason', 'response'])) { S.panel[id] = null; toast('De vuelta en la bandeja'); }
    return;
  }
  if (act === 'deshacer') {
    $('#toast').hidden = true;
    if (!inc || !(id in S.undo)) return;
    const data = S.undo[id] ? { ...S.undo[id] } : { state: 'open' }; delete data.id;
    try {
      await S.db.doc(`incidentWork/${id}`).set({ ...data, updatedAt: nowIso(), updatedBy: S.me || null });
      await S.db.collection('activity').add({ incidentId: id, projectId: inc.projectId, type: 'reopen', text: 'deshizo su última acción', by: S.me || null, at: nowIso() });
      delete S.undo[id]; toast('Acción deshecha');
    } catch { toast('No se pudo deshacer'); }
    return;
  }
  // ---- acciones de Admin ----
  try {
    if (act === 'activar' || act === 'pausar') {
      await S.db.doc(`projects/${b.dataset.pid}`).update({ status: act === 'activar' ? 'active' : 'paused', updatedAt: nowIso() });
      toast(act === 'activar' ? 'Proyecto activado' : 'Control pausado');
    } else if (act === 'reanalizar') {
      await S.db.collection('requests').add({ type: 'reanalyze_project', projectId: b.dataset.pid, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
      toast('Re-análisis pedido: lo hace la próxima corrida');
    } else if (act === 'regla') {
      const patch = { status: b.dataset.s }; if (b.dataset.s === 'active') { patch.approvedBy = S.me || null; patch.approvedAt = nowIso(); }
      await S.db.doc(`rules/${b.dataset.rid}`).update(patch);
      toast({ active: 'Regla activa', rejected: 'Regla rechazada', disabled: 'Regla desactivada' }[b.dataset.s]);
    } else if (act === 'nueva-regla') {
      const text = (S.drafts['nr-text'] || '').trim(); if (!text) return toast('Escribí la regla');
      const pid = S.drafts['nr-proj'] || (document.getElementById('nr-proj') || {}).value || S.filter || '*';
      await S.db.doc(`rules/${slug(pid)}-${Date.now().toString(36)}`).set({ projectId: pid, text, status: 'pending_compile', origin: 'manual', createdBy: S.me || null, createdAt: nowIso() });
      delete S.drafts['nr-text']; toast('Regla creada: se compila en la próxima corrida');
    } else if (act === 'guardar-ajustes') {
      const v = (k, d) => S.drafts['aj-' + k] ?? d; const s = S.settings || {};
      await S.db.doc('config/settings').set({ ...s, triageCriteria: v('crit', s.triageCriteria || ''), severityMatrix: v('sev', s.severityMatrix || ''), pendingMaxMinutes: Number(v('pend', s.pendingMaxMinutes || 30)),
        retention: { runsDays: Number(v('runs', (s.retention || {}).runsDays || 60)), closedIncidentsDays: Number(v('inc', (s.retention || {}).closedIncidentsDays || 180)) } });
      toast('Ajustes guardados');
    } else if (act === 'guardar-proyecto') {
      const pid = b.dataset.pid; const p = S.projects[pid];
      const r = proyectoDesdeForm(S.forms['cfg-' + pid] || formDesde(p));
      if (r.error) return toast(r.error);
      // `repo` era el formato anterior (un solo repo por proyecto): se reemplaza por `processes`.
      await S.db.doc(`projects/${pid}`).update({ ...r.data, repo: null, updatedAt: nowIso(), updatedBy: S.me || null });
      if (b.dataset.reanalizar) {
        await S.db.collection('requests').add({ type: 'reanalyze_project', projectId: pid, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
        toast('Guardado. La próxima corrida re-analiza el proyecto.');
      } else toast('Configuración guardada');
      S.forms['cfg-' + pid] = formDesde({ ...p, ...r.data });
    } else if (act === 'registrar-detectada') {
      const folder = b.dataset.folder; const nombre = b.dataset.name || folder.split('/').pop();
      let id2 = slug(folder.split('/').slice(-2).join('-')); if (S.projects[id2]) id2 = `${id2}-${Date.now().toString(36).slice(-4)}`;
      await S.db.doc(`projects/${id2}`).set({ name: nombre, status: 'pending_analysis', orchestrator: { folderPath: folder }, includeAllProcesses: true, processes: [], docs: { paths: [] }, triageCriteria: '', createdBy: S.me || null, createdAt: nowIso(), updatedAt: nowIso() });
      await S.db.collection('requests').add({ type: 'onboard_project', projectId: id2, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
      toast(`${nombre} registrado: la rutina lo analiza en la próxima corrida`);
    } else if (act === 'registrar') {
      const r = proyectoDesdeForm(S.forms.nuevo || formDesde(null));
      if (r.error) return toast(r.error);
      let id2 = slug(r.data.name); if (S.projects[id2]) id2 = `${id2}-${Date.now().toString(36).slice(-4)}`;
      await S.db.doc(`projects/${id2}`).set({ ...r.data, status: 'pending_analysis', createdBy: S.me || null, createdAt: nowIso(), updatedAt: nowIso() });
      await S.db.collection('requests').add({ type: 'onboard_project', projectId: id2, requestedBy: S.me || null, requestedAt: nowIso(), status: 'pending' });
      delete S.forms.nuevo;
      toast('Proyecto registrado: la rutina lo analiza en la próxima corrida');
      location.hash = '#proyecto-' + id2;
    }
  } catch (err) { toast(err && err.code === 'invalid_argument' ? 'No tenés permiso para esta acción' : 'No se pudo guardar. Probá de nuevo.'); }
}

window.addEventListener('hashchange', () => {
  const h = ruta(); const esInc = h.startsWith('incidente-'); const eraInc = prevHash.startsWith('incidente-') ? prevHash.slice(10) : null;
  if (esInc) {
    // El detalle se abre sobre la vista actual: no se pierde el lugar en la lista.
    S.focusNext = 'dw';
    if (!eraInc) { const d = $('#drawer'); d.classList.add('opening'); setTimeout(() => d.classList.remove('opening'), 260); }
  } else if (eraInc && h === base) S.focusNext = 't-' + eraInc; // al cerrar, el foco vuelve a la tarjeta
  else { window.scrollTo(0, 0); S.focusNext = 'vt'; }
  S.scopeOpen = false; prevHash = h; render();
});

// ---------- arranque ----------
async function start() {
  render();
  const cl = window.claude;
  const [db, user] = await Promise.all([cl && cl.use ? cl.use('db') : null, cl && cl.use ? cl.use('user') : null]);
  S.user = user;
  if (!db) { S.error = 'El tablero necesita una sesión de claude.ai para mostrar datos.'; return schedule(); }
  S.db = db;
  if (user) {
    S.me = await user.id();
    S.isAdmin = await user.canEdit();
    const w = await user.can('data.write');
    S.canWrite = S.isAdmin || w === true || w === null;
    S.role = S.isAdmin ? 'admin' : S.canWrite ? 'operador' : 'lector';
    if (S.me) resolveNames([S.me]);
  }
  const timer = setTimeout(() => { S.stale = true; schedule(); }, 10000);
  const onErr = (e) => { clearTimeout(timer); S.error = e && e.code === 'revoked' ? 'Tu acceso al tablero cambió.' : 'No se pudo leer el tablero.'; schedule(); };
  const coll = (name, key, fn) => db.collection(name).onSnapshot((s) => { clearTimeout(timer); S[key] = {}; for (const d of s.docs) S[key][d.id] = { id: d.id, ...d.data() }; S.loaded[key] = true; if (fn) fn(); schedule(); }, onErr);
  coll('projects', 'projects');
  coll('rules', 'rules');
  coll('incidentWork', 'work', () => resolveNames(Object.values(S.work).flatMap((w) => [w.assignee, w.delegatedBy, w.updatedBy])));
  db.collection('incidents').where('status', '==', 'open').onSnapshot((s) => { clearTimeout(timer); S.incidents = {}; for (const d of s.docs) S.incidents[d.id] = { id: d.id, ...d.data() }; S.loaded.incidents = true; schedule(); }, onErr);
  db.collection('runs').orderBy('startedAt', 'desc').limit(50).onSnapshot((s) => { S.runs = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.runs = true; schedule(); }, onErr);
  db.doc('config/settings').onSnapshot((d) => { S.settings = d.exists ? d.data() : null; schedule(); }, () => {});
  db.doc('config/discovery').onSnapshot((d) => { S.discovery = d.exists ? d.data() : null; schedule(); }, () => {});
  coll('libraries', 'libraries');
  setInterval(schedule, 60000); // refresca los "hace X min"
}
start();
})();
</script>
